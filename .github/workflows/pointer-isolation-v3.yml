name: Frames 0.9.98 Pointer Isolation CI v3

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/pointer-isolation-v3.yml'
      - 'tools/ci/pointer_diag_v3.py'

permissions:
  contents: read

jobs:
  pointer-isolation-v3:
    name: Pointer isolation / ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        lane: [ps2, usb]

    env:
      EXPECTED_V1_KIT_SHA256: 1c7f1b514d9aa2f847f724e8b633286d069d745bf7c281a3967c46bbfea1a18c

    steps:
      - uses: actions/checkout@v4

      - name: Verify reusable diagnostic source kit
        shell: bash
        run: |
          set -euo pipefail
          test -f Frames-0.9.98-Pointer-Diagnostics-CI-v1.zip
          actual="$(sha256sum Frames-0.9.98-Pointer-Diagnostics-CI-v1.zip | awk '{print $1}')"
          echo "source_kit_sha=$actual"
          test "$actual" = "$EXPECTED_V1_KIT_SHA256"
          rm -rf "$RUNNER_TEMP/pointer-v3"
          mkdir -p "$RUNNER_TEMP/pointer-v3"
          unzip -q Frames-0.9.98-Pointer-Diagnostics-CI-v1.zip -d "$RUNNER_TEMP/pointer-v3"
          echo "FRAMES_DIR=$RUNNER_TEMP/pointer-v3/Frames-0.9.98-Pointer-CI-Source" >> "$GITHUB_ENV"

      - name: Extract sealed pointer source context
        shell: bash
        run: |
          set +e
          OUT="$GITHUB_WORKSPACE/pointer-source-context"
          mkdir -p "$OUT"
          cd "$FRAMES_DIR"
          {
            echo '=== matching files ==='
            grep -RIlE 'FRAMES_USB_HID_FOUND|USB_HID|usb_hid|hid_mouse|pointer|PS2|ps2' kernel apps 2>/dev/null | sort
            echo
            echo '=== matching lines ==='
            grep -RInE 'FRAMES_USB_HID_FOUND|USB_HID|usb_hid|hid_mouse|pointer|PS2|ps2' kernel apps 2>/dev/null | head -n 1200
          } > "$OUT/matches.txt"
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path('.')
          out=pathlib.Path(__import__('os').environ['GITHUB_WORKSPACE'])/'pointer-source-context'/'contexts.txt'
          pats=re.compile(r'FRAMES_USB_HID_FOUND|USB_HID|usb_hid|hid_mouse|pointer|PS2|ps2',re.I)
          chunks=[]
          for p in sorted(list((root/'kernel').rglob('*'))+list((root/'apps').rglob('*'))):
              if not p.is_file(): continue
              try: lines=p.read_text(errors='replace').splitlines()
              except Exception: continue
              hits=[i for i,l in enumerate(lines) if pats.search(l)]
              if not hits: continue
              keep=set()
              for i in hits:
                  keep.update(range(max(0,i-18),min(len(lines),i+19)))
              chunks.append(f'===== {p} =====')
              last=-2
              for i in sorted(keep):
                  if i>last+1: chunks.append('...')
                  chunks.append(f'{i+1:06d}: {lines[i]}')
                  last=i
          out.write_text('\n'.join(chunks)+'\n')
          PY
          echo '=== sealed pointer source context ==='
          cat "$OUT/contexts.txt"
          exit 0

      - name: Install QEMU/OVMF and build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf clang lld python3 unzip zip
          code="$(find /usr/share/OVMF -type f \( -name 'OVMF_CODE_4M.fd' -o -name 'OVMF_CODE.fd' \) | head -n1)"
          test -n "$code"
          echo "OVMF_CODE=$code" >> "$GITHUB_ENV"
          echo "QEMU=$(command -v qemu-system-x86_64)" >> "$GITHUB_ENV"

      - name: Normalize executable permissions
        shell: bash
        run: |
          set -euo pipefail
          find "$FRAMES_DIR" -type f -name '*.sh' -exec chmod +x {} +
          find "$FRAMES_DIR/toolchain" -type f -name nexus -exec chmod +x {} +
          chmod +x tools/ci/pointer_diag_v3.py

      - name: Build exact diagnostic source
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRAMES_DIR"
          ./tools/build.sh
          python3 tools/make_esp.py
          python3 tools/sdk_selftest.py
          python3 tools/make_desktop_preview_image.py
          python3 tools/verify_desktop_preview_image.py --image build/Frames-0.9.98-Desktop-Preview.img --require-pass
          python3 tools/verify_release.py

      - name: Run OCR-free pointer isolation diagnostics
        id: pointer_test
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          set +e
          OUT="$GITHUB_WORKSPACE/pointer-isolation-${{ matrix.lane }}"
          mkdir -p "$OUT"
          cp -a "$GITHUB_WORKSPACE/pointer-source-context/." "$OUT/" 2>/dev/null || true
          printf 'lane=%s\nstatus=started\n' '${{ matrix.lane }}' > "$OUT/harness-status.txt"
          python3 tools/ci/pointer_diag_v3.py \
            --qemu "$QEMU" \
            --ovmf "$OVMF_CODE" \
            --image "$FRAMES_DIR/build/Frames-0.9.98-Desktop-Preview.img" \
            --lane "${{ matrix.lane }}" \
            --out "$OUT" \
            2>&1 | tee "$OUT/runner.log"
          rc=${PIPESTATUS[0]}
          printf 'lane=%s\nstatus=completed\nrunner_rc=%s\n' '${{ matrix.lane }}' "$rc" > "$OUT/harness-status.txt"
          echo "runner_rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Print isolation summary
        if: always()
        shell: bash
        run: |
          set +e
          OUT="pointer-isolation-${{ matrix.lane }}"
          for f in harness-status.txt summary.json pointer-serial-lines.txt SHA256SUMS.txt runner.log; do
            if [[ -f "$OUT/$f" ]]; then
              echo "=== $f ==="
              cat "$OUT/$f"
              echo
            fi
          done
          exit 0

      - name: Upload v3 pointer isolation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frames-0.9.98-pointer-isolation-v3-${{ matrix.lane }}
          path: |
            pointer-isolation-${{ matrix.lane }}/**
          if-no-files-found: error
          retention-days: 14

      - name: Enforce lane result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.pointer_test.outputs.runner_rc }}" = "0"
