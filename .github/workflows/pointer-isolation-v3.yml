name: Frames 0.9.98 Pointer Isolation CI v3

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/pointer-isolation-v3.yml'
      - 'tools/ci/pointer_diag_v3.py'

permissions:
  contents: read

jobs:
  pointer-isolation-v3:
    name: Pointer isolation / ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        lane: [ps2, usb]

    env:
      EXPECTED_V1_KIT_SHA256: 1c7f1b514d9aa2f847f724e8b633286d069d745bf7c281a3967c46bbfea1a18c

    steps:
      - uses: actions/checkout@v4

      - name: Verify reusable diagnostic source kit
        shell: bash
        run: |
          set -euo pipefail
          test -f Frames-0.9.98-Pointer-Diagnostics-CI-v1.zip
          actual="$(sha256sum Frames-0.9.98-Pointer-Diagnostics-CI-v1.zip | awk '{print $1}')"
          echo "source_kit_sha=$actual"
          test "$actual" = "$EXPECTED_V1_KIT_SHA256"
          rm -rf "$RUNNER_TEMP/pointer-v3"
          mkdir -p "$RUNNER_TEMP/pointer-v3"
          unzip -q Frames-0.9.98-Pointer-Diagnostics-CI-v1.zip -d "$RUNNER_TEMP/pointer-v3"
          echo "FRAMES_DIR=$RUNNER_TEMP/pointer-v3/Frames-0.9.98-Pointer-CI-Source" >> "$GITHUB_ENV"

      - name: Install QEMU/OVMF and build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf clang lld python3 unzip zip
          code="$(find /usr/share/OVMF -type f \( -name 'OVMF_CODE_4M.fd' -o -name 'OVMF_CODE.fd' \) | head -n1)"
          test -n "$code"
          echo "OVMF_CODE=$code" >> "$GITHUB_ENV"
          echo "QEMU=$(command -v qemu-system-x86_64)" >> "$GITHUB_ENV"

      - name: Normalize executable permissions
        shell: bash
        run: |
          set -euo pipefail
          find "$FRAMES_DIR" -type f -name '*.sh' -exec chmod +x {} +
          find "$FRAMES_DIR/toolchain" -type f -name nexus -exec chmod +x {} +
          chmod +x tools/ci/pointer_diag_v3.py

      - name: Build exact diagnostic source
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRAMES_DIR"
          ./tools/build.sh
          python3 tools/make_esp.py
          python3 tools/sdk_selftest.py
          python3 tools/make_desktop_preview_image.py
          python3 tools/verify_desktop_preview_image.py --image build/Frames-0.9.98-Desktop-Preview.img --require-pass
          python3 tools/verify_release.py

      - name: Run OCR-free pointer isolation diagnostics
        id: pointer_test
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          OUT="$GITHUB_WORKSPACE/pointer-isolation-${{ matrix.lane }}"
          mkdir -p "$OUT"
          python3 tools/ci/pointer_diag_v3.py \
            --qemu "$QEMU" \
            --ovmf "$OVMF_CODE" \
            --image "$FRAMES_DIR/build/Frames-0.9.98-Desktop-Preview.img" \
            --lane "${{ matrix.lane }}" \
            --out "$OUT"
          rc=$?
          echo "runner_rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Print isolation summary
        if: always()
        shell: bash
        run: |
          set +e
          cat "pointer-isolation-${{ matrix.lane }}/summary.json"
          echo
          echo "=== machine-readable pointer serial lines ==="
          cat "pointer-isolation-${{ matrix.lane }}/pointer-serial-lines.txt"
          echo
          echo "=== hashes ==="
          cat "pointer-isolation-${{ matrix.lane }}/SHA256SUMS.txt"

      - name: Upload v3 pointer isolation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frames-0.9.98-pointer-isolation-v3-${{ matrix.lane }}
          path: |
            pointer-isolation-${{ matrix.lane }}/**
          if-no-files-found: error
          retention-days: 14

      - name: Enforce lane result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.pointer_test.outputs.runner_rc }}" = "0"
