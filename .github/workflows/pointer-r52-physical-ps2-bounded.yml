name: Frames 0.9.98 r52 Physical PS2 Bounded Delta USB Image

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/pointer-r52-physical-ps2-bounded.yml'
      - 'tools/ci/make_r52_ps2_bounded_delta.py'
      - 'tools/ci/make_r50_ps2_phase_fix.py'
      - 'tools/ci/make_r49_ps2_phase.py'

permissions:
  contents: read

env:
  EXPECTED_PARENT_SHA256: 1c7f1b514d9aa2f847f724e8b633286d069d745bf7c281a3967c46bbfea1a18c
  EXPECTED_R46_KERNEL_MAIN_SHA256: e5ccd3d4a453184f620e2ed5f928599bc8a7fa6959098f3aeff4916f6dcff165

jobs:
  build-r52:
    name: Build r52 Rufus-compatible bounded PS2 image
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Initialize evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf r52-out
          mkdir -p r52-out
          printf 'status=started\nrevision=r52\n' > r52-out/BUILD-STATUS.txt

      - name: Reconstruct exact certified r46 base
        shell: bash
        run: |
          set -euo pipefail
          parent_sha="$(sha256sum Frames-0.9.98-Pointer-Diagnostics-CI-v1.zip | awk '{print $1}')"
          echo "protected_parent_sha256=$parent_sha" > r52-out/PARENT-IDENTITY.txt
          test "$parent_sha" = "$EXPECTED_PARENT_SHA256"
          rm -rf "$RUNNER_TEMP/r52"; mkdir -p "$RUNNER_TEMP/r52"
          unzip -q Frames-0.9.98-Pointer-Diagnostics-CI-v1.zip -d "$RUNNER_TEMP/r52"
          SRC="$RUNNER_TEMP/r52/Frames-0.9.98-Pointer-CI-Source"
          python3 - "$SRC/kernel/main.nx" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          a='if usb_hid_found != 0 { usb_hid_configured = xhci_configure_boot_hid(xhci_state,phys_state); if usb_hid_configured != 0 { usb_hid_report_ready = xhci_read_first_hid_report(xhci_state,phys_state); } }'
          b='if usb_hid_found != 0 { usb_hid_configured = xhci_configure_boot_hid(xhci_state,phys_state); if usb_hid_configured != 0 { usb_hid_report_ready = 1; } }'
          c='if input_queue_ready != 0 { if usb_hid_report_ready != 0 { input_decode_ready = input_decode_boot_hid(xhci_state,input_state); } else { ps2_poll_fallback(input_state); } }'
          d='if input_queue_ready != 0 { if usb_hid_report_ready != 0 { input_decode_ready = 1; } else { ps2_poll_fallback(input_state); } }'
          assert s.count(a)==1 and s.count(c)==1
          p.write_text(s.replace(a,b).replace(c,d))
          PY
          r46_sha="$(sha256sum "$SRC/kernel/main.nx" | awk '{print $1}')"
          echo "r46_kernel_main_sha256=$r46_sha" > r52-out/R46-BASE-IDENTITY.txt
          test "$r46_sha" = "$EXPECTED_R46_KERNEL_MAIN_SHA256"
          cp "$SRC/kernel/main.nx" r52-out/kernel-main-r46.nx
          echo "FRAMES_DIR=$SRC" >> "$GITHUB_ENV"

      - name: Apply r52 bounded-delta repair on working r50 path
        shell: bash
        run: |
          set -euo pipefail
          cp "$FRAMES_DIR/kernel/main.nx" r52-out/kernel-main-before-r52.nx
          python3 tools/ci/make_r52_ps2_bounded_delta.py "$FRAMES_DIR/kernel/main.nx"
          cp "$FRAMES_DIR/kernel/main.nx" r52-out/kernel-main-r52.nx
          diff -u r52-out/kernel-main-before-r52.nx r52-out/kernel-main-r52.nx > r52-out/R52-BOUNDED-DELTA.patch || true
          grep -q 'R52' "$FRAMES_DIR/kernel/main.nx"
          grep -q 'safe_x>32' "$FRAMES_DIR/kernel/main.nx"
          grep -q 'safe_y>32' "$FRAMES_DIR/kernel/main.nx"
          sha256sum "$FRAMES_DIR/kernel/main.nx" | tee r52-out/R52-KERNEL-SHA256.txt

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld python3 unzip zip mtools dosfstools
          find "$FRAMES_DIR" -type f -name '*.sh' -exec chmod +x {} +
          find "$FRAMES_DIR/toolchain" -type f -name nexus -exec chmod +x {} +

      - name: Build and verify raw USB image
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRAMES_DIR"
          ./tools/build.sh
          python3 tools/make_esp.py
          python3 tools/sdk_selftest.py
          python3 tools/make_desktop_preview_image.py
          python3 tools/verify_desktop_preview_image.py --image build/Frames-0.9.98-Desktop-Preview.img --require-pass
          python3 tools/verify_release.py
          cp build/Frames-0.9.98-Desktop-Preview.img "$GITHUB_WORKSPACE/r52-out/Frames-0.9.98-r52-Physical-PS2-Bounded-Delta-Rufus.img"

      - name: Record hands-on instructions and hashes
        shell: bash
        run: |
          set -euo pipefail
          img="r52-out/Frames-0.9.98-r52-Physical-PS2-Bounded-Delta-Rufus.img"
          img_sha="$(sha256sum "$img" | awk '{print $1}')"
          cat > r52-out/HANDS-ON-TEST.txt <<'EOF'
          Write Frames-0.9.98-r52-Physical-PS2-Bounded-Delta-Rufus.img directly to USB with Rufus/raw image mode.
          Boot in UEFI mode and confirm PTR DIAG R52.
          Move the touchpad normally, slowly, then quickly in all directions for 15-20 seconds.
          r52 preserves the working r50 packet path. It never rejects or resynchronizes a packet solely for a large delta; it caps each axis magnitude at 32 before Generic Pointer emission.
          Focus on cursor smoothness plus SRC, CORE, TRNS, CLMP, JNUM, JPDX, JPDY, BNDX, BNDY, BIGD, SHFT and LOCK.
          Experimental physical repair build; do not promote until hands-on success plus regression certification.
          EOF
          printf 'status=PASS\nrevision=r52\nimage_sha256=%s\n' "$img_sha" > r52-out/BUILD-STATUS.txt
          sha256sum r52-out/* > r52-out/SHA256SUMS.txt

      - name: Upload r52 USB image and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frames-0.9.98-r52-physical-ps2-bounded-delta-rufus-image
          path: r52-out/**
          if-no-files-found: error
          retention-days: 14
