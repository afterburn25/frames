name: Frames v108 Combined Live Input Certification

on:
  workflow_dispatch:
  push:
    branches: [ v108-physical-input-bringup ]
    paths:
      - '.github/workflows/frames-v108-combined-live-input-cert.yml'
      - 'tools/ci/patch_v108_live_input_common.py'
      - 'tools/ci/patch_v108_usb_mouse_live.py'
      - 'tools/ci/patch_v108_ps2_touchpad_live.py'

permissions:
  contents: read

env:
  KIT_SHA: 61b0fc25513719fce554729724c7848647de9cffe54434d4ab5f7ba8af42a36a
  SRC_SHA: 5f8c13adac6d34e64bd47d9463a3e261cd0b51bb5ddb500aa9f7b87c2914a52d
  BASE_MAIN_SHA: ffc5721eca68844357dbdca63b0edf266e7e210f9d162eecde8cae0067f210a8

jobs:
  build-combined:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v108-physical-input-bringup
      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld python3 unzip zip mtools dosfstools
      - name: Reconstruct exact certified v108 and apply both input overlays
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/k" "$RUNNER_TEMP/s" combined-build-evidence
          K=Frames-0.9.98-Runtime-Certification-Kit-v108-r9.zip
          test "$(sha256sum "$K" | awk '{print $1}')" = "$KIT_SHA"
          unzip -q "$K" -d "$RUNNER_TEMP/k"
          Z="$RUNNER_TEMP/k/Frames-0.9.98-Source-v108.zip"
          test "$(sha256sum "$Z" | awk '{print $1}')" = "$SRC_SHA"
          unzip -q "$Z" -d "$RUNNER_TEMP/s"
          F="$RUNNER_TEMP/s/Frames-0.9.98"
          test "$(sha256sum "$F/kernel/main.nx" | awk '{print $1}')" = "$BASE_MAIN_SHA"
          cp "$F/kernel/main.nx" combined-build-evidence/kernel-certified-v108.nx
          python3 tools/ci/patch_v108_live_input_common.py "$F/kernel/main.nx" | tee combined-build-evidence/common-sha.txt
          python3 tools/ci/patch_v108_usb_mouse_live.py "$F/kernel/main.nx" | tee combined-build-evidence/usb-sha.txt
          python3 tools/ci/patch_v108_ps2_touchpad_live.py "$F/kernel/main.nx" | tee combined-build-evidence/ps2-sha.txt
          cp "$F/kernel/main.nx" combined-build-evidence/kernel-combined.nx
          diff -u combined-build-evidence/kernel-certified-v108.nx combined-build-evidence/kernel-combined.nx > combined-build-evidence/COMBINED-INPUT.patch || true
          grep -q 'serial_marker_v108_usb_live_report_ok' "$F/kernel/main.nx"
          grep -q 'serial_marker_v108_ps2_packet_ok' "$F/kernel/main.nx"
          grep -q 'serial_marker_v108_input_test_runtime_ready' "$F/kernel/main.nx"
          sha256sum "$F/kernel/main.nx" | tee combined-build-evidence/COMBINED-KERNEL-SHA256.txt
          echo "FRAMES_DIR=$F" >> "$GITHUB_ENV"
      - name: Build one combined image
        shell: bash
        run: |
          set -euo pipefail
          find "$FRAMES_DIR" -type f -name '*.sh' -exec chmod +x {} +
          find "$FRAMES_DIR/toolchain" -type f -name nexus -exec chmod +x {} +
          cd "$FRAMES_DIR"
          ./tools/build.sh
          python3 tools/make_esp.py
          python3 tools/sdk_selftest.py
          python3 tools/make_desktop_preview_image.py
          python3 tools/verify_desktop_preview_image.py --image build/Frames-0.9.98-Desktop-Preview.img --require-pass
          python3 tools/verify_release.py
          cp build/Frames-0.9.98-Desktop-Preview.img "$GITHUB_WORKSPACE/Frames-0.9.98-v108-Combined-Live-Input.img"
          sha256sum "$GITHUB_WORKSPACE/Frames-0.9.98-v108-Combined-Live-Input.img" | tee "$GITHUB_WORKSPACE/combined-build-evidence/IMAGE-SHA256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: Frames-v108-Combined-Live-Input-Candidate
          path: |
            Frames-0.9.98-v108-Combined-Live-Input.img
            combined-build-evidence/**
          if-no-files-found: error
          retention-days: 30

  live-regression:
    needs: build-combined
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        lane: [usb, ps2]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Frames-v108-Combined-Live-Input-Candidate
          path: candidate
      - name: Install QEMU/OVMF
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf python3
          code="$(find /usr/share/OVMF -type f \( -name 'OVMF_CODE_4M.fd' -o -name 'OVMF_CODE.fd' \) | head -n1)"
          test -n "$code"
          echo "OVMF_CODE=$code" >> "$GITHUB_ENV"
      - name: Exercise ${{ matrix.lane }} through the same combined image
        shell: bash
        run: |
          set -euo pipefail
          OUT="evidence-${{ matrix.lane }}"; mkdir -p "$OUT"
          IMG="$(find candidate -name 'Frames-0.9.98-v108-Combined-Live-Input.img' -print -quit)"; test -s "$IMG"
          DUMMY="$RUNNER_TEMP/dummy-usb.img"; truncate -s 8M "$DUMMY"
          python3 - "$OVMF_CODE" "$IMG" "$DUMMY" "$OUT" '${{ matrix.lane }}' <<'PY'
          import json,pathlib,socket,subprocess,sys,time
          ovmf,image,dummy,out,lane=sys.argv[1:]
          out=pathlib.Path(out); qmp=out/'qmp.sock'; serial=out/'serial.log'; stderr=out/'qemu.stderr'
          cmd=['qemu-system-x86_64','-machine','q35','-m','768M','-smp','2','-cpu','max','-accel','tcg,thread=single','-display','none','-no-reboot','-no-shutdown','-nic','none','-serial',f'file:{serial}','-qmp',f'unix:{qmp},server=on,wait=off','-drive',f'if=pflash,format=raw,readonly=on,file={ovmf}','-drive',f'if=none,id=framesdisk,format=raw,file={image}','-device','nvme,serial=FRAMEV108,drive=framesdisk']
          if lane=='usb': cmd += ['-device','qemu-xhci,id=xhci','-drive',f'if=none,id=dummy,format=raw,file={dummy}','-device','usb-storage,drive=dummy,bus=xhci.0','-device','usb-mouse,bus=xhci.0,id=usbmouse']
          (out/'qemu-command.json').write_text(json.dumps(cmd,indent=2)+'\n')
          ef=stderr.open('wb'); p=subprocess.Popen(cmd,stdout=subprocess.DEVNULL,stderr=ef)
          try:
              deadline=time.time()+25
              while time.time()<deadline and not qmp.exists():
                  if p.poll() is not None: raise RuntimeError(f'qemu exited {p.returncode}')
                  time.sleep(.05)
              if not qmp.exists(): raise RuntimeError('qmp timeout')
              s=socket.socket(socket.AF_UNIX,socket.SOCK_STREAM); s.connect(str(qmp)); f=s.makefile('rwb',buffering=0); json.loads(f.readline())
              def call(name,args=None):
                  o={'execute':name}
                  if args is not None:o['arguments']=args
                  f.write((json.dumps(o)+'\n').encode())
                  while True:
                      r=json.loads(f.readline())
                      if 'return' in r:return r['return']
                      if 'error' in r:raise RuntimeError(r['error'])
              call('qmp_capabilities'); mice=call('query-mice'); (out/'query-mice.json').write_text(json.dumps(mice,indent=2)+'\n')
              if lane=='usb': idx=next((m['index'] for m in mice if ('hid' in m['name'].lower() or 'usb' in m['name'].lower()) and 'ps/2' not in m['name'].lower()),None)
              else: idx=next((m['index'] for m in mice if 'ps/2' in m['name'].lower() or 'ps2' in m['name'].lower()),None)
              if idx is None: raise RuntimeError(f'{lane} QEMU pointer frontend missing: {mice}')
              call('human-monitor-command',{'command-line':f'mouse_set {idx}'})
              deadline=time.time()+75; ready=False
              while time.time()<deadline:
                  txt=serial.read_text(errors='ignore') if serial.exists() else ''
                  if 'FRAMES_V108_INPUT_TEST_RUNTIME_READY' in txt: ready=True; break
                  if p.poll() is not None: raise RuntimeError('qemu stopped before runtime ready')
                  time.sleep(.2)
              if not ready: raise RuntimeError('runtime ready timeout')
              before=out/'before.ppm'; call('screendump',{'filename':str(before)})
              required=['FRAMES_V108_USB_LIVE_REPORT_OK','FRAMES_V108_USB_GUI_CURSOR_OK'] if lane=='usb' else ['FRAMES_V108_PS2_ENABLE_OK','FRAMES_V108_PS2_PACKET_OK','FRAMES_V108_PS2_GUI_CURSOR_OK']
              ok=False
              for _ in range(80):
                  call('input-send-event',{'events':[{'type':'rel','data':{'axis':'x','value':7}},{'type':'rel','data':{'axis':'y','value':3}}]})
                  time.sleep(.1)
                  txt=serial.read_text(errors='ignore') if serial.exists() else ''
                  if all(m in txt for m in required): ok=True; break
              after=out/'after.ppm'; call('screendump',{'filename':str(after)})
              a=before.read_bytes(); b=after.read_bytes(); changed=sum(x!=y for x,y in zip(a,b))
              result={'status':'PASS' if ok and changed>20 else 'FAIL','lane':lane,'runtime_ready':ready,'required_markers':required,'markers_ok':ok,'changed_bytes':changed,'frontend_index':idx}
              (out/'RESULT.json').write_text(json.dumps(result,indent=2)+'\n'); print(json.dumps(result,indent=2))
              if result['status']!='PASS': raise SystemExit(1)
              call('quit')
          finally:
              try:p.wait(timeout=5)
              except:p.kill(); p.wait()
          PY
          find "$OUT" -type s -delete || true
          sha256sum "$OUT"/* > "$OUT/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Frames-v108-Combined-${{ matrix.lane }}-Evidence
          path: evidence-${{ matrix.lane }}/**
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: [build-combined, live-regression]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Frames-v108-Combined-Live-Input-Candidate
          path: candidate
      - name: Seal combined VM input certification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aggregate
          IMG="$(find candidate -name 'Frames-0.9.98-v108-Combined-Live-Input.img' -print -quit)"
          sha256sum "$IMG" | tee aggregate/IMAGE-SHA256.txt
          cat > aggregate/FINAL-COMBINED-LIVE-INPUT.json <<'EOF'
          {
            "status": "PASS",
            "profile": "frames-0.9.98-v108-combined-live-input-vm-certification",
            "base": "exact freshly certified Frames 0.9.98 v108 r9",
            "usb_live_input_vm": true,
            "ps2_live_input_vm": true,
            "physical_hardware_verified": false,
            "i2c_hid_touchpad_implemented": false,
            "physical_destructive_writes_certified": false,
            "promotion_allowed": false
          }
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: Frames-v108-Combined-Live-Input-Final
          path: aggregate/**
          if-no-files-found: error
          retention-days: 30
