name: Frames Real GUI Baseline Audit v2

on:
  workflow_dispatch:
  push:
    branches: [ v116-full-product-v101-integration ]
    paths:
      - '.github/workflows/frames-real-gui-baseline-audit-v2.yml'
      - 'architecture/integration/run_real_gui_baseline_audit_v2.sh'

permissions:
  contents: read

jobs:
  audit-real-gui:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v116-full-product-v101-integration

      - name: Install audit tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld python3 unzip gdisk mtools dosfstools qemu-system-x86 ovmf netcat-openbsd binutils

      - name: Audit v72 v94 v101 as supplied
        run: |
          set -euo pipefail
          chmod +x architecture/integration/run_real_gui_baseline_audit_v2.sh
          architecture/integration/run_real_gui_baseline_audit_v2.sh

      - name: Upload complete GUI audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Frames-Real-GUI-Baseline-Audit-v2
          path: real-gui-audit-v2/
          if-no-files-found: error
          retention-days: 30
