name: Frames v116 Integrated GUI Physical Test ISO

on:
  workflow_dispatch:
  push:
    branches: [ integrated-gui-physical-iso ]
    paths:
      - '.github/workflows/frames-v116-integrated-gui-physical-test-iso.yml'
      - 'bootux/**'
      - 'architecture/integration/**'
      - 'architecture/v109/**'
      - 'architecture/v110/**'
      - 'architecture/v111/**'
      - 'architecture/v112/**'
      - 'architecture/v113/**'
      - 'architecture/v114/**'
      - 'architecture/v115/**'
      - 'architecture/v116/**'

permissions:
  contents: read

env:
  V108_KIT_SHA256: 61b0fc25513719fce554729724c7848647de9cffe54434d4ab5f7ba8af42a36a
  V108_SOURCE_SHA256: 5f8c13adac6d34e64bd47d9463a3e261cd0b51bb5ddb500aa9f7b87c2914a52d
  V101_KIT_SHA256: 84f0a5c6b47d10e11237ab1d6d4c34507a4d525b98bbe58ffc6aa20e3a8dbca5
  V101_SOURCE_SHA256: ce58e0eceb770e5b9bc3842ce096deccd9640d986ac0acfec5065305efef2b65
  APPROVED_LOGO_SHA256: ea3542453493238c0f50a6c703150d482edc0d5b875a6dfe678c15a42ab7ae0e
  APPROVED_SPLASH_SHA256: 70e9ca0c9e31b56b720f3cf0bd22c5eacc35b51797782ad0f03172c2038b9fbd
  V116_MAIN_SHA256: a8c569ca5c6b9facd85176a0fe97c8b369f9e4bbf50153f41a1b7777636a3ed5

jobs:
  certify-and-build-physical-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrated-gui-physical-iso

      - name: Install build, ISO, and proof tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld python3 python3-pil unzip qemu-system-x86 ovmf netcat-openbsd mtools dosfstools gdisk file xorriso

      - name: Reconstruct exact certified v108 r9 source and port v109 through v116
        shell: bash
        run: |
          set -euo pipefail
          E="$GITHUB_WORKSPACE/gui-iso-evidence"; mkdir -p "$E" "$RUNNER_TEMP/v108-kit" "$RUNNER_TEMP/v108-src"
          KIT="$GITHUB_WORKSPACE/Frames-0.9.98-Runtime-Certification-Kit-v108-r9.zip"
          test -s "$KIT"; test "$(sha256sum "$KIT" | awk '{print $1}')" = "$V108_KIT_SHA256"
          unzip -q "$KIT" -d "$RUNNER_TEMP/v108-kit"
          Z="$RUNNER_TEMP/v108-kit/Frames-0.9.98-Source-v108.zip"
          test -s "$Z"; test "$(sha256sum "$Z" | awk '{print $1}')" = "$V108_SOURCE_SHA256"
          unzip -q "$Z" -d "$RUNNER_TEMP/v108-src"
          S="$RUNNER_TEMP/v108-src/Frames-0.9.98"
          test -f "$S/kernel/main.nx"; test -f "$S/boot/uefi/frames_boot.c"
          for p in \
            architecture/v109/make_unified_device_architecture_v109.py \
            architecture/v110/make_driver_runtime_v110.py \
            architecture/v111/make_async_io_service_runtime_v111.py \
            architecture/v112/make_device_service_integration_v112.py \
            architecture/v113/make_driver_execution_hal_v113.py \
            architecture/v114/make_kernel_concurrency_driver_scheduling_v114.py \
            architecture/v115/make_driver_migration_unified_input_v115.py \
            architecture/v116/make_usb_core_xhci_migration_v116.py; do
              python3 "$p" "$S/kernel/main.nx"
          done
          test "$(sha256sum "$S/kernel/main.nx" | awk '{print $1}')" = "$V116_MAIN_SHA256"
          echo "S=$S" >> "$GITHUB_ENV"
          sha256sum "$KIT" "$Z" "$S/kernel/main.nx" "$S/boot/uefi/frames_boot.c" > "$E/SOURCE-CHAIN-SHA256.txt"
          grep -n 'serial_marker_integrated_gui_ok(); serial_marker_desktop_phase12_ok(); return 1;' "$S/kernel/main.nx" > "$E/LEGACY-INTEGRATED-GUI-SUCCESS-PREDICATE.txt"

      - name: Recreate approved splash exactly and apply current GUI product integration
        shell: bash
        run: |
          set -euo pipefail
          E="$GITHUB_WORKSPACE/gui-iso-evidence"; mkdir -p "$RUNNER_TEMP/v101-kit" "$RUNNER_TEMP/v101-src"
          KIT="$GITHUB_WORKSPACE/Frames-0.9.91-Integrated-Connected-Services-Certification-Kit-v101.zip"
          test -s "$KIT"; test "$(sha256sum "$KIT" | awk '{print $1}')" = "$V101_KIT_SHA256"
          unzip -q "$KIT" -d "$RUNNER_TEMP/v101-kit"
          Z="$(find "$RUNNER_TEMP/v101-kit" -type f -iname '*0.9.91*Source*.zip' -print | sort | head -n1)"
          test -s "$Z"; test "$(sha256sum "$Z" | awk '{print $1}')" = "$V101_SOURCE_SHA256"
          unzip -q "$Z" -d "$RUNNER_TEMP/v101-src"
          V101="$RUNNER_TEMP/v101-src/Frames-0.9.91"
          LOGO="$V101/assets/branding/FramesLogo.png"
          test "$(sha256sum "$LOGO" | awk '{print $1}')" = "$APPROVED_LOGO_SHA256"
          SPLASH="$RUNNER_TEMP/SPLASH.FSP"
          python3 bootux/make_splash_asset.py "$LOGO" "$SPLASH" | tee "$E/APPROVED-SPLASH-ASSET.json"
          test "$(sha256sum "$SPLASH" | awk '{print $1}')" = "$APPROVED_SPLASH_SHA256"
          sha256sum "$LOGO" "$SPLASH" > "$E/APPROVED-SPLASH-IDENTITY.txt"
          python3 bootux/patch_v108_uefi_approved_splash.py "$S/boot/uefi/frames_boot.c" | tee "$E/V108-SPLASH-AND-GUI-REPAIRS.log"
          python3 bootux/patch_integrated_gui_physical_test_policy.py "$S/boot/uefi/frames_boot.c" "$S/kernel/main.nx" | tee "$E/GUI-PHYSICAL-TEST-POLICY-PATCH.log"
          clang -fsyntax-only -ffreestanding -fshort-wchar -mno-red-zone -mno-sse -mno-sse2 -Wno-unused-function "$S/boot/uefi/frames_boot.c"
          grep -q 'fn serial_marker_frames_integrated_gui_ok()' "$S/kernel/main.nx"
          grep -q 'gui_physical_test_mode!=0' "$S/kernel/main.nx"
          sha256sum "$S/boot/uefi/frames_boot.c" "$S/kernel/main.nx" > "$E/PATCHED-PRODUCT-SHA256.txt"
          echo "SPLASH=$SPLASH" >> "$GITHUB_ENV"

      - name: Build v116 integrated-GUI physical-test product
        shell: bash
        run: |
          set -euo pipefail
          E="$GITHUB_WORKSPACE/gui-iso-evidence"
          cd "$S"
          chmod +x tools/*.sh tools/*.py sdk/*.sh 2>/dev/null || true
          find toolchain -type f -name nexus -exec chmod +x {} + 2>/dev/null || true
          ./tools/build.sh 2>&1 | tee "$E/BUILD.log"
          grep -q 'decision: BLOCKED' "$E/BUILD.log"
          python3 tools/sdk_selftest.py --require-pass > "$E/SDK-SELFTEST.json"
          python3 tools/make_esp.py 2>&1 | tee "$E/MAKE-ESP.log"
          python3 tools/make_desktop_preview_image.py 2>&1 | tee "$E/MAKE-DESKTOP-PREVIEW.log"
          python3 tools/verify_release.py > "$E/RELEASE-VERIFY.log"
          test -s build/BOOTX64.EFI; test -s build/FramesKernel.fkrn; test -s build/System.fex
          test -s build/Frames-0.9.98-ESP.img; test -s build/Frames-0.9.98-Desktop-Preview.img
          sha256sum build/BOOTX64.EFI build/FramesKernel.fkrn build/System.fex build/Frames-0.9.98-ESP.img build/Frames-0.9.98-Desktop-Preview.img > "$E/PRODUCT-BUILD-SHA256.txt"

      - name: Compose exact desktop splash and isolated GUI-test policy into product ESP
        shell: bash
        run: |
          set -euo pipefail
          E="$GITHUB_WORKSPACE/gui-iso-evidence"
          ESP="$(readlink -f "$S/build/Frames-0.9.98-ESP.img")"
          DESK="$(readlink -f "$S/build/Frames-0.9.98-Desktop-Preview.img")"
          ESP_FIRST="$(sgdisk -i 1 "$ESP" | awk -F: '/First sector/ {gsub(/^[ \t]+|[ \t]+$/, "", $2); split($2,a," "); print a[1]; exit}')"
          ESP_LAST="$(sgdisk -i 1 "$ESP" | awk -F: '/Last sector/ {gsub(/^[ \t]+|[ \t]+$/, "", $2); split($2,a," "); print a[1]; exit}')"
          DESK_FIRST="$(sgdisk -i 1 "$DESK" | awk -F: '/First sector/ {gsub(/^[ \t]+|[ \t]+$/, "", $2); split($2,a," "); print a[1]; exit}')"
          test -n "$ESP_FIRST"; test -n "$ESP_LAST"; test -n "$DESK_FIRST"
          ESP_MTOOLS="$ESP@@$((ESP_FIRST*512))"; DESK_MTOOLS="$DESK@@$((DESK_FIRST*512))"
          mkdir -p "$RUNNER_TEMP/desktop-files" "$RUNNER_TEMP/roundtrip"
          for f in DESKTOP.CFG HELLO.FAP THEME.FTH APPEAR.CFG; do
            mcopy -o -i "$DESK_MTOOLS" "::/FRAMES/$f" "$RUNNER_TEMP/desktop-files/$f"
            test -s "$RUNNER_TEMP/desktop-files/$f"
            mcopy -o -i "$ESP_MTOOLS" "$RUNNER_TEMP/desktop-files/$f" "::/FRAMES/$f"
          done
          printf 'FRAMES_INTEGRATED_GUI_PHYSICAL_TEST_V1\n' > "$RUNNER_TEMP/desktop-files/GUITEST.CFG"
          mcopy -o -i "$ESP_MTOOLS" "$RUNNER_TEMP/desktop-files/GUITEST.CFG" ::/FRAMES/GUITEST.CFG
          mcopy -o -i "$ESP_MTOOLS" "$SPLASH" ::/FRAMES/SPLASH.FSP
          mdir -i "$ESP_MTOOLS" ::/FRAMES > "$E/PRODUCT-ESP-FRAMES.txt"
          for f in DESKTOP.CFG HELLO.FAP THEME.FTH APPEAR.CFG GUITEST.CFG SPLASH.FSP; do
            mcopy -o -i "$ESP_MTOOLS" "::/FRAMES/$f" "$RUNNER_TEMP/roundtrip/$f"
            test -s "$RUNNER_TEMP/roundtrip/$f"
          done
          test "$(sha256sum "$RUNNER_TEMP/roundtrip/SPLASH.FSP" | awk '{print $1}')" = "$APPROVED_SPLASH_SHA256"
          for f in DESKTOP.CFG HELLO.FAP THEME.FTH APPEAR.CFG GUITEST.CFG; do cmp "$RUNNER_TEMP/desktop-files/$f" "$RUNNER_TEMP/roundtrip/$f"; done
          ! mdir -i "$ESP_MTOOLS" ::/FRAMES/PHYSBOOT.CFG >/dev/null 2>&1
          ! mdir -i "$ESP_MTOOLS" ::/FRAMES/USBMSC.CFG >/dev/null 2>&1
          ! mdir -i "$ESP_MTOOLS" ::/FRAMES/DEVPREV.CFG >/dev/null 2>&1
          sha256sum "$RUNNER_TEMP/roundtrip"/* > "$E/ESP-ROUNDTRIP-SHA256.txt"
          printf 'esp=%s\nesp_first=%s\nesp_last=%s\ndesktop_first=%s\n' "$ESP" "$ESP_FIRST" "$ESP_LAST" "$DESK_FIRST" > "$E/PARTITION-LAYOUT.txt"
          echo "ESP=$ESP" >> "$GITHUB_ENV"
          echo "ESP_FIRST=$ESP_FIRST" >> "$GITHUB_ENV"
          echo "ESP_LAST=$ESP_LAST" >> "$GITHUB_ENV"

      - name: Locate OVMF firmware
        shell: bash
        run: |
          set -euo pipefail
          code=""; vars=""
          for p in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd; do [ -f "$p" ] && code="$p" && break; done
          for p in /usr/share/OVMF/OVMF_VARS_4M.fd /usr/share/OVMF/OVMF_VARS.fd; do [ -f "$p" ] && vars="$p" && break; done
          test -n "$code"; test -n "$vars"
          echo "OVMF_CODE=$code" >> "$GITHUB_ENV"; echo "OVMF_VARS=$vars" >> "$GITHUB_ENV"
          printf 'OVMF_CODE=%s\nOVMF_VARS=%s\n' "$code" "$vars" > "$GITHUB_WORKSPACE/gui-iso-evidence/OVMF-IDENTITY.txt"

      - name: QEMU proof 1 - approved splash to kernel phase12 appearance and FRAMES_INTEGRATED_GUI_OK
        shell: bash
        run: |
          set -euo pipefail
          E="$GITHUB_WORKSPACE/gui-iso-evidence"; MON="$RUNNER_TEMP/gui-mon.sock"; SERIAL="$E/RAW-ESP-SERIAL.log"
          cp "$OVMF_VARS" "$RUNNER_TEMP/gui-vars.fd"; rm -f "$MON"
          qemu-system-x86_64 -machine q35 -m 1024 -smp 2 -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" -drive if=pflash,format=raw,file="$RUNNER_TEMP/gui-vars.fd" -drive if=virtio,format=raw,file="$ESP" -boot menu=off -serial file:"$SERIAL" -monitor unix:"$MON",server=on,wait=off -display none -vga std -no-reboot &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 80); do [ -S "$MON" ] && break; sleep 0.1; done
          test -S "$MON"
          python3 - "$MON" "$E" <<'PY'
          import socket,sys,time,pathlib
          s=socket.socket(socket.AF_UNIX,socket.SOCK_STREAM); s.connect(sys.argv[1]); s.settimeout(.05)
          try:s.recv(4096)
          except Exception:pass
          out=pathlib.Path(sys.argv[2])
          for i in range(45):
              s.sendall(f'screendump {out}/RAW-SPLASH-{i:02d}.ppm\n'.encode()); time.sleep(.15)
          s.close()
          PY
          python3 bootux/verify_splash_frame.py "$E"/RAW-SPLASH-*.ppm | tee "$E/RAW-SPLASH-FRAME-PROOF.json"
          WIN="$(python3 - "$E/RAW-SPLASH-FRAME-PROOF.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))['winner']['file'])
          PY
          )"
          cp "$E/$WIN" "$E/RAW-BOOT-SPLASH-PROOF.ppm"; rm -f "$E"/RAW-SPLASH-[0-9][0-9].ppm
          found=0
          for i in $(seq 1 75); do
            if [ -s "$SERIAL" ] && grep -q 'FRAMES_INTEGRATED_GUI_OK' "$SERIAL"; then found=1; break; fi
            sleep 1
          done
          test "$found" = 1
          grep -q 'FRAMES_KERNEL_START' "$SERIAL"
          grep -q 'FRAMES_USB_MIGRATION_RUNTIME_V9_OK' "$SERIAL"
          grep -q 'FRAMES_DESKTOP_POLICY_OK' "$SERIAL"
          grep -q 'FRAMES_GUI_PHYSICAL_TEST_POLICY_OK' "$SERIAL"
          grep -q 'FRAMES_GUI_APP_CONTRACT_OK' "$SERIAL"
          grep -q 'FRAMES_GUI_APP_PRESENT_OK' "$SERIAL"
          grep -q 'FRAMES_GUI_DESKTOP_INTEGRATED_OK' "$SERIAL"
          grep -q 'FRAMES_DESKTOP_PHASE12_OK' "$SERIAL"
          grep -q 'FRAMES_APPEARANCE_SYSTEM_OK' "$SERIAL"
          grep -q 'FRAMES_INTEGRATED_GUI_OK' "$SERIAL"
          grep -q 'FRAMES_GUI_PHYSICAL_TEST_READY' "$SERIAL"
          ! grep -q 'FRAMES_DESKTOP_CERT_FAIL' "$SERIAL"
          python3 - "$MON" "$E/RAW-GUI-PROOF.ppm" <<'PY'
          import socket,sys,time
          s=socket.socket(socket.AF_UNIX,socket.SOCK_STREAM); s.connect(sys.argv[1]); s.settimeout(.1)
          try:s.recv(4096)
          except Exception:pass
          s.sendall(f'screendump {sys.argv[2]}\n'.encode()); time.sleep(.4); s.sendall(b'quit\n'); time.sleep(.2); s.close()
          PY
          wait "$PID" || true; trap - EXIT
          python3 bootux/verify_gui_transition_frame.py "$E/RAW-BOOT-SPLASH-PROOF.ppm" "$E/RAW-GUI-PROOF.ppm" | tee "$E/RAW-GUI-FRAME-PROOF.json"
          python3 - "$SERIAL" "$E/RAW-TRANSITION-ORDER.json" <<'PY'
          import json,sys
          s=open(sys.argv[1],errors='replace').read()
          marks=['FRAMES_KERNEL_START','FRAMES_DESKTOP_POLICY_OK','FRAMES_GUI_PHYSICAL_TEST_POLICY_OK','FRAMES_USB_MIGRATION_RUNTIME_V9_OK','FRAMES_DESKTOP_PHASE12_OK','FRAMES_APPEARANCE_SYSTEM_OK','FRAMES_INTEGRATED_GUI_OK','FRAMES_GUI_PHYSICAL_TEST_READY']
          pos={m:s.find(m) for m in marks}; ok=all(pos[m]>=0 for m in marks) and all(pos[marks[i]]<pos[marks[i+1]] for i in range(len(marks)-1)) and 'FRAMES_DESKTOP_CERT_FAIL' not in s
          open(sys.argv[2],'w').write(json.dumps({'status':'PASS' if ok else 'FAIL','positions':pos,'desktop_cert_fail_absent':'FRAMES_DESKTOP_CERT_FAIL' not in s},indent=2)+'\n')
          if not ok: raise SystemExit(1)
          PY

      - name: Create next physical-test UEFI ISO only after integrated GUI proof passes
        shell: bash
        run: |
          set -euo pipefail
          E="$GITHUB_WORKSPACE/gui-iso-evidence"
          test "$(python3 -c 'import json;print(json.load(open("gui-iso-evidence/RAW-GUI-FRAME-PROOF.json"))["status"])')" = PASS
          test "$(python3 -c 'import json;print(json.load(open("gui-iso-evidence/RAW-TRANSITION-ORDER.json"))["status"])')" = PASS
          COUNT=$((ESP_LAST-ESP_FIRST+1)); EFI_BOOT="$RUNNER_TEMP/efiboot-integrated-gui.img"
          dd if="$ESP" of="$EFI_BOOT" bs=512 skip="$ESP_FIRST" count="$COUNT" status=none
          test -s "$EFI_BOOT"
          mdir -i "$EFI_BOOT" ::/EFI/BOOT/BOOTX64.EFI >/dev/null
          mdir -i "$EFI_BOOT" ::/FRAMES > "$E/ISO-EFIBOOT-FRAMES.txt"
          mkdir -p "$RUNNER_TEMP/iso-root/EFI" "$RUNNER_TEMP/iso-root/FRAMES"
          cp "$EFI_BOOT" "$RUNNER_TEMP/iso-root/EFI/efiboot.img"
          cp "$S/build/FramesKernel.fkrn" "$RUNNER_TEMP/iso-root/FRAMES/FramesKernel.fkrn"
          cp "$S/build/System.fex" "$RUNNER_TEMP/iso-root/FRAMES/System.fex"
          cat > "$RUNNER_TEMP/iso-root/README.TXT" <<'EOF'
          Frames v116 Integrated GUI Physical Test
          Diagnostic-only physical test media.
          Approved Boot Splash Phase 1 asset is folded in byte-for-byte.
          QEMU certification requires splash -> kernel -> desktop phase 12 -> appearance -> FRAMES_INTEGRATED_GUI_OK.
          GUITEST.CFG isolates this test from storage-indexed and connected-service certification trains.
          Physical destructive-write certification is not granted by this image.
          EOF
          OUT="$GITHUB_WORKSPACE/Frames-0.9.106-v116-Integrated-GUI-Physical-Test-UEFI.iso"
          xorriso -as mkisofs -iso-level 3 -R -J -V FRAMES_GUI_V116 -eltorito-alt-boot -e EFI/efiboot.img -no-emul-boot -o "$OUT" "$RUNNER_TEMP/iso-root"
          test -s "$OUT"
          sha256sum "$OUT" | tee "$E/PHYSICAL-TEST-ISO-SHA256.txt"
          xorriso -indev "$OUT" -report_el_torito plain > "$E/EL-TORITO-REPORT.txt" 2>&1
          xorriso -indev "$OUT" -find / -maxdepth 3 -type f -exec lsdl > "$E/ISO-CONTENTS.txt" 2>&1
          echo "ISO=$OUT" >> "$GITHUB_ENV"

      - name: QEMU proof 2 - boot physical-test ISO through exact splash kernel and integrated GUI
        shell: bash
        run: |
          set -euo pipefail
          E="$GITHUB_WORKSPACE/gui-iso-evidence"; MON="$RUNNER_TEMP/iso-gui-mon.sock"; SERIAL="$E/ISO-SERIAL.log"
          cp "$OVMF_VARS" "$RUNNER_TEMP/iso-gui-vars.fd"; rm -f "$MON"
          qemu-system-x86_64 -machine q35 -m 1024 -smp 2 -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" -drive if=pflash,format=raw,file="$RUNNER_TEMP/iso-gui-vars.fd" -cdrom "$ISO" -boot d -serial file:"$SERIAL" -monitor unix:"$MON",server=on,wait=off -display none -vga std -no-reboot &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 80); do [ -S "$MON" ] && break; sleep 0.1; done
          test -S "$MON"
          python3 - "$MON" "$E" <<'PY'
          import socket,sys,time,pathlib
          s=socket.socket(socket.AF_UNIX,socket.SOCK_STREAM); s.connect(sys.argv[1]); s.settimeout(.05)
          try:s.recv(4096)
          except Exception:pass
          out=pathlib.Path(sys.argv[2])
          for i in range(55):
              s.sendall(f'screendump {out}/ISO-SPLASH-{i:02d}.ppm\n'.encode()); time.sleep(.15)
          s.close()
          PY
          python3 bootux/verify_splash_frame.py "$E"/ISO-SPLASH-*.ppm | tee "$E/ISO-SPLASH-FRAME-PROOF.json"
          WIN="$(python3 - "$E/ISO-SPLASH-FRAME-PROOF.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))['winner']['file'])
          PY
          )"
          cp "$E/$WIN" "$E/ISO-BOOT-SPLASH-PROOF.ppm"; rm -f "$E"/ISO-SPLASH-[0-9][0-9].ppm
          found=0
          for i in $(seq 1 80); do
            if [ -s "$SERIAL" ] && grep -q 'FRAMES_INTEGRATED_GUI_OK' "$SERIAL"; then found=1; break; fi
            sleep 1
          done
          test "$found" = 1
          grep -q 'FRAMES_KERNEL_START' "$SERIAL"
          grep -q 'FRAMES_USB_MIGRATION_RUNTIME_V9_OK' "$SERIAL"
          grep -q 'FRAMES_DESKTOP_POLICY_OK' "$SERIAL"
          grep -q 'FRAMES_GUI_PHYSICAL_TEST_POLICY_OK' "$SERIAL"
          grep -q 'FRAMES_GUI_DESKTOP_INTEGRATED_OK' "$SERIAL"
          grep -q 'FRAMES_DESKTOP_PHASE12_OK' "$SERIAL"
          grep -q 'FRAMES_APPEARANCE_SYSTEM_OK' "$SERIAL"
          grep -q 'FRAMES_INTEGRATED_GUI_OK' "$SERIAL"
          grep -q 'FRAMES_GUI_PHYSICAL_TEST_READY' "$SERIAL"
          ! grep -q 'FRAMES_DESKTOP_CERT_FAIL' "$SERIAL"
          python3 - "$MON" "$E/ISO-GUI-PROOF.ppm" <<'PY'
          import socket,sys,time
          s=socket.socket(socket.AF_UNIX,socket.SOCK_STREAM); s.connect(sys.argv[1]); s.settimeout(.1)
          try:s.recv(4096)
          except Exception:pass
          s.sendall(f'screendump {sys.argv[2]}\n'.encode()); time.sleep(.4); s.sendall(b'quit\n'); time.sleep(.2); s.close()
          PY
          wait "$PID" || true; trap - EXIT
          python3 bootux/verify_gui_transition_frame.py "$E/ISO-BOOT-SPLASH-PROOF.ppm" "$E/ISO-GUI-PROOF.ppm" | tee "$E/ISO-GUI-FRAME-PROOF.json"
          python3 - "$SERIAL" "$E/ISO-TRANSITION-ORDER.json" <<'PY'
          import json,sys
          s=open(sys.argv[1],errors='replace').read()
          marks=['FRAMES_KERNEL_START','FRAMES_DESKTOP_POLICY_OK','FRAMES_GUI_PHYSICAL_TEST_POLICY_OK','FRAMES_USB_MIGRATION_RUNTIME_V9_OK','FRAMES_DESKTOP_PHASE12_OK','FRAMES_APPEARANCE_SYSTEM_OK','FRAMES_INTEGRATED_GUI_OK','FRAMES_GUI_PHYSICAL_TEST_READY']
          pos={m:s.find(m) for m in marks}; ok=all(pos[m]>=0 for m in marks) and all(pos[marks[i]]<pos[marks[i+1]] for i in range(len(marks)-1)) and 'FRAMES_DESKTOP_CERT_FAIL' not in s
          open(sys.argv[2],'w').write(json.dumps({'status':'PASS' if ok else 'FAIL','positions':pos,'desktop_cert_fail_absent':'FRAMES_DESKTOP_CERT_FAIL' not in s},indent=2)+'\n')
          if not ok: raise SystemExit(1)
          PY

      - name: Final fail-closed integrated GUI physical-test ISO certification
        shell: bash
        run: |
          set -euo pipefail
          E="$GITHUB_WORKSPACE/gui-iso-evidence"
          test -s "$ISO"; test -s "$E/RAW-BOOT-SPLASH-PROOF.ppm"; test -s "$E/RAW-GUI-PROOF.ppm"; test -s "$E/ISO-BOOT-SPLASH-PROOF.ppm"; test -s "$E/ISO-GUI-PROOF.ppm"
          python3 - "$E" "$ISO" <<'PY'
          import hashlib,json,pathlib,sys
