name: Frames v108 r28c Hardened Retry Certification

on:
  workflow_dispatch:
  push:
    branches: [ v108-usb-hub-topology-r1 ]
    paths:
      - '.github/workflows/frames-v108-r28c-hardened-retry-cert.yml'
      - 'tools/ci/harden_qemu_text_edit_gate_r28.py'

permissions:
  contents: read
  actions: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v108-usb-hub-topology-r1
      - name: Install build, image and runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld python3 python3-pil unzip mtools dosfstools gdisk xorriso qemu-system-x86 ovmf
      - name: Fetch exact r21 protected source
        uses: actions/download-artifact@v4
        with:
          name: Frames-v108-r21-Candidate
          path: r21-candidate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: afterburn25/frames
          run-id: '31979817129'
      - name: Harden text-gate readiness only
        run: python3 tools/ci/harden_qemu_text_edit_gate_r28.py
      - name: Rebuild exact r28c candidate and run complete certification
        run: python3 tools/ci/r28c_cert_driver.py
      - name: Validate sealed Rufus physical handoff
        run: python3 tools/ci/validate_physical_handoff.py --final final
      - name: Upload r28c hardened-retry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Frames-v108-r28c-Hardened-Retry-Evidence
          path: |
            evidence/**
            out/*.iso
          if-no-files-found: warn
          retention-days: 30
      - name: Upload sealed r28c Rufus ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Frames-v108-r28c-Rufus-Final
          path: final/**
          if-no-files-found: error
          retention-days: 30
