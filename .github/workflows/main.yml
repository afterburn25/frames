name: Frames 0.9.50 v60 r3 Evidence Repair
on:
  workflow_dispatch:
  push:
    paths:
      - 'Frames-0.9.50-Runtime-Certification-Kit-v60-r3-Evidence-Repair.zip'
permissions:
  contents: read
jobs:
  certify-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Initialize
        shell: bash
        run: rm -rf r3kit runtime-evidence && mkdir -p r3kit runtime-evidence
      - name: Locate r3 kit
        id: locate
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 - "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/r3kit" <<'PY'
          import sys,pathlib,zipfile,json
          ws=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          marker='Frames-0.9.50-Runtime-Certification-Kit-v60-r3-Evidence-Repair/KIT-CONTRACT.json'
          matches=[]
          for p in ws.rglob('*.zip'):
              try:
                  with zipfile.ZipFile(p) as z:
                      if marker in z.namelist():
                          c=json.loads(z.read(marker))
                          if c.get('workflow_revision')=='v60-incremental-r3' and c.get('candidate_source_sha256')=='21d35759dd7eeaa7e17e587a31ec99c97a1b64052a08b38944aabec30a91f883':matches.append(p)
              except Exception:pass
          assert len(matches)==1,matches
          with zipfile.ZipFile(matches[0]) as z:z.extractall(out)
          PY
      - name: Re-evaluate exact runtime evidence
        id: evaluate
        if: always()
        shell: bash
        continue-on-error: true
        run: |
          root="$GITHUB_WORKSPACE/r3kit/Frames-0.9.50-Runtime-Certification-Kit-v60-r3-Evidence-Repair"
          rc=0
          python3 "$root/verify-v60-r3-evidence.py" "$root" "$GITHUB_WORKSPACE/runtime-evidence" > runtime-evidence/R3-CONSOLE.log 2>&1 || rc=$?
          echo "$rc" > runtime-evidence/R3-EXIT-CODE.txt
          exit "$rc"
      - name: Verify final manifest
        if: always()
        shell: bash
        run: |
          python3 - runtime-evidence <<'PY'
          from pathlib import Path
          import hashlib,sys,json
          r=Path(sys.argv[1])
          def H(p):
              h=hashlib.sha256()
              with open(p,'rb') as f:
                  for c in iter(lambda:f.read(1<<20),b''):h.update(c)
              return h.hexdigest()
          files=[p for p in sorted(r.rglob('*')) if p.is_file() and p.name!='EVIDENCE-FILES-SHA256.txt']
          r.joinpath('EVIDENCE-FILES-SHA256.txt').write_text(''.join(f"{H(p)}  {p.relative_to(r).as_posix()}\n" for p in files))
          mism=[]
          for line in r.joinpath('EVIDENCE-FILES-SHA256.txt').read_text().splitlines():
              h,n=line.split('  ',1)
              if H(r/n)!=h:mism.append(n)
          r.joinpath('FINAL-MANIFEST-VERIFY.json').write_text(json.dumps({'status':'PASS' if not mism else 'FAIL','mismatches':mism},indent=2)+'\n')
          files=[p for p in sorted(r.rglob('*')) if p.is_file() and p.name!='EVIDENCE-FILES-SHA256.txt']
          r.joinpath('EVIDENCE-FILES-SHA256.txt').write_text(''.join(f"{H(p)}  {p.relative_to(r).as_posix()}\n" for p in files))
          PY
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frames-0.9.50-helixfs-readonly-phase3-evidence-v60
          path: runtime-evidence
          if-no-files-found: error
      - name: Final verdict
        if: always()
        shell: bash
        run: |
          [[ "${{ steps.locate.outcome }}" == success && "${{ steps.evaluate.outcome }}" == success ]]
          python3 - <<'PY'
          import json
          f=json.load(open('runtime-evidence/FINAL-CERTIFICATION.json'))
          m=json.load(open('runtime-evidence/FINAL-MANIFEST-VERIFY.json'))
          assert f['status']=='PASS' and f['workflow_revision']=='v60-incremental-r3'
          assert m['status']=='PASS'
          print('FRAMES 0.9.50 v60 r3 FINAL CERTIFICATION PASS')
          PY
