name: Frames Runtime Certification

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  qemu-ovmf-certification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf clang lld python3 unzip

      - name: Locate Frames 0.9.9 source
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "$GITHUB_WORKSPACE/toolchain/Nexus-Language-5.15.0/nexus" ]]; then
            frames_dir="$GITHUB_WORKSPACE"
          elif [[ -f "$GITHUB_WORKSPACE/Frames-0.9.9/toolchain/Nexus-Language-5.15.0/nexus" ]]; then
            frames_dir="$GITHUB_WORKSPACE/Frames-0.9.9"
          elif [[ -f "$GITHUB_WORKSPACE/Frames-0.9.9-Source.zip" ]]; then
            mkdir -p "$RUNNER_TEMP/frames-source"
            unzip -q "$GITHUB_WORKSPACE/Frames-0.9.9-Source.zip" -d "$RUNNER_TEMP/frames-source"
            frames_dir="$RUNNER_TEMP/frames-source/Frames-0.9.9"
          else
            echo "Frames 0.9.9 source tree was not found."
            echo "Repository root contents:"
            find "$GITHUB_WORKSPACE" -maxdepth 2 -type f | sort | head -200
            exit 1
          fi

          test -f "$frames_dir/toolchain/Nexus-Language-5.15.0/nexus"
          test -f "$frames_dir/tools/qemu_certify.sh"
          test -f "$frames_dir/tools/runtime_evidence.py"
          test -f "$frames_dir/tools/runtime_storage_cert.py"

          echo "FRAMES_DIR=$frames_dir" >> "$GITHUB_ENV"
          echo "Frames source: $frames_dir"

      - name: Locate firmware
        shell: bash
        run: |
          set -euo pipefail
          code="$(find /usr/share/OVMF -type f \( -name 'OVMF_CODE_4M.fd' -o -name 'OVMF_CODE.fd' \) | head -n1)"
          vars="$(find /usr/share/OVMF -type f \( -name 'OVMF_VARS_4M.fd' -o -name 'OVMF_VARS.fd' \) | head -n1)"
          test -n "$code"
          echo "OVMF_CODE=$code" >> "$GITHUB_ENV"
          if [[ -n "$vars" ]]; then
            echo "OVMF_VARS=$vars" >> "$GITHUB_ENV"
          fi

      - name: Runtime certification
        shell: bash
        env:
          FRAMES_BOOT_TIMEOUT: '60'
        run: |
          set -euo pipefail
          cd "$FRAMES_DIR"
          # qemu_certify.sh copies the writable OVMF VARS template before build.sh runs.
          # Ensure its destination exists on a fresh GitHub runner.
          mkdir -p "$FRAMES_DIR/build"
          export NEXUS="$FRAMES_DIR/toolchain/Nexus-Language-5.15.0/nexus"
          chmod +x toolchain/Nexus-Language-5.15.0/nexus tools/*.sh tools/*.py
          ./tools/qemu_certify.sh

      - name: Build runtime evidence
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$GITHUB_WORKSPACE/runtime-evidence"

          if [[ -n "${FRAMES_DIR:-}" && -f "$FRAMES_DIR/build/serial.log" ]]; then
            cd "$FRAMES_DIR"
            python3 tools/runtime_evidence.py --serial build/serial.log || true
            python3 tools/runtime_storage_cert.py --serial build/serial.log || true

            for f in \
              build/serial.log \
              build/RUNTIME-EVIDENCE.json \
              build/STORAGE-RUNTIME-CERT.json \
              build/RUNTIME-CERTIFICATION.json; do
              if [[ -f "$f" ]]; then
                cp "$f" "$GITHUB_WORKSPACE/runtime-evidence/"
              fi
            done
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frames-0.9.9-runtime-evidence
          path: runtime-evidence/
          if-no-files-found: warn
