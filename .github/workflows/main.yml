name: Frames 0.9.46 v56 Parallel r10 Final Evidence Seal

on:
  workflow_dispatch:
  push:
    paths:
      - 'Frames-0.9.46-Runtime-Certification-Kit-v56-Parallel-r10-Final-Evidence-Seal.zip'
      - '.github/workflows/frames-0.9.46-v56-parallel-r10-final-evidence-seal.yml'

permissions:
  contents: read

jobs:
  seal-final-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize final evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/runtime-evidence"
          mkdir -p "$GITHUB_WORKSPACE/runtime-evidence"
          echo "v56-parallel-r10" > "$GITHUB_WORKSPACE/runtime-evidence/R10-START.txt"

      - name: Locate exact r10 kit
        id: locate
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          E="$GITHUB_WORKSPACE/runtime-evidence"
          kit="$(find "$GITHUB_WORKSPACE" -type f -name 'Frames-0.9.46-Runtime-Certification-Kit-v56-Parallel-r10-Final-Evidence-Seal.zip' -print | head -n1)"
          if [[ -z "$kit" ]]; then
            echo "r10 kit not found" > "$E/R10-LOCATE-FAILURE.txt"
            exit 1
          fi
          rm -rf "$GITHUB_WORKSPACE/r10-kit"
          mkdir -p "$GITHUB_WORKSPACE/r10-kit"
          python3 - "$kit" "$GITHUB_WORKSPACE/r10-kit" <<'PY'
          import zipfile,sys
          with zipfile.ZipFile(sys.argv[1]) as z:
              assert z.testzip() is None
              z.extractall(sys.argv[2])
          PY
          root="$(find "$GITHUB_WORKSPACE/r10-kit" -maxdepth 2 -type d -name 'Frames-0.9.46-Runtime-Certification-Kit-v56-Parallel-r10-Final-Evidence-Seal' -print | head -n1)"
          [[ -n "$root" ]] || { echo "r10 kit root missing" > "$E/R10-LOCATE-FAILURE.txt"; exit 2; }
          echo "KIT_ROOT=$root" >> "$GITHUB_ENV"
          sha256sum "$kit" > "$E/R10-KIT-SHA256.txt"

      - name: Verify and canonically seal final evidence
        id: seal
        if: always()
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          E="$GITHUB_WORKSPACE/runtime-evidence"
          mkdir -p "$E"
          rc=0
          if [[ -z "${KIT_ROOT:-}" ]]; then
            echo "KIT_ROOT unavailable" > "$E/R10-SEAL-CONSOLE.log"
            rc=2
          else
            export EVIDENCE="$E"
            python3 "$KIT_ROOT/verify-and-seal-v56-r10.py" > "$E/R10-SEAL-CONSOLE.log" 2>&1 || rc=$?
          fi
          echo "$rc" > "$E/R10-SEAL-EXIT-CODE.txt"
          exit "$rc"

      - name: Regenerate manifest after workflow diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          E="$GITHUB_WORKSPACE/runtime-evidence"
          python3 - "$E" <<'PY'
          from pathlib import Path
          import hashlib,sys,json
          root=Path(sys.argv[1])
          def sha(p):
              h=hashlib.sha256()
              with open(p,"rb") as f:
                  for c in iter(lambda:f.read(1024*1024),b""): h.update(c)
              return h.hexdigest()
          files=[p for p in sorted(root.iterdir()) if p.is_file() and p.name!="EVIDENCE-FILES-SHA256.txt"]
          root.joinpath("EVIDENCE-FILES-SHA256.txt").write_text("".join(f"{sha(p)}  {p.name}\n" for p in files))
          mism=[]
          for line in root.joinpath("EVIDENCE-FILES-SHA256.txt").read_text().splitlines():
              h,n=line.split("  ",1)
              if sha(root/n)!=h: mism.append(n)
          root.joinpath("R10-FINAL-MANIFEST-VERIFY.json").write_text(json.dumps({
              "status":"PASS" if not mism else "FAIL","mismatches":mism
          },indent=2)+"\n")
          # Manifest one final time to cover R10-FINAL-MANIFEST-VERIFY.json.
          files=[p for p in sorted(root.iterdir()) if p.is_file() and p.name!="EVIDENCE-FILES-SHA256.txt"]
          root.joinpath("EVIDENCE-FILES-SHA256.txt").write_text("".join(f"{sha(p)}  {p.name}\n" for p in files))
          for line in root.joinpath("EVIDENCE-FILES-SHA256.txt").read_text().splitlines():
              h,n=line.split("  ",1)
              assert sha(root/n)==h
          PY

      - name: Record r10 outcomes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cat > "$GITHUB_WORKSPACE/runtime-evidence/R10-STEP-OUTCOMES.txt" <<EOF
          locate=${{ steps.locate.outcome }}
          seal=${{ steps.seal.outcome }}
          EOF
          # Re-seal manifest after outcomes file is complete.
          python3 - "$GITHUB_WORKSPACE/runtime-evidence" <<'PY'
          from pathlib import Path
          import hashlib,sys
          root=Path(sys.argv[1])
          def sha(p):
              h=hashlib.sha256()
              with open(p,"rb") as f:
                  for c in iter(lambda:f.read(1024*1024),b""): h.update(c)
              return h.hexdigest()
          files=[p for p in sorted(root.iterdir()) if p.is_file() and p.name!="EVIDENCE-FILES-SHA256.txt"]
          root.joinpath("EVIDENCE-FILES-SHA256.txt").write_text("".join(f"{sha(p)}  {p.name}\n" for p in files))
          for line in root.joinpath("EVIDENCE-FILES-SHA256.txt").read_text().splitlines():
              h,n=line.split("  ",1)
              assert sha(root/n)==h
          PY

      - name: Upload final canonical evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frames-0.9.46-fapp-native-application-loader-parallel-evidence-v56
          path: runtime-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Final fail-closed verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ steps.locate.outcome }}" == success ]]
          [[ "${{ steps.seal.outcome }}" == success ]]
          [[ "$(cat runtime-evidence/R10-SEAL-EXIT-CODE.txt)" == 0 ]]
          python3 - <<'PY'
          import json
          final=json.load(open("runtime-evidence/FINAL-CERTIFICATION.json"))
          manifest=json.load(open("runtime-evidence/R10-FINAL-MANIFEST-VERIFY.json"))
          assert final["status"]=="PASS"
          assert final["workflow_revision"]=="v56-parallel-r10"
          assert manifest["status"]=="PASS"
          print("FRAMES 0.9.46 v56 PARALLEL r10 FINAL EVIDENCE SEAL PASS")
          PY
