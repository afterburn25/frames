name: Frames 0.9.62 Integrated GUI Desktop Certification v72 Split Upload
on:
  workflow_dispatch:
  push:
    paths:
      - 'Frames-0.9.62-Integrated-GUI-Certification-Kit-v72.part01'
      - 'Frames-0.9.62-Integrated-GUI-Certification-Kit-v72.part02'
      - 'Frames-0.9.62-Integrated-GUI-Certification-Kit-v72.part03'
      - 'Frames-0.9.62-Integrated-GUI-Certification-Kit-v72-Split-Manifest.txt'
permissions:
  contents: read
jobs:
  certify-gui:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Reassemble and locate certification kit
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf gui-kit runtime-evidence prepared reconstructed
          mkdir -p gui-kit runtime-evidence prepared reconstructed
          p1="$GITHUB_WORKSPACE/Frames-0.9.62-Integrated-GUI-Certification-Kit-v72.part01"
          p2="$GITHUB_WORKSPACE/Frames-0.9.62-Integrated-GUI-Certification-Kit-v72.part02"
          p3="$GITHUB_WORKSPACE/Frames-0.9.62-Integrated-GUI-Certification-Kit-v72.part03"
          [[ -f "$p1" && -f "$p2" && -f "$p3" ]]
          echo "f334b074358ff5549fffdc11b11603e62c3acc0f6a68044601de5cd82fd2a215  Frames-0.9.62-Integrated-GUI-Certification-Kit-v72.part01" | sha256sum -c -
          echo "0e647d23fdafc2e2376a21ad6e1690b000a71251827fb7b6df1dafa83d8853c2  Frames-0.9.62-Integrated-GUI-Certification-Kit-v72.part02" | sha256sum -c -
          echo "9458a128b6ce01d3063c6d1a2965100e8195c8d0f6b5e5671fc1e4733fe90737  Frames-0.9.62-Integrated-GUI-Certification-Kit-v72.part03" | sha256sum -c -
          cat "$p1" "$p2" "$p3" > "$GITHUB_WORKSPACE/reconstructed/Frames-0.9.62-Integrated-GUI-Certification-Kit-v72.zip"
          echo "f52057d6e532d2d3f83cd51847938b805ba883c0c7a1de5d344b1232b910c559  reconstructed/Frames-0.9.62-Integrated-GUI-Certification-Kit-v72.zip" | sha256sum -c -
          python3 - "$GITHUB_WORKSPACE/reconstructed/Frames-0.9.62-Integrated-GUI-Certification-Kit-v72.zip" "$GITHUB_WORKSPACE/gui-kit" <<'PY'
          import pathlib,zipfile,json,sys,hashlib
          kit=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          expected='f52057d6e532d2d3f83cd51847938b805ba883c0c7a1de5d344b1232b910c559'
          h=hashlib.sha256(kit.read_bytes()).hexdigest()
          assert h==expected,(h,expected)
          marker='Frames-0.9.62-Integrated-GUI-Certification-Kit-v72/KIT-CONTRACT.json'
          with zipfile.ZipFile(kit) as z:
              assert z.testzip() is None
              assert marker in z.namelist()
              c=json.loads(z.read(marker))
              assert c.get('workflow_revision')=='v72-integrated-gui-r1',c
              assert c.get('candidate_source_sha256')=='67a6876596c960ec06456328767d8ac1773185aa319c8d166890150b45044bab',c
              z.extractall(out)
          PY
          echo "KIT_ROOT=$GITHUB_WORKSPACE/gui-kit/Frames-0.9.62-Integrated-GUI-Certification-Kit-v72" >> "$GITHUB_ENV"
      - name: Install QEMU build tools
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf clang lld python3 unzip
      - name: Preflight exact development chain
        shell: bash
        run: |
          set -euo pipefail
          python3 "$KIT_ROOT/prepare-integrated-gui.py" "$KIT_ROOT" "$GITHUB_WORKSPACE/prepared"
          cp "$GITHUB_WORKSPACE/prepared/STRUCTURAL-EVIDENCE.json" runtime-evidence/
          FRAMES_DIR="$GITHUB_WORKSPACE/prepared/source/Frames-0.9.62"
          chmod +x "$FRAMES_DIR"/tools/*.sh "$FRAMES_DIR"/tools/*.py "$FRAMES_DIR"/sdk/*.sh "$FRAMES_DIR"/sdk/*.py "$FRAMES_DIR"/toolchain/Nexus-Language-5.20.0/nexus
          echo "FRAMES_DIR=$FRAMES_DIR" >> "$GITHUB_ENV"
          echo "NEXUS_EXE=$FRAMES_DIR/toolchain/Nexus-Language-5.20.0/nexus" >> "$GITHUB_ENV"
          sha256sum "$KIT_ROOT/Frames-0.9.62-Source-v72.zip" | tee runtime-evidence/SOURCE-SHA256.txt
          code=/usr/share/OVMF/OVMF_CODE_4M.fd; vars=/usr/share/OVMF/OVMF_VARS_4M.fd; [[ -f "$code" && -f "$vars" ]]
          echo "OVMF_CODE=$code" >> "$GITHUB_ENV"; echo "OVMF_VARS=$vars" >> "$GITHUB_ENV"
      - name: Build exact final desktop source
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRAMES_DIR"; export NEXUS="$NEXUS_EXE"; export ARTIFACT_TOOL_RPC_DAEMON_STARTUP_TIMEOUT_S=1
          python3 tools/verify_gui_0962.py
          ./tools/build.sh
          python3 tools/make_esp.py
          python3 tools/verify_release.py
          python3 tools/sdk_selftest.py --require-pass | tee build/SDK-SELFTEST-CONSOLE.log
          python3 tools/make_developer_preview_image.py
          python3 tools/verify_developer_preview_image.py --image build/Frames-0.9.62-Developer-Preview.img --package build/HelloFrames.fapp --require-pass
          python3 tools/app_packaging_evidence.py --package build/HelloFrames.fapp --image build/Frames-0.9.62-Developer-Preview.img --require-pass > build/APP-PACKAGING-EVIDENCE.json
          python3 tools/make_desktop_preview_image.py
          cp build/SDK-TOOLING-EVIDENCE.json "$GITHUB_WORKSPACE/runtime-evidence/"
          cp build/APP-PACKAGING-EVIDENCE.json "$GITHUB_WORKSPACE/runtime-evidence/"
      - name: Integrated GUI framebuffer certification
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRAMES_DIR"; BOOT=build/Frames-0.9.62-Desktop-Preview.img; cp "$BOOT" "$BOOT.before"
          LOG=build/gui-integrated-serial.log; QMP=build/gui-integrated-qmp.sock; PPM=build/gui-integrated.ppm; DBG=build/gui-integrated-qemu-debug.log; rm -f "$LOG" "$QMP" "$PPM" "$DBG"
          cp "$OVMF_VARS" build/OVMF_VARS.gui.fd
          set +e
          timeout 240 qemu-system-x86_64 -machine q35 -accel tcg,thread=multi -m 2048M -smp 4 -cpu max -display none -vga std -serial file:"$LOG" -no-reboot -no-shutdown -qmp "unix:$QMP,server=on,wait=off" -d guest_errors -D "$DBG" -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" -drive if=pflash,format=raw,file=build/OVMF_VARS.gui.fd -drive if=none,id=desktopboot,format=raw,readonly=on,file="$BOOT" -device nvme,serial=FRAMESGUI0962,drive=desktopboot,bootindex=1 &
          qpid=$!; python3 "$KIT_ROOT/qmp_gui_integrated_capture.py" "$QMP" "$LOG" "$PPM" > build/gui-capture.log 2>&1 & cpid=$!; wait "$qpid"; qrc=$?; wait "$cpid"; crc=$?; set -e
          echo "$qrc" > build/GUI-QEMU-EXIT-CODE.txt; [[ "$qrc" -eq 0 && "$crc" -eq 0 ]]
          python3 tools/gui_integrated_evidence.py --serial "$LOG" --qemu-exit "$qrc" --require-pass > build/GUI-INTEGRATED-EVIDENCE.json
          python3 "$KIT_ROOT/gui_integrated_visual_evidence.py" --serial "$LOG" --ppm "$PPM" --qemu-exit "$qrc" --media-before "$BOOT.before" --media-after "$BOOT" --require-pass > build/GUI-INTEGRATED-VISUAL-EVIDENCE.json
          cp build/GUI-INTEGRATED-EVIDENCE.json build/GUI-INTEGRATED-VISUAL-EVIDENCE.json build/gui-integrated-serial.log build/gui-integrated.ppm build/GUI-QEMU-EXIT-CODE.txt "$GITHUB_WORKSPACE/runtime-evidence/"
      - name: Kernel read-only regression
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRAMES_DIR"; export NEXUS="$NEXUS_EXE" FRAMES_PREBUILT=1 OVMF_CODE OVMF_VARS
          ./tools/qemu_helixfs_readonly_smoke.sh
          cp build/RUNTIME-EVIDENCE.json build/HELIXFS-KERNEL-PHASE3-EVIDENCE.json "$GITHUB_WORKSPACE/runtime-evidence/"
      - name: Developer Preview regression
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRAMES_DIR"; export NEXUS="$NEXUS_EXE" FRAMES_PREBUILT=1 OVMF_CODE OVMF_VARS
          ./tools/qemu_developer_preview_certify.sh
          cp build/DEVELOPER-PREVIEW-EVIDENCE.json build/DEVELOPER-PREVIEW-PHASE3-EVIDENCE.json build/APP-LOADER-EVIDENCE.json build/HELIXFS-PHASE2-EVIDENCE.json build/HELIXFS-PHASE3-EVIDENCE.json "$GITHUB_WORKSPACE/runtime-evidence/"
      - name: Final integrated GUI verdict
        shell: bash
        run: |
          set -euo pipefail
          python3 "$KIT_ROOT/finalize-integrated-gui.py" "$GITHUB_WORKSPACE/runtime-evidence"
          python3 - runtime-evidence <<'PY'
          from pathlib import Path
          import hashlib,json,sys
          r=Path(sys.argv[1])
          def H(p):
              h=hashlib.sha256()
              with open(p,'rb') as f:
                  for c in iter(lambda:f.read(1<<20),b''):h.update(c)
              return h.hexdigest()
          files=[p for p in sorted(r.rglob('*')) if p.is_file() and p.name!='EVIDENCE-FILES-SHA256.txt']
          r.joinpath('EVIDENCE-FILES-SHA256.txt').write_text(''.join(f"{H(p)}  {p.relative_to(r).as_posix()}\n" for p in files))
          mism=[]
          for line in r.joinpath('EVIDENCE-FILES-SHA256.txt').read_text().splitlines():
              h,n=line.split('  ',1)
              if H(r/n)!=h:mism.append(n)
          r.joinpath('FINAL-MANIFEST-VERIFY.json').write_text(json.dumps({'status':'PASS' if not mism else 'FAIL','mismatches':mism},indent=2)+'\n')
          files=[p for p in sorted(r.rglob('*')) if p.is_file() and p.name!='EVIDENCE-FILES-SHA256.txt']
          r.joinpath('EVIDENCE-FILES-SHA256.txt').write_text(''.join(f"{H(p)}  {p.relative_to(r).as_posix()}\n" for p in files))
          assert not mism
          PY
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frames-0.9.62-integrated-gui-desktop-evidence-v72
          path: runtime-evidence
          if-no-files-found: error
