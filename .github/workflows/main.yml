name: Frames 0.9.46 FAPP Native Application Loader Phase 1 Certification v56

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  qemu-ovmf-certification:
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    env:
      EXPECTED_FRAMES_VERSION: '0.9.46'
      EXPECTED_SOURCE_SHA256: 'ed823f9d449e53913a018d754cfc90f5369ff2a729afe7c3eda73d404cf430a7'
      EXPECTED_WORKFLOW_REVISION: 'v56'

    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU, OVMF, and build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf clang lld python3 unzip
          command -v qemu-system-x86_64
          command -v clang
          command -v lld-link
          command -v python3
          command -v unzip

      - name: Locate exact Frames 0.9.46 source and bundled Nexus
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="$GITHUB_WORKSPACE/runtime-evidence"
          mkdir -p "$EVIDENCE"
          frames_dir=""
          source_zip=""

          # v29: fail closed on exact source content, not candidate timestamp.
          # Scan all direct source ZIPs first, then all matching runtime kits.
          # A stale same-version ZIP is ignored rather than being allowed to win.
          candidate_log="$EVIDENCE/SOURCE-CANDIDATES.txt"
          : > "$candidate_log"

          select_if_exact() {
            local candidate="$1"
            local actual_sha
            actual_sha="$(sha256sum "$candidate" | awk '{print $1}')"
            printf '%s  %s\n' "$actual_sha" "$candidate" >> "$candidate_log"
            if [[ "$actual_sha" == "$EXPECTED_SOURCE_SHA256" ]]; then
              source_zip="$candidate"
              return 0
            fi
            return 1
          }

          while IFS= read -r candidate; do
            [[ -n "$candidate" ]] || continue
            if select_if_exact "$candidate"; then
              break
            fi
          done < <(
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f \
              -name "Frames-${EXPECTED_FRAMES_VERSION}-Source*.zip" -print 2>/dev/null | sort
          )

          if [[ -z "$source_zip" ]]; then
            while IFS= read -r kit_zip; do
              [[ -n "$kit_zip" ]] || continue
              rm -rf "$RUNNER_TEMP/frames-kit-candidate"
              mkdir -p "$RUNNER_TEMP/frames-kit-candidate"
              echo "Inspecting runtime kit: $kit_zip"
              unzip -q "$kit_zip" -d "$RUNNER_TEMP/frames-kit-candidate"
              while IFS= read -r candidate; do
                [[ -n "$candidate" ]] || continue
                if select_if_exact "$candidate"; then
                  break 2
                fi
              done < <(
                find "$RUNNER_TEMP/frames-kit-candidate" -maxdepth 5 -type f \
                  -name "Frames-${EXPECTED_FRAMES_VERSION}-Source*.zip" -print 2>/dev/null | sort
              )
            done < <(
              find "$GITHUB_WORKSPACE" -maxdepth 3 -type f \
                -name "Frames-${EXPECTED_FRAMES_VERSION}-Runtime-Certification-Kit*.zip" -print 2>/dev/null | sort
            )
          fi

          if [[ -z "$source_zip" ]]; then
            {
              echo "FAIL: no Frames ${EXPECTED_FRAMES_VERSION} source archive matched the exact required SHA-256."
              echo "Expected: $EXPECTED_SOURCE_SHA256"
              echo
              echo "Candidates inspected:"
              cat "$candidate_log"
            } | tee "$EVIDENCE/SOURCE-INTEGRITY-FAILURE.txt"
            exit 1
          fi

          actual_sha="$(sha256sum "$source_zip" | awk '{print $1}')"
          echo "Selected sealed source: $source_zip"
          echo "Source SHA-256: $actual_sha"
          echo "Workflow revision: $EXPECTED_WORKFLOW_REVISION"

          rm -rf "$RUNNER_TEMP/frames-source"
          mkdir -p "$RUNNER_TEMP/frames-source"
          unzip -q "$source_zip" -d "$RUNNER_TEMP/frames-source"

          while IFS= read -r vfile; do
            candidate="${vfile%/VERSION}"
            [[ -f "$candidate/tools/qemu_certify.sh" ]] || continue
            version="$(tr -d '\r\n' < "$vfile")"
            if [[ "$version" == "$EXPECTED_FRAMES_VERSION" ]]; then
              frames_dir="$candidate"
              break
            fi
          done < <(find "$RUNNER_TEMP/frames-source" -maxdepth 6 -type f -name VERSION -print | sort)

          if [[ -z "$frames_dir" ]]; then
            {
              echo "FAIL: exact source archive matched SHA but did not contain a valid Frames ${EXPECTED_FRAMES_VERSION} source tree."
              echo "Selected archive: $source_zip"
              echo "SHA-256: $actual_sha"
            } | tee "$EVIDENCE/SOURCE-DISCOVERY-FAILURE.txt"
            exit 1
          fi

          frames_version="$(tr -d '\r\n' < "$frames_dir/VERSION")"
          if [[ "$frames_version" != "$EXPECTED_FRAMES_VERSION" ]]; then
            echo "FAIL: selected source reports $frames_version, expected $EXPECTED_FRAMES_VERSION" | tee "$EVIDENCE/VERSION-MISMATCH.txt"
            exit 1
          fi

          nexus_path="$(find "$frames_dir/toolchain" -maxdepth 3 -type f -name nexus -path '*/Nexus-Language-*/nexus' -print | sort -V | tail -n1 || true)"
          if [[ -z "$nexus_path" ]]; then
            echo "FAIL: bundled Nexus compiler was not found under $frames_dir/toolchain" | tee "$EVIDENCE/NEXUS-DISCOVERY-FAILURE.txt"
            exit 1
          fi

          echo "FRAMES_DIR=$frames_dir" >> "$GITHUB_ENV"
          echo "FRAMES_VERSION=$frames_version" >> "$GITHUB_ENV"
          echo "NEXUS_EXE=$nexus_path" >> "$GITHUB_ENV"
          echo "FRAMES_SOURCE_ZIP=${source_zip:-<unpacked-tree>}" >> "$GITHUB_ENV"
          echo "============================================================"
          echo "Frames source:  $frames_dir"
          echo "Frames version: $frames_version"
          echo "Nexus compiler: $nexus_path"
          echo "============================================================"

      - name: Locate matching OVMF CODE and VARS pair
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="$GITHUB_WORKSPACE/runtime-evidence"
          mkdir -p "$EVIDENCE"
          code=""
          vars=""

          # CODE and VARS must be a matching pair. Prefer 4M firmware on Ubuntu.
          for dir in /usr/share/OVMF /usr/share/edk2/ovmf /usr/share/edk2/x64; do
            if [[ -f "$dir/OVMF_CODE_4M.fd" && -f "$dir/OVMF_VARS_4M.fd" ]]; then
              code="$dir/OVMF_CODE_4M.fd"
              vars="$dir/OVMF_VARS_4M.fd"
              break
            fi
          done
          if [[ -z "$code" ]]; then
            for dir in /usr/share/OVMF /usr/share/edk2/ovmf /usr/share/edk2/x64; do
              if [[ -f "$dir/OVMF_CODE.fd" && -f "$dir/OVMF_VARS.fd" ]]; then
                code="$dir/OVMF_CODE.fd"
                vars="$dir/OVMF_VARS.fd"
                break
              fi
            done
          fi

          if [[ -z "$code" || -z "$vars" ]]; then
            {
              echo "FAIL: no matching OVMF CODE/VARS pair was found."
              echo "Available firmware files:"
              find /usr/share/OVMF /usr/share/edk2 -maxdepth 4 -type f -name 'OVMF_*.fd' -print 2>/dev/null | sort
            } | tee "$EVIDENCE/OVMF-DISCOVERY-FAILURE.txt"
            exit 1
          fi

          # Split OVMF CODE and VARS files are allowed to have different
          # lengths; pair them by the same firmware family/name, not by size.
          code_size="$(stat -c %s "$code")"
          vars_size="$(stat -c %s "$vars")"

          echo "OVMF_CODE=$code" >> "$GITHUB_ENV"
          echo "OVMF_VARS=$vars" >> "$GITHUB_ENV"
          echo "OVMF CODE: $code ($code_size bytes)"
          echo "OVMF VARS: $vars ($vars_size bytes)"

      - name: Preflight exact source before QEMU
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRAMES_DIR"
          mkdir -p build "$GITHUB_WORKSPACE/runtime-evidence"
          export NEXUS="$NEXUS_EXE"
          chmod +x "$NEXUS_EXE" tools/*.sh tools/*.py
          CONSOLE="$GITHUB_WORKSPACE/runtime-evidence/PREFLIGHT-CONSOLE.log"
          {
            echo "Frames $FRAMES_VERSION preflight"
            echo "Nexus: $($NEXUS_EXE --version)"
            echo "Clang: $(clang --version | head -n1)"
            echo "LLD: $(lld-link --version | head -n1)"
            bash -n tools/*.sh
            python3 -m compileall -q tools
            ./tools/build.sh
            python3 tools/make_esp.py
            python3 tools/make_write_test_nvme.py
            cp build/Frames-${FRAMES_VERSION}-Write-Test.img build/Frames-${FRAMES_VERSION}-Write-Test.before.img
            python3 tools/verify_write_test_image.py --before build/Frames-${FRAMES_VERSION}-Write-Test.before.img --after build/Frames-${FRAMES_VERSION}-Write-Test.img --require-pass
            python3 tools/verify_release.py
            python3 tools/sdk_selftest.py --require-pass
            python3 tools/make_developer_preview_image.py
            python3 tools/verify_developer_preview_image.py --image build/Frames-${FRAMES_VERSION}-Developer-Preview.img --package build/HelloFrames.fapp --require-pass
            python3 tools/app_packaging_evidence.py --package build/HelloFrames.fapp --image build/Frames-${FRAMES_VERSION}-Developer-Preview.img --require-pass
            python3 tools/verify_runtime_repair_0946.py
            python3 tools/make_usb_boot_image.py
            python3 tools/make_physical_preview_image.py
            python3 tools/verify_physical_preview_image.py
            python3 tools/make_physical_sata_guard.py
            python3 tools/physical_preview_synthetic.py --require-pass
            python3 tools/make_internal_usb_guard.py
            python3 tools/make_lifecycle_test_nvme.py --mode both
            python3 tools/verify_lifecycle_image.py --image build/Frames-${FRAMES_VERSION}-Lifecycle-reboot.img --mode reboot --expect-state 0 --require-pass
            python3 tools/verify_lifecycle_image.py --image build/Frames-${FRAMES_VERSION}-Lifecycle-shutdown.img --mode shutdown --expect-state 0 --require-pass
            python3 tools/make_filesystem_test_nvme.py --all
            for s in 0 1 2 3 4; do
              python3 tools/verify_filesystem_test_image.py --image "build/Frames-${FRAMES_VERSION}-Filesystem-s${s}.img" --scenario "$s" --phase initial --require-pass
            done
            python3 tools/make_system_volume_clone.py
            cp build/Frames-${FRAMES_VERSION}-System-Clone.img build/Frames-${FRAMES_VERSION}-System-Clone.before.img
            python3 tools/verify_system_volume_clone.py --before build/Frames-${FRAMES_VERSION}-System-Clone.before.img --after build/Frames-${FRAMES_VERSION}-System-Clone.img --manifest build/SYSTEM-VOLUME-TARGET.json --require-pass
            python3 tools/make_fat_lifecycle_clone.py
            cp build/Frames-${FRAMES_VERSION}-FAT-Lifecycle-Clone.img build/Frames-${FRAMES_VERSION}-FAT-Lifecycle-Clone.before.img
            python3 tools/verify_fat_lifecycle_clone.py --before build/Frames-${FRAMES_VERSION}-FAT-Lifecycle-Clone.before.img --after build/Frames-${FRAMES_VERSION}-FAT-Lifecycle-Clone.img --manifest build/FAT-LIFECYCLE-TARGET.json --require-pass
            python3 tools/fat_lifecycle_synthetic.py
            sha256sum build/BOOTX64.EFI build/FramesKernel.fkrn build/System.fex build/Frames-${FRAMES_VERSION}-ESP.img build/BOOTSTAT.TXT
            python3 tools/runtime_preflight.py --require-ready
          } 2>&1 | tee "$CONSOLE"

      - name: Runtime certification and marker diagnosis
        id: runtime
        shell: bash
        env:
          # The repaired GPT/FAT path performs many more real NVMe reads than
          # older diagnostic builds. Give the two-vCPU TCG run ample headroom.
          FRAMES_BOOT_TIMEOUT: '240'
        run: |
          set -uo pipefail
          cd "$FRAMES_DIR"
          mkdir -p "$FRAMES_DIR/build" "$GITHUB_WORKSPACE/runtime-evidence"
          export NEXUS="$NEXUS_EXE"
          chmod +x "$NEXUS_EXE" tools/*.sh tools/*.py
          CONSOLE="$GITHUB_WORKSPACE/runtime-evidence/RUNTIME-CERTIFICATION-CONSOLE.log"

          set +e
          ./tools/qemu_certify.sh 2>&1 | tee "$CONSOLE"
          cert_rc=${PIPESTATUS[0]}
          set -e

          echo "$cert_rc" > "$GITHUB_WORKSPACE/runtime-evidence/QEMU-CERTIFY-EXIT-CODE.txt"
          LOG="$FRAMES_DIR/build/serial.log"
          echo
          echo "================ Frames runtime marker diagnosis ================"
          echo "qemu_certify.sh exit code: $cert_rc"
          if [[ ! -f "$LOG" ]]; then
            echo "serial.log was not produced."
            exit "$cert_rc"
          fi

          python3 - "$FRAMES_DIR/tools/qemu_certify.sh" "$LOG" <<'PY'
          import json, pathlib, re, sys
          script=pathlib.Path(sys.argv[1]).read_text(errors='replace')
          log_path=pathlib.Path(sys.argv[2])
          log=log_path.read_text(errors='replace')
          m=re.search(r'for marker in\s+(.*?);\s*do',script,re.S)
          if not m:
              print('Could not parse expected marker list from qemu_certify.sh')
              raise SystemExit(2)
          expected=m.group(1).split()
          present=[x for x in expected if x in log]
          missing=[x for x in expected if x not in log]
          fatal=[x for x in ('FRAMES_PAGE_FAULT','FRAMES_AP_PROTECTION_FAULT=','FRAMES_STRESS_ALLOCATOR_FAIL','FRAMES_STRESS_SCHEDULER_FAIL','FRAMES_STRESS_STORAGE_READ_FAIL','FRAMES_STRESS_USB_INPUT_FAIL','FRAMES_STRESS_NETWORK_FAIL','FRAMES_STRESS_DISPLAY_FAIL','FRAMES_STRESS_RECOVERY_FAIL','FRAMES_STRESS_POWER_FAIL','FRAMES_STORAGE_WRITE_INTEGRITY_FAIL','FRAMES_LIFECYCLE_DESTRUCTIVE_FAIL','FRAMES_FS_WRITE_CERT_FAIL','FRAMES_SYSTEM_VOLUME_WRITE_CERT_FAIL','FRAMES_FAT_LIFECYCLE_CERT_FAIL','FRAMES_SMP_SCALE_CERT_FAIL','FRAMES_USB_BOOT_CERT_FAIL','FRAMES_PHYSICAL_PREVIEW_CERT_FAIL') if x in log]
          ack_pos=log.find('FRAMES_RESCHED_IPI_OK')
          fallback_pos=log.find('FRAMES_RESCHED_FALLBACK_SENT')
          eager_rhs = ack_pos >= 0 and fallback_pos > ack_pos
          if eager_rhs:
              fatal.append('FRAMES_SHORT_CIRCUIT_EAGER_RHS')
          short_circuit={
              'resched_ipi_ok_position':ack_pos,
              'fallback_sent_position':fallback_pos,
              'eager_rhs_after_ack':eager_rhs,
              'status':'PASS' if not eager_rhs else 'FAIL',
          }
          (log_path.parent/'SHORT-CIRCUIT-RUNTIME.json').write_text(json.dumps(short_circuit,indent=2)+'\n')
          print(f'Expected markers: {len(expected)}')
          print(f'Present markers:  {len(present)}')
          print(f'Missing markers:  {len(missing)}')
          print(f'Fatal markers:    {len(fatal)}')
          print('\nMISSING MARKERS:')
          for x in missing: print(f'  - {x}')
          print('\nFATAL MARKERS:')
          for x in fatal: print(f'  - {x}')
          print('\nLAST 160 SERIAL LINES:')
          for line in log.splitlines()[-160:]: print(line)
          (log_path.parent/'MISSING-RUNTIME-MARKERS.json').write_text(json.dumps({
              'expected_count':len(expected),
              'present_count':len(present),
              'missing_count':len(missing),
              'missing':missing,
              'fatal':fatal,
          },indent=2)+'\n')
          if not missing and fatal:
              print('All positive markers were present, but a fatal runtime marker was also observed.')
              raise SystemExit(3)
          PY
          diag_rc=$?

          set +e
          python3 tools/stress_evidence.py --serial "$LOG" --require-power-pass | tee "$GITHUB_WORKSPACE/runtime-evidence/STRESS-CERTIFICATION-CONSOLE.log"
          stress_rc=${PIPESTATUS[0]}
          python3 tools/runtime_storage_cert.py --serial "$LOG" --require-pass | tee "$GITHUB_WORKSPACE/runtime-evidence/STORAGE-RUNTIME-CERTIFICATION-CONSOLE.log"
          storage_rc=${PIPESTATUS[0]}
          python3 tools/storage_write_evidence.py --serial "$LOG" --media "$FRAMES_DIR/build/WRITE-MEDIA-INTEGRITY.json" --require-pass | tee "$GITHUB_WORKSPACE/runtime-evidence/STORAGE-WRITE-CERTIFICATION-CONSOLE.log"
          write_rc=${PIPESTATUS[0]}
          set -e
          echo "$stress_rc" > "$GITHUB_WORKSPACE/runtime-evidence/STRESS-CERTIFY-EXIT-CODE.txt"
          echo "$storage_rc" > "$GITHUB_WORKSPACE/runtime-evidence/STORAGE-RUNTIME-CERTIFY-EXIT-CODE.txt"
          echo "$write_rc" > "$GITHUB_WORKSPACE/runtime-evidence/STORAGE-WRITE-CERTIFY-EXIT-CODE.txt"

          echo "================================================================="
          if [[ "$cert_rc" -eq 0 && "$diag_rc" -ne 0 ]]; then
            exit "$diag_rc"
          fi
          if [[ "$cert_rc" -eq 0 && "$stress_rc" -ne 0 ]]; then
            exit "$stress_rc"
          fi
          if [[ "$cert_rc" -eq 0 && "$storage_rc" -ne 0 ]]; then
            exit "$storage_rc"
          fi
          if [[ "$cert_rc" -eq 0 && "$write_rc" -ne 0 ]]; then
            exit "$write_rc"
          fi
          exit "$cert_rc"

      - name: Destructive reboot and shutdown lifecycle certification
        id: lifecycle
        shell: bash
        env:
          FRAMES_LIFECYCLE_TIMEOUT: '300'
        run: |
          set -uo pipefail
          cd "$FRAMES_DIR"
          export NEXUS="$NEXUS_EXE"
          chmod +x "$NEXUS_EXE" tools/*.sh tools/*.py
          EVIDENCE="$GITHUB_WORKSPACE/runtime-evidence"
          mkdir -p "$EVIDENCE"
          CONSOLE="$EVIDENCE/LIFECYCLE-CERTIFICATION-CONSOLE.log"

          set +e
          ./tools/qemu_lifecycle_certify.sh 2>&1 | tee "$CONSOLE"
          lifecycle_rc=${PIPESTATUS[0]}
          set -e
          echo "$lifecycle_rc" > "$EVIDENCE/LIFECYCLE-CERTIFY-EXIT-CODE.txt"

          for f in \
            build/reboot-serial.log \
            build/shutdown-serial.log \
            build/reboot-qemu-debug.log \
            build/shutdown-qemu-debug.log \
            build/reboot-qmp-input.log \
            build/shutdown-qmp-input.log \
            build/reboot-monitor.log \
            build/REBOOT-QEMU-EXIT-CODE.txt \
            build/SHUTDOWN-QEMU-EXIT-CODE.txt \
            build/REBOOT-MEDIA-VERIFY.json \
            build/SHUTDOWN-MEDIA-VERIFY.json \
            build/LIFECYCLE-EVIDENCE.json \
            build/LIFECYCLE-REBOOT-TARGET.json \
            build/LIFECYCLE-SHUTDOWN-TARGET.json; do
            [[ -f "$f" ]] && cp "$f" "$EVIDENCE/"
          done

          exit "$lifecycle_rc"

      - name: Sacrificial filesystem write and hard-crash recovery certification
        id: filesystem
        shell: bash
        timeout-minutes: 60
        env:
          FRAMES_FILESYSTEM_TIMEOUT: '300'
        run: |
          set -uo pipefail
          cd "$FRAMES_DIR"
          export NEXUS="$NEXUS_EXE"
          chmod +x "$NEXUS_EXE" tools/*.sh tools/*.py
          EVIDENCE="$GITHUB_WORKSPACE/runtime-evidence"
          mkdir -p "$EVIDENCE"
          CONSOLE="$EVIDENCE/FILESYSTEM-CERTIFICATION-CONSOLE.log"

          set +e
          ./tools/qemu_filesystem_certify.sh 2>&1 | tee "$CONSOLE"
          filesystem_rc=${PIPESTATUS[0]}
          set -e
          echo "$filesystem_rc" > "$EVIDENCE/FILESYSTEM-CERTIFY-EXIT-CODE.txt"

          for f in \
            build/FILESYSTEM-EVIDENCE.json \
            build/FILESYSTEM-S0-MEDIA.json \
            build/FILESYSTEM-S1-MEDIA.json \
            build/FILESYSTEM-S2-MEDIA.json \
            build/FILESYSTEM-S3-MEDIA.json \
            build/FILESYSTEM-S4-MEDIA.json \
            build/FILESYSTEM-S0-TARGET.json \
            build/FILESYSTEM-S1-TARGET.json \
            build/FILESYSTEM-S2-TARGET.json \
            build/FILESYSTEM-S3-TARGET.json \
            build/FILESYSTEM-S4-TARGET.json \
            build/FILESYSTEM-S0-EXIT-CODE.txt \
            build/FILESYSTEM-S1-CRASH-EXIT-CODE.txt \
            build/FILESYSTEM-S2-CRASH-EXIT-CODE.txt \
            build/FILESYSTEM-S3-CRASH-EXIT-CODE.txt \
            build/FILESYSTEM-S4-CRASH-EXIT-CODE.txt \
            build/FILESYSTEM-S1-RECOVERY-EXIT-CODE.txt \
            build/FILESYSTEM-S2-RECOVERY-EXIT-CODE.txt \
            build/FILESYSTEM-S3-RECOVERY-EXIT-CODE.txt \
            build/FILESYSTEM-S4-RECOVERY-EXIT-CODE.txt; do
            [[ -f "$f" ]] && cp "$f" "$EVIDENCE/"
          done
          for f in build/fs-s*-serial.log build/fs-s*-qemu-debug.log build/fs-s*-input.log build/fs-s*-monitor.log; do
            [[ -f "$f" ]] && cp "$f" "$EVIDENCE/"
          done

          exit "$filesystem_rc"

      - name: Disposable system-volume FAT32 write certification
        id: system_volume
        shell: bash
        env:
          FRAMES_SYSTEM_VOLUME_TIMEOUT: '360'
        run: |
          set -uo pipefail
          cd "$FRAMES_DIR"
          export NEXUS="$NEXUS_EXE"
          chmod +x "$NEXUS_EXE" tools/*.sh tools/*.py
          EVIDENCE="$GITHUB_WORKSPACE/runtime-evidence"
          mkdir -p "$EVIDENCE"
          CONSOLE="$EVIDENCE/SYSTEM-VOLUME-CERTIFICATION-CONSOLE.log"

          set +e
          ./tools/qemu_system_volume_certify.sh 2>&1 | tee "$CONSOLE"
          sysvol_rc=${PIPESTATUS[0]}
          set -e
          echo "$sysvol_rc" > "$EVIDENCE/SYSTEM-VOLUME-CERTIFY-EXIT-CODE.txt"

          for f in \
            build/system-volume-serial.log \
            build/system-volume-qemu-debug.log \
            build/system-volume-input.log \
            build/system-volume-monitor.log \
            build/SYSTEM-VOLUME-QEMU-EXIT-CODE.txt \
            build/SYSTEM-VOLUME-TARGET.json \
            build/SYSTEM-VOLUME-MEDIA.json \
            build/SYSTEM-VOLUME-MEDIA-CONSOLE.json \
            build/SYSTEM-VOLUME-EVIDENCE.json \
            build/SYSTEM-VOLUME-GENERATOR.log; do
            [[ -f "$f" ]] && cp "$f" "$EVIDENCE/"
          done

          exit "$sysvol_rc"

      - name: FAT32 allocation and full file lifecycle certification
        id: fat_lifecycle
        shell: bash
        env:
          FRAMES_FAT_LIFECYCLE_TIMEOUT: '420'
        run: |
          set -uo pipefail
          cd "$FRAMES_DIR"
          export NEXUS="$NEXUS_EXE"
          chmod +x "$NEXUS_EXE" tools/*.sh tools/*.py
          EVIDENCE="$GITHUB_WORKSPACE/runtime-evidence"
          mkdir -p "$EVIDENCE"
          CONSOLE="$EVIDENCE/FAT-LIFECYCLE-CERTIFICATION-CONSOLE.log"

          set +e
          ./tools/qemu_fat_lifecycle_certify.sh 2>&1 | tee "$CONSOLE"
          fat_rc=${PIPESTATUS[0]}
          set -e
          echo "$fat_rc" > "$EVIDENCE/FAT-LIFECYCLE-CERTIFY-EXIT-CODE.txt"

          for f in \
            build/fat-lifecycle-serial.log \
            build/fat-lifecycle-qemu-debug.log \
            build/fat-lifecycle-input.log \
            build/fat-lifecycle-monitor.log \
            build/FAT-LIFECYCLE-QEMU-EXIT-CODE.txt \
            build/FAT-LIFECYCLE-TARGET.json \
            build/FAT-LIFECYCLE-MEDIA.json \
            build/FAT-LIFECYCLE-MEDIA-CONSOLE.json \
            build/FAT-LIFECYCLE-EVIDENCE.json \
            build/FAT-LIFECYCLE-GENERATOR.log \
            build/FAT-LIFECYCLE-SYNTHETIC.json; do
            [[ -f "$f" ]] && cp "$f" "$EVIDENCE/"
          done

          exit "$fat_rc"

      - name: Scalable SMP 2 through 96 logical CPU certification
        id: smp_scale
        shell: bash
        run: |
          set -uo pipefail
          cd "$FRAMES_DIR"
          export NEXUS="$NEXUS_EXE"
          chmod +x "$NEXUS_EXE" tools/*.sh tools/*.py
          EVIDENCE="$GITHUB_WORKSPACE/runtime-evidence"
          mkdir -p "$EVIDENCE"

          scale_rc=0
          for cpus in 2 4 8 16 32 64 96; do
            CONSOLE="$EVIDENCE/SMP-${cpus}-CERTIFICATION-CONSOLE.log"
            set +e
            ./tools/qemu_smp_scale_certify.sh "$cpus" 2>&1 | tee "$CONSOLE"
            rc=${PIPESTATUS[0]}
            set -e
