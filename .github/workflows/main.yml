name: Frames Runtime Certification

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  qemu-ovmf-certification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Initialize evidence capture
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p "$GITHUB_WORKSPACE/runtime-evidence"
          {
            echo "Frames runtime certification evidence"
            echo "workflow_run_id=${GITHUB_RUN_ID:-unknown}"
            echo "workflow_run_attempt=${GITHUB_RUN_ATTEMPT:-unknown}"
            echo "runner_os=${RUNNER_OS:-unknown}"
            echo "runner_arch=${RUNNER_ARCH:-unknown}"
            echo "workspace=${GITHUB_WORKSPACE:-unknown}"
            echo "status=initialized"
            date -u '+timestamp_utc=%Y-%m-%dT%H:%M:%SZ'
          } > "$GITHUB_WORKSPACE/runtime-evidence/WORKFLOW-STATUS.txt"

      - name: Install QEMU and OVMF
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf clang lld python3 unzip
          {
            qemu-system-x86_64 --version || true
            dpkg-query -W qemu-system-x86 ovmf clang lld python3 unzip || true
          } > "$GITHUB_WORKSPACE/runtime-evidence/TOOL-VERSIONS.txt" 2>&1

      - name: Locate Frames source and bundled Nexus
        shell: bash
        run: |
          set -u
          EVIDENCE="$GITHUB_WORKSPACE/runtime-evidence"
          mkdir -p "$EVIDENCE"
          DISC="$EVIDENCE/SOURCE-DISCOVERY.txt"
          : > "$DISC"

          echo "Repository: $GITHUB_WORKSPACE" | tee -a "$DISC"
          echo "Runner temp: $RUNNER_TEMP" | tee -a "$DISC"

          frames_dir=""

          # 1) Source already unpacked at repository root.
          if [[ -f "$GITHUB_WORKSPACE/VERSION" && -f "$GITHUB_WORKSPACE/tools/qemu_certify.sh" ]]; then
            frames_dir="$GITHUB_WORKSPACE"
            echo "Using source at repository root." | tee -a "$DISC"
          fi

          # 2) Source already unpacked in one nested Frames-* directory.
          if [[ -z "$frames_dir" ]]; then
            while IFS= read -r version_file; do
              d="${version_file%/VERSION}"
              if [[ -f "$d/tools/qemu_certify.sh" ]]; then
                frames_dir="$d"
                echo "Using nested source tree: $frames_dir" | tee -a "$DISC"
                break
              fi
            done < <(find "$GITHUB_WORKSPACE" -mindepth 2 -maxdepth 4 -type f -name VERSION -print 2>/dev/null)
          fi

          # 3) Source ZIP at repository root.
          if [[ -z "$frames_dir" ]]; then
            source_zip=""
            if [[ -f "$GITHUB_WORKSPACE/Frames-0.9.12-Source.zip" ]]; then
              source_zip="$GITHUB_WORKSPACE/Frames-0.9.12-Source.zip"
            else
              while IFS= read -r z; do
                source_zip="$z"
              done < <(
                find "$GITHUB_WORKSPACE" \
                  -maxdepth 1 \
                  -type f \
                  -name 'Frames-*-Source.zip' \
                  -print 2>/dev/null | sort -V
              )
            fi

            if [[ -z "$source_zip" ]]; then
              echo "ERROR: No Frames-*-Source.zip was found at repository root." | tee -a "$DISC"
              find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -print 2>/