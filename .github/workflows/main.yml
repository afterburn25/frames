name: Frames 0.9.27 USB/Input Stress Certification v20 DMA-Lifetime Repair

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  qemu-ovmf-certification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_FRAMES_VERSION: '0.9.27'
      EXPECTED_SOURCE_SHA256: '394098234ee14f9ac6736d0252fc3bea68bbeb9aca77671d0a3ab8e5412d58d2'

    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU, OVMF, and build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf clang lld python3 unzip
          command -v qemu-system-x86_64
          command -v clang
          command -v lld-link
          command -v python3
          command -v unzip

      - name: Locate exact Frames 0.9.27 source and bundled Nexus
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="$GITHUB_WORKSPACE/runtime-evidence"
          mkdir -p "$EVIDENCE"
          frames_dir=""
          source_zip=""

          # Prefer a sealed source archive for the exact expected release. This
          # prevents an older unpacked tree or older kit from silently winning.
          source_zip="$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -name "Frames-${EXPECTED_FRAMES_VERSION}-Source*.zip" -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n1 | cut -d' ' -f2- || true)"

          if [[ -z "$source_zip" ]]; then
            kit_zip="$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -name "Frames-${EXPECTED_FRAMES_VERSION}-Runtime-Certification-Kit*.zip" -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n1 | cut -d' ' -f2- || true)"
            if [[ -n "$kit_zip" ]]; then
              rm -rf "$RUNNER_TEMP/frames-kit"
              mkdir -p "$RUNNER_TEMP/frames-kit"
              echo "Extracting exact runtime kit: $kit_zip"
              unzip -q "$kit_zip" -d "$RUNNER_TEMP/frames-kit"
              source_zip="$(find "$RUNNER_TEMP/frames-kit" -maxdepth 4 -type f -name "Frames-${EXPECTED_FRAMES_VERSION}-Source*.zip" -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n1 | cut -d' ' -f2- || true)"
            fi
          fi

          if [[ -n "$source_zip" ]]; then
            actual_sha="$(sha256sum "$source_zip" | awk '{print $1}')"
            echo "Selected sealed source: $source_zip"
            echo "Source SHA-256: $actual_sha"
            if [[ "$actual_sha" != "$EXPECTED_SOURCE_SHA256" ]]; then
              {
                echo "FAIL: Frames source archive hash does not match the authoritative 0.9.27 source."
                echo "Expected: $EXPECTED_SOURCE_SHA256"
                echo "Actual:   $actual_sha"
                echo "File:     $source_zip"
              } | tee "$EVIDENCE/SOURCE-INTEGRITY-FAILURE.txt"
              exit 1
            fi
            rm -rf "$RUNNER_TEMP/frames-source"
            mkdir -p "$RUNNER_TEMP/frames-source"
            unzip -q "$source_zip" -d "$RUNNER_TEMP/frames-source"
            while IFS= read -r vfile; do
              candidate="${vfile%/VERSION}"
              [[ -f "$candidate/tools/qemu_certify.sh" ]] || continue
              version="$(tr -d '\r\n' < "$vfile")"
              if [[ "$version" == "$EXPECTED_FRAMES_VERSION" ]]; then
                frames_dir="$candidate"
                break
              fi
            done < <(find "$RUNNER_TEMP/frames-source" -maxdepth 6 -type f -name VERSION -print | sort)
          fi

          # Fallback: allow an unpacked exact-version source tree only when no
          # sealed archive/kit is present. Older trees are explicitly ignored.
          if [[ -z "$frames_dir" && -z "$source_zip" ]]; then
            while IFS= read -r vfile; do
              candidate="${vfile%/VERSION}"
              [[ -f "$candidate/tools/qemu_certify.sh" ]] || continue
              version="$(tr -d '\r\n' < "$vfile")"
              if [[ "$version" == "$EXPECTED_FRAMES_VERSION" ]]; then
                frames_dir="$candidate"
                break
              fi
            done < <(find "$GITHUB_WORKSPACE" -maxdepth 5 -type f -name VERSION -print | sort)
          fi

          if [[ -z "$frames_dir" ]]; then
            {
              echo "FAIL: exact Frames ${EXPECTED_FRAMES_VERSION} source tree was not found."
              echo "Older/newer Frames releases are deliberately ignored by this workflow."
              echo
              echo "Repository files:"
              find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -print 2>/dev/null | sort | head -300
              echo
              echo "Runner temp files:"
              find "$RUNNER_TEMP" -maxdepth 5 -type f -print 2>/dev/null | sort | head -300
            } | tee "$EVIDENCE/SOURCE-DISCOVERY-FAILURE.txt"
            exit 1
          fi

          frames_version="$(tr -d '\r\n' < "$frames_dir/VERSION")"
          if [[ "$frames_version" != "$EXPECTED_FRAMES_VERSION" ]]; then
            echo "FAIL: selected source reports $frames_version, expected $EXPECTED_FRAMES_VERSION" | tee "$EVIDENCE/VERSION-MISMATCH.txt"
            exit 1
          fi

          nexus_path="$(find "$frames_dir/toolchain" -maxdepth 3 -type f -name nexus -path '*/Nexus-Language-*/nexus' -print | sort -V | tail -n1 || true)"
          if [[ -z "$nexus_path" ]]; then
            echo "FAIL: bundled Nexus compiler was not found under $frames_dir/toolchain" | tee "$EVIDENCE/NEXUS-DISCOVERY-FAILURE.txt"
            exit 1
          fi

          echo "FRAMES_DIR=$frames_dir" >> "$GITHUB_ENV"
          echo "FRAMES_VERSION=$frames_version" >> "$GITHUB_ENV"
          echo "NEXUS_EXE=$nexus_path" >> "$GITHUB_ENV"
          echo "FRAMES_SOURCE_ZIP=${source_zip:-<unpacked-tree>}" >> "$GITHUB_ENV"
          echo "============================================================"
          echo "Frames source:  $frames_dir"
          echo "Frames version: $frames_version"
          echo "Nexus compiler: $nexus_path"
          echo "============================================================"

      - name: Locate matching OVMF CODE and VARS pair
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="$GITHUB_WORKSPACE/runtime-evidence"
          mkdir -p "$EVIDENCE"
          code=""
          vars=""

          # CODE and VARS must be a matching pair. Prefer 4M firmware on Ubuntu.
          for dir in /usr/share/OVMF /usr/share/edk2/ovmf /usr/share/edk2/x64; do
            if [[ -f "$dir/OVMF_CODE_4M.fd" && -f "$dir/OVMF_VARS_4M.fd" ]]; then
              code="$dir/OVMF_CODE_4M.fd"
              vars="$dir/OVMF_VARS_4M.fd"
              break
            fi
          done
          if [[ -z "$code" ]]; then
            for dir in /usr/share/OVMF /usr/share/edk2/ovmf /usr/share/edk2/x64; do
              if [[ -f "$dir/OVMF_CODE.fd" && -f "$dir/OVMF_VARS.fd" ]]; then
                code="$dir/OVMF_CODE.fd"
                vars="$dir/OVMF_VARS.fd"
                break
              fi
            done
          fi

          if [[ -z "$code" || -z "$vars" ]]; then
            {
              echo "FAIL: no matching OVMF CODE/VARS pair was found."
              echo "Available firmware files:"
              find /usr/share/OVMF /usr/share/edk2 -maxdepth 4 -type f -name 'OVMF_*.fd' -print 2>/dev/null | sort
            } | tee "$EVIDENCE/OVMF-DISCOVERY-FAILURE.txt"
            exit 1
          fi

          # Split OVMF CODE and VARS files are allowed to have different
          # lengths; pair them by the same firmware family/name, not by size.
          code_size="$(stat -c %s "$code")"
          vars_size="$(stat -c %s "$vars")"

          echo "OVMF_CODE=$code" >> "$GITHUB_ENV"
          echo "OVMF_VARS=$vars" >> "$GITHUB_ENV"
          echo "OVMF CODE: $code ($code_size bytes)"
          echo "OVMF VARS: $vars ($vars_size bytes)"

      - name: Preflight exact source before QEMU
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRAMES_DIR"
          mkdir -p build "$GITHUB_WORKSPACE/runtime-evidence"
          export NEXUS="$NEXUS_EXE"
          chmod +x "$NEXUS_EXE" tools/*.sh tools/*.py
          CONSOLE="$GITHUB_WORKSPACE/runtime-evidence/PREFLIGHT-CONSOLE.log"
          {
            echo "Frames $FRAMES_VERSION preflight"
            echo "Nexus: $($NEXUS_EXE --version)"
            echo "Clang: $(clang --version | head -n1)"
            echo "LLD: $(lld-link --version | head -n1)"
            bash -n tools/*.sh
            python3 -m compileall -q tools
            ./tools/build.sh
            python3 tools/make_esp.py
            python3 tools/verify_release.py
            python3 tools/verify_runtime_repair_0927.py
            sha256sum build/BOOTX64.EFI build/FramesKernel.fkrn build/System.fex build/Frames-${FRAMES_VERSION}-ESP.img build/BOOTSTAT.TXT
            python3 tools/runtime_preflight.py --require-ready
          } 2>&1 | tee "$CONSOLE"

      - name: Runtime certification and marker diagnosis
        id: runtime
        shell: bash
        env:
          # The repaired GPT/FAT path performs many more real NVMe reads than
          # older diagnostic builds. Give the two-vCPU TCG run ample headroom.
          FRAMES_BOOT_TIMEOUT: '180'
        run: |
          set -uo pipefail
          cd "$FRAMES_DIR"
          mkdir -p "$FRAMES_DIR/build" "$GITHUB_WORKSPACE/runtime-evidence"
          export NEXUS="$NEXUS_EXE"
          chmod +x "$NEXUS_EXE" tools/*.sh tools/*.py
          CONSOLE="$GITHUB_WORKSPACE/runtime-evidence/RUNTIME-CERTIFICATION-CONSOLE.log"

          set +e
          ./tools/qemu_certify.sh 2>&1 | tee "$CONSOLE"
          cert_rc=${PIPESTATUS[0]}
          set -e

          echo "$cert_rc" > "$GITHUB_WORKSPACE/runtime-evidence/QEMU-CERTIFY-EXIT-CODE.txt"
          LOG="$FRAMES_DIR/build/serial.log"
          echo
          echo "================ Frames runtime marker diagnosis ================"
          echo "qemu_certify.sh exit code: $cert_rc"
          if [[ ! -f "$LOG" ]]; then
            echo "serial.log was not produced."
            exit "$cert_rc"
          fi

          python3 - "$FRAMES_DIR/tools/qemu_certify.sh" "$LOG" <<'PY'
          import json, pathlib, re, sys
          script=pathlib.Path(sys.argv[1]).read_text(errors='replace')
          log_path=pathlib.Path(sys.argv[2])
          log=log_path.read_text(errors='replace')
          m=re.search(r'for marker in\s+(.*?);\s*do',script,re.S)
          if not m:
              print('Could not parse expected marker list from qemu_certify.sh')
              raise SystemExit(2)
          expected=m.group(1).split()
          present=[x for x in expected if x in log]
          missing=[x for x in expected if x not in log]
          fatal=[x for x in ('FRAMES_PAGE_FAULT','FRAMES_AP_PROTECTION_FAULT=','FRAMES_STRESS_ALLOCATOR_FAIL','FRAMES_STRESS_SCHEDULER_FAIL','FRAMES_STRESS_STORAGE_READ_FAIL','FRAMES_STRESS_USB_INPUT_FAIL') if x in log]
          ack_pos=log.find('FRAMES_RESCHED_IPI_OK')
          fallback_pos=log.find('FRAMES_RESCHED_FALLBACK_SENT')
          eager_rhs = ack_pos >= 0 and fallback_pos > ack_pos
          if eager_rhs:
              fatal.append('FRAMES_SHORT_CIRCUIT_EAGER_RHS')
          short_circuit={
              'resched_ipi_ok_position':ack_pos,
              'fallback_sent_position':fallback_pos,
              'eager_rhs_after_ack':eager_rhs,
              'status':'PASS' if not eager_rhs else 'FAIL',
          }
          (log_path.parent/'SHORT-CIRCUIT-RUNTIME.json').write_text(json.dumps(short_circuit,indent=2)+'\n')
          print(f'Expected markers: {len(expected)}')
          print(f'Present markers:  {len(present)}')
          print(f'Missing markers:  {len(missing)}')
          print(f'Fatal markers:    {len(fatal)}')
          print('\nMISSING MARKERS:')
          for x in missing: print(f'  - {x}')
          print('\nFATAL MARKERS:')
          for x in fatal: print(f'  - {x}')
          print('\nLAST 160 SERIAL LINES:')
          for line in log.splitlines()[-160:]: print(line)
          (log_path.parent/'MISSING-RUNTIME-MARKERS.json').write_text(json.dumps({
              'expected_count':len(expected),
              'present_count':len(present),
              'missing_count':len(missing),
              'missing':missing,
              'fatal':fatal,
          },indent=2)+'\n')
          if not missing and fatal:
              print('All positive markers were present, but a fatal runtime marker was also observed.')
              raise SystemExit(3)
          PY
          diag_rc=$?

          set +e
          python3 tools/stress_evidence.py --serial "$LOG" --require-usb-input-pass | tee "$GITHUB_WORKSPACE/runtime-evidence/STRESS-CERTIFICATION-CONSOLE.log"
          stress_rc=${PIPESTATUS[0]}
          set -e
          echo "$stress_rc" > "$GITHUB_WORKSPACE/runtime-evidence/STRESS-CERTIFY-EXIT-CODE.txt"

          echo "================================================================="
          if [[ "$cert_rc" -eq 0 && "$diag_rc" -ne 0 ]]; then
            exit "$diag_rc"
          fi
          if [[ "$cert_rc" -eq 0 && "$stress_rc" -ne 0 ]]; then
            exit "$stress_rc"
          fi
          exit "$cert_rc"

      - name: Build runtime evidence
        if: always()
        shell: bash
        run: |
          set +e
          EVIDENCE="$GITHUB_WORKSPACE/runtime-evidence"
          mkdir -p "$EVIDENCE"

          {
            echo "Frames runtime workflow diagnostics"
            echo "UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
            echo "EXPECTED_FRAMES_VERSION=${EXPECTED_FRAMES_VERSION:-<unset>}"
            echo "FRAMES_DIR=${FRAMES_DIR:-<unset>}"
            echo "FRAMES_VERSION=${FRAMES_VERSION:-<unset>}"
            echo "FRAMES_SOURCE_ZIP=${FRAMES_SOURCE_ZIP:-<unset>}"
            echo "NEXUS_EXE=${NEXUS_EXE:-<unset>}"
            echo "OVMF_CODE=${OVMF_CODE:-<unset>}"
            echo "OVMF_VARS=${OVMF_VARS:-<unset>}"
            echo "QEMU_VERSION=$(qemu-system-x86_64 --version 2>/dev/null | head -n1 || true)"
            echo "CLANG_VERSION=$(clang --version 2>/dev/null | head -n1 || true)"
            echo "LLD_LINK_VERSION=$(lld-link --version 2>/dev/null | head -n1 || true)"
            echo
            echo "Repository files:"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -print 2>/dev/null | sort | head -300
            echo
            echo "Frames build files:"
            if [[ -n "${FRAMES_DIR:-}" && -d "$FRAMES_DIR/build" ]]; then
              find "$FRAMES_DIR/build" -maxdepth 2 -type f -printf '%p %s bytes\n' 2>/dev/null | sort
            else
              echo "Frames build directory does not exist."
            fi
          } > "$EVIDENCE/WORKFLOW-DIAGNOSTICS.txt" 2>&1

          if [[ -n "${FRAMES_DIR:-}" && -f "$FRAMES_DIR/build/serial.log" ]]; then
            cd "$FRAMES_DIR"
            python3 tools/runtime_evidence.py --serial build/serial.log || true
            python3 tools/runtime_storage_cert.py --serial build/serial.log || true
            python3 tools/stress_evidence.py --serial build/serial.log || true
            for f in \
              build/serial.log \
              build/qmp-input.log \
              build/qemu-debug.log \
              build/MISSING-RUNTIME-MARKERS.json \
              build/SHORT-CIRCUIT-RUNTIME.json \
              build/RUNTIME-EVIDENCE.json \
              build/STORAGE-RUNTIME-CERT.json \
              build/RUNTIME-CERTIFICATION.json \
              build/STRESS-EVIDENCE.json; do
              [[ -f "$f" ]] && cp "$f" "$EVIDENCE/"
            done
          else
            {
              echo "QEMU did not produce build/serial.log."
              echo "Inspect PREFLIGHT-CONSOLE.log, RUNTIME-CERTIFICATION-CONSOLE.log, and WORKFLOW-DIAGNOSTICS.txt."
            } > "$EVIDENCE/NO-SERIAL-LOG.txt"
          fi

          echo "Evidence directory contents:"
          find "$EVIDENCE" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Upload runtime evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frames-0.9.27-stress-evidence
          path: ${{ github.workspace }}/runtime-evidence
          if-no-files-found: error
          retention-days: 14
