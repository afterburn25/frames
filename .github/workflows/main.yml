name: Frames 0.9.46 v56 Parallel r9 Evidence Repair

on:
  workflow_dispatch:
  push:
    paths:
      - 'Frames-0.9.46-Runtime-Certification-Kit-v56-Parallel-r9-Evidence-Repair.zip'
      - '.github/workflows/frames-0.9.46-v56-parallel-r9-evidence-repair.yml'

permissions:
  contents: read

jobs:
  reaggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_FRAMES_VERSION: '0.9.46'
      EXPECTED_WORKFLOW_REVISION: 'v56-parallel-r9'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize r9 evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/runtime-evidence"
          mkdir -p "$GITHUB_WORKSPACE/runtime-evidence"
          {
            echo "frames_version=0.9.46"
            echo "workflow_revision=v56-parallel-r9"
          } > "$GITHUB_WORKSPACE/runtime-evidence/R9-START.txt"

      - name: Locate and extract exact r9 evidence-repair kit
        id: locate
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          E="$GITHUB_WORKSPACE/runtime-evidence"
          kit="$(find "$GITHUB_WORKSPACE" -type f -name 'Frames-0.9.46-Runtime-Certification-Kit-v56-Parallel-r9-Evidence-Repair.zip' -print | head -n1)"
          if [[ -z "$kit" ]]; then
            echo "r9 kit not found" | tee "$E/R9-LOCATE-FAILURE.txt"
            exit 1
          fi
          rm -rf "$GITHUB_WORKSPACE/r9-kit"
          mkdir -p "$GITHUB_WORKSPACE/r9-kit"
          python3 - "$kit" "$GITHUB_WORKSPACE/r9-kit" <<'PY'
          import zipfile,sys
          with zipfile.ZipFile(sys.argv[1]) as z:
              assert z.testzip() is None
              z.extractall(sys.argv[2])
          PY
          root="$(find "$GITHUB_WORKSPACE/r9-kit" -maxdepth 2 -type d -name 'Frames-0.9.46-Runtime-Certification-Kit-v56-Parallel-r9-Evidence-Repair' -print | head -n1)"
          if [[ -z "$root" ]]; then
            echo "extracted r9 kit root missing" | tee "$E/R9-LOCATE-FAILURE.txt"
            exit 2
          fi
          echo "KIT_ROOT=$root" >> "$GITHUB_ENV"
          {
            echo "kit=$kit"
            echo "kit_root=$root"
            sha256sum "$kit"
          } > "$E/R9-KIT-IDENTITY.txt"

      - name: Evaluate exact external evidence
        id: evaluate
        if: always()
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          E="$GITHUB_WORKSPACE/runtime-evidence"
          mkdir -p "$E"
          rc=0
          if [[ -z "${KIT_ROOT:-}" ]]; then
            echo "KIT_ROOT unavailable; locate outcome=${{ steps.locate.outcome }}" | tee "$E/R9-EVALUATION-CONSOLE.log"
            rc=2
          else
            export EVIDENCE="$E"
            python3 "$KIT_ROOT/verify-v56-r9-evidence.py" 2>&1 | tee "$E/R9-EVALUATION-CONSOLE.log" || rc=$?
          fi
          echo "$rc" > "$E/R9-EVALUATION-EXIT-CODE.txt"
          exit "$rc"

      - name: Record r9 step outcomes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/runtime-evidence"
          cat > "$GITHUB_WORKSPACE/runtime-evidence/R9-STEP-OUTCOMES.txt" <<EOF
          locate=${{ steps.locate.outcome }}
          evaluate=${{ steps.evaluate.outcome }}
          EOF

      - name: Upload final r9 aggregate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frames-0.9.46-fapp-native-application-loader-parallel-evidence-v56
          path: runtime-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Final fail-closed verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ steps.locate.outcome }}" == success ]]
          [[ "${{ steps.evaluate.outcome }}" == success ]]
          [[ "$(cat runtime-evidence/R9-EVALUATION-EXIT-CODE.txt)" == 0 ]]
          python3 - <<'PY'
          import json
          j=json.load(open("runtime-evidence/PARALLEL-INCREMENTAL-CERTIFICATION.json"))
          assert j["status"]=="PASS"
          assert j["workflow_revision"]=="v56-parallel-r9"
          print("FRAMES 0.9.46 v56 PARALLEL r9 EVIDENCE REPAIR PASS")
          PY
