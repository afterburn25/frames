name: Frames 0.9.98 Integrated Secure Online Services Certification v108 r4

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Frames-0.9.98-Runtime-Certification-Kit-v108-r4.zip'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      # Automatic runs are intentionally triggered ONLY by uploading/replacing
      # Frames-0.9.98-Runtime-Certification-Kit-v108-r4.zip. Updating this workflow file does not start a run.
      EXPECTED_RUNTIME_KIT_SHA256: 9a0973835660cecdb9ebf87df324045a559e52a3ea37939597cf70864712de0f
      EXPECTED_SOURCE_SHA256: 5f8c13adac6d34e64bd47d9463a3e261cd0b51bb5ddb500aa9f7b87c2914a52d
      EXPECTED_FRAMES_VERSION: 0.9.98
      EXPECTED_SOURCE_REVISION: v108-train
      WORKFLOW_REVISION: v108-integrated-secure-online-services-r4
      PARENT_FRAMES_VERSION: 0.9.91
      PARENT_SOURCE_SHA256: ce58e0eceb770e5b9bc3842ce096deccd9640d986ac0acfec5065305efef2b65
      PARENT_EVIDENCE_SHA256: 526afe1d1cdc1e9996c355c904c6cf19e2e2916425d9c51b72dca01c8881fecb

    steps:
      - uses: actions/checkout@v4

      - name: Seal exact source from upload-last runtime kit
        id: source
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          E="$GITHUB_WORKSPACE/runtime-evidence"
          mkdir -p "$E"
          KIT="$GITHUB_WORKSPACE/Frames-0.9.98-Runtime-Certification-Kit-v108-r4.zip"
          EXTRACT="$RUNNER_TEMP/frames-v108-r4-kit"
          NESTED="$EXTRACT/Frames-0.9.98-Source-v108.zip"

          echo "runtime_kit=$KIT"
          echo "expected_runtime_kit_sha=$EXPECTED_RUNTIME_KIT_SHA256"
          echo "expected_source_sha=$EXPECTED_SOURCE_SHA256"

          if [[ ! -f "$KIT" ]]; then
            echo "::error::Required upload-last runtime kit is missing: Frames-0.9.98-Runtime-Certification-Kit-v108-r4.zip"
            python3 - "$E/SOURCE-SEAL-EVIDENCE.json" <<'PY'
          import json,sys
          json.dump({
            'status':'FAIL',
            'reason':'upload-last runtime certification kit missing from repository root',
            'expected_runtime_kit':'Frames-0.9.98-Runtime-Certification-Kit-v108-r4.zip',
            'workflow_revision':'v108-integrated-secure-online-services-r4'
          }, open(sys.argv[1],'w'), indent=2)
          open(sys.argv[1],'a').write('\n')
          PY
            exit 1
          fi

          kit_sha="$(sha256sum "$KIT" | awk '{print $1}')"
          echo "actual_runtime_kit_sha=$kit_sha"
          echo "runtime_kit_sha=$kit_sha" >> "$GITHUB_OUTPUT"
          if [[ "$kit_sha" != "$EXPECTED_RUNTIME_KIT_SHA256" ]]; then
            echo "::error::Runtime kit SHA mismatch. Actual: $kit_sha"
            python3 - "$E/SOURCE-SEAL-EVIDENCE.json" "$kit_sha" <<'PY'
          import json,sys
          json.dump({
            'status':'FAIL',
            'reason':'runtime certification kit SHA-256 mismatch',
            'actual_runtime_kit_sha256':sys.argv[2],
            'expected_runtime_kit_sha256':'9a0973835660cecdb9ebf87df324045a559e52a3ea37939597cf70864712de0f',
            'workflow_revision':'v108-integrated-secure-online-services-r4'
          }, open(sys.argv[1],'w'), indent=2)
          open(sys.argv[1],'a').write('\n')
          PY
            exit 1
          fi

          rm -rf "$EXTRACT"
          mkdir -p "$EXTRACT"
          python3 - "$KIT" "$EXTRACT" <<'PY'
          import json,sys,zipfile,pathlib
          kit=pathlib.Path(sys.argv[1]); dst=pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(kit) as z:
              bad=z.testzip()
              if bad:
                  raise SystemExit(f'outer runtime-kit ZIP integrity failure at {bad}')
              names=set(z.namelist())
              required={'CERTIFICATION-KIT.json','Frames-0.9.98-Source-v108.zip'}
              missing=required-names
              if missing:
                  raise SystemExit(f'runtime-kit missing required members: {sorted(missing)}')
              z.extract('CERTIFICATION-KIT.json', dst)
              z.extract('Frames-0.9.98-Source-v108.zip', dst)
          meta=json.loads((dst/'CERTIFICATION-KIT.json').read_text())
          if meta.get('frames_version')!='0.9.98' or meta.get('source_revision')!='v108-train':
              raise SystemExit('runtime-kit metadata identity mismatch')
          PY

          if [[ ! -f "$NESTED" ]]; then
            echo "::error::Embedded sealed source was not extracted."
            exit 1
          fi

          actual_sha="$(sha256sum "$NESTED" | awk '{print $1}')"
          echo "actual_source_sha=$actual_sha"
          echo "source_sha=$actual_sha" >> "$GITHUB_OUTPUT"
          if [[ "$actual_sha" != "$EXPECTED_SOURCE_SHA256" ]]; then
            echo "::error::Embedded source SHA mismatch. Actual: $actual_sha"
            python3 - "$E/SOURCE-SEAL-EVIDENCE.json" "$actual_sha" <<'PY'
          import json,sys
          json.dump({
            'status':'FAIL',
            'reason':'embedded sealed source SHA-256 mismatch',
            'actual_source_sha256':sys.argv[2],
            'expected_source_sha256':'5f8c13adac6d34e64bd47d9463a3e261cd0b51bb5ddb500aa9f7b87c2914a52d',
            'workflow_revision':'v108-integrated-secure-online-services-r4'
          }, open(sys.argv[1],'w'), indent=2)
          open(sys.argv[1],'a').write('\n')
          PY
            exit 1
          fi

          rm -rf "$RUNNER_TEMP/frames-source"
          mkdir -p "$RUNNER_TEMP/frames-source"
          python3 - "$NESTED" "$RUNNER_TEMP/frames-source" <<'PY'
          import sys,zipfile
          src,dst=sys.argv[1:]
          with zipfile.ZipFile(src) as z:
              bad=z.testzip()
              if bad:
                  raise SystemExit(f'source ZIP integrity failure at {bad}')
              z.extractall(dst)
          PY

          frames_dir="$RUNNER_TEMP/frames-source/Frames-0.9.98"
          if [[ ! -f "$frames_dir/VERSION" || ! -f "$frames_dir/GUI-REPAIR-REVISION" ]]; then
            echo "::error::Expected Frames-0.9.98 source root/identity files are missing."
            exit 1
          fi

          version="$(tr -d '\r\n' < "$frames_dir/VERSION")"
          revision="$(tr -d '\r\n' < "$frames_dir/GUI-REPAIR-REVISION")"
          echo "frames_version=$version"
          echo "source_revision=$revision"
          if [[ "$version" != "$EXPECTED_FRAMES_VERSION" || "$revision" != "$EXPECTED_SOURCE_REVISION" ]]; then
            echo "::error::Source identity mismatch: version=$version revision=$revision"
            exit 1
          fi

          chmod +x "$frames_dir/toolchain/Nexus-Language-5.20.0/nexus" 2>/dev/null || true
          find "$frames_dir/tools" -maxdepth 1 -type f \( -name '*.sh' -o -name '*.py' \) -exec chmod +x {} +

          echo "FRAMES_DIR=$frames_dir" >> "$GITHUB_ENV"
          echo "NEXUS=$frames_dir/toolchain/Nexus-Language-5.20.0/nexus" >> "$GITHUB_ENV"

          python3 - "$E/SOURCE-IDENTITY.json" "$kit_sha" "$actual_sha" <<'PY'
          import json,sys
          out,kit_sha,source_sha=sys.argv[1:]
          json.dump({
            'status':'PASS',
            'frames_version':'0.9.98',
            'source_revision':'v108-train',
            'runtime_kit':'Frames-0.9.98-Runtime-Certification-Kit-v108-r4.zip',
            'runtime_kit_sha256':kit_sha,
            'source_archive':'Frames-0.9.98-Source-v108.zip',
            'source_sha256':source_sha,
            'workflow_revision':'v108-integrated-secure-online-services-r4'
          }, open(out,'w'), indent=2)
          open(out,'a').write('\n')
          PY
          cp "$E/SOURCE-IDENTITY.json" "$E/SOURCE-SEAL-EVIDENCE.json"

      - name: Install certification dependencies with diagnostics
        id: dependencies
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          E="$GITHUB_WORKSPACE/runtime-evidence"
          mkdir -p "$E"
          rc=0
          {
            sudo apt-get update &&
            sudo apt-get install -y qemu-system-x86 ovmf clang lld python3 unzip zip
          } > "$E/DEPENDENCY-INSTALL.log" 2>&1 || rc=$?
          python3 - "$E/DEPENDENCY-INSTALL-EVIDENCE.json" "$rc" <<'PY'
          import json,sys
          rc=int(sys.argv[2])
          json.dump({'status':'PASS' if rc==0 else 'FAIL','exit_code':rc,
                     'workflow_revision':'v108-integrated-secure-online-services-r4'},open(sys.argv[1],'w'),indent=2)
          open(sys.argv[1],'a').write('\n')
          PY
          exit "$rc"

      - name: Resolve OVMF firmware with diagnostics
        id: firmware
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          E="$GITHUB_WORKSPACE/runtime-evidence"
          mkdir -p "$E"
          code="$(find /usr/share/OVMF -type f \( -name 'OVMF_CODE_4M.fd' -o -name 'OVMF_CODE.fd' \) -print 2>/dev/null | head -n1)"
          vars="$(find /usr/share/OVMF -type f \( -name 'OVMF_VARS_4M.fd' -o -name 'OVMF_VARS.fd' \) -print 2>/dev/null | head -n1)"
          if [[ -n "$code" ]]; then
            echo "OVMF_CODE=$code" >> "$GITHUB_ENV"
            [[ -n "$vars" ]] && echo "OVMF_VARS=$vars" >> "$GITHUB_ENV"
            python3 - "$E/OVMF-FIRMWARE-EVIDENCE.json" "$code" "$vars" <<'PY'
          import json,sys
          json.dump({'status':'PASS','ovmf_code':sys.argv[2],'ovmf_vars':sys.argv[3] or None,
                     'workflow_revision':'v108-integrated-secure-online-services-r4'},open(sys.argv[1],'w'),indent=2)
          open(sys.argv[1],'a').write('\n')
          PY
          else
            python3 - "$E/OVMF-FIRMWARE-EVIDENCE.json" <<'PY'
          import json,sys
          json.dump({'status':'FAIL','reason':'OVMF CODE firmware not found after dependency installation',
                     'workflow_revision':'v108-integrated-secure-online-services-r4'},open(sys.argv[1],'w'),indent=2)
          open(sys.argv[1],'a').write('\n')
          PY
            exit 1
          fi

      - name: Prepare and structural regression gate
        id: prepare
        if: steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.firmware.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRAMES_DIR"
          python3 tools/verify_secure_online_services_0998.py > "$GITHUB_WORKSPACE/runtime-evidence/SECURE-ONLINE-STRUCTURAL-EVIDENCE.json"
          python3 tools/verify_connected_services_0991.py > "$GITHUB_WORKSPACE/runtime-evidence/CONNECTED-SERVICES-STRUCTURAL-REGRESSION.json"
          python3 tools/verify_system_services_0984.py > "$GITHUB_WORKSPACE/runtime-evidence/SYSTEM-SERVICES-STRUCTURAL-REGRESSION.txt"
          "$NEXUS" kernel check kernel/main.nx > "$GITHUB_WORKSPACE/runtime-evidence/KERNEL-CHECK.txt"
          "$NEXUS" check apps/System/main.nx > "$GITHUB_WORKSPACE/runtime-evidence/SYSTEM-FEX-CHECK.txt"
          python3 - "$GITHUB_WORKSPACE/runtime-evidence/TRAIN-PREPARE-EVIDENCE.json" <<'PY'
          import json,sys
          out={'status':'PASS','profile':'frames-0.9.98-v108-secure-online-services-prepare','frames_version':'0.9.98','revision':'v108-train','train':'0.9.92-0.9.98','expected_source_sha256':'5f8c13adac6d34e64bd47d9463a3e261cd0b51bb5ddb500aa9f7b87c2914a52d','parent_frames_version':'0.9.91','parent_source_sha256':'ce58e0eceb770e5b9bc3842ce096deccd9640d986ac0acfec5065305efef2b65','parent_evidence_sha256':'526afe1d1cdc1e9996c355c904c6cf19e2e2916425d9c51b72dca01c8881fecb','checks':{'secure_online_structural':True,'connected_services_regression':True,'system_services_regression':True,'kernel_check':True,'system_fex_check':True},'live_external_tls_certified':False,'certificate_signature_verification_certified':False,'physical_boot_approved':False,'physical_media_writes_unlocked':False,'update_execution_enabled':False,'frames_1_0_promoted':False}
          json.dump(out,open(sys.argv[1],'w'),indent=2); open(sys.argv[1],'a').write('\n')
          PY

      - name: Integrated QEMU connected + secure online desktop gate
        id: secure
        if: steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.firmware.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRAMES_DIR"
          ./tools/qemu_secure_online_services_certify.sh
          qrc="$(cat build/SECURE-ONLINE-QEMU-EXIT-CODE.txt)"
          python3 tools/runtime_evidence.py --serial build/secure-online-serial.log --require-pass > /dev/null
          python3 tools/helixfs_kernel_phase3_evidence.py --serial build/secure-online-serial.log --require-pass > build/HELIXFS-KERNEL-PHASE3-EVIDENCE.json
          python3 tools/appearance_integrated_evidence.py --serial build/secure-online-serial.log --qemu-exit "$qrc" --require-pass > build/APPEARANCE-RUNTIME-EVIDENCE.json
          python3 tools/productivity_integrated_evidence.py --serial build/secure-online-serial.log --qemu-exit "$qrc" --require-pass > build/PRODUCTIVITY-RUNTIME-EVIDENCE.json
          python3 tools/daily_ux_integrated_evidence.py --serial build/secure-online-serial.log --qemu-exit "$qrc" --require-pass > build/DAILY-UX-RUNTIME-EVIDENCE.json
          python3 tools/system_services_integrated_evidence.py --serial build/secure-online-serial.log --qemu-exit "$qrc" --require-pass > build/SYSTEM-SERVICES-RUNTIME-EVIDENCE.json
          python3 tools/connected_services_integrated_evidence.py --serial build/secure-online-serial.log --qemu-exit "$qrc" --require-pass > build/CONNECTED-SERVICES-RUNTIME-EVIDENCE.json
          python3 tools/verify_theme_pack.py --require-pass > build/THEME-PACK-EVIDENCE.json
          python3 tools/verify_theme_pack.py --require-pass > build/THEME-PACK-SDK-REGRESSION.json
          python3 tools/verify_desktop_preview_image.py --require-pass > build/DESKTOP-IMAGE-EVIDENCE.json

      - name: Developer Preview, HelixFS and FAPP regression gate
        id: developer
        if: steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.firmware.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRAMES_DIR"
          FRAMES_PREBUILT=1 ./tools/qemu_developer_preview_certify.sh
          python3 tools/app_packaging_evidence.py --package build/HelloFrames.fapp --image "build/Frames-0.9.98-Developer-Preview.img" --require-pass > /dev/null

      - name: SDK tooling regression gate
        id: sdk
        if: steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.firmware.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRAMES_DIR"
          python3 tools/sdk_selftest.py --require-pass > build/SDK-TOOLING-EVIDENCE.json

      - name: Collect and aggregate evidence
        if: always()
        shell: bash
        env:
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          FIRMWARE_OUTCOME: ${{ steps.firmware.outcome }}
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          SECURE_OUTCOME: ${{ steps.secure.outcome }}
          DEVELOPER_OUTCOME: ${{ steps.developer.outcome }}
          SDK_OUTCOME: ${{ steps.sdk.outcome }}
        run: |
          set -uo pipefail
          E="$GITHUB_WORKSPACE/runtime-evidence"
          mkdir -p "$E"
          if [[ -n "${FRAMES_DIR:-}" && -d "$FRAMES_DIR/build" ]]; then
            for f in \
              SECURE-ONLINE-SERVICES-RUNTIME-EVIDENCE.json \
              SECURE-ONLINE-SERVICES-VISUAL-EVIDENCE.json \
              CONNECTED-SERVICES-RUNTIME-EVIDENCE.json \
              SYSTEM-SERVICES-RUNTIME-EVIDENCE.json \
              DAILY-UX-RUNTIME-EVIDENCE.json \
              PRODUCTIVITY-RUNTIME-EVIDENCE.json \
              APPEARANCE-RUNTIME-EVIDENCE.json \
              RUNTIME-EVIDENCE.json \
              HELIXFS-KERNEL-PHASE3-EVIDENCE.json \
              DEVELOPER-PREVIEW-EVIDENCE.json \
              DEVELOPER-PREVIEW-PHASE3-EVIDENCE.json \
              APP-LOADER-EVIDENCE.json \
              HELIXFS-PHASE2-EVIDENCE.json \
              HELIXFS-PHASE3-EVIDENCE.json \
              SDK-TOOLING-EVIDENCE.json \
              APP-PACKAGING-EVIDENCE.json \
              THEME-PACK-EVIDENCE.json \
              THEME-PACK-SDK-REGRESSION.json \
              DESKTOP-IMAGE-EVIDENCE.json \
              SECURE-ONLINE-QEMU-EXIT-CODE.txt \
              SECURE-ONLINE-CAPTURE-EXIT-CODE.txt \
              secure-online-serial.log \
              secure-online-qemu-debug.log \
              secure-online-capture.log \
              secure-online.ppm \
              DEVELOPER-PREVIEW-QEMU-EXIT-CODE.txt \
              developer-preview-serial.log \
              developer-preview-qemu-debug.log \
              developer-preview-qmp-input.log; do
              [[ -f "$FRAMES_DIR/build/$f" ]] && cp "$FRAMES_DIR/build/$f" "$E/$f"
            done
          fi
          printf '%s\n' "source=$SOURCE_OUTCOME" "dependencies=$DEPENDENCIES_OUTCOME" "firmware=$FIRMWARE_OUTCOME" "prepare=$PREPARE_OUTCOME" "secure=$SECURE_OUTCOME" "developer=$DEVELOPER_OUTCOME" "sdk=$SDK_OUTCOME" > "$E/WORKFLOW-STEP-OUTCOMES.txt"
          python3 - "$E" "$SOURCE_OUTCOME" "$DEPENDENCIES_OUTCOME" "$FIRMWARE_OUTCOME" "$PREPARE_OUTCOME" "$SECURE_OUTCOME" "$DEVELOPER_OUTCOME" "$SDK_OUTCOME" <<'PY'
          from pathlib import Path
          import json,sys,hashlib
          E=Path(sys.argv[1]); outcomes=sys.argv[2:]
          source_sha=''
          try:
              source_sha=json.loads((E/'SOURCE-IDENTITY.json').read_text()).get('source_sha256','')
          except Exception:
              pass
          required={
            'prepare':'TRAIN-PREPARE-EVIDENCE.json',
            'secure_online_runtime':'SECURE-ONLINE-SERVICES-RUNTIME-EVIDENCE.json',
            'secure_online_visual':'SECURE-ONLINE-SERVICES-VISUAL-EVIDENCE.json',
            'connected_services_runtime':'CONNECTED-SERVICES-RUNTIME-EVIDENCE.json',
            'system_services_runtime':'SYSTEM-SERVICES-RUNTIME-EVIDENCE.json',
            'daily_ux_runtime':'DAILY-UX-RUNTIME-EVIDENCE.json',
            'productivity_runtime':'PRODUCTIVITY-RUNTIME-EVIDENCE.json',
            'appearance_runtime':'APPEARANCE-RUNTIME-EVIDENCE.json',
            'kernel_runtime':'RUNTIME-EVIDENCE.json',
            'helixfs_kernel':'HELIXFS-KERNEL-PHASE3-EVIDENCE.json',
            'developer_preview':'DEVELOPER-PREVIEW-EVIDENCE.json',
            'developer_preview_phase3':'DEVELOPER-PREVIEW-PHASE3-EVIDENCE.json',
            'app_loader':'APP-LOADER-EVIDENCE.json',
            'helixfs_phase2':'HELIXFS-PHASE2-EVIDENCE.json',
            'helixfs_phase3':'HELIXFS-PHASE3-EVIDENCE.json',
            'sdk_tooling':'SDK-TOOLING-EVIDENCE.json',
            'fapp_packaging':'APP-PACKAGING-EVIDENCE.json',
            'theme_pack':'THEME-PACK-EVIDENCE.json',
            'theme_sdk_regression':'THEME-PACK-SDK-REGRESSION.json',
            'desktop_image':'DESKTOP-IMAGE-EVIDENCE.json',
          }
          checks={}
          checks['source_seal']=outcomes[0]=='success'
          checks['dependencies']=outcomes[1]=='success'
          checks['firmware']=outcomes[2]=='success'
          for name,fn in required.items():
              p=E/fn
              try: checks[name]=p.is_file() and json.loads(p.read_text()).get('status')=='PASS'
              except Exception: checks[name]=False
          checks['workflow_steps']=all(x=='success' for x in outcomes)
          checks['source_sha_exact']=source_sha=='5f8c13adac6d34e64bd47d9463a3e261cd0b51bb5ddb500aa9f7b87c2914a52d'
          status='PASS' if all(checks.values()) else 'FAIL'
          final={'status':status,'profile':'frames-0.9.98-integrated-secure-online-services-certification','workflow_revision':'v108-integrated-secure-online-services-r4','frames_version':'0.9.98','train':'0.9.92-0.9.98','candidate_source_sha256':source_sha,'certified_parent_frames_version':'0.9.91','certified_parent_source_sha256':'ce58e0eceb770e5b9bc3842ce096deccd9640d986ac0acfec5065305efef2b65','certified_parent_evidence_sha256':'526afe1d1cdc1e9996c355c904c6cf19e2e2916425d9c51b72dca01c8881fecb','checks':checks,'qemu_nat_external_connectivity_certified':checks.get('connected_services_runtime',False),'secure_online_services_foundation_certified':checks.get('secure_online_runtime',False) and checks.get('secure_online_visual',False),'live_external_tls_certified':False,'certificate_signature_verification_certified':False,'physical_network_hardware_certified':False,'physical_boot_approved':False,'physical_media_writes_unlocked':False,'target_settings_writeback_enabled':False,'file_operation_write_execution_enabled':False,'power_action_execution_enabled':False,'update_execution_enabled':False,'recovery_action_execution_enabled':False,'frames_1_0_promoted':False}
          (E/'FINAL-SECURE-ONLINE-SERVICES-CERTIFICATION.json').write_text(json.dumps(final,indent=2)+'\n')
          # Manifest all evidence existing at this point except the manifest and its verifier.
          files=sorted(p for p in E.iterdir() if p.is_file() and p.name not in ('EVIDENCE-FILES-SHA256.txt','FINAL-MANIFEST-VERIFY.json'))
          (E/'EVIDENCE-FILES-SHA256.txt').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in files))
          mism=[]
          for line in (E/'EVIDENCE-FILES-SHA256.txt').read_text().splitlines():
              sha,name=line.split('  ',1); p=E/name
              if not p.is_file() or hashlib.sha256(p.read_bytes()).hexdigest()!=sha: mism.append(name)
          (E/'FINAL-MANIFEST-VERIFY.json').write_text(json.dumps({'status':'PASS' if not mism else 'FAIL','mismatches':mism},indent=2)+'\n')
          PY
          cd "$GITHUB_WORKSPACE"
          rm -f frames-0.9.98-integrated-secure-online-services-evidence-v108.zip
          zip -q -r frames-0.9.98-integrated-secure-online-services-evidence-v108.zip runtime-evidence
          sha256sum frames-0.9.98-integrated-secure-online-services-evidence-v108.zip | tee "$E/AGGREGATE-ZIP-SHA256.txt"

      - name: Upload aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frames-0.9.98-integrated-secure-online-services-evidence-v108
          path: |
            runtime-evidence
            frames-0.9.98-integrated-secure-online-services-evidence-v108.zip
          if-no-files-found: error

      - name: Enforce final certification
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('runtime-evidence/FINAL-SECURE-ONLINE-SERVICES-CERTIFICATION.json')
          if not p.is_file(): raise SystemExit('final certification evidence missing')
          d=json.loads(p.read_text())
          print(json.dumps(d,indent=2))
          if d.get('status')!='PASS': raise SystemExit(1)
          m=json.loads(pathlib.Path('runtime-evidence/FINAL-MANIFEST-VERIFY.json').read_text())
          if m.get('status')!='PASS': raise SystemExit(1)
          PY
