name: Frames 0.9.63 Appearance System & Theme Engine Integrated Certification v73

on:
  workflow_dispatch:
  push:
    paths:
      - 'Frames-0.9.63-Appearance-Certification-Kit-v73.zip'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Verify and extract exact certification kit
        shell: bash
        run: |
          set -euo pipefail
          KIT="$GITHUB_WORKSPACE/Frames-0.9.63-Appearance-Certification-Kit-v73.zip"
          [[ -f "$KIT" ]]
          echo "31b049af5df88db6276e10348c80cef20c1eaa7ca94a8b69011c33fdd796a309  Frames-0.9.63-Appearance-Certification-Kit-v73.zip" | sha256sum -c -
          rm -rf "$GITHUB_WORKSPACE/gui-kit" "$GITHUB_WORKSPACE/prepared"
          mkdir -p "$GITHUB_WORKSPACE/gui-kit" "$GITHUB_WORKSPACE/prepared"
          unzip -q "$KIT" -d "$GITHUB_WORKSPACE/gui-kit"
          echo "KIT_ROOT=$GITHUB_WORKSPACE/gui-kit/Frames-0.9.63-Appearance-Certification-Kit-v73" >> "$GITHUB_ENV"

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld python3 unzip

      - name: Seal source identity and exact change impact
        shell: bash
        run: |
          set -euo pipefail
          python3 "$KIT_ROOT/prepare-appearance.py" "$KIT_ROOT" "$GITHUB_WORKSPACE/prepared"
          echo "FRAMES_DIR=$GITHUB_WORKSPACE/prepared/source/Frames-0.9.63" >> "$GITHUB_ENV"

      - name: Build exact candidate once
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRAMES_DIR"
          export NEXUS="$FRAMES_DIR/toolchain/Nexus-Language-5.20.0/nexus"
          chmod +x tools/*.sh tools/*.py sdk/*.sh sdk/*.py "$NEXUS" 2>/dev/null || true
          python3 tools/verify_appearance_0963.py
          ./tools/build.sh
          python3 tools/verify_theme_pack.py --require-pass > "$GITHUB_WORKSPACE/prepared/THEME-PACK-EVIDENCE.json"
          python3 tools/make_esp.py
          python3 tools/verify_release.py
          python3 tools/sdk_selftest.py --require-pass > "$GITHUB_WORKSPACE/prepared/SDK-TOOLING-PREP.json"
          python3 tools/make_developer_preview_image.py
          python3 tools/verify_developer_preview_image.py --image build/Frames-0.9.63-Developer-Preview.img --package build/HelloFrames.fapp --require-pass
          python3 tools/app_packaging_evidence.py --package build/HelloFrames.fapp --image build/Frames-0.9.63-Developer-Preview.img --require-pass > "$GITHUB_WORKSPACE/prepared/APP-PACKAGING-PREP.json"
          python3 tools/make_desktop_preview_image.py
          python3 tools/verify_desktop_preview_image.py --image build/Frames-0.9.63-Desktop-Preview.img --package build/HelloFrames.fapp --require-pass > "$GITHUB_WORKSPACE/prepared/DESKTOP-IMAGE-EVIDENCE.json"
          tar -czf "$GITHUB_WORKSPACE/prepared-source-build.tgz" -C "$GITHUB_WORKSPACE/prepared" source

      - name: Upload prepared source/build
        uses: actions/upload-artifact@v7
        with:
          name: frames-0963-prepared-source-build
          path: prepared-source-build.tgz
          if-no-files-found: error

      - name: Upload prepare evidence
        uses: actions/upload-artifact@v7
        with:
          name: frames-0963-prepare-evidence
          path: |
            prepared/PREPARE-EVIDENCE.json
            prepared/THEME-PACK-EVIDENCE.json
            prepared/DESKTOP-IMAGE-EVIDENCE.json
          if-no-files-found: error

  lanes:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lane: [desktop-appearance, kernel-readonly, developer-preview, sdk-packaging]
    steps:
      - uses: actions/checkout@v5

      - name: Download exact prepared build
        uses: actions/download-artifact@v7
        with:
          name: frames-0963-prepared-source-build
          path: .

      - name: Restore prepared source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p prepared lane-evidence
          tar -xzf prepared-source-build.tgz -C prepared
          FRAMES_DIR="$GITHUB_WORKSPACE/prepared/source/Frames-0.9.63"
          echo "FRAMES_DIR=$FRAMES_DIR" >> "$GITHUB_ENV"
          echo "NEXUS_EXE=$FRAMES_DIR/toolchain/Nexus-Language-5.20.0/nexus" >> "$GITHUB_ENV"
          chmod +x "$FRAMES_DIR"/tools/*.sh "$FRAMES_DIR"/tools/*.py "$FRAMES_DIR"/sdk/*.sh "$FRAMES_DIR"/sdk/*.py "$FRAMES_DIR"/toolchain/Nexus-Language-5.20.0/nexus 2>/dev/null || true

      - name: Install QEMU for runtime lanes
        if: matrix.lane != 'sdk-packaging'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf python3
          echo "OVMF_CODE=/usr/share/OVMF/OVMF_CODE_4M.fd" >> "$GITHUB_ENV"
          echo "OVMF_VARS=/usr/share/OVMF/OVMF_VARS_4M.fd" >> "$GITHUB_ENV"

      - name: Desktop appearance framebuffer lane
        if: matrix.lane == 'desktop-appearance'
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRAMES_DIR"
          export NEXUS="$NEXUS_EXE"
          BOOT=build/Frames-0.9.63-Desktop-Preview.img
          cp "$BOOT" "$BOOT.before"
          LOG=build/appearance-serial.log
          QMP=build/appearance-qmp.sock
          PPM=build/appearance.ppm
          DBG=build/appearance-qemu-debug.log
          CAP=build/appearance-capture.log
          rm -f "$LOG" "$QMP" "$PPM" "$DBG" "$CAP"
          cp "$OVMF_VARS" build/OVMF_VARS.appearance.fd
          set +e
          timeout 240 qemu-system-x86_64 -machine q35 -accel tcg,thread=multi -m 2048M -smp 4 -cpu max -display none -vga std             -serial file:"$LOG" -no-reboot -no-shutdown -qmp "unix:$QMP,server=on,wait=off" -d guest_errors -D "$DBG"             -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE"             -drive if=pflash,format=raw,file=build/OVMF_VARS.appearance.fd             -drive if=none,id=desktopboot,format=raw,readonly=on,file="$BOOT"             -device nvme,serial=FRAMESAPPEAR0963,drive=desktopboot,bootindex=1 &
          qpid=$!
          python3 "$GITHUB_WORKSPACE/gui-kit/Frames-0.9.63-Appearance-Certification-Kit-v73/qmp-appearance-capture.py" "$QMP" "$LOG" "$PPM" > "$CAP" 2>&1 &
          cpid=$!
          wait "$cpid"; crc=$?
          if kill -0 "$qpid" 2>/dev/null && [[ "$crc" -ne 0 ]]; then kill -TERM "$qpid" 2>/dev/null || true; fi
          wait "$qpid"; qrc=$?
          set -e
          echo "$qrc" > build/APPEARANCE-QEMU-EXIT-CODE.txt
          echo "$crc" > build/APPEARANCE-CAPTURE-EXIT-CODE.txt
          python3 tools/appearance_integrated_evidence.py --serial "$LOG" --qemu-exit "$qrc" --require-pass > "$GITHUB_WORKSPACE/lane-evidence/APPEARANCE-RUNTIME-EVIDENCE.json"
          python3 "$GITHUB_WORKSPACE/gui-kit/Frames-0.9.63-Appearance-Certification-Kit-v73/appearance-visual-evidence.py"             --serial "$LOG" --ppm "$PPM" --qemu-exit "$qrc" --media-before "$BOOT.before" --media-after "$BOOT" --require-pass             > "$GITHUB_WORKSPACE/lane-evidence/APPEARANCE-VISUAL-EVIDENCE.json"
          cp "$LOG" "$PPM" "$DBG" "$CAP" build/APPEARANCE-QEMU-EXIT-CODE.txt build/APPEARANCE-CAPTURE-EXIT-CODE.txt "$GITHUB_WORKSPACE/lane-evidence/"
          [[ "$qrc" -eq 0 && "$crc" -eq 0 ]]

      - name: Kernel read-only regression lane
        if: matrix.lane == 'kernel-readonly'
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRAMES_DIR"
          export NEXUS="$NEXUS_EXE" FRAMES_PREBUILT=1 OVMF_CODE OVMF_VARS
          ./tools/qemu_helixfs_readonly_smoke.sh
          cp build/RUNTIME-EVIDENCE.json build/HELIXFS-KERNEL-PHASE3-EVIDENCE.json "$GITHUB_WORKSPACE/lane-evidence/"

      - name: Developer Preview regression lane
        if: matrix.lane == 'developer-preview'
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRAMES_DIR"
          export NEXUS="$NEXUS_EXE" FRAMES_PREBUILT=1 OVMF_CODE OVMF_VARS
          ./tools/qemu_developer_preview_certify.sh
          cp build/DEVELOPER-PREVIEW-EVIDENCE.json build/DEVELOPER-PREVIEW-PHASE3-EVIDENCE.json build/APP-LOADER-EVIDENCE.json              build/HELIXFS-PHASE2-EVIDENCE.json build/HELIXFS-PHASE3-EVIDENCE.json "$GITHUB_WORKSPACE/lane-evidence/"

      - name: SDK / theme packaging regression lane
        if: matrix.lane == 'sdk-packaging'
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRAMES_DIR"
          export NEXUS="$NEXUS_EXE"
          python3 tools/verify_theme_pack.py --require-pass > "$GITHUB_WORKSPACE/lane-evidence/THEME-PACK-SDK-REGRESSION.json"
          python3 tools/sdk_selftest.py --require-pass > "$GITHUB_WORKSPACE/lane-evidence/SDK-TOOLING-EVIDENCE.json"
          python3 tools/app_packaging_evidence.py --package build/HelloFrames.fapp --image build/Frames-0.9.63-Developer-Preview.img --require-pass > "$GITHUB_WORKSPACE/lane-evidence/APP-PACKAGING-EVIDENCE.json"

      - name: Upload lane evidence
        uses: actions/upload-artifact@v7
        with:
          name: frames-0963-lane-${{ matrix.lane }}
          path: lane-evidence
          if-no-files-found: error

  aggregate:
    needs: [prepare, lanes]
    runs-on: ubuntu-24.04
    if: always() && needs.prepare.result == 'success' && needs.lanes.result == 'success'
    steps:
      - uses: actions/checkout@v5

      - name: Extract certification kit
        shell: bash
        run: |
          set -euo pipefail
          unzip -q Frames-0.9.63-Appearance-Certification-Kit-v73.zip -d gui-kit
          echo "KIT_ROOT=$GITHUB_WORKSPACE/gui-kit/Frames-0.9.63-Appearance-Certification-Kit-v73" >> "$GITHUB_ENV"

      - name: Download prepare evidence
        uses: actions/download-artifact@v7
        with:
          name: frames-0963-prepare-evidence
          path: runtime-evidence

      - name: Download all lane evidence
        uses: actions/download-artifact@v7
        with:
          pattern: frames-0963-lane-*
          path: runtime-evidence
          merge-multiple: true

      - name: Final integrated appearance verdict
        shell: bash
        run: |
          set -euo pipefail
          python3 "$KIT_ROOT/finalize-appearance.py" "$GITHUB_WORKSPACE/runtime-evidence"
          python3 - "$GITHUB_WORKSPACE/runtime-evidence" <<'PY'
          from pathlib import Path
          import hashlib,json,sys
          r=Path(sys.argv[1])
          def H(p):
              h=hashlib.sha256()
              with open(p,"rb") as f:
                  for c in iter(lambda:f.read(1<<20),b""): h.update(c)
              return h.hexdigest()
          files=[p for p in sorted(r.rglob("*")) if p.is_file() and p.name!="EVIDENCE-FILES-SHA256.txt"]
          (r/"EVIDENCE-FILES-SHA256.txt").write_text("".join(f"{H(p)}  {p.relative_to(r).as_posix()}\n" for p in files))
          mism=[]
          for line in (r/"EVIDENCE-FILES-SHA256.txt").read_text().splitlines():
              expected,name=line.split("  ",1)
              if H(r/name)!=expected: mism.append(name)
          (r/"FINAL-MANIFEST-VERIFY.json").write_text(json.dumps({"status":"PASS" if not mism else "FAIL","mismatches":mism},indent=2)+"\n")
          assert not mism
          PY

      - name: Upload final certification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frames-0.9.63-appearance-theme-engine-evidence-v73
          path: runtime-evidence
          if-no-files-found: error
