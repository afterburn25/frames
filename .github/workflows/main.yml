name: Frames 0.9.48 HelixFS Phase 1 Storage Confirmation v58 r2
on:
  workflow_dispatch:
  push:
    paths:
      - 'Frames-0.9.48-Runtime-Certification-Kit-v58-r2-Storage-Confirmation.zip'
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Locate kit by internal contract
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf r2kit prep-evidence prepared-source
          mkdir -p r2kit prep-evidence prepared-source
          python3 - "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/r2kit" <<'PY'
          import sys,pathlib,zipfile,json
          ws=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          marker='Frames-0.9.48-Runtime-Certification-Kit-v58-r2-Storage-Confirmation/KIT-CONTRACT.json'
          matches=[]
          for p in ws.rglob('*.zip'):
              try:
                  with zipfile.ZipFile(p) as z:
                      if marker in z.namelist():
                          c=json.loads(z.read(marker))
                          if c.get('workflow_revision')=='v58-incremental-r2' and c.get('candidate_source_sha256')=='142150f649035413ab829a44169522c180d7a8471d89a3dbaad3c37bc49f3a7a':
                              matches.append(p)
              except Exception:
                  pass
          assert len(matches)==1,matches
          with zipfile.ZipFile(matches[0]) as z:z.extractall(out)
          PY
          root="$GITHUB_WORKSPACE/r2kit/Frames-0.9.48-Runtime-Certification-Kit-v58-r2-Storage-Confirmation"
          python3 "$root/verify-v58-r2-prep.py" "$root" "$GITHUB_WORKSPACE/prep-evidence"
          unzip -q "$root/Frames-0.9.48-Source-v58.zip" -d "$GITHUB_WORKSPACE/prepared-source"
          FRAMES_DIR="$GITHUB_WORKSPACE/prepared-source/Frames-0.9.48"
          chmod +x "$FRAMES_DIR"/tools/*.sh "$FRAMES_DIR"/tools/*.py "$FRAMES_DIR"/sdk/*.sh "$FRAMES_DIR"/sdk/*.py "$FRAMES_DIR"/toolchain/Nexus-Language-5.20.0/nexus
          echo "FRAMES_DIR=$FRAMES_DIR" >> "$GITHUB_ENV"
          echo "NEXUS_EXE=$FRAMES_DIR/toolchain/Nexus-Language-5.20.0/nexus" >> "$GITHUB_ENV"
      - name: Install runtime tools
        id: install
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf clang lld python3 unzip
      - name: Discover OVMF
        id: ovmf
        shell: bash
        run: |
          set -euo pipefail
          code=/usr/share/OVMF/OVMF_CODE_4M.fd
          vars=/usr/share/OVMF/OVMF_VARS_4M.fd
          [[ -f "$code" && -f "$vars" ]]
          echo "OVMF_CODE=$code" >> "$GITHUB_ENV"
          echo "OVMF_VARS=$vars" >> "$GITHUB_ENV"
      - name: Build and seal exact source
        id: build
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRAMES_DIR"; export NEXUS="$NEXUS_EXE"
          ./tools/build.sh > "$GITHUB_WORKSPACE/prep-evidence/BUILD-CONSOLE.log" 2>&1
          python3 tools/make_esp.py >> "$GITHUB_WORKSPACE/prep-evidence/BUILD-CONSOLE.log" 2>&1
          python3 tools/verify_release.py >> "$GITHUB_WORKSPACE/prep-evidence/BUILD-CONSOLE.log" 2>&1
          tar --sort=name --mtime='UTC 2026-08-13 00:00:00' --owner=0 --group=0 --numeric-owner -C "$GITHUB_WORKSPACE/prepared-source" -cf - Frames-0.9.48 | gzip -n -9 > "$GITHUB_WORKSPACE/Frames-0.9.48-v58-r2-prepared-source.tar.gz"
          sha256sum "$GITHUB_WORKSPACE/Frames-0.9.48-v58-r2-prepared-source.tar.gz" > "$GITHUB_WORKSPACE/prep-evidence/PREPARED-SOURCE-ARCHIVE-SHA256.txt"
      - name: Record prep outcomes
        if: always()
        shell: bash
        run: |
          cat > prep-evidence/PREP-STEP-OUTCOMES.txt <<EOF
          locate=${{ steps.locate.outcome }}
          install=${{ steps.install.outcome }}
          ovmf=${{ steps.ovmf.outcome }}
          build=${{ steps.build.outcome }}
          EOF
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frames-v58-r2-prep-evidence
          path: prep-evidence
      - uses: actions/upload-artifact@v7
        with:
          name: frames-v58-r2-prepared-source
          path: Frames-0.9.48-v58-r2-prepared-source.tar.gz

  confirm-storage:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Initialize
        shell: bash
        run: mkdir -p confirmation prepared-source
      - uses: actions/download-artifact@v8
        with:
          name: frames-v58-r2-prepared-source
          path: .
      - name: Install runtime tools
        id: install
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf clang lld python3 unzip
      - name: Extract sealed source
        id: source
        shell: bash
        run: |
          tar -xzf Frames-0.9.48-v58-r2-prepared-source.tar.gz -C prepared-source
          FRAMES_DIR="$GITHUB_WORKSPACE/prepared-source/Frames-0.9.48"
          chmod +x "$FRAMES_DIR"/tools/*.sh "$FRAMES_DIR"/tools/*.py "$FRAMES_DIR"/sdk/*.sh "$FRAMES_DIR"/sdk/*.py "$FRAMES_DIR"/toolchain/Nexus-Language-5.20.0/nexus
          echo "FRAMES_DIR=$FRAMES_DIR" >> "$GITHUB_ENV"
          echo "NEXUS_EXE=$FRAMES_DIR/toolchain/Nexus-Language-5.20.0/nexus" >> "$GITHUB_ENV"
      - name: Discover OVMF
        id: ovmf
        shell: bash
        run: |
          code=/usr/share/OVMF/OVMF_CODE_4M.fd; vars=/usr/share/OVMF/OVMF_VARS_4M.fd
          [[ -f "$code" && -f "$vars" ]]
          echo "OVMF_CODE=$code" >> "$GITHUB_ENV"; echo "OVMF_VARS=$vars" >> "$GITHUB_ENV"
      - name: Confirm storage write certification
        id: runlane
        shell: bash
        continue-on-error: true
        env:
          FRAMES_BOOT_TIMEOUT: '240'
        run: |
          set -uo pipefail
          cd "$FRAMES_DIR"; export NEXUS="$NEXUS_EXE"; rc=0
          ./tools/qemu_certify.sh > "$GITHUB_WORKSPACE/confirmation/STORAGE-CONFIRM-CONSOLE.log" 2>&1 || rc=$?
          cp build/serial.log "$GITHUB_WORKSPACE/confirmation/serial.log" 2>/dev/null || true
          cp build/qemu-debug.log "$GITHUB_WORKSPACE/confirmation/qemu-debug.log" 2>/dev/null || true
          cp build/Frames-0.9.48-Write-Test.before.img "$GITHUB_WORKSPACE/confirmation/" 2>/dev/null || true
          cp build/Frames-0.9.48-Write-Test.img "$GITHUB_WORKSPACE/confirmation/" 2>/dev/null || true
          echo "$rc" > "$GITHUB_WORKSPACE/confirmation/LANE-CERTIFY-EXIT-CODE.txt"
          python3 - "$rc" "$GITHUB_WORKSPACE/confirmation/LANE-RESULT.json" <<'PY'
          import sys,json,pathlib
          rc=int(sys.argv[1])
          pathlib.Path(sys.argv[2]).write_text(json.dumps({'status':'PASS' if rc==0 else 'FAIL','lane':'storage-confirmation','exit_code':rc,'workflow_revision':'v58-incremental-r2'},indent=2)+'\n')
          PY
          exit "$rc"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frames-v58-r2-storage-confirmation
          path: confirmation
          if-no-files-found: error
      - name: Fail closed
        if: always()
        shell: bash
        run: |
          [[ "${{ steps.install.outcome }}" == success && "${{ steps.source.outcome }}" == success && "${{ steps.ovmf.outcome }}" == success && "${{ steps.runlane.outcome }}" == success ]]

  aggregate:
    if: always()
    needs: [prepare, confirm-storage]
    runs-on: ubuntu-24.04
    steps:
      - shell: bash
        run: mkdir -p runtime-evidence/prep runtime-evidence/confirmation
      - uses: actions/download-artifact@v8
        id: prep
        continue-on-error: true
        with:
          name: frames-v58-r2-prep-evidence
          path: runtime-evidence/prep
      - uses: actions/download-artifact@v8
        id: confirm
        continue-on-error: true
        with:
          name: frames-v58-r2-storage-confirmation
          path: runtime-evidence/confirmation
      - name: Aggregate final v58 evidence
        id: aggregate
        shell: bash
        continue-on-error: true
        run: |
          python3 - runtime-evidence "${{ needs.prepare.result }}" "${{ needs.confirm-storage.result }}" <<'PY'
          #!/usr/bin/env python3
          from pathlib import Path
          import json,sys
          out=Path(sys.argv[1]); prep_result=sys.argv[2]; confirm_result=sys.argv[3]
          def J(p): return json.loads(p.read_text()) if p.is_file() else {}
          prep=J(out/"prep/R2-PREP-EVIDENCE.json")
          confirm=J(out/"confirmation/LANE-RESULT.json")
          checks={
          "prepare_job_success":prep_result=="success",
          "confirmation_job_success":confirm_result=="success",
          "prep_pass":prep.get("status")=="PASS",
          "developer_helixfs_reused_pass":prep.get("reused_lanes",{}).get("developer-helixfs",{}).get("status")=="PASS",
          "sdk_packaging_reused_pass":prep.get("reused_lanes",{}).get("sdk-packaging",{}).get("status")=="PASS",
          "r1_runtime_groups_pass":prep.get("r1_kernel_runtime",{}).get("runtime_marker_groups_pass") is True,
          "r1_failure_exactly_flush_813":prep.get("r1_kernel_runtime",{}).get("storage_write_failure_code")==813,
          "storage_confirmation_pass":confirm.get("status")=="PASS" and confirm.get("exit_code")==0,
          }
          # Confirm actual storage write evidence markers in the rerun serial.
          serialp=out/"confirmation/serial.log"
          serial=serialp.read_text(errors="replace") if serialp.is_file() else ""
          for marker in ["FRAMES_NVME_WRITE_TARGET_FOUND","FRAMES_NVME_WRITE_OK","FRAMES_NVME_FLUSH_OK","FRAMES_STORAGE_WRITE_GUARDS_OK","FRAMES_STORAGE_WRITE_INTEGRITY_OK","FRAMES_KERNEL_READY"]:
              checks["confirm_marker_"+marker]=marker in serial
          checks["confirm_no_storage_fail"]="FRAMES_STORAGE_WRITE_INTEGRITY_FAIL" not in serial
          status="PASS" if all(checks.values()) else "FAIL"
          final={
          "status":status,
          "profile":"frames-0.9.48-helixfs-readonly-phase1-v58-r2",
          "workflow_revision":"v58-incremental-r2",
          "frames_version":"0.9.48",
          "candidate_source_sha256":"142150f649035413ab829a44169522c180d7a8471d89a3dbaad3c37bc49f3a7a",
          "certified_baseline":{"frames_version":"0.9.47","source_sha256":"77d0e2be5100af124e89c66c04e7fcad71d26c41036d2135fdc13c1dc67d0c19","evidence_sha256":"41b0678f550d30eea2e4c5b3419d200d68ec18f1f512b94eed3ad2af020e4bbf"},
          "reused_external_lanes":prep.get("reused_lanes",{}),
          "r1_kernel_runtime_evidence":prep.get("r1_kernel_runtime",{}),
          "executed_r2_storage_confirmation":confirm,
          "checks":checks,
          "physical_boot_approved":False,
          "physical_media_writes_unlocked":False,
          "frames_1_0_promoted":False
          }
          (out/"FINAL-CERTIFICATION.json").write_text(json.dumps(final,indent=2)+"\n")
          print(json.dumps(final,indent=2))
          raise SystemExit(0 if status=="PASS" else 1)

          PY
      - name: Seal evidence manifest
        if: always()
        shell: bash
        run: |
          python3 - runtime-evidence <<'PY'
          from pathlib import Path
          import hashlib,sys,json
          r=Path(sys.argv[1])
          def H(p):
              h=hashlib.sha256()
              with open(p,'rb') as f:
                  for c in iter(lambda:f.read(1<<20),b''):h.update(c)
              return h.hexdigest()
          files=[p for p in sorted(r.rglob('*')) if p.is_file() and p.name!='EVIDENCE-FILES-SHA256.txt']
          r.joinpath('EVIDENCE-FILES-SHA256.txt').write_text(''.join(f"{H(p)}  {p.relative_to(r).as_posix()}\n" for p in files))
          mism=[]
          for line in r.joinpath('EVIDENCE-FILES-SHA256.txt').read_text().splitlines():
              h,n=line.split('  ',1)
              if H(r/n)!=h:mism.append(n)
          r.joinpath('EVIDENCE-MANIFEST-VERIFY.json').write_text(json.dumps({'status':'PASS' if not mism else 'FAIL','mismatches':mism},indent=2)+'\n')
          files=[p for p in sorted(r.rglob('*')) if p.is_file() and p.name!='EVIDENCE-FILES-SHA256.txt']
          r.joinpath('EVIDENCE-FILES-SHA256.txt').write_text(''.join(f"{H(p)}  {p.relative_to(r).as_posix()}\n" for p in files))
          PY
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frames-0.9.48-helixfs-readonly-phase1-evidence-v58
          path: runtime-evidence
          if-no-files-found: error
      - name: Final verdict
        if: always()
        shell: bash
        run: |
          [[ "${{ steps.prep.outcome }}" == success && "${{ steps.confirm.outcome }}" == success && "${{ steps.aggregate.outcome }}" == success ]]
          python3 - <<'PY'
          import json
          f=json.load(open('runtime-evidence/FINAL-CERTIFICATION.json'))
          m=json.load(open('runtime-evidence/EVIDENCE-MANIFEST-VERIFY.json'))
          assert f['status']=='PASS' and f['workflow_revision']=='v58-incremental-r2'
          assert m['status']=='PASS'
          print('FRAMES 0.9.48 v58 r2 FINAL CERTIFICATION PASS')
          PY
