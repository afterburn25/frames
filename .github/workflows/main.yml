              "$FRAMES_DIR/build/REBOOT-MEDIA-VERIFY.json" \
              "$FRAMES_DIR/build/SHUTDOWN-MEDIA-VERIFY.json" \
              "$FRAMES_DIR/build/LIFECYCLE-EVIDENCE.json" \
              "$FRAMES_DIR/build/LIFECYCLE-REBOOT-TARGET.json" \
              "$FRAMES_DIR/build/LIFECYCLE-SHUTDOWN-TARGET.json"; do
              [[ -f "$f" ]] && cp "$f" "$EVIDENCE/"
            done
          fi

          if [[ -n "${FRAMES_DIR:-}" && -d "$FRAMES_DIR/build" ]]; then
