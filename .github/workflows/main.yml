name: Frames 0.9.41 Native USB Mass-Storage Auto-Repair Certification v43

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  qemu-ovmf-certification:
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    env:
      EXPECTED_FRAMES_VERSION: '0.9.41'
      EXPECTED_V42_SOURCE_SHA256: '054c8477a79720c731025bde2407e4d073a12408a458809c135fbc16b518d50c'
      EXPECTED_WORKFLOW_REVISION: 'v43'
      REPAIR_DIR: '${{ github.workspace }}/v43-repair'
      EVIDENCE_DIR: '${{ github.workspace }}/runtime-evidence'
      REPAIRED_SOURCE_DIR: '${{ github.workspace }}/repaired-source'

    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU, OVMF, and build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf clang lld python3 unzip zip
          command -v qemu-system-x86_64
          command -v clang
          command -v lld-link
          command -v python3
          command -v unzip
          mkdir -p "$EVIDENCE_DIR" "$REPAIRED_SOURCE_DIR"

          # The workflow works either from an extracted v43 overlay or from the
          # v43 kit ZIP sitting beside this workflow in the repository.
          repair_dir="$GITHUB_WORKSPACE/v43-repair"
          if [[ ! -f "$repair_dir/tools/apply_usb_msc_v43_repair.py" ]]; then
            kit="$(find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -name 'Frames-0.9.41-Native-USB-MSC-Auto-Repair-Kit-v43*.zip' -print 2>/dev/null | sort | head -n1 || true)"
            [[ -n "$kit" ]] || { echo "FAIL: v43 repair tools are neither extracted nor present in a v43 kit ZIP"; exit 1; }
            rm -rf "$RUNNER_TEMP/frames-v43-overlay"
            mkdir -p "$RUNNER_TEMP/frames-v43-overlay"
            unzip -q "$kit" -d "$RUNNER_TEMP/frames-v43-overlay"
            repair_dir="$(find "$RUNNER_TEMP/frames-v43-overlay" -maxdepth 4 -type d -name v43-repair -print | head -n1 || true)"
          fi
          [[ -f "$repair_dir/tools/apply_usb_msc_v43_repair.py" ]] || { echo "FAIL: v43 repair tool missing"; exit 1; }
          echo "REPAIR_DIR=$repair_dir" >> "$GITHUB_ENV"
          python3 -m py_compile "$repair_dir"/tools/*.py

      - name: Locate exact v42 Frames 0.9.41 source and bundled Nexus
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="$EVIDENCE_DIR"
          source_zip=""
          frames_dir=""
          candidate_log="$EVIDENCE/SOURCE-CANDIDATES.txt"
          : > "$candidate_log"

          select_exact() {
            local candidate="$1"
            local sha
            sha="$(sha256sum "$candidate" | awk '{print $1}')"
            printf '%s  %s\n' "$sha" "$candidate" >> "$candidate_log"
            if [[ "$sha" == "$EXPECTED_V42_SOURCE_SHA256" ]]; then
              source_zip="$candidate"
              return 0
            fi
            return 1
          }

          while IFS= read -r candidate; do
            [[ -n "$candidate" ]] || continue
            if select_exact "$candidate"; then break; fi
          done < <(find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -name "Frames-${EXPECTED_FRAMES_VERSION}-Source*.zip" -print 2>/dev/null | sort)

          if [[ -z "$source_zip" ]]; then
            while IFS= read -r kit; do
              [[ -n "$kit" ]] || continue
              rm -rf "$RUNNER_TEMP/frames-v42-kit"
              mkdir -p "$RUNNER_TEMP/frames-v42-kit"
              unzip -q "$kit" -d "$RUNNER_TEMP/frames-v42-kit" || continue
              while IFS= read -r candidate; do
                [[ -n "$candidate" ]] || continue
                if select_exact "$candidate"; then break 2; fi
              done < <(find "$RUNNER_TEMP/frames-v42-kit" -maxdepth 7 -type f -name "Frames-${EXPECTED_FRAMES_VERSION}-Source*.zip" -print 2>/dev/null | sort)
            done < <(find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -name "Frames-${EXPECTED_FRAMES_VERSION}-Runtime-Certification-Kit*.zip" -print 2>/dev/null | sort)
          fi

          if [[ -z "$source_zip" ]]; then
            {
              echo "FAIL: exact Frames ${EXPECTED_FRAMES_VERSION} v42 source was not found."
              echo "Expected SHA-256: $EXPECTED_V42_SOURCE_SHA256"
              echo "Candidates inspected:"
              cat "$candidate_log"
            } | tee "$EVIDENCE/SOURCE-INTEGRITY-FAILURE.txt"
            exit 1
          fi

          rm -rf "$RUNNER_TEMP/frames-v43-source"
          mkdir -p "$RUNNER_TEMP/frames-v43-source"
          unzip -q "$source_zip" -d "$RUNNER_TEMP/frames-v43-source"
          while IFS= read -r vf; do
            candidate="${vf%/VERSION}"
            [[ -f "$candidate/tools/qemu_certify.sh" ]] || continue
            [[ "$(tr -d '\r\n' < "$vf")" == "$EXPECTED_FRAMES_VERSION" ]] || continue
            frames_dir="$candidate"
            break
          done < <(find "$RUNNER_TEMP/frames-v43-source" -maxdepth 7 -type f -name VERSION -print | sort)
          [[ -n "$frames_dir" ]] || { echo "FAIL: exact source ZIP lacks a valid 0.9.41 source tree" | tee "$EVIDENCE/SOURCE-DISCOVERY-FAILURE.txt"; exit 1; }

          nexus="$(find "$frames_dir/toolchain" -maxdepth 4 -type f -name nexus -path '*/Nexus-Language-*/nexus' -print | sort -V | tail -n1 || true)"
          [[ -n "$nexus" ]] || { echo "FAIL: bundled Nexus compiler not found" | tee "$EVIDENCE/NEXUS-DISCOVERY-FAILURE.txt"; exit 1; }
          chmod +x "$nexus"

          echo "FRAMES_DIR=$frames_dir" >> "$GITHUB_ENV"
          echo "FRAMES_SOURCE_V42=$source_zip" >> "$GITHUB_ENV"
          echo "NEXUS_EXE=$nexus" >> "$GITHUB_ENV"
          echo "Selected exact v42 source: $source_zip"
          echo "v42 source SHA-256: $(sha256sum "$source_zip" | awk '{print $1}')"

      - name: Apply fail-closed v43 USB MSC control-transfer repair
        shell: bash
        run: |
          set -euo pipefail
          python3 "$REPAIR_DIR/tools/apply_usb_msc_v43_repair.py" \
            --source "$FRAMES_DIR" \
            --report "$EVIDENCE_DIR/V43-USB-MSC-REPAIR.json" \
            --diff "$EVIDENCE_DIR/V43-USB-MSC-REPAIR.diff"
          python3 "$REPAIR_DIR/tools/verify_usb_msc_v43_repair.py" \
            --source "$FRAMES_DIR" \
            --repair-report "$EVIDENCE_DIR/V43-USB-MSC-REPAIR.json" \
            --output "$EVIDENCE_DIR/V43-USB-MSC-REPAIR-VERIFY.json"

          python3 - "$FRAMES_DIR" "$REPAIRED_SOURCE_DIR/Frames-0.9.41-Source-v43-repaired.zip" <<'PY'
          import os, pathlib, stat, sys, zipfile
          root=pathlib.Path(sys.argv[1]).resolve(); out=pathlib.Path(sys.argv[2])
          out.parent.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(root.rglob('*')):
                  rel=p.relative_to(root)
                  if not p.is_file() or any(x in rel.parts for x in ('build','.git')): continue
                  zi=zipfile.ZipInfo(str(pathlib.Path('Frames-0.9.41')/rel).replace(os.sep,'/'), date_time=(2026,8,12,0,0,0))
                  mode=p.stat().st_mode
                  zi.external_attr=((stat.S_IFREG | (mode & 0o777)) << 16)
                  zi.compress_type=zipfile.ZIP_DEFLATED
                  z.writestr(zi,p.read_bytes())
          PY
          sha256sum "$REPAIRED_SOURCE_DIR/Frames-0.9.41-Source-v43-repaired.zip" | tee "$EVIDENCE_DIR/V43-REPAIRED-SOURCE-SHA256.txt"

      - name: Locate matching OVMF CODE and VARS pair
        shell: bash
        run: |
          set -euo pipefail
          code=""; vars=""
          for dir in /usr/share/OVMF /usr/share/edk2/ovmf /usr/share/edk2/x64; do
            if [[ -f "$dir/OVMF_CODE_4M.fd" && -f "$dir/OVMF_VARS_4M.fd" ]]; then code="$dir/OVMF_CODE_4M.fd"; vars="$dir/OVMF_VARS_4M.fd"; break; fi
          done
          if [[ -z "$code" ]]; then
            for dir in /usr/share/OVMF /usr/share/edk2/ovmf /usr/share/edk2/x64; do
              if [[ -f "$dir/OVMF_CODE.fd" && -f "$dir/OVMF_VARS.fd" ]]; then code="$dir/OVMF_CODE.fd"; vars="$dir/OVMF_VARS.fd"; break; fi
            done
          fi
          [[ -n "$code" && -n "$vars" ]] || { echo "FAIL: matching OVMF CODE/VARS pair not found" | tee "$EVIDENCE_DIR/OVMF-DISCOVERY-FAILURE.txt"; exit 1; }
          echo "OVMF_CODE=$code" >> "$GITHUB_ENV"
          echo "OVMF_VARS=$vars" >> "$GITHUB_ENV"

      - name: Preflight repaired exact source
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRAMES_DIR"
          export NEXUS="$NEXUS_EXE"
          chmod +x tools/*.sh tools/*.py "$NEXUS_EXE"
          {
            echo "Frames 0.9.41 v43 repaired-source preflight"
            echo "Nexus: $($NEXUS_EXE --version)"
            echo "QEMU: $(qemu-system-x86_64 --version | head -n1)"
            echo "Clang: $(clang --version | head -n1)"
            bash -n tools/*.sh
            python3 -m compileall -q tools
            ./tools/build.sh
            python3 tools/make_esp.py
            python3 tools/make_write_test_nvme.py
            cp build/Frames-${EXPECTED_FRAMES_VERSION}-Write-Test.img build/Frames-${EXPECTED_FRAMES_VERSION}-Write-Test.before.img
            python3 tools/verify_write_test_image.py --before build/Frames-${EXPECTED_FRAMES_VERSION}-Write-Test.before.img --after build/Frames-${EXPECTED_FRAMES_VERSION}-Write-Test.img --require-pass
            python3 tools/verify_release.py
            python3 tools/verify_runtime_repair_0941.py
            python3 tools/make_usb_boot_image.py
            python3 tools/make_physical_preview_image.py
            python3 tools/verify_physical_preview_image.py
            python3 tools/make_physical_sata_guard.py
            python3 tools/physical_preview_synthetic.py --require-pass
            python3 tools/make_internal_usb_guard.py
            python3 tools/make_lifecycle_test_nvme.py --mode both
            python3 tools/make_filesystem_test_nvme.py --all
            python3 tools/make_system_volume_clone.py
            python3 tools/make_fat_lifecycle_clone.py
            python3 tools/fat_lifecycle_synthetic.py
            python3 tools/runtime_preflight.py --require-ready
          } 2>&1 | tee "$EVIDENCE_DIR/PREFLIGHT-CONSOLE.log"

      - name: Execute inherited certification gates and v43 USB MSC lanes
        shell: bash
        run: |
          set -uo pipefail
          cd "$FRAMES_DIR"
          export NEXUS="$NEXUS_EXE"
          chmod +x tools/*.sh tools/*.py "$NEXUS_EXE"
          E="$EVIDENCE_DIR"
          overall=0

          run_gate() {
            local label="$1"; shift
            echo "================ $label ================"
            set +e
            "$@" 2>&1 | tee "$E/${label}-CONSOLE.log"
            local rc=${PIPESTATUS[0]}
            set -e
            echo "$rc" > "$E/${label}-EXIT-CODE.txt"
            [[ "$rc" -eq 0 ]] || overall=1
          }

          export FRAMES_BOOT_TIMEOUT=240
          run_gate QEMU-CERTIFY ./tools/qemu_certify.sh
          if [[ -f build/serial.log ]]; then
            run_gate STRESS-CERT python3 tools/stress_evidence.py --serial build/serial.log --require-power-pass
            run_gate STORAGE-RUNTIME-CERT python3 tools/runtime_storage_cert.py --serial build/serial.log --require-pass
            run_gate STORAGE-WRITE-CERT python3 tools/storage_write_evidence.py --serial build/serial.log --media build/WRITE-MEDIA-INTEGRITY.json --require-pass
          else
            echo 99 > "$E/STRESS-CERT-EXIT-CODE.txt"; overall=1
          fi

          export FRAMES_LIFECYCLE_TIMEOUT=300
          run_gate LIFECYCLE-CERT ./tools/qemu_lifecycle_certify.sh
          export FRAMES_FILESYSTEM_TIMEOUT=300
          run_gate FILESYSTEM-CERT ./tools/qemu_filesystem_certify.sh
          export FRAMES_SYSTEM_VOLUME_TIMEOUT=360
          run_gate SYSTEM-VOLUME-CERT ./tools/qemu_system_volume_certify.sh
          export FRAMES_FAT_LIFECYCLE_TIMEOUT=420
          run_gate FAT-LIFECYCLE-CERT ./tools/qemu_fat_lifecycle_certify.sh

          smp_rc=0
          for cpus in 2 4 8 16 32 64 96; do
            set +e
            ./tools/qemu_smp_scale_certify.sh "$cpus" 2>&1 | tee "$E/SMP-${cpus}-CERT-CONSOLE.log"
            rc=${PIPESTATUS[0]}; set -e
            echo "$rc" > "$E/SMP-${cpus}-CERT-EXIT-CODE.txt"
            [[ "$rc" -eq 0 ]] || smp_rc=1
          done
          if [[ "$smp_rc" -eq 0 ]]; then
            run_gate SMP-SCALE-MATRIX python3 tools/smp_scale_matrix_evidence.py --require-pass
          else
            overall=1
          fi

          run_gate USB-BOOT-CERT ./tools/qemu_usb_boot_matrix_certify.sh
          run_gate PHYSICAL-PREVIEW-CERT ./tools/qemu_physical_preview_matrix_certify.sh
          run_gate HWCOMPAT-CERT ./tools/qemu_hardware_compat_matrix_certify.sh

          # The repaired lane. Do not relax timeouts, marker counts, media identity,
          # hot-unplug proof, or the deliberate absence of SCSI WRITE(10).
          run_gate USB-MSC-CERT ./tools/qemu_usb_msc_matrix_certify.sh

          normal="build/usb-msc-normal-serial.log"
          detach="build/usb-msc-detach-serial.log"
          if [[ -f "$normal" && -f "$detach" ]]; then
            run_gate USB-MSC-V43-EVIDENCE python3 "$REPAIR_DIR/tools/usb_msc_v43_evidence.py" \
              --normal "$normal" --detach "$detach" \
              --output "$E/V43-USB-MSC-EVIDENCE.json" --require-pass
          else
            echo "USB MSC serial logs missing" | tee "$E/V43-USB-MSC-EVIDENCE-MISSING.txt"
            overall=1
          fi

          find build -maxdepth 1 -type f \( -name '*.log' -o -name '*.json' -o -name '*.txt' \) -exec cp -f {} "$E/" \; 2>/dev/null || true
          {
            echo "workflow_revision=v43"
            echo "source_v42_sha256=$EXPECTED_V42_SOURCE_SHA256"
            echo "qemu=$(qemu-system-x86_64 --version | head -n1)"
            echo "nexus=$($NEXUS_EXE --version)"
            echo "aggregate_exit=$overall"
          } > "$E/V43-RUN-IDENTITY.txt"
          echo "$overall" > "$E/V43-AGGREGATE-EXIT-CODE.txt"
          # Keep the step successful so evidence upload always occurs. Final gate below fails the job.
          exit 0

      - name: Package v43 evidence metadata
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$EVIDENCE_DIR"
          cp -f "$REPAIR_DIR"/README-v43.md "$EVIDENCE_DIR/" 2>/dev/null || true
          cp -f "$REPAIR_DIR"/REPAIR-ANALYSIS-v42-to-v43.md "$EVIDENCE_DIR/" 2>/dev/null || true
          cp -f "$REPAIR_DIR"/tools/*.py "$EVIDENCE_DIR/" 2>/dev/null || true
          sha256sum "$EVIDENCE_DIR"/* 2>/dev/null | sort > "$EVIDENCE_DIR/EVIDENCE-FILES-SHA256.txt" || true

      - name: Upload repaired source and v43 runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frames-0.9.41-native-usb-storage-evidence-v43
          if-no-files-found: error
          retention-days: 30
          path: |
            runtime-evidence/
            repaired-source/

      - name: Enforce v43 aggregate result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          f="$EVIDENCE_DIR/V43-AGGREGATE-EXIT-CODE.txt"
          [[ -f "$f" ]] || { echo "FAIL: v43 aggregate result was not produced"; exit 1; }
          rc="$(tr -d '\r\n ' < "$f")"
          if [[ "$rc" != "0" ]]; then
            echo "FAIL: one or more v43 certification lanes failed. Evidence was uploaded."
            exit 1
          fi
          echo "PASS: Frames 0.9.41 v43 aggregate certification gates all passed."
