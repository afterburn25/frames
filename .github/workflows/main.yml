name: Frames 0.9.46 FAPP Native Application Loader Parallel Incremental Certification v56 r4
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - Frames-0.9.46-Runtime-Certification-Kit-v56-Parallel-r4.zip
    - '**/Frames-0.9.46-Runtime-Certification-Kit-v56-Parallel-r4.zip'
permissions:
  contents: read
concurrency:
  group: frames-0.9.46-v56-parallel-r4-${{ github.ref }}
  cancel-in-progress: false
env:
  EXPECTED_FRAMES_VERSION: 0.9.46
  EXPECTED_SOURCE_SHA256: ed823f9d449e53913a018d754cfc90f5369ff2a729afe7c3eda73d404cf430a7
  CERTIFIED_BASELINE_VERSION: 0.9.45
  CERTIFIED_BASELINE_SOURCE_SHA256: f79e43eac7d2047bde1fb20cb7ade9f1ce09bbabffa9acc95d62acf9ca574199
  CERTIFIED_BASELINE_EVIDENCE_SHA256: 054590dd2a76a216f8b0639b8cb419c2ca3bf06d45ae64cda965adf8209065a5
  EXPECTED_WORKFLOW_REVISION: v56-parallel-r4
  EXPECTED_TRIGGER_KIT: Frames-0.9.46-Runtime-Certification-Kit-v56-Parallel-r4.zip
jobs:
  prepare:
    name: Build once + seal certification inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - name: Initialize preparation evidence
      shell: bash
      run: 'mkdir -p "$GITHUB_WORKSPACE/prep-evidence" "$GITHUB_WORKSPACE/sealed-inputs" "$GITHUB_WORKSPACE/prepared-source"

        printf ''workflow_revision=%s\nutc=%s\n'' "$EXPECTED_WORKFLOW_REVISION" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$GITHUB_WORKSPACE/prep-evidence/PREP-RUN-IDENTITY.txt"'
    - name: Checkout repository
      id: checkout
      uses: actions/checkout@v5
      continue-on-error: true
    - name: Install build tools
      id: install
      shell: bash
      continue-on-error: true
      run: 'set -uo pipefail

        { sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf clang lld python3 unzip; } 2>&1 | tee "$GITHUB_WORKSPACE/prep-evidence/INSTALL-CONSOLE.log"'
    - name: Locate exact runtime kit and sealed sources
      id: locate
      shell: bash
      continue-on-error: true
      run: 'set -euo pipefail

        EVIDENCE="$GITHUB_WORKSPACE/prep-evidence"

        INPUTS="$GITHUB_WORKSPACE/sealed-inputs"

        PREPARED="$GITHUB_WORKSPACE/prepared-source"

        mkdir -p "$EVIDENCE" "$INPUTS" "$PREPARED"

        kit_zip="$(find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -name "$EXPECTED_TRIGGER_KIT" -print | sort | head -n1 || true)"

        [[ -n "$kit_zip" ]] || { echo "FAIL: required runtime kit missing: $EXPECTED_TRIGGER_KIT" | tee "$EVIDENCE/KIT-MISSING.txt"; exit 1; }

        rm -rf "$RUNNER_TEMP/v56-r4-kit"; mkdir -p "$RUNNER_TEMP/v56-r4-kit"

        unzip -q "$kit_zip" -d "$RUNNER_TEMP/v56-r4-kit"

        candidate="$(find "$RUNNER_TEMP/v56-r4-kit" -type f -name ''Frames-0.9.46-Source-v56.zip'' -print | sort | head -n1 || true)"

        baseline="$(find "$RUNNER_TEMP/v56-r4-kit" -type f -name ''Frames-0.9.45-Source-v55.zip'' -print | sort | head -n1 || true)"

        [[ -n "$candidate" && -n "$baseline" ]] || { echo ''FAIL: candidate/baseline source missing from kit'' | tee "$EVIDENCE/SOURCE-DISCOVERY-FAILURE.txt"; exit 1; }

        candidate_sha="$(sha256sum "$candidate" | awk ''{print $1}'')"; baseline_sha="$(sha256sum "$baseline" | awk ''{print $1}'')"

        [[ "$candidate_sha" == "$EXPECTED_SOURCE_SHA256" ]] || { echo "FAIL candidate SHA $candidate_sha" | tee "$EVIDENCE/SOURCE-HASH-FAILURE.txt"; exit 1; }

        [[ "$baseline_sha" == "$CERTIFIED_BASELINE_SOURCE_SHA256" ]] || { echo "FAIL baseline SHA $baseline_sha" | tee "$EVIDENCE/BASELINE-HASH-FAILURE.txt"; exit 1; }

        cp "$candidate" "$INPUTS/Frames-0.9.46-Source-v56.zip"; cp "$baseline" "$INPUTS/Frames-0.9.45-Source-v55.zip"

        printf ''%s  Frames-0.9.46-Source-v56.zip\n%s  Frames-0.9.45-Source-v55.zip\n'' "$candidate_sha" "$baseline_sha" > "$EVIDENCE/SOURCE-IDENTITY-SHA256.txt"

        unzip -q "$INPUTS/Frames-0.9.46-Source-v56.zip" -d "$PREPARED"

        frames_dir="$(find "$PREPARED" -maxdepth 4 -type f -name VERSION -print | while read -r v; do d="${v%/VERSION}"; [[ "$(tr -d ''\r\n'' < "$v")" == "$EXPECTED_FRAMES_VERSION" && -f "$d/tools/qemu_certify.sh" ]] && { echo "$d"; break; }; done)"

        [[ -n "$frames_dir" ]] || { echo ''FAIL: Frames source tree not found after extraction'' | tee "$EVIDENCE/SOURCE-TREE-FAILURE.txt"; exit 1; }

        nexus="$(find "$frames_dir/toolchain" -maxdepth 3 -type f -name nexus -path ''*/Nexus-Language-*/nexus'' -print | sort -V | tail -n1 || true)"; [[ -n "$nexus" ]] || exit 1

        chmod +x "$nexus"

        echo "FRAMES_DIR=$frames_dir" >> "$GITHUB_ENV"; echo "FRAMES_VERSION=$EXPECTED_FRAMES_VERSION" >> "$GITHUB_ENV"; echo "NEXUS_EXE=$nexus" >> "$GITHUB_ENV"

        printf ''workflow_revision=%s\ntrigger_kit=%s\n'' "$EXPECTED_WORKFLOW_REVISION" "$EXPECTED_TRIGGER_KIT" > "$EVIDENCE/WORKFLOW-IDENTITY.txt"'
    - name: Compute exact v55 to v56 change impact
      id: impact
      shell: bash
      continue-on-error: true
      run: "set -euo pipefail\nEVIDENCE=\"$GITHUB_WORKSPACE/prep-evidence\"\nmkdir -p \"$EVIDENCE\"\nrm -rf \"$RUNNER_TEMP/base-src\" \"$RUNNER_TEMP/cand-src\"\nmkdir -p \"$RUNNER_TEMP/base-src\" \"$RUNNER_TEMP/cand-src\"\nunzip -q \"$GITHUB_WORKSPACE/sealed-inputs/Frames-0.9.45-Source-v55.zip\" -d \"$RUNNER_TEMP/base-src\"\nunzip -q \"$GITHUB_WORKSPACE/sealed-inputs/Frames-0.9.46-Source-v56.zip\" -d \"$RUNNER_TEMP/cand-src\"\npython3 - \"$RUNNER_TEMP/base-src\" \"$RUNNER_TEMP/cand-src\" \"$EVIDENCE\" <<'PYIMPACT'\nimport sys, pathlib, hashlib, difflib, re, json\nbase_dir=pathlib.Path(sys.argv[1]); cand_dir=pathlib.Path(sys.argv[2]); ev=pathlib.Path(sys.argv[3])\nbase=next(p for p in base_dir.iterdir() if p.is_dir()); cand=next(p for p in cand_dir.iterdir() if p.is_dir())\ndef H(p): return hashlib.sha256(p.read_bytes()).hexdigest()\ndef files(root): return {p.relative_to(root).as_posix():H(p) for p in root.rglob('*') if p.is_file() and 'build' not in p.relative_to(root).parts and '__pycache__'\
        \ not in p.parts and p.suffix!='.pyc'}\na,b=files(base),files(cand); changed=sorted(r for r in set(a)|set(b) if a.get(r)!=b.get(r)); (ev/'CHANGED-FILES.txt').write_text('\\n'.join(changed)+'\\n')\nexpected=set('''README.md\nVERSION\nboot/uefi/frames_boot.c\ndocs/HARDWARE-MATRIX.json\ndocs/PHYSICAL-BOOT-GATE.md\ndocs/RELEASE-NOTES-0.9.46.md\nkernel/main.nx\nmedia/EFI/BOOT/BOOTX64.EFI\nmedia/Frames/FramesKernel.fkrn\nsdk/SDK-MANIFEST.json\nsdk/fapp_tool.py\nsdk/frames-sdk.sh\ntools/app_loader_evidence.py\ntools/developer_preview_evidence.py\ntools/qemu_developer_preview_certify.sh\ntools/qmp_developer_preview_input.py\ntools/verify_runtime_repair_0946.py'''.splitlines())\nif set(changed)!=expected:\n print('FAIL: changed-file set differs from sealed impact contract'); print('\\n'.join(changed)); raise SystemExit(1)\nlines0=(base/'kernel/main.nx').read_text().splitlines(); lines1=(cand/'kernel/main.nx').read_text().splitlines()\ndef fn_at(lines,idx):\n for j in range(idx,-1,-1):\n \
        \ m=re.match(r'\\s*fn\\s+([A-Za-z0-9_]+)\\s*\\(',lines[j])\n  if m:return m.group(1)\n return '<top>'\nsm=difflib.SequenceMatcher(a=lines0,b=lines1); funcs=set()\nfor tag,i1,i2,j1,j2 in sm.get_opcodes():\n if tag!='equal': funcs.update(fn_at(lines1,j) for j in range(j1,j2)); funcs.update(fn_at(lines0,i) for i in range(i1,i2))\nallow={'setup_user_fex','setup_user_fex_from_mod','dev_text_app','dev_text_title','dev_text_version','developer_preview_execute','developer_preview_launch_fapp','developer_preview_result_text','developer_preview_run','kernel_main','serial_hwcompat_diag','serial_marker_devprev_cmd_app_ok','serial_marker_devprev_fapp_abi_ok','serial_marker_devprev_fapp_exit_ok','serial_marker_devprev_fapp_hash_ok','serial_marker_devprev_fapp_launch_begin','serial_marker_devprev_fapp_manifest_ok'}\nif not funcs<=allow:\n print('FAIL: unexpected kernel functions changed:',sorted(funcs-allow)); raise SystemExit(1)\n(ev/'CHANGED-KERNEL-FUNCTIONS.txt').write_text('\\n'.join(sorted(funcs))+'\\\
        n')\nexecuted=['source_identity','change_impact','build_release','kernel_boot_smoke','physical_preview','hardware_compat','sdk_tooling','app_packaging','developer_preview','app_loader','safety_locks']\ninherited={'smp_scale':'No SMP/scheduler/AP/interrupt functions or SMP harness files changed.','storage_runtime':'No NVMe/block/storage/DMA source or storage harness files changed.','storage_write':'No storage write-path source or write certification harness files changed.','filesystem':'No filesystem/FAT allocation/crash-recovery source or harness files changed.','fat_lifecycle':'No FAT lifecycle source or harness files changed.','system_volume':'No system-volume write source or harness files changed.','lifecycle':'No reboot/shutdown/power lifecycle source or harness files changed.','usb_boot':'No USB boot/xHCI/HID source or USB boot harness files changed.','usb_msc':'No xHCI/BOT/SCSI/USB-MSC source or harness files changed.','stress':'No stress/fault subsystem source or stress harness\
        \ files changed.'}\nimpact={'status':'PASS','profile':'frames-incremental-certification-v1','parallel_execution':True,'certified_baseline':{'frames_version':'0.9.45','source_sha256':'f79e43eac7d2047bde1fb20cb7ade9f1ce09bbabffa9acc95d62acf9ca574199','evidence_sha256':'054590dd2a76a216f8b0639b8cb419c2ca3bf06d45ae64cda965adf8209065a5'},'candidate':{'frames_version':'0.9.46','source_sha256':'ed823f9d449e53913a018d754cfc90f5369ff2a729afe7c3eda73d404cf430a7'},'changed_files':changed,'changed_kernel_functions':sorted(funcs),'executed_groups':executed,'inherited_groups':inherited}\n(ev/'CHANGE-IMPACT-EVIDENCE.json').write_text(json.dumps(impact,indent=2)+'\\n')\n(ev/'EXECUTED-CERTIFICATION-GROUPS.json').write_text(json.dumps({'status':'READY','groups':executed},indent=2)+'\\n')\n(ev/'INHERITED-CERTIFICATION-GROUPS.json').write_text(json.dumps({'status':'READY','baseline_evidence_sha256':impact['certified_baseline']['evidence_sha256'],'groups':inherited},indent=2)+'\\n')\n(ev/'CERTIFIED-BASELINE.json').write_text(json.dumps(impact['certified_baseline'],indent=2)+'\\\
        n')\nprint('Incremental impact analysis: PASS',len(changed),len(funcs))\nPYIMPACT"
    - name: Build once and preflight exact source
      id: build
      shell: bash
      continue-on-error: true
      run: "set -euo pipefail\ncd \"$FRAMES_DIR\"\nmkdir -p build \"$GITHUB_WORKSPACE/prep-evidence\"\nexport NEXUS=\"$NEXUS_EXE\"\nchmod +x \"$NEXUS_EXE\" tools/*.sh tools/*.py\nCONSOLE=\"$GITHUB_WORKSPACE/prep-evidence/PREFLIGHT-CONSOLE.log\"\n{\n  echo \"Frames $FRAMES_VERSION preflight\"\n  echo \"Nexus: $($NEXUS_EXE --version)\"\n  echo \"Clang: $(clang --version | head -n1)\"\n  echo \"LLD: $(lld-link --version | head -n1)\"\n  bash -n tools/*.sh\n  python3 -m compileall -q tools\n  ./tools/build.sh\n  python3 tools/make_esp.py\n  python3 tools/make_write_test_nvme.py\n  cp build/Frames-${FRAMES_VERSION}-Write-Test.img build/Frames-${FRAMES_VERSION}-Write-Test.before.img\n  python3 tools/verify_write_test_image.py --before build/Frames-${FRAMES_VERSION}-Write-Test.before.img --after build/Frames-${FRAMES_VERSION}-Write-Test.img --require-pass\n  python3 tools/verify_release.py\n  python3 tools/sdk_selftest.py --require-pass\n  python3 tools/make_developer_preview_image.py\n  python3\
        \ tools/verify_developer_preview_image.py --image build/Frames-${FRAMES_VERSION}-Developer-Preview.img --package build/HelloFrames.fapp --require-pass\n  python3 tools/app_packaging_evidence.py --package build/HelloFrames.fapp --image build/Frames-${FRAMES_VERSION}-Developer-Preview.img --require-pass\n  python3 tools/verify_runtime_repair_0946.py\n  python3 tools/make_usb_boot_image.py\n  python3 tools/make_physical_preview_image.py\n  python3 tools/verify_physical_preview_image.py\n  python3 tools/make_physical_sata_guard.py\n  python3 tools/physical_preview_synthetic.py --require-pass\n  python3 tools/make_internal_usb_guard.py\n  python3 tools/make_lifecycle_test_nvme.py --mode both\n  python3 tools/verify_lifecycle_image.py --image build/Frames-${FRAMES_VERSION}-Lifecycle-reboot.img --mode reboot --expect-state 0 --require-pass\n  python3 tools/verify_lifecycle_image.py --image build/Frames-${FRAMES_VERSION}-Lifecycle-shutdown.img --mode shutdown --expect-state 0 --require-pass\n\
        \  python3 tools/make_filesystem_test_nvme.py --all\n  for s in 0 1 2 3 4; do\n    python3 tools/verify_filesystem_test_image.py --image \"build/Frames-${FRAMES_VERSION}-Filesystem-s${s}.img\" --scenario \"$s\" --phase initial --require-pass\n  done\n  python3 tools/make_system_volume_clone.py\n  cp build/Frames-${FRAMES_VERSION}-System-Clone.img build/Frames-${FRAMES_VERSION}-System-Clone.before.img\n  python3 tools/verify_system_volume_clone.py --before build/Frames-${FRAMES_VERSION}-System-Clone.before.img --after build/Frames-${FRAMES_VERSION}-System-Clone.img --manifest build/SYSTEM-VOLUME-TARGET.json --require-pass\n  python3 tools/make_fat_lifecycle_clone.py\n  cp build/Frames-${FRAMES_VERSION}-FAT-Lifecycle-Clone.img build/Frames-${FRAMES_VERSION}-FAT-Lifecycle-Clone.before.img\n  python3 tools/verify_fat_lifecycle_clone.py --before build/Frames-${FRAMES_VERSION}-FAT-Lifecycle-Clone.before.img --after build/Frames-${FRAMES_VERSION}-FAT-Lifecycle-Clone.img --manifest build/FAT-LIFECYCLE-TARGET.json\
        \ --require-pass\n  python3 tools/fat_lifecycle_synthetic.py\n  sha256sum build/BOOTX64.EFI build/FramesKernel.fkrn build/System.fex build/Frames-${FRAMES_VERSION}-ESP.img build/BOOTSTAT.TXT\n  python3 tools/runtime_preflight.py --require-ready\n} 2>&1 | tee \"$CONSOLE\"\n"
    - name: Seal prepared source artifact
      id: seal
      shell: bash
      continue-on-error: true
      run: 'set -euo pipefail

        EVIDENCE="$GITHUB_WORKSPACE/prep-evidence"

        cd "$FRAMES_DIR"

        find . -type f -print0 | sort -z | xargs -0 sha256sum > "$EVIDENCE/PREPARED-SOURCE-MANIFEST-SHA256.txt"

        python3 - "$EVIDENCE/PREPARED-SOURCE-MANIFEST-SHA256.txt" <<''PYSEAL''

        import pathlib,sys,json

        p=pathlib.Path(sys.argv[1]); count=sum(bool(x.strip()) for x in p.read_text().splitlines())

        (p.parent/''PREPARED-SOURCE-IDENTITY.json'').write_text(json.dumps({''status'':''PASS'',''frames_version'':''0.9.46'',''candidate_source_sha256'':''ed823f9d449e53913a018d754cfc90f5369ff2a729afe7c3eda73d404cf430a7'',''prepared_file_count'':count,''workflow_revision'':''v56-parallel-r4''},indent=2)+''\n'')

        print(''Prepared source files:'',count)

        PYSEAL'
    - name: Upload prepared source
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: frames-v56-parallel-r4-prepared-source
        path: ${{ github.workspace }}/prepared-source
        if-no-files-found: warn
        retention-days: 2
        compression-level: 1
    - name: Upload preparation evidence
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: frames-v56-parallel-r4-prep-evidence
        path: ${{ github.workspace }}/prep-evidence
        if-no-files-found: error
        retention-days: 14
    - name: Preparation verdict
      if: always()
      shell: bash
      run: 'set -euo pipefail

        cat > "$GITHUB_WORKSPACE/prep-evidence/PREP-STEP-OUTCOMES.txt" <<EOF

        checkout=${{ steps.checkout.outcome }}

        install=${{ steps.install.outcome }}

        locate=${{ steps.locate.outcome }}

        impact=${{ steps.impact.outcome }}

        build=${{ steps.build.outcome }}

        seal=${{ steps.seal.outcome }}

        EOF

        bad=0

        for v in "${{ steps.checkout.outcome }}" "${{ steps.install.outcome }}" "${{ steps.locate.outcome }}" "${{ steps.impact.outcome }}" "${{ steps.build.outcome }}" "${{ steps.seal.outcome }}"; do [[ "$v" == success ]] || bad=1; done

        exit "$bad"'
  certify:
    name: Certify ${{ matrix.lane }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        lane:
        - kernel-smoke
        - physical-preview
        - hardware-compat
        - sdk-tooling
        - app-packaging
        - developer-loader
    steps:
    - name: Initialize lane evidence
      shell: bash
      run: mkdir -p "$GITHUB_WORKSPACE/lane-evidence"; printf "lane=%s\n" "$LANE" > "$GITHUB_WORKSPACE/lane-evidence/LANE-START.txt"
      env:
        LANE: ${{ matrix.lane }}
    - name: Install lane runtime tools
      id: setup
      shell: bash
      continue-on-error: true
      run: 'set -uo pipefail

        { sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf clang lld python3 unzip; } 2>&1 | tee "$GITHUB_WORKSPACE/lane-evidence/LANE-SETUP-CONSOLE.log"'
    - name: Download prepared source
      id: download_source
      uses: actions/download-artifact@v8
      continue-on-error: true
      with:
        name: frames-v56-parallel-r4-prepared-source
        path: ${{ github.workspace }}/prepared-source
    - name: Download preparation evidence
      id: download_prep
      uses: actions/download-artifact@v8
      continue-on-error: true
      with:
        name: frames-v56-parallel-r4-prep-evidence
        path: ${{ github.workspace }}/prep-evidence
    - name: Verify prepared source identity
      id: verify
      shell: bash
      continue-on-error: true
      run: 'set -euo pipefail

        EVIDENCE="$GITHUB_WORKSPACE/lane-evidence"; mkdir -p "$EVIDENCE"

        FRAMES_DIR="$(find "$GITHUB_WORKSPACE/prepared-source" -maxdepth 4 -type f -name VERSION -print | while read -r v; do d="${v%/VERSION}"; [[ "$(tr -d ''\r\n'' < "$v")" == "$EXPECTED_FRAMES_VERSION" && -f "$d/tools/qemu_certify.sh" ]] && { echo "$d"; break; }; done)"

        [[ -n "$FRAMES_DIR" ]] || { echo ''FAIL: prepared source missing'' | tee "$EVIDENCE/PREPARED-SOURCE-MISSING.txt"; exit 1; }

        cd "$FRAMES_DIR"; sha256sum -c "$GITHUB_WORKSPACE/prep-evidence/PREPARED-SOURCE-MANIFEST-SHA256.txt" >/dev/null

        nexus="$(find "$FRAMES_DIR/toolchain" -maxdepth 3 -type f -name nexus -path ''*/Nexus-Language-*/nexus'' -print | sort -V | tail -n1 || true)"; [[ -n "$nexus" ]] || exit 1

        chmod +x "$nexus" tools/*.sh tools/*.py sdk/*.sh sdk/*.py

        echo "FRAMES_DIR=$FRAMES_DIR" >> "$GITHUB_ENV"; echo "FRAMES_VERSION=$EXPECTED_FRAMES_VERSION" >> "$GITHUB_ENV"; echo "NEXUS_EXE=$nexus" >> "$GITHUB_ENV"'
    - name: Locate matching OVMF CODE and VARS pair
      id: ovmf
      if: ${{ matrix.lane == 'kernel-smoke' || matrix.lane == 'physical-preview' || matrix.lane == 'hardware-compat' || matrix.lane == 'developer-loader' }}
      shell: bash
      continue-on-error: true
      run: "set -euo pipefail\nEVIDENCE=\"$GITHUB_WORKSPACE/lane-evidence\"\nmkdir -p \"$EVIDENCE\"\ncode=\"\"\nvars=\"\"\n\n# CODE and VARS must be a matching pair. Prefer 4M firmware on Ubuntu.\nfor dir in /usr/share/OVMF /usr/share/edk2/ovmf /usr/share/edk2/x64; do\n  if [[ -f \"$dir/OVMF_CODE_4M.fd\" && -f \"$dir/OVMF_VARS_4M.fd\" ]]; then\n    code=\"$dir/OVMF_CODE_4M.fd\"\n    vars=\"$dir/OVMF_VARS_4M.fd\"\n    break\n  fi\ndone\nif [[ -z \"$code\" ]]; then\n  for dir in /usr/share/OVMF /usr/share/edk2/ovmf /usr/share/edk2/x64; do\n    if [[ -f \"$dir/OVMF_CODE.fd\" && -f \"$dir/OVMF_VARS.fd\" ]]; then\n      code=\"$dir/OVMF_CODE.fd\"\n      vars=\"$dir/OVMF_VARS.fd\"\n      break\n    fi\n  done\nfi\n\nif [[ -z \"$code\" || -z \"$vars\" ]]; then\n  {\n    echo \"FAIL: no matching OVMF CODE/VARS pair was found.\"\n    echo \"Available firmware files:\"\n    find /usr/share/OVMF /usr/share/edk2 -maxdepth 4 -type f -name 'OVMF_*.fd' -print 2>/dev/null | sort\n  } | tee \"$EVIDENCE/OVMF-DISCOVERY-FAILURE.txt\"\
        \n  exit 1\nfi\n\n# Split OVMF CODE and VARS files are allowed to have different\n# lengths; pair them by the same firmware family/name, not by size.\ncode_size=\"$(stat -c %s \"$code\")\"\nvars_size=\"$(stat -c %s \"$vars\")\"\n\necho \"OVMF_CODE=$code\" >> \"$GITHUB_ENV\"\necho \"OVMF_VARS=$vars\" >> \"$GITHUB_ENV\"\necho \"OVMF CODE: $code ($code_size bytes)\"\necho \"OVMF VARS: $vars ($vars_size bytes)\"\n"
    - name: Run isolated certification lane
      id: runlane
      shell: bash
      continue-on-error: true
      env:
        LANE: ${{ matrix.lane }}
        FRAMES_BOOT_TIMEOUT: '240'
      run: "set -uo pipefail\nEVIDENCE=\"$GITHUB_WORKSPACE/lane-evidence\"; mkdir -p \"$EVIDENCE\"\nprintf 'lane=%s\\nworkflow_revision=%s\\n' \"$LANE\" \"$EXPECTED_WORKFLOW_REVISION\" > \"$EVIDENCE/LANE-IDENTITY.txt\"\ncase \"$LANE\" in\nkernel-smoke)\nset -uo pipefail\ncd \"$FRAMES_DIR\"\nexport NEXUS=\"$NEXUS_EXE\"\nEVIDENCE=\"$GITHUB_WORKSPACE/lane-evidence\"; mkdir -p \"$EVIDENCE\"\nset +e\n./tools/qemu_certify.sh 2>&1 | tee \"$EVIDENCE/KERNEL-BOOT-SMOKE-CONSOLE.log\"\nrc=${PIPESTATUS[0]}\nset -e\necho \"$rc\" > \"$EVIDENCE/KERNEL-BOOT-SMOKE-CERTIFY-EXIT-CODE.txt\"\n[[ -f build/serial.log ]] && cp build/serial.log \"$EVIDENCE/\"\n[[ -f build/qemu-debug.log ]] && cp build/qemu-debug.log \"$EVIDENCE/\"\nif [[ -f build/serial.log ]]; then\n  python3 - build/serial.log \"$EVIDENCE/KERNEL-BOOT-SMOKE-EVIDENCE.json\" <<'PYSMOKE'\nimport sys,json,pathlib\ns=pathlib.Path(sys.argv[1]).read_text(errors='replace'); fatal=[m for m in ['FRAMES_PAGE_FAULT','FRAMES_AP_PROTECTION_FAULT=','FRAMES_DEVPREV_CERT_FAIL','FRAMES_USB_MSC_CERT_FAIL','FRAMES_FS_WRITE_CERT_FAIL']\
        \ if m in s]; req=['FRAMES_KERNEL_READY','FRAMES_USERSPACE_READY']; missing=[m for m in req if m not in s]; status='PASS' if not fatal and not missing else 'FAIL'; pathlib.Path(sys.argv[2]).write_text(json.dumps({'status':status,'profile':'frames-kernel-boot-smoke','missing':missing,'fatal':fatal},indent=2)+'\\n'); raise SystemExit(0 if status=='PASS' else 1)\nPYSMOKE\nfi\nexit \"$rc\"\n\n;;\nphysical-preview)\nset -uo pipefail\ncd \"$FRAMES_DIR\"\nexport NEXUS=\"$NEXUS_EXE\"\nchmod +x \"$NEXUS_EXE\" tools/*.sh tools/*.py\nEVIDENCE=\"$GITHUB_WORKSPACE/lane-evidence\"\nmkdir -p \"$EVIDENCE\"\nCONSOLE=\"$EVIDENCE/PHYSICAL-PREVIEW-CERTIFICATION-CONSOLE.log\"\n\nset +e\n./tools/qemu_physical_preview_matrix_certify.sh 2>&1 | tee \"$CONSOLE\"\nphysical_rc=${PIPESTATUS[0]}\nset -e\necho \"$physical_rc\" > \"$EVIDENCE/PHYSICAL-PREVIEW-CERTIFY-EXIT-CODE.txt\"\n\nfor f in build/physical-*-serial.log build/physical-*-monitor.log build/physical-*-qemu-debug.log build/PHYSICAL-PREVIEW-*.json\
        \ build/PHYSICAL-PREVIEW-*.txt; do\n  [[ -f \"$f\" ]] && cp \"$f\" \"$EVIDENCE/\"\ndone\n\nsha256sum \\\n  build/Frames-${FRAMES_VERSION}-Physical-Hardware-Preview.img \\\n  build/Frames-${FRAMES_VERSION}-ESP.img \\\n  build/Frames-${FRAMES_VERSION}-Physical-SATA-Guard.img \\\n  build/Frames-${FRAMES_VERSION}-Write-Test.img \\\n  build/Frames-${FRAMES_VERSION}-Lifecycle-reboot.img \\\n  build/Frames-${FRAMES_VERSION}-Lifecycle-shutdown.img \\\n  build/Frames-${FRAMES_VERSION}-Filesystem-s0.img \\\n  build/Frames-${FRAMES_VERSION}-System-Clone.img \\\n  build/Frames-${FRAMES_VERSION}-FAT-Lifecycle-Clone.img \\\n  > \"$EVIDENCE/PHYSICAL-PREVIEW-DEFINING-SHA256.txt\"\nexit \"$physical_rc\"\n\n;;\nhardware-compat)\nset -uo pipefail\ncd \"$FRAMES_DIR\"\nexport NEXUS=\"$NEXUS_EXE\"\nchmod +x \"$NEXUS_EXE\" tools/*.sh tools/*.py\nEVIDENCE=\"$GITHUB_WORKSPACE/lane-evidence\"\nmkdir -p \"$EVIDENCE\"\nCONSOLE=\"$EVIDENCE/HWCOMPAT-CERTIFICATION-CONSOLE.log\"\n\nset +e\n./tools/qemu_hardware_compat_matrix_certify.sh\
        \ 2>&1 | tee \"$CONSOLE\"\ncompat_rc=${PIPESTATUS[0]}\nset -e\necho \"$compat_rc\" > \"$EVIDENCE/HWCOMPAT-CERTIFY-EXIT-CODE.txt\"\n\nfor f in build/hwcompat-*.log build/HWCOMPAT-*.json build/HWCOMPAT-*.txt; do\n  [[ -f \"$f\" ]] && cp \"$f\" \"$EVIDENCE/\"\ndone\nsha256sum             build/BOOTX64.EFI             build/FramesKernel.fkrn             build/System.fex             build/Frames-${FRAMES_VERSION}-ESP.img             build/Frames-${FRAMES_VERSION}-Physical-Hardware-Preview.img             > \"$EVIDENCE/HWCOMPAT-DEFINING-SHA256.txt\"\nexit \"$compat_rc\"\n\n;;\nsdk-tooling)\nset -uo pipefail\ncd \"$FRAMES_DIR\"\nexport NEXUS=\"$NEXUS_EXE\"\nchmod +x \"$NEXUS_EXE\" tools/*.sh tools/*.py sdk/*.sh\nEVIDENCE=\"$GITHUB_WORKSPACE/lane-evidence\"\nmkdir -p \"$EVIDENCE\"\nCONSOLE=\"$EVIDENCE/SDK-TOOLING-CERTIFICATION-CONSOLE.log\"\n\nset +e\npython3 tools/sdk_selftest.py --require-pass 2>&1 | tee \"$CONSOLE\"\nsdk_rc=${PIPESTATUS[0]}\nset -e\necho \"$sdk_rc\" > \"$EVIDENCE/SDK-TOOLING-CERTIFY-EXIT-CODE.txt\"\
        \n\n[[ -f build/SDK-TOOLING-EVIDENCE.json ]] && cp build/SDK-TOOLING-EVIDENCE.json \"$EVIDENCE/\"\n{\n  sha256sum sdk/SDK-MANIFEST.json sdk/examples/hello/main.nx sdk/fapp_tool.py\n  [[ -f build/HelloFrames-SDK.fex ]] && sha256sum build/HelloFrames-SDK.fex\n  [[ -f build/HelloFrames.fapp ]] && sha256sum build/HelloFrames.fapp\n} > \"$EVIDENCE/SDK-TOOLING-DEFINING-SHA256.txt\"\n\nexit \"$sdk_rc\"\n\n;;\napp-packaging)\nset -uo pipefail\ncd \"$FRAMES_DIR\"\nexport NEXUS=\"$NEXUS_EXE\"\nchmod +x \"$NEXUS_EXE\" tools/*.sh tools/*.py sdk/*.sh sdk/*.py\nEVIDENCE=\"$GITHUB_WORKSPACE/lane-evidence\"\nmkdir -p \"$EVIDENCE\"\nCONSOLE=\"$EVIDENCE/APP-PACKAGING-CERTIFICATION-CONSOLE.log\"\n\nset +e\npython3 tools/sdk_selftest.py --require-pass >/dev/null 2>&1\npython3 tools/make_developer_preview_image.py >/dev/null 2>&1\npython3 tools/app_packaging_evidence.py --package build/HelloFrames.fapp --image build/Frames-${FRAMES_VERSION}-Developer-Preview.img --require-pass 2>&1 | tee \"$CONSOLE\"\
        \napp_rc=${PIPESTATUS[0]}\nset -e\necho \"$app_rc\" > \"$EVIDENCE/APP-PACKAGING-CERTIFY-EXIT-CODE.txt\"\n[[ -f build/APP-PACKAGING-EVIDENCE.json ]] && cp build/APP-PACKAGING-EVIDENCE.json \"$EVIDENCE/\"\n[[ -f build/HelloFrames.fapp ]] && cp build/HelloFrames.fapp \"$EVIDENCE/\"\n{\n  sha256sum sdk/fapp_tool.py sdk/SDK-MANIFEST.json\n  [[ -f build/HelloFrames.fapp ]] && sha256sum build/HelloFrames.fapp\n  [[ -f build/Frames-${FRAMES_VERSION}-Developer-Preview.img ]] && sha256sum build/Frames-${FRAMES_VERSION}-Developer-Preview.img\n} > \"$EVIDENCE/APP-PACKAGING-DEFINING-SHA256.txt\"\nexit \"$app_rc\"\n\n;;\ndeveloper-loader)\nset -uo pipefail\ncd \"$FRAMES_DIR\"\nexport NEXUS=\"$NEXUS_EXE\"\nchmod +x \"$NEXUS_EXE\" tools/*.sh tools/*.py\nEVIDENCE=\"$GITHUB_WORKSPACE/lane-evidence\"\nmkdir -p \"$EVIDENCE\"\nCONSOLE=\"$EVIDENCE/DEVELOPER-PREVIEW-CERTIFICATION-CONSOLE.log\"\n\nset +e\n./tools/qemu_developer_preview_certify.sh 2>&1 | tee \"$CONSOLE\"\npreview_rc=${PIPESTATUS[0]}\nset\
        \ -e\necho \"$preview_rc\" > \"$EVIDENCE/DEVELOPER-PREVIEW-CERTIFY-EXIT-CODE.txt\"\n\nfor f in \\\n  build/developer-preview-*.log \\\n  build/DEVELOPER-PREVIEW-*.json \\\n  build/DEVELOPER-PREVIEW-*.txt; do\n  [[ -f \"$f\" ]] && cp \"$f\" \"$EVIDENCE/\"\ndone\n\nfor f in \\\n  build/Frames-${FRAMES_VERSION}-Developer-Preview.img \\\n  build/HelloFrames.fapp \\\n  build/BOOTX64.EFI \\\n  build/FramesKernel.fkrn \\\n  build/System.fex; do\n  [[ -f \"$f\" ]] && sha256sum \"$f\"\ndone > \"$EVIDENCE/DEVELOPER-PREVIEW-DEFINING-SHA256.txt\"\n\nexit \"$preview_rc\"\n\nset -uo pipefail\ncd \"$FRAMES_DIR\"\nEVIDENCE=\"$GITHUB_WORKSPACE/lane-evidence\"\nmkdir -p \"$EVIDENCE\"\nCONSOLE=\"$EVIDENCE/APP-LOADER-CERTIFICATION-CONSOLE.log\"\n\nset +e\npython3 tools/app_loader_evidence.py --developer-evidence build/DEVELOPER-PREVIEW-EVIDENCE.json --require-pass 2>&1 | tee build/APP-LOADER-EVIDENCE.json | tee \"$CONSOLE\"\nloader_rc=${PIPESTATUS[0]}\nset -e\necho \"$loader_rc\" > \"$EVIDENCE/APP-LOADER-CERTIFY-EXIT-CODE.txt\"\
        \n[[ -f build/APP-LOADER-EVIDENCE.json ]] && cp build/APP-LOADER-EVIDENCE.json \"$EVIDENCE/\"\n{\n  sha256sum tools/app_loader_evidence.py tools/developer_preview_evidence.py\n  [[ -f build/DEVELOPER-PREVIEW-EVIDENCE.json ]] && sha256sum build/DEVELOPER-PREVIEW-EVIDENCE.json\n  [[ -f build/HelloFrames.fapp ]] && sha256sum build/HelloFrames.fapp\n} > \"$EVIDENCE/APP-LOADER-DEFINING-SHA256.txt\"\nexit \"$loader_rc\"\n\n;;\n  *) echo \"Unknown lane: $LANE\" >&2; exit 64 ;;\nesac\n"
    - name: Upload lane evidence
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: frames-v56-parallel-r4-lane-${{ matrix.lane }}
        path: ${{ github.workspace }}/lane-evidence
        if-no-files-found: error
        retention-days: 14
    - name: Lane verdict
      if: always()
      shell: bash
      run: 'set -euo pipefail

        printf ''setup=%s

        download_source=%s

        download_prep=%s

        verify=%s

        runlane=%s

        '' "${{ steps.setup.outcome }}" "${{ steps.download_source.outcome }}" "${{ steps.download_prep.outcome }}" "${{ steps.verify.outcome }}" "${{ steps.runlane.outcome }}" >> "$GITHUB_WORKSPACE/lane-evidence/LANE-STEP-OUTCOMES.txt"

        [[ "${{ steps.setup.outcome }}" == success && "${{ steps.download_source.outcome }}" == success && "${{ steps.download_prep.outcome }}" == success && "${{ steps.verify.outcome }}" == success && "${{ steps.runlane.outcome }}" == success ]]'
  aggregate:
    name: Aggregate parallel certification evidence
    needs:
    - prepare
    - certify
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - name: Initialize aggregate evidence
      shell: bash
      run: mkdir -p "$GITHUB_WORKSPACE/runtime-evidence"; printf "workflow_revision=%s\n" "$EXPECTED_WORKFLOW_REVISION" > "$GITHUB_WORKSPACE/runtime-evidence/AGGREGATE-START.txt"
    - name: Download preparation evidence
      id: dlprep
      uses: actions/download-artifact@v8
      continue-on-error: true
      with:
        name: frames-v56-parallel-r4-prep-evidence
        path: ${{ github.workspace }}/runtime-evidence
    - name: Download all lane evidence
      id: dllanes
      uses: actions/download-artifact@v8
      continue-on-error: true
      with:
        pattern: frames-v56-parallel-r4-lane-*
        path: ${{ github.workspace }}/runtime-evidence
        merge-multiple: true
    - name: Record artifact download outcomes
      if: always()
      shell: bash
      run: printf "prep_download=${{ steps.dlprep.outcome }}\nlane_download=${{ steps.dllanes.outcome }}\nprepare_job=${{ needs.prepare.result }}\ncertify_job=${{ needs.certify.result }}\n" > "$GITHUB_WORKSPACE/runtime-evidence/AGGREGATE-DOWNLOAD-OUTCOMES.txt"
    - name: Build fail-closed parallel aggregate
      id: aggregate
      if: always()
      shell: bash
      continue-on-error: true
      run: "set -euo pipefail\nEVIDENCE=\"$GITHUB_WORKSPACE/runtime-evidence\"; mkdir -p \"$EVIDENCE\"\npython3 - \"$EVIDENCE\" \"${{ needs.prepare.result }}\" \"${{ needs.certify.result }}\" <<'PYAGG'\nimport sys,pathlib,json,hashlib\np=pathlib.Path(sys.argv[1]); prep=sys.argv[2]; cert=sys.argv[3]\nrequired=['KERNEL-BOOT-SMOKE-CERTIFY-EXIT-CODE.txt','PHYSICAL-PREVIEW-CERTIFY-EXIT-CODE.txt','HWCOMPAT-CERTIFY-EXIT-CODE.txt','SDK-TOOLING-CERTIFY-EXIT-CODE.txt','APP-PACKAGING-CERTIFY-EXIT-CODE.txt','DEVELOPER-PREVIEW-CERTIFY-EXIT-CODE.txt','APP-LOADER-CERTIFY-EXIT-CODE.txt']\nmissing=[]; nonzero={}\nfor n in required:\n f=p/n\n if not f.exists(): missing.append(n); continue\n try:v=int(f.read_text().strip())\n except:v=-999\n if v!=0: nonzero[n]=v\nrequired_json={'CHANGE-IMPACT-EVIDENCE.json':'PASS','KERNEL-BOOT-SMOKE-EVIDENCE.json':'PASS','SDK-TOOLING-EVIDENCE.json':'PASS','APP-PACKAGING-EVIDENCE.json':'PASS','DEVELOPER-PREVIEW-EVIDENCE.json':'PASS','APP-LOADER-EVIDENCE.json':'PASS'}\njson_bad={}\n\
        for n,want in required_json.items():\n f=p/n\n if not f.exists(): json_bad[n]='MISSING'; continue\n try: got=json.loads(f.read_text()).get('status')\n except Exception: got='UNREADABLE'\n if got!=want: json_bad[n]=got\nstatus='PASS' if prep=='success' and cert=='success' and not missing and not nonzero and not json_bad else 'FAIL'\nout={'status':status,'profile':'frames-0.9.46-v56-parallel-incremental-r4','workflow_revision':'v56-parallel-r4','prepare_job_result':prep,'certify_job_result':cert,'missing':missing,'nonzero':nonzero,'json_status_issues':json_bad,'candidate_source_sha256':'ed823f9d449e53913a018d754cfc90f5369ff2a729afe7c3eda73d404cf430a7','certified_baseline_source_sha256':'f79e43eac7d2047bde1fb20cb7ade9f1ce09bbabffa9acc95d62acf9ca574199','certified_baseline_evidence_sha256':'054590dd2a76a216f8b0639b8cb419c2ca3bf06d45ae64cda965adf8209065a5'}\n(p/'PARALLEL-INCREMENTAL-CERTIFICATION.json').write_text(json.dumps(out,indent=2)+'\\n')\nfiles=[hashlib.sha256(f.read_bytes()).hexdigest()+'\
        \  '+f.name for f in sorted(p.iterdir()) if f.is_file() and f.name!='EVIDENCE-FILES-SHA256.txt']\n(p/'EVIDENCE-FILES-SHA256.txt').write_text('\\n'.join(files)+'\\n'); print(json.dumps(out,indent=2))\nPYAGG"
    - name: Upload final parallel evidence
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: frames-0.9.46-fapp-native-application-loader-parallel-evidence-v56
        path: ${{ github.workspace }}/runtime-evidence
        if-no-files-found: error
        retention-days: 14
    - name: Final certification verdict
      if: always()
      shell: bash
      run: 'python3 - "$GITHUB_WORKSPACE/runtime-evidence/PARALLEL-INCREMENTAL-CERTIFICATION.json" <<''PY''

        import json,sys,pathlib

        p=pathlib.Path(sys.argv[1])

        if not p.exists(): raise SystemExit(''FAIL: aggregate JSON missing'')

        d=json.loads(p.read_text()); print(json.dumps(d,indent=2)); raise SystemExit(0 if d.get(''status'')==''PASS'' else 1)

        PY'
