name: Frames Runtime Certification

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  qemu-ovmf-certification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize evidence capture
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          EVIDENCE="$GITHUB_WORKSPACE/runtime-evidence"

          mkdir -p "$EVIDENCE"

          {
            echo "Frames runtime certification evidence"
            echo "workflow_run_id=${GITHUB_RUN_ID:-unknown}"
            echo "workflow_run_attempt=${GITHUB_RUN_ATTEMPT:-unknown}"
            echo "runner_os=${RUNNER_OS:-unknown}"
            echo "runner_arch=${RUNNER_ARCH:-unknown}"
            echo "workspace=${GITHUB_WORKSPACE:-unknown}"
            echo "status=initialized"
            date -u '+timestamp_utc=%Y-%m-%dT%H:%M:%SZ'
          } > "$EVIDENCE/WORKFLOW-STATUS.txt"

      - name: Install QEMU and OVMF
        shell: bash
        run: |
          set -euo pipefail

          EVIDENCE="$GITHUB_WORKSPACE/runtime-evidence"

          sudo apt-get update

          sudo apt-get install -y \
            qemu-system-x86 \
            ovmf \
            clang \
            lld \
            python3 \
            unzip

          {
            echo "=== QEMU ==="
            qemu-system-x86_64 --version || true

            echo
            echo "=== Packages ==="

            dpkg-query -W \
              qemu-system-x86 \
              ovmf \
              clang \
              lld \
              python3 \
              unzip || true
          } > "$EVIDENCE/TOOL-VERSIONS.txt" 2>&1

      - name: Locate Frames 0.9.12 source and Nexus 5.17
        shell: bash
        run: |
          set -euo pipefail

          EVIDENCE="$GITHUB_WORKSPACE/runtime-evidence"
          DISC="$EVIDENCE/SOURCE-DISCOVERY.txt"

          mkdir -p "$EVIDENCE"
          : > "$DISC"

          echo "Repository: $GITHUB_WORKSPACE" | tee -a "$DISC"
          echo "Runner temp: $RUNNER_TEMP" | tee -a "$DISC"

          SOURCE_ZIP="$(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 1 \
              -type f \
              -name 'Frames-0.9.12-Source*.zip' \
              -print \
              | sort -V \
              | tail -n1
          )"

          EXTRACT_ROOT="$RUNNER_TEMP/frames-source"

          if [[ -z "$SOURCE_ZIP" || ! -f "$SOURCE_ZIP" ]]; then
            echo "ERROR: No Frames-0.9.12-Source*.zip file was found." \
              | tee -a "$DISC"

            echo "Repository files:" | tee -a "$DISC"

            find "$GITHUB_WORKSPACE" \
              -maxdepth 2 \
              -type f \
              -print 2>/dev/null \
              | sort \
              | tee -a