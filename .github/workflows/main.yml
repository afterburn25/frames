name: Frames Runtime Certification

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  qemu-ovmf-certification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf clang lld python3 unzip

      - name: Locate Frames source and bundled Nexus
        shell: bash
        run: |
          set -euo pipefail
          frames_dir=""

          if [[ -f "$GITHUB_WORKSPACE/VERSION" && -f "$GITHUB_WORKSPACE/tools/qemu_certify.sh" ]]; then
            frames_dir="$GITHUB_WORKSPACE"
          fi

          if [[ -z "$frames_dir" ]]; then
            candidate="$(find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -name VERSION -print | while read -r v; do d="${v%/VERSION}"; [[ -f "$d/tools/qemu_certify.sh" ]] && echo "$d"; done | head -n1 || true)"
            [[ -n "$candidate" ]] && frames_dir="$candidate"
          fi

          if [[ -z "$frames_dir" ]]; then
            source_zip="$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -name 'Frames-*-Source.zip' -print | sort -V | tail -n1 || true)"
            if [[ -n "$source_zip" ]]; then
              rm -rf "$RUNNER_TEMP/frames-source"
              mkdir -p "$RUNNER_TEMP/frames-source"
              echo "Extracting source archive: $source_zip"
              unzip -q "$source_zip" -d "$RUNNER_TEMP/frames-source"
              candidate="$(find "$RUNNER_TEMP/frames-source" -maxdepth 5 -type f -name VERSION -print | while read -r v; do d="${v%/VERSION}"; [[ -f "$d/tools/qemu_certify.sh" ]] && echo "$d"; done | head -n1 || true)"
              [[ -n "$candidate" ]] && frames_dir="$candidate"
            fi
          fi

          if [[ -z "$frames_dir" ]]; then
            echo "Frames source tree was not found."
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f | sort | head -200
            exit 1
          fi

          nexus_path="$(find "$frames_dir/toolchain" -maxdepth 3 -type f -name nexus -path '*/Nexus-Language-*/nexus' -print | sort -V | tail -n1 || true)"
          if [[ -z "$nexus_path" ]]; then
            echo "Bundled Nexus compiler was not found under $frames_dir/toolchain"
            exit 1
          fi

          frames_version="$(tr -d '\r\n' < "$frames_dir/VERSION")"
          echo "FRAMES_DIR=$frames_dir" >> "$GITHUB_ENV"
          echo "FRAMES_VERSION=$frames_version" >> "$GITHUB_ENV"
          echo "NEXUS_EXE=$nexus_path" >> "$GITHUB_ENV"
          echo "Frames source: $frames_dir"
          echo "Frames version: $frames_version"
          echo "Nexus compiler: $nexus_path"

      - name: Locate firmware
        shell: bash
        run: |
          set -euo pipefail
          code="$(find /usr/share/OVMF -type f \( -name 'OVMF_CODE_4M.fd' -o -name 'OVMF_CODE.fd' \) | head -n1)"
          vars="$(find /usr/share/OVMF -type f \( -name 'OVMF_VARS_4M.fd' -o -name 'OVMF_VARS.fd' \) | head -n1)"
          test -n "$code"
          echo "OVMF_CODE=$code" >> "$GITHUB_ENV"
          [[ -n "$vars" ]] && echo "OVMF_VARS=$vars" >> "$GITHUB_ENV"
          echo "OVMF CODE: $code"
          echo "OVMF VARS: ${vars:-<none>}"

      - name: Runtime certification and marker diagnosis
        id: runtime
        shell: bash
        env:
          FRAMES_BOOT_TIMEOUT: '60'
        run: |
          set -uo pipefail
          cd "$FRAMES_DIR"
          mkdir -p "$FRAMES_DIR/build"
          export NEXUS="$NEXUS_EXE"
          chmod +x "$NEXUS_EXE" tools/*.sh tools/*.py

          set +e
          ./tools/qemu_certify.sh
          cert_rc=$?
          set -e

          LOG="$FRAMES_DIR/build/serial.log"
          echo
          echo "================ Frames runtime marker diagnosis ================"
          echo "qemu_certify.sh exit code: $cert_rc"
          if [[ ! -f "$LOG" ]]; then
            echo "serial.log was not produced."
            exit "$cert_rc"
          fi

          python3 - "$FRAMES_DIR/tools/qemu_certify.sh" "$LOG" <<'PY'
          import pathlib, re, sys, json
          script=pathlib.Path(sys.argv[1]).read_text(errors='replace')
          log_path=pathlib.Path(sys.argv[2]); log=log_path.read_text(errors='replace')
          m=re.search(r'for marker in\s+(.*?);\s*do',script,re.S)
          if not m:
              print('Could not parse expected marker list from qemu_certify.sh')
              raise SystemExit(2)
          expected=m.group(1).split(); present=[x for x in expected if x in log]; missing=[x for x in expected if x not in log]
          print(f'Expected markers: {len(expected)}'); print(f'Present markers:  {len(present)}'); print(f'Missing markers:  {len(missing)}')
          print('\nMISSING MARKERS:')
          for x in missing: print(f'  - {x}')
          print('\nLAST 120 SERIAL LINES:')
          for line in log.splitlines()[-120:]: print(line)
          (log_path.parent/'MISSING-RUNTIME-MARKERS.json').write_text(json.dumps({'expected_count':len(expected),'present_count':len(present),'missing_count':len(missing),'missing':missing},indent=2)+'\n')
          PY
          echo "================================================================="
          exit "$cert_rc"

      - name: Build runtime evidence
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$GITHUB_WORKSPACE/runtime-evidence"
          if [[ -n "${FRAMES_DIR:-}" && -f "$FRAMES_DIR/build/serial.log" ]]; then
            cd "$FRAMES_DIR"
            python3 tools/runtime_evidence.py --serial build/serial.log || true
            python3 tools/runtime_storage_cert.py --serial build/serial.log || true
            for f in build/serial.log build/MISSING-RUNTIME-MARKERS.json build/RUNTIME-EVIDENCE.json build/STORAGE-RUNTIME-CERT.json build/RUNTIME-CERTIFICATION.json; do
              [[ -f "$f" ]] && cp "$f" "$GITHUB_WORKSPACE/runtime-evidence/"
            done
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frames-runtime-evidence
          path: runtime-evidence/
          if-no-files-found: warn
