name: Frames 0.9.47 v57 r6 Evidence Verifier Repair
on:
  workflow_dispatch:
  push:
    paths:
      - 'Frames-0.9.47-Runtime-Certification-Kit-v57-r6-Evidence-Repair.zip'
permissions:
  contents: read
jobs:
  certify-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Initialize
        shell: bash
        run: |
          rm -rf runtime-evidence r6kit
          mkdir -p runtime-evidence r6kit
      - name: Locate r6 kit by contract
        id: locate
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 - "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/r6kit" <<'PY'
          import sys,pathlib,zipfile,json,shutil
          ws=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          marker='Frames-0.9.47-Runtime-Certification-Kit-v57-r6-Evidence-Repair/KIT-CONTRACT.json'
          matches=[]
          for p in ws.rglob('*.zip'):
              try:
                  with zipfile.ZipFile(p) as z:
                      if marker in z.namelist():
                          c=json.loads(z.read(marker))
                          if c.get('workflow_revision')=='v57-incremental-r6' and c.get('candidate_source_sha256')=='77d0e2be5100af124e89c66c04e7fcad71d26c41036d2135fdc13c1dc67d0c19':
                              matches.append(p)
              except Exception:
                  pass
          assert len(matches)==1,matches
          with zipfile.ZipFile(matches[0]) as z:z.extractall(out)
          print(matches[0])
          PY
      - name: Re-evaluate sealed r5 runtime evidence
        id: evaluate
        if: always()
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          root="$GITHUB_WORKSPACE/r6kit/Frames-0.9.47-Runtime-Certification-Kit-v57-r6-Evidence-Repair"
          rc=0
          python3 "$root/verify-v57-r6-evidence.py" "$root" "$GITHUB_WORKSPACE/runtime-evidence" > runtime-evidence/R6-CONSOLE.log 2>&1 || rc=$?
          echo "$rc" > runtime-evidence/R6-EXIT-CODE.txt
          exit "$rc"
      - name: Reseal manifest after diagnostics
        if: always()
        shell: bash
        run: |
          python3 - runtime-evidence <<'PY'
          from pathlib import Path
          import hashlib,sys,json
          r=Path(sys.argv[1])
          def H(p):
              h=hashlib.sha256()
              with open(p,'rb') as f:
                  for c in iter(lambda:f.read(1<<20),b''):h.update(c)
              return h.hexdigest()
          files=[p for p in sorted(r.rglob('*')) if p.is_file() and p.name!='EVIDENCE-FILES-SHA256.txt']
          r.joinpath('EVIDENCE-FILES-SHA256.txt').write_text(''.join(f"{H(p)}  {p.relative_to(r).as_posix()}\n" for p in files))
          mism=[]
          for line in r.joinpath('EVIDENCE-FILES-SHA256.txt').read_text().splitlines():
              h,n=line.split('  ',1)
              if H(r/n)!=h:mism.append(n)
          r.joinpath('FINAL-MANIFEST-VERIFY.json').write_text(json.dumps({'status':'PASS' if not mism else 'FAIL','mismatches':mism},indent=2)+'\n')
          files=[p for p in sorted(r.rglob('*')) if p.is_file() and p.name!='EVIDENCE-FILES-SHA256.txt']
          r.joinpath('EVIDENCE-FILES-SHA256.txt').write_text(''.join(f"{H(p)}  {p.relative_to(r).as_posix()}\n" for p in files))
          PY
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frames-0.9.47-developer-preview-phase3-evidence-v57
          path: runtime-evidence
          if-no-files-found: error
      - name: Final verdict
        if: always()
        shell: bash
        run: |
          [[ "${{ steps.locate.outcome }}" == success && "${{ steps.evaluate.outcome }}" == success ]]
          python3 - <<'PY'
          import json
          f=json.load(open('runtime-evidence/FINAL-CERTIFICATION.json'))
          m=json.load(open('runtime-evidence/FINAL-MANIFEST-VERIFY.json'))
          assert f['status']=='PASS' and f['workflow_revision']=='v57-incremental-r6'
          assert m['status']=='PASS'
          print('FRAMES 0.9.47 v57 r6 FINAL CERTIFICATION PASS')
          PY
