name: Frames 0.9.98 r60 Flight Recorder Write-Path Proof USB Image

on:
  workflow_dispatch:
  push:
    branches: [ r56-linux-input-architecture ]
    paths:
      - '.github/workflows/pointer-r60-flight-recorder-write-proof.yml'
      - 'tools/ci/make_r60_flight_recorder_write_proof.py'
      - 'tools/ci/make_r59_windows_log_partition.py'
      - 'tools/ci/make_r58_input_flight_recorder_fixed.py'
      - 'tools/ci/make_r58_input_flight_recorder.py'
      - 'tools/ci/make_r57_persistent_xhci_trace.py'

permissions:
  contents: read

env:
  EXPECTED_PARENT_SHA256: 1c7f1b514d9aa2f847f724e8b633286d069d745bf7c281a3967c46bbfea1a18c
  EXPECTED_R46_KERNEL_MAIN_SHA256: e5ccd3d4a453184f620e2ed5f928599bc8a7fa6959098f3aeff4916f6dcff165

jobs:
  build-r60:
    name: Build r60 storage proof + FRAMESLOG Rufus image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r56-linux-input-architecture

      - name: Reconstruct protected r46 base and apply r60
        shell: bash
        run: |
          set -euo pipefail
          rm -rf r60-out "$RUNNER_TEMP/r60"
          mkdir -p r60-out "$RUNNER_TEMP/r60"
          parent_sha="$(sha256sum Frames-0.9.98-Pointer-Diagnostics-CI-v1.zip | awk '{print $1}')"
          test "$parent_sha" = "$EXPECTED_PARENT_SHA256"
          unzip -q Frames-0.9.98-Pointer-Diagnostics-CI-v1.zip -d "$RUNNER_TEMP/r60"
          SRC="$RUNNER_TEMP/r60/Frames-0.9.98-Pointer-CI-Source"
          python3 - "$SRC/kernel/main.nx" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          a='if usb_hid_found != 0 { usb_hid_configured = xhci_configure_boot_hid(xhci_state,phys_state); if usb_hid_configured != 0 { usb_hid_report_ready = xhci_read_first_hid_report(xhci_state,phys_state); } }'
          b='if usb_hid_found != 0 { usb_hid_configured = xhci_configure_boot_hid(xhci_state,phys_state); if usb_hid_configured != 0 { usb_hid_report_ready = 1; } }'
          c='if input_queue_ready != 0 { if usb_hid_report_ready != 0 { input_decode_ready = input_decode_boot_hid(xhci_state,input_state); } else { ps2_poll_fallback(input_state); } }'
          d='if input_queue_ready != 0 { if usb_hid_report_ready != 0 { input_decode_ready = 1; } else { ps2_poll_fallback(input_state); } }'
          assert s.count(a)==1 and s.count(c)==1
          p.write_text(s.replace(a,b).replace(c,d))
          PY
          test "$(sha256sum "$SRC/kernel/main.nx" | awk '{print $1}')" = "$EXPECTED_R46_KERNEL_MAIN_SHA256"
          python3 tools/ci/make_r60_flight_recorder_write_proof.py "$SRC/kernel/main.nx"
          grep -q 'r60 storage-path proof' "$SRC/kernel/main.nx"
          grep -q 'ptrtrace_storage_proof' "$SRC/kernel/main.nx"
          grep -q 'R59 FRAMESLOG GPT partition 2' "$SRC/kernel/main.nx"
          echo "FRAMES_DIR=$SRC" >> "$GITHUB_ENV"
          sha256sum "$SRC/kernel/main.nx" > r60-out/R60-KERNEL-SHA256.txt

      - name: Install build and image dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld python3 unzip zip mtools dosfstools gdisk
          find "$FRAMES_DIR" -type f -name '*.sh' -exec chmod +x {} +
          find "$FRAMES_DIR/toolchain" -type f -name nexus -exec chmod +x {} +

      - name: Build base Frames image
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRAMES_DIR"
          ./tools/build.sh
          python3 tools/make_esp.py
          python3 tools/sdk_selftest.py
          python3 tools/make_desktop_preview_image.py
          python3 tools/verify_desktop_preview_image.py --image build/Frames-0.9.98-Desktop-Preview.img --require-pass
          python3 tools/verify_release.py

      - name: Add Windows-readable FRAMESLOG partition
        shell: bash
        run: |
          set -euo pipefail
          BASE="$FRAMES_DIR/build/Frames-0.9.98-Desktop-Preview.img"
          OUT="r60-out/Frames-0.9.98-r60-Flight-Recorder-Write-Proof-FRAMESLOG-Rufus.img"
          cp "$BASE" "$OUT"
          old_bytes="$(stat -c %s "$OUT")"
          truncate -s $((old_bytes + 64*1024*1024)) "$OUT"
          sgdisk -e "$OUT"
          sgdisk -n 2:0:0 -t 2:0700 -c 2:FRAMESLOG "$OUT"
          sgdisk -v "$OUT" | tee r60-out/GPT-VERIFY.txt
          read START SECTORS <<<"$(python3 - "$OUT" <<'PY'
          import struct,sys
          with open(sys.argv[1],'rb') as f:
              f.seek(2*512+128); e=f.read(128)
          first,last=struct.unpack_from('<QQ',e,32)
          if first<34 or last<first: raise SystemExit('invalid GPT partition #2')
          print(first,last-first+1)
          PY
          )"
          printf 'frameslog_start_lba=%s\nframeslog_sectors=%s\n' "$START" "$SECTORS" | tee r60-out/FRAMESLOG-LAYOUT.txt
          PART="r60-out/FRAMESLOG.part.img"
          truncate -s $((SECTORS*512)) "$PART"
          mkfs.fat -F 32 -n FRAMESLOG "$PART"
          truncate -s 1048576 r60-out/PTRLOG.BIN
          mcopy -o -i "$PART" r60-out/PTRLOG.BIN ::PTRLOG.BIN
          mdir -i "$PART" :: | tee r60-out/FRAMESLOG-DIRECTORY.txt
          grep -q 'PTRLOG' r60-out/FRAMESLOG-DIRECTORY.txt
          dd if="$PART" of="$OUT" bs=512 seek="$START" conv=notrunc status=none
          rm -f "$PART"

      - name: Verify FRAMESLOG and PTRLOG layout
        shell: bash
        run: |
          set -euo pipefail
          IMG="r60-out/Frames-0.9.98-r60-Flight-Recorder-Write-Proof-FRAMESLOG-Rufus.img"
          python3 - "$IMG" <<'PY' | tee r60-out/PTRLOG-LAYOUT.txt
          import struct,sys
          f=open(sys.argv[1],'rb')
          def sec(lba): f.seek(lba*512); return f.read(512)
          f.seek(2*512+128); e=f.read(128); part,last=struct.unpack_from('<QQ',e,32)
          b=sec(part); bps=struct.unpack_from('<H',b,11)[0]; spc=b[13]; reserved=struct.unpack_from('<H',b,14)[0]; fats=b[16]; fatsecs=struct.unpack_from('<I',b,36)[0]; root=struct.unpack_from('<I',b,44)[0]&0x0fffffff; label=b[71:82].decode('ascii','ignore').rstrip()
          assert label=='FRAMESLOG' and bps==512 and spc>=1
          fat_start=part+reserved; data_start=fat_start+fats*fatsecs
          def clba(c): return data_start+(c-2)*spc
          def nxt(c):
              bo=c*4; d=sec(fat_start+bo//512); return struct.unpack_from('<I',d,bo%512)[0]&0x0fffffff
          c=root; found=None
          for _ in range(256):
              for si in range(spc):
                  d=sec(clba(c)+si)
                  for off in range(0,512,32):
                      if d[off]==0: break
                      if d[off:off+11]==b'PTRLOG  BIN':
                          fc=(struct.unpack_from('<H',d,off+20)[0]<<16)|struct.unpack_from('<H',d,off+26)[0]; size=struct.unpack_from('<I',d,off+28)[0]; found=(fc,size); break
                  if found: break
              if found: break
              c=nxt(c)
              if c>=0x0ffffff8: break
          assert found and found[1]==1048576
          fc,size=found; clusters=(size+spc*512-1)//(spc*512); c=fc
          for _ in range(clusters-1):
              n=nxt(c); assert n==c+1, f'fragmented {c}->{n}'; c=n
          print(f'partition2_start_lba={part}')
          print(f'partition2_label={label}')
          print(f'ptrlog_first_cluster={fc}')
          print(f'ptrlog_first_lba={clba(fc)}')
          print('ptrlog_contiguous=PASS')
          print('windows_readable_partition=PASS')
          PY

      - name: Package r60 evidence
        shell: bash
        run: |
          set -euo pipefail
          IMG="r60-out/Frames-0.9.98-r60-Flight-Recorder-Write-Proof-FRAMESLOG-Rufus.img"
          cat > r60-out/HANDS-ON-TEST.txt <<'EOF'
          1. Flash r60 with Rufus/raw image mode.
          2. Plug the USB mouse in before boot.
          3. Boot PTR DIAG R60. The storage proof runs before the pointer capture loop.
          4. WSTG=7 and WERR=0 means FRAMESLOG/PTRLOG was found, WRITE(10) completed, cache flush completed, and sector read-back matched exactly.
          5. Exercise USB mouse + touchpad for at least 15 seconds.
          6. Wait for SAVE=2. Power off and return the USB to Windows.
          7. Open FRAMESLOG and upload PTRLOG.BIN.

          WSTG stages: 1=start, 2=MSC configured, 3=PTRLOG located, 4=WRITE(10) passed, 5=flush passed, 6=readback returned, 7=signature verified.
          WERR: 1=MSC enumeration, 2=PTRLOG lookup, 3=buffer allocation, 4=WRITE(10), 5=flush, 6=READ(10), 7=readback mismatch.
          Diagnostic-only. Do not promote r60.
          EOF
          sha256sum "$IMG" | tee r60-out/IMAGE-SHA256.txt
          printf 'status=PASS\nrevision=r60\nstrategy=pre-capture-write-flush-readback-proof\n' > r60-out/BUILD-STATUS.txt
          sha256sum r60-out/* > r60-out/SHA256SUMS.txt

      - name: Upload r60 image and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frames-0.9.98-r60-flight-recorder-write-proof-rufus-image
          path: r60-out/**
          if-no-files-found: error
          retention-days: 14
