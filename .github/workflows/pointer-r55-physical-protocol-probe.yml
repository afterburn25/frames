name: Frames 0.9.98 r55 Physical Protocol Identification USB Image

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/pointer-r55-physical-protocol-probe.yml'
      - 'tools/ci/make_r55_physical_protocol_probe.py'
      - 'tools/ci/make_r54_usb_multiport_hid.py'
      - 'tools/ci/make_r53b_input_protocol_id.py'
      - 'tools/ci/make_r50_ps2_phase_fix.py'
      - 'tools/ci/make_r49_ps2_phase.py'

permissions:
  contents: read

env:
  EXPECTED_PARENT_SHA256: 1c7f1b514d9aa2f847f724e8b633286d069d745bf7c281a3967c46bbfea1a18c
  EXPECTED_R46_KERNEL_MAIN_SHA256: e5ccd3d4a453184f620e2ed5f928599bc8a7fa6959098f3aeff4916f6dcff165

jobs:
  build-r55:
    name: Build r55 Rufus-compatible physical protocol identification image
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Initialize evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf r55-out
          mkdir -p r55-out
          printf 'status=started\nrevision=r55\n' > r55-out/BUILD-STATUS.txt

      - name: Reconstruct exact certified r46 base
        shell: bash
        run: |
          set -euo pipefail
          parent_sha="$(sha256sum Frames-0.9.98-Pointer-Diagnostics-CI-v1.zip | awk '{print $1}')"
          echo "protected_parent_sha256=$parent_sha" > r55-out/PARENT-IDENTITY.txt
          test "$parent_sha" = "$EXPECTED_PARENT_SHA256"
          rm -rf "$RUNNER_TEMP/r55"; mkdir -p "$RUNNER_TEMP/r55"
          unzip -q Frames-0.9.98-Pointer-Diagnostics-CI-v1.zip -d "$RUNNER_TEMP/r55"
          SRC="$RUNNER_TEMP/r55/Frames-0.9.98-Pointer-CI-Source"
          python3 - "$SRC/kernel/main.nx" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          a='if usb_hid_found != 0 { usb_hid_configured = xhci_configure_boot_hid(xhci_state,phys_state); if usb_hid_configured != 0 { usb_hid_report_ready = xhci_read_first_hid_report(xhci_state,phys_state); } }'
          b='if usb_hid_found != 0 { usb_hid_configured = xhci_configure_boot_hid(xhci_state,phys_state); if usb_hid_configured != 0 { usb_hid_report_ready = 1; } }'
          c='if input_queue_ready != 0 { if usb_hid_report_ready != 0 { input_decode_ready = input_decode_boot_hid(xhci_state,input_state); } else { ps2_poll_fallback(input_state); } }'
          d='if input_queue_ready != 0 { if usb_hid_report_ready != 0 { input_decode_ready = 1; } else { ps2_poll_fallback(input_state); } }'
          assert s.count(a)==1 and s.count(c)==1
          p.write_text(s.replace(a,b).replace(c,d))
          PY
          r46_sha="$(sha256sum "$SRC/kernel/main.nx" | awk '{print $1}')"
          echo "r46_kernel_main_sha256=$r46_sha" > r55-out/R46-BASE-IDENTITY.txt
          test "$r46_sha" = "$EXPECTED_R46_KERNEL_MAIN_SHA256"
          echo "FRAMES_DIR=$SRC" >> "$GITHUB_ENV"

      - name: Apply r55 physical protocol identification telemetry
        shell: bash
        run: |
          set -euo pipefail
          cp "$FRAMES_DIR/kernel/main.nx" r55-out/kernel-main-before-r55.nx
          python3 tools/ci/make_r55_physical_protocol_probe.py "$FRAMES_DIR/kernel/main.nx"
          cp "$FRAMES_DIR/kernel/main.nx" r55-out/kernel-main-r55.nx
          diff -u r55-out/kernel-main-before-r55.nx r55-out/kernel-main-r55.nx > r55-out/R55-PROTOCOL-PROBE.patch || true
          grep -q 'R55' "$FRAMES_DIR/kernel/main.nx"
          grep -q 'USTG' "$FRAMES_DIR/kernel/main.nx"
          grep -q 'UTRY' "$FRAMES_DIR/kernel/main.nx"
          grep -q 'RAW0' "$FRAMES_DIR/kernel/main.nx"
          sha256sum "$FRAMES_DIR/kernel/main.nx" | tee r55-out/R55-KERNEL-SHA256.txt

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld python3 unzip zip mtools dosfstools
          find "$FRAMES_DIR" -type f -name '*.sh' -exec chmod +x {} +
          find "$FRAMES_DIR/toolchain" -type f -name nexus -exec chmod +x {} +

      - name: Build and verify raw USB image
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRAMES_DIR"
          ./tools/build.sh
          python3 tools/make_esp.py
          python3 tools/sdk_selftest.py
          python3 tools/make_desktop_preview_image.py
          python3 tools/verify_desktop_preview_image.py --image build/Frames-0.9.98-Desktop-Preview.img --require-pass
          python3 tools/verify_release.py
          cp build/Frames-0.9.98-Desktop-Preview.img "$GITHUB_WORKSPACE/r55-out/Frames-0.9.98-r55-Physical-Protocol-ID-Rufus.img"

      - name: Record test instructions and hashes
        shell: bash
        run: |
          set -euo pipefail
          img="r55-out/Frames-0.9.98-r55-Physical-Protocol-ID-Rufus.img"
          img_sha="$(sha256sum "$img" | awk '{print $1}')"
          cat > r55-out/HANDS-ON-TEST.txt <<'EOF'
          Write the r55 IMG directly with Rufus/raw image mode and boot UEFI.
          Plug the physical USB mouse in BEFORE boot and leave the Frames boot USB inserted.
          Confirm PTR DIAG R55.

          USB enumeration stage USTG:
            0=no xHCI progress recorded
            1=controller initialized
            2=connected root port selected/reset
            3=slot enabled
            4=default device addressed
            5=first 8 device-descriptor bytes read
            6=full address/device descriptor completed
            7=boot-HID interface discovered
            8=boot-HID configured
          UTRY=number of connected-port scan attempts; UPOR=selected root port; UVID=device VID if obtained.

          Touchpad: RAW0/RAW1/RAW2 are the rolling last 12 physical AUX bytes; PKT3 is the three bytes Frames interpreted as a standard packet; RCNT is raw byte count; PSIZ is configured packet size.

          Test USB mouse first for 10-15 seconds without touching the touchpad and photograph the entire panel. Then move the touchpad slowly right for 5 seconds and slowly down for 5 seconds and photograph the panel again.
          Diagnostic-only. Do not promote.
          EOF
          printf 'status=PASS\nrevision=r55\nimage_sha256=%s\n' "$img_sha" > r55-out/BUILD-STATUS.txt
          sha256sum r55-out/* > r55-out/SHA256SUMS.txt

      - name: Upload r55 USB image and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frames-0.9.98-r55-physical-protocol-id-rufus-image
          path: r55-out/**
          if-no-files-found: error
          retention-days: 14
