name: Frames v108 Full Product Boot Inspection

on:
  push:
    branches: [ v108-full-product-rufus-iso ]
    paths:
      - '.github/workflows/frames-v108-full-product-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CERT_COMMIT: 7333a6670a38c9180e7d72c2a3df444409c36164
  EXPECTED_KIT_SHA: 61b0fc25513719fce554729724c7848647de9cffe54434d4ab5f7ba8af42a36a
  EXPECTED_SOURCE_SHA: 5f8c13adac6d34e64bd47d9463a3e261cd0b51bb5ddb500aa9f7b87c2914a52d

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch and verify sealed v108 source
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://raw.githubusercontent.com/afterburn25/frames/$CERT_COMMIT/Frames-0.9.98-Runtime-Certification-Kit-v108-r9.zip" -o /tmp/kit.zip
          test "$(sha256sum /tmp/kit.zip | awk '{print $1}')" = "$EXPECTED_KIT_SHA"
          mkdir -p /tmp/kit /tmp/src
          unzip -q /tmp/kit.zip 'Frames-0.9.98-Source-v108.zip' -d /tmp/kit
          test "$(sha256sum /tmp/kit/Frames-0.9.98-Source-v108.zip | awk '{print $1}')" = "$EXPECTED_SOURCE_SHA"
          unzip -q /tmp/kit/Frames-0.9.98-Source-v108.zip -d /tmp/src
          echo "FRAMES=/tmp/src/Frames-0.9.98" >> "$GITHUB_ENV"

      - name: Inspect product and boot builders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inspect-out/scripts
          cd "$FRAMES"
          printf 'VERSION=' > "$GITHUB_WORKSPACE/inspect-out/identity.txt"
          cat VERSION >> "$GITHUB_WORKSPACE/inspect-out/identity.txt"
          printf 'REVISION=' >> "$GITHUB_WORKSPACE/inspect-out/identity.txt"
          cat GUI-REPAIR-REVISION >> "$GITHUB_WORKSPACE/inspect-out/identity.txt"
          find . -maxdepth 3 -type f | sort > "$GITHUB_WORKSPACE/inspect-out/source-tree.txt"
          find tools -maxdepth 1 -type f -printf '%f\n' | sort > "$GITHUB_WORKSPACE/inspect-out/tools-list.txt"
          grep -RniE 'desktop.preview|diagnostic|full.product|normal.boot|boot.mode|make_.*image|Frames-0\.9\.98.*img|BOOTX64|FramesKernel' tools boot kernel system apps 2>/dev/null | head -n 2500 > "$GITHUB_WORKSPACE/inspect-out/boot-search.txt" || true
          for f in tools/make_desktop_preview_image.py tools/make_esp.py tools/build.sh tools/verify_release.py; do
            if [ -f "$f" ]; then cp "$f" "$GITHUB_WORKSPACE/inspect-out/scripts/$(basename "$f")"; fi
          done
          find . -maxdepth 4 -type f \( -iname '*boot*' -o -iname '*desktop*' -o -iname '*image*' -o -iname '*release*' \) | sort > "$GITHUB_WORKSPACE/inspect-out/boot-files.txt"

      - name: Build and inventory outputs
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y clang lld python3 unzip zip mtools dosfstools >/dev/null
          find "$FRAMES" -type f -name '*.sh' -exec chmod +x {} +
          find "$FRAMES/toolchain" -type f -name nexus -exec chmod +x {} +
          cd "$FRAMES"
          ./tools/build.sh
          python3 tools/make_esp.py
          find build -maxdepth 3 -type f -printf '%p\t%s bytes\n' | sort > "$GITHUB_WORKSPACE/inspect-out/build-tree.txt"
          file build/* > "$GITHUB_WORKSPACE/inspect-out/build-file-types.txt" 2>&1 || true
          cp -a build "$GITHUB_WORKSPACE/inspect-out/build-output"

      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: frames-v108-full-product-boot-inspection
          path: inspect-out/**
          if-no-files-found: error
          retention-days: 7
