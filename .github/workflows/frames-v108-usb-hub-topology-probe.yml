name: Frames v108 USB Mouse Topology Probe

on:
  workflow_dispatch:
  push:
    branches: [ v108-physical-input-bringup ]
    paths:
      - '.github/workflows/frames-v108-usb-hub-topology-probe.yml'

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: 31927431251
  EXPECTED_IMG_SHA: 6918d228725f0cb3185e17f974119b4abf8c8413af1173369fc8d0594f30bab7

jobs:
  topology:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        topology: [direct, hub]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Frames-v108-Physical-Input-Test-r2-Candidate
          path: candidate
          repository: afterburn25/frames
          run-id: 31927431251
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install QEMU/OVMF
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf python3
          code="$(find /usr/share/OVMF -type f \( -name 'OVMF_CODE_4M.fd' -o -name 'OVMF_CODE.fd' \) | head -n1)"
          test -n "$code"
          echo "OVMF_CODE=$code" >> "$GITHUB_ENV"
      - name: Probe ${{ matrix.topology }} USB topology
        run: |
          set -euo pipefail
          OUT="probe-${{ matrix.topology }}"; mkdir -p "$OUT"
          IMG="$(find candidate -name 'Frames-0.9.98-v108-Physical-Input-Test-r2.img' -print -quit)"
          test -s "$IMG"
          test "$(sha256sum "$IMG" | awk '{print $1}')" = "$EXPECTED_IMG_SHA"
          python3 - "$OVMF_CODE" "$IMG" "$OUT" '${{ matrix.topology }}' <<'PY'
          import json,pathlib,socket,subprocess,sys,time
          ovmf,image,out,topology=sys.argv[1:]
          out=pathlib.Path(out); qmp=out/'qmp.sock'; serial=out/'serial.log'; stderr=out/'qemu.stderr'
          cmd=['qemu-system-x86_64','-machine','q35','-m','768M','-smp','2','-cpu','max','-accel','tcg,thread=single','-display','none','-no-reboot','-no-shutdown','-nic','none','-serial',f'file:{serial}','-qmp',f'unix:{qmp},server=on,wait=off','-drive',f'if=pflash,format=raw,readonly=on,file={ovmf}','-device','qemu-xhci,id=xhci','-drive',f'if=none,id=bootusb,format=raw,file={image}','-device','usb-storage,drive=bootusb,bus=xhci.0,port=1,bootindex=1']
          if topology=='direct':
              cmd += ['-device','usb-mouse,bus=xhci.0,port=2,id=usbmouse']
          else:
              cmd += ['-device','usb-hub,bus=xhci.0,port=2,id=hub','-device','usb-mouse,bus=xhci.0,port=2.1,id=usbmouse']
          (out/'qemu-command.json').write_text(json.dumps(cmd,indent=2)+'\n')
          ef=stderr.open('wb'); p=subprocess.Popen(cmd,stdout=subprocess.DEVNULL,stderr=ef)
          result={'topology':topology,'qemu_started':False,'runtime_ready':False,'usb_live_report':False,'usb_gui_cursor':False,'classification':'UNKNOWN'}
          try:
              deadline=time.time()+25
              while time.time()<deadline and not qmp.exists():
                  if p.poll() is not None: raise RuntimeError(f'qemu exited {p.returncode}')
                  time.sleep(.05)
              if not qmp.exists(): raise RuntimeError('qmp timeout')
              result['qemu_started']=True
              s=socket.socket(socket.AF_UNIX,socket.SOCK_STREAM); s.connect(str(qmp)); f=s.makefile('rwb',buffering=0); json.loads(f.readline())
              def call(name,args=None):
                  o={'execute':name}
                  if args is not None:o['arguments']=args
                  f.write((json.dumps(o)+'\n').encode())
                  while True:
                      r=json.loads(f.readline())
                      if 'return' in r:return r['return']
                      if 'error' in r:raise RuntimeError(r['error'])
              call('qmp_capabilities'); mice=call('query-mice'); (out/'query-mice.json').write_text(json.dumps(mice,indent=2)+'\n')
              idx=next((m['index'] for m in mice if ('hid' in m['name'].lower() or 'usb' in m['name'].lower()) and 'ps/2' not in m['name'].lower()),None)
              if idx is not None: call('human-monitor-command',{'command-line':f'mouse_set {idx}'})
              deadline=time.time()+90
              while time.time()<deadline:
                  txt=serial.read_text(errors='ignore') if serial.exists() else ''
                  if 'FRAMES_V108_INPUT_TEST_RUNTIME_READY' in txt:
                      result['runtime_ready']=True; break
                  if p.poll() is not None: break
                  time.sleep(.2)
              if result['runtime_ready'] and idx is not None:
                  for _ in range(100):
                      call('input-send-event',{'events':[{'type':'rel','data':{'axis':'x','value':8}},{'type':'rel','data':{'axis':'y','value':4}}]})
                      time.sleep(.08)
                      txt=serial.read_text(errors='ignore') if serial.exists() else ''
                      result['usb_live_report']='FRAMES_V108_USB_LIVE_REPORT_OK' in txt
                      result['usb_gui_cursor']='FRAMES_V108_USB_GUI_CURSOR_OK' in txt
                      if result['usb_live_report'] and result['usb_gui_cursor']: break
              if result['usb_live_report'] and result['usb_gui_cursor']:
                  result['classification']='SUPPORTED'
              elif result['runtime_ready']:
                  result['classification']='NO_HID_BEHIND_TOPOLOGY'
              else:
                  result['classification']='BOOT_OR_RUNTIME_FAILURE'
              try: call('quit')
              except Exception: pass
          finally:
              try:p.wait(timeout=5)
              except: p.kill(); p.wait()
              (out/'RESULT.json').write_text(json.dumps(result,indent=2)+'\n'); print(json.dumps(result,indent=2))
          if topology=='direct' and result['classification']!='SUPPORTED':
              raise SystemExit('direct USB regression failed')
          PY
          find "$OUT" -type s -delete || true
          sha256sum "$OUT"/* > "$OUT/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Frames-v108-USB-Topology-${{ matrix.topology }}
          path: probe-${{ matrix.topology }}/**
          if-no-files-found: error
          retention-days: 30
