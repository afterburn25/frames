name: Frames 0.9.98 r54 Physical PS2 Jitter Smoothing USB Image

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/pointer-r54-physical-ps2-jitter-smoothing.yml'
      - 'tools/ci/make_r54_ps2_jitter_smoothing.py'
      - 'tools/ci/make_r52_ps2_bounded_delta.py'
      - 'tools/ci/make_r50_ps2_phase_fix.py'
      - 'tools/ci/make_r49_ps2_phase.py'

permissions:
  contents: read

env:
  EXPECTED_PARENT_SHA256: 1c7f1b514d9aa2f847f724e8b633286d069d745bf7c281a3967c46bbfea1a18c
  EXPECTED_R46_KERNEL_MAIN_SHA256: e5ccd3d4a453184f620e2ed5f928599bc8a7fa6959098f3aeff4916f6dcff165

jobs:
  build-r54:
    name: Build r54 Rufus-compatible jitter-smoothed PS2 image
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Initialize evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf r54-out
          mkdir -p r54-out
          printf 'status=started\nrevision=r54\n' > r54-out/BUILD-STATUS.txt

      - name: Reconstruct exact certified r46 base
        shell: bash
        run: |
          set -euo pipefail
          parent_sha="$(sha256sum Frames-0.9.98-Pointer-Diagnostics-CI-v1.zip | awk '{print $1}')"
          echo "protected_parent_sha256=$parent_sha" > r54-out/PARENT-IDENTITY.txt
          test "$parent_sha" = "$EXPECTED_PARENT_SHA256"
          rm -rf "$RUNNER_TEMP/r54"; mkdir -p "$RUNNER_TEMP/r54"
          unzip -q Frames-0.9.98-Pointer-Diagnostics-CI-v1.zip -d "$RUNNER_TEMP/r54"
          SRC="$RUNNER_TEMP/r54/Frames-0.9.98-Pointer-CI-Source"
          python3 - "$SRC/kernel/main.nx" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          a='if usb_hid_found != 0 { usb_hid_configured = xhci_configure_boot_hid(xhci_state,phys_state); if usb_hid_configured != 0 { usb_hid_report_ready = xhci_read_first_hid_report(xhci_state,phys_state); } }'
          b='if usb_hid_found != 0 { usb_hid_configured = xhci_configure_boot_hid(xhci_state,phys_state); if usb_hid_configured != 0 { usb_hid_report_ready = 1; } }'
          c='if input_queue_ready != 0 { if usb_hid_report_ready != 0 { input_decode_ready = input_decode_boot_hid(xhci_state,input_state); } else { ps2_poll_fallback(input_state); } }'
          d='if input_queue_ready != 0 { if usb_hid_report_ready != 0 { input_decode_ready = 1; } else { ps2_poll_fallback(input_state); } }'
          assert s.count(a)==1 and s.count(c)==1
          p.write_text(s.replace(a,b).replace(c,d))
          PY
          r46_sha="$(sha256sum "$SRC/kernel/main.nx" | awk '{print $1}')"
          echo "r46_kernel_main_sha256=$r46_sha" > r54-out/R46-BASE-IDENTITY.txt
          test "$r46_sha" = "$EXPECTED_R46_KERNEL_MAIN_SHA256"
          cp "$SRC/kernel/main.nx" r54-out/kernel-main-r46.nx
          echo "FRAMES_DIR=$SRC" >> "$GITHUB_ENV"

      - name: Apply r54 jitter smoothing on working r52 path
        shell: bash
        run: |
          set -euo pipefail
          cp "$FRAMES_DIR/kernel/main.nx" r54-out/kernel-main-before-r54.nx
          python3 tools/ci/make_r54_ps2_jitter_smoothing.py "$FRAMES_DIR/kernel/main.nx"
          cp "$FRAMES_DIR/kernel/main.nx" r54-out/kernel-main-r54.nx
          diff -u r54-out/kernel-main-before-r54.nx r54-out/kernel-main-r54.nx > r54-out/R54-JITTER-SMOOTHING.patch || true
          grep -q 'R54' "$FRAMES_DIR/kernel/main.nx"
          grep -q 'micro-reversal smoothing' "$FRAMES_DIR/kernel/main.nx"
          grep -q 'emit_x=0' "$FRAMES_DIR/kernel/main.nx"
          sha256sum "$FRAMES_DIR/kernel/main.nx" | tee r54-out/R54-KERNEL-SHA256.txt

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld python3 unzip zip mtools dosfstools
          find "$FRAMES_DIR" -type f -name '*.sh' -exec chmod +x {} +
          find "$FRAMES_DIR/toolchain" -type f -name nexus -exec chmod +x {} +

      - name: Build and verify raw USB image
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRAMES_DIR"
          ./tools/build.sh
          python3 tools/make_esp.py
          python3 tools/sdk_selftest.py
          python3 tools/make_desktop_preview_image.py
          python3 tools/verify_desktop_preview_image.py --image build/Frames-0.9.98-Desktop-Preview.img --require-pass
          python3 tools/verify_release.py
          cp build/Frames-0.9.98-Desktop-Preview.img "$GITHUB_WORKSPACE/r54-out/Frames-0.9.98-r54-Physical-PS2-Jitter-Smoothing-Rufus.img"

      - name: Record hands-on instructions and hashes
        shell: bash
        run: |
          set -euo pipefail
          img="r54-out/Frames-0.9.98-r54-Physical-PS2-Jitter-Smoothing-Rufus.img"
          img_sha="$(sha256sum "$img" | awk '{print $1}')"
          cat > r54-out/HANDS-ON-TEST.txt <<'EOF'
          Write Frames-0.9.98-r54-Physical-PS2-Jitter-Smoothing-Rufus.img directly to USB with Rufus/raw image mode.
          Boot in UEFI mode and confirm PTR DIAG R54.
          Move the touchpad slowly, normally, then quickly in all directions for 15-20 seconds. Also stop with your finger resting lightly to check idle jitter.
          r54 inherits r52's 32-unit hard bound. It suppresses only one isolated <=4-unit reversal per axis and immediately allows sustained reversal on the following packet. It does not force phase resync or change IRQ/AUX/Generic Pointer behavior.
          Focus on subjective smoothness plus SRC, CORE, TRNS, CLMP, JNUM, JPDX, JPDY, BNDX, BNDY, BIGD, JITR, SHFT and LOCK.
          Experimental physical repair build; do not promote until hands-on success plus regression certification.
          EOF
          printf 'status=PASS\nrevision=r54\nimage_sha256=%s\n' "$img_sha" > r54-out/BUILD-STATUS.txt
          sha256sum r54-out/* > r54-out/SHA256SUMS.txt

      - name: Upload r54 USB image and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frames-0.9.98-r54-physical-ps2-jitter-smoothing-rufus-image
          path: r54-out/**
          if-no-files-found: error
          retention-days: 14
