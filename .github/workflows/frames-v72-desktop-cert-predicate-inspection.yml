name: Frames v72 Desktop Cert Predicate Inspection

on:
  workflow_dispatch:
  push:
    branches: [ v116-full-product-v101-integration ]
    paths:
      - '.github/workflows/frames-v72-desktop-cert-predicate-inspection.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v116-full-product-v101-integration
      - name: Extract v72 desktop certification predicate
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/v72-desktop-cert-inspection"
          TMP="$RUNNER_TEMP/v72-cert-inspect"
          rm -rf "$OUT" "$TMP"
          mkdir -p "$OUT" "$TMP"
          unzip -q "$GITHUB_WORKSPACE/Frames-0.9.62-Source-v72-r1.zip" -d "$TMP"
          SRC="$(find "$TMP" -type f -name VERSION -print | while read -r f; do [ "$(tr -d '\r\n' < "$f")" = '0.9.62' ] && dirname "$f" && break; done)"
          test -n "$SRC"
          K="$SRC/kernel/main.nx"
          echo "source=$SRC" > "$OUT/IDENTITY.txt"
          grep -n -C 100 -E 'serial_marker_desktop_cert_fail|desktop_cert|desktop_ready|desktop.*cert|cert.*desktop' "$K" > "$OUT/CERT-FAIL-CONTEXT.txt" || true
          grep -n -C 50 -E 'serial_marker_pre1_promotion_blocked|serial_marker_pre1_snapshot_ready|serial_marker_desktop_policy_ok|serial_marker_desktop_write_lock_ok|serial_marker_desktop_phase1_ok|serial_marker_integrated_gui_ok' "$K" > "$OUT/DESKTOP-MARKER-CONTEXT.txt" || true
          grep -n -E 'let .*desktop|var .*desktop|desktop_[A-Za-z0-9_]*\s*=|.*_ready\s*=' "$K" > "$OUT/DESKTOP-ASSIGNMENTS.txt" || true
          grep -n -C 25 -E 'if .*desktop|if .*cert|promotion|snapshot|gui_app_phase1_compose|desktop_ready' "$K" > "$OUT/DESKTOP-BRANCHES.txt" || true
          wc -c "$OUT"/*.txt | tee "$OUT/SIZES.txt"
          test -s "$OUT/CERT-FAIL-CONTEXT.txt" || test -s "$OUT/DESKTOP-MARKER-CONTEXT.txt"
      - name: Upload inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Frames-v72-Desktop-Cert-Predicate-Inspection
          path: v72-desktop-cert-inspection/
          if-no-files-found: error
