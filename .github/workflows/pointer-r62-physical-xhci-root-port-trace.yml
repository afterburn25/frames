name: Frames 0.9.98 r62 Physical xHCI Root-Port Enumeration Trace USB Image

on:
  workflow_dispatch:
  push:
    branches: [ r56-linux-input-architecture ]
    paths:
      - '.github/workflows/pointer-r62-physical-xhci-root-port-trace.yml'
      - 'tools/ci/make_r62_physical_xhci_root_port_trace.py'
      - 'tools/ci/make_r59_windows_log_partition.py'
      - 'tools/ci/make_r58_input_flight_recorder_fixed.py'
      - 'tools/ci/make_r58_input_flight_recorder.py'
      - 'tools/ci/make_r57_persistent_xhci_trace.py'

permissions:
  contents: read

env:
  EXPECTED_PARENT_SHA256: 1c7f1b514d9aa2f847f724e8b633286d069d745bf7c281a3967c46bbfea1a18c
  EXPECTED_R46_KERNEL_MAIN_SHA256: e5ccd3d4a453184f620e2ed5f928599bc8a7fa6959098f3aeff4916f6dcff165

jobs:
  build-r62:
    name: Build r62 physical xHCI root-port trace Rufus image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r56-linux-input-architecture

      - name: Reconstruct protected r46 base and apply r62
        shell: bash
        run: |
          set -euo pipefail
          rm -rf r62-out "$RUNNER_TEMP/r62"
          mkdir -p r62-out "$RUNNER_TEMP/r62"
          parent_sha="$(sha256sum Frames-0.9.98-Pointer-Diagnostics-CI-v1.zip | awk '{print $1}')"
          test "$parent_sha" = "$EXPECTED_PARENT_SHA256"
          unzip -q Frames-0.9.98-Pointer-Diagnostics-CI-v1.zip -d "$RUNNER_TEMP/r62"
          SRC="$RUNNER_TEMP/r62/Frames-0.9.98-Pointer-CI-Source"
          python3 - "$SRC/kernel/main.nx" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          a='if usb_hid_found != 0 { usb_hid_configured = xhci_configure_boot_hid(xhci_state,phys_state); if usb_hid_configured != 0 { usb_hid_report_ready = xhci_read_first_hid_report(xhci_state,phys_state); } }'
          b='if usb_hid_found != 0 { usb_hid_configured = xhci_configure_boot_hid(xhci_state,phys_state); if usb_hid_configured != 0 { usb_hid_report_ready = 1; } }'
          c='if input_queue_ready != 0 { if usb_hid_report_ready != 0 { input_decode_ready = input_decode_boot_hid(xhci_state,input_state); } else { ps2_poll_fallback(input_state); } }'
          d='if input_queue_ready != 0 { if usb_hid_report_ready != 0 { input_decode_ready = 1; } else { ps2_poll_fallback(input_state); } }'
          assert s.count(a)==1 and s.count(c)==1
          p.write_text(s.replace(a,b).replace(c,d))
          PY
          test "$(sha256sum "$SRC/kernel/main.nx" | awk '{print $1}')" = "$EXPECTED_R46_KERNEL_MAIN_SHA256"
          python3 tools/ci/make_r62_physical_xhci_root_port_trace.py "$SRC/kernel/main.nx"
          grep -q 'R62' "$SRC/kernel/main.nx"
          grep -q 'r62_xhci_root_port_trace' "$SRC/kernel/main.nx"
          echo "FRAMES_DIR=$SRC" >> "$GITHUB_ENV"
          sha256sum "$SRC/kernel/main.nx" > r62-out/R62-KERNEL-SHA256.txt

      - name: Install build and image dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld python3 unzip zip mtools dosfstools gdisk
          find "$FRAMES_DIR" -type f -name '*.sh' -exec chmod +x {} +
          find "$FRAMES_DIR/toolchain" -type f -name nexus -exec chmod +x {} +

      - name: Build base Frames image
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRAMES_DIR"
          ./tools/build.sh
          python3 tools/make_esp.py
          python3 tools/sdk_selftest.py
          python3 tools/make_desktop_preview_image.py
          python3 tools/verify_desktop_preview_image.py --image build/Frames-0.9.98-Desktop-Preview.img --require-pass
          python3 tools/verify_release.py

      - name: Add Windows-readable FRAMESLOG partition
        shell: bash
        run: |
          set -euo pipefail
          BASE="$FRAMES_DIR/build/Frames-0.9.98-Desktop-Preview.img"
          OUT="r62-out/Frames-0.9.98-r62-Physical-xHCI-Root-Port-Trace-FRAMESLOG-Rufus.img"
          cp "$BASE" "$OUT"
          old_bytes="$(stat -c %s "$OUT")"
          truncate -s $((old_bytes + 64*1024*1024)) "$OUT"
          sgdisk -e "$OUT"
          sgdisk -n 2:0:0 -t 2:0700 -c 2:FRAMESLOG "$OUT"
          sgdisk -v "$OUT" | tee r62-out/GPT-VERIFY.txt
          read START SECTORS <<<"$(python3 - "$OUT" <<'PY'
          import struct,sys
          with open(sys.argv[1],'rb') as f:
              f.seek(2*512+128); e=f.read(128)
          first,last=struct.unpack_from('<QQ',e,32)
          if first<34 or last<first: raise SystemExit('invalid GPT partition #2')
          print(first,last-first+1)
          PY
          )"
          PART="r62-out/FRAMESLOG.part.img"
          truncate -s $((SECTORS*512)) "$PART"
          mkfs.fat -F 32 -n FRAMESLOG "$PART"
          truncate -s 1048576 r62-out/PTRLOG.BIN
          mcopy -o -i "$PART" r62-out/PTRLOG.BIN ::PTRLOG.BIN
          dd if="$PART" of="$OUT" bs=512 seek="$START" conv=notrunc status=none
          rm -f "$PART"

      - name: Package r62 evidence
        shell: bash
        run: |
          set -euo pipefail
          IMG="r62-out/Frames-0.9.98-r62-Physical-xHCI-Root-Port-Trace-FRAMESLOG-Rufus.img"
          cat > r62-out/HANDS-ON-TEST.txt <<'EOF'
          Flash with Rufus/raw image mode. Plug the physical USB mouse in before boot.
          r62 inventories up to eight connected xHCI root ports and replays the basic
          enumeration sequence independently of HID and storage persistence.

          P1..P8 are packed records: byte0=physical port, low nibble byte1=speed,
          high nibble byte1=deepest stage, byte2=xHCI completion/error snapshot.
          Stages: 2 reset, 3 slot enabled, 4 Address Device, 5 descriptor8, 6 full descriptor.
          DPRT is the deepest-progress physical port; PSC is its raw PORTSC; DVID its VID;
          DSCC packs deepest stage + completion code; PCNT is the number of connected-port attempts.

          Photograph the P1..P8 and DPRT/PSC/DVID/DSCC/PCNT rows after boot.
          Diagnostic-only. Do not promote r62.
          EOF
          sha256sum "$IMG" | tee r62-out/IMAGE-SHA256.txt
          printf 'status=PASS\nrevision=r62\nstrategy=physical-xhci-root-port-enumeration-trace\n' > r62-out/BUILD-STATUS.txt
          sha256sum r62-out/* > r62-out/SHA256SUMS.txt

      - name: Upload r62 image and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frames-0.9.98-r62-physical-xhci-root-port-trace-rufus-image
          path: r62-out/**
          if-no-files-found: error
          retention-days: 14
