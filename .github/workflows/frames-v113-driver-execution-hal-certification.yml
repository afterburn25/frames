name: Frames 0.9.103 v113 Driver Execution Hardware Abstraction Phase 5

on:
  workflow_dispatch:
  push:
    branches: [ v113-driver-execution-hal ]
    paths:
      - '.github/workflows/frames-v113-driver-execution-hal-certification.yml'
      - 'architecture/v113/**'

env:
  KIT_SHA256: 61b0fc25513719fce554729724c7848647de9cffe54434d4ab5f7ba8af42a36a
  SOURCE_SHA256: 5f8c13adac6d34e64bd47d9463a3e261cd0b51bb5ddb500aa9f7b87c2914a52d
  V109_MAIN_SHA256: 82594aaea923a2a19c06eadb73d8d985941b392c56b8c613866b5a99523ae806
  V110_MAIN_SHA256: 788f456bc334fac55c14b2f4c4b04bd39d84822d42a2d655bcb2f5b8d982bdc7
  V111_MAIN_SHA256: e1dfef88b17199311da98d7474673a16b3aa54826c3d95284e35b74c83c49f23
  V112_MAIN_SHA256: 40acf98479fbf81122411b01afa7192b99b44ba6ab1dbb188f7d8f14c1f74085

jobs:
  certify-v113:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v113-driver-execution-hal

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf clang lld python3 unzip mtools dosfstools gdisk file

      - name: Reconstruct two sealed v113 candidates
        run: |
          set -euo pipefail
          E="$GITHUB_WORKSPACE/v113-evidence"; mkdir -p "$E" "$RUNNER_TEMP/kit" "$RUNNER_TEMP/a" "$RUNNER_TEMP/b"
          KIT="$GITHUB_WORKSPACE/Frames-0.9.98-Runtime-Certification-Kit-v108-r9.zip"
          test "$(sha256sum "$KIT"|awk '{print $1}')" = "$KIT_SHA256"
          unzip -q "$KIT" -d "$RUNNER_TEMP/kit"
          Z="$RUNNER_TEMP/kit/Frames-0.9.98-Source-v108.zip"
          test "$(sha256sum "$Z"|awk '{print $1}')" = "$SOURCE_SHA256"
          unzip -q "$Z" -d "$RUNNER_TEMP/a"; unzip -q "$Z" -d "$RUNNER_TEMP/b"
          A="$RUNNER_TEMP/a/Frames-0.9.98"; B="$RUNNER_TEMP/b/Frames-0.9.98"
          for S in "$A" "$B"; do
            python3 architecture/v109/make_unified_device_architecture_v109.py "$S/kernel/main.nx"
            test "$(sha256sum "$S/kernel/main.nx"|awk '{print $1}')" = "$V109_MAIN_SHA256"
            python3 architecture/v110/make_driver_runtime_v110.py "$S/kernel/main.nx"
            test "$(sha256sum "$S/kernel/main.nx"|awk '{print $1}')" = "$V110_MAIN_SHA256"
            python3 architecture/v111/make_async_io_service_runtime_v111.py "$S/kernel/main.nx"
            test "$(sha256sum "$S/kernel/main.nx"|awk '{print $1}')" = "$V111_MAIN_SHA256"
            python3 architecture/v112/make_device_service_integration_v112.py "$S/kernel/main.nx"
            test "$(sha256sum "$S/kernel/main.nx"|awk '{print $1}')" = "$V112_MAIN_SHA256"
            python3 architecture/v113/make_driver_execution_hal_v113.py "$S/kernel/main.nx"
            chmod +x "$S"/tools/*.sh "$S"/tools/*.py "$S"/sdk/*.sh 2>/dev/null || true
            find "$S/toolchain" -type f -name nexus -exec chmod +x {} +
          done
          A_SHA="$(sha256sum "$A/kernel/main.nx"|awk '{print $1}')"; B_SHA="$(sha256sum "$B/kernel/main.nx"|awk '{print $1}')"
          test "$A_SHA" = "$B_SHA"
          printf '%s  kernel/main.nx\n' "$A_SHA" > "$E/V113-KERNEL-MAIN-SHA256.txt"
          echo "A=$A" >> "$GITHUB_ENV"; echo "B=$B" >> "$GITHUB_ENV"; echo "V113_MAIN_SHA=$A_SHA" >> "$GITHUB_ENV"

      - name: Structural v113 gate
        run: |
          set -euo pipefail
          python3 - "$A/kernel/main.nx" "$GITHUB_WORKSPACE/v113-evidence/V113-STRUCTURAL.json" <<'PY'
          import json,re,sys,pathlib
          s=pathlib.Path(sys.argv[1]).read_text()
          names=['hal_mmio_v6_selftest','hal_irq_v6_selftest','hal_dma_v6_selftest','driver_exec_v6_selftest','controller_queue_v6_selftest','usb_hal_v6_attach','input_hal_v6_attach','storage_hal_v6_attach','network_hal_v6_attach','graphics_hal_v6_attach','hal_runtime_v6_snapshot','hal_runtime_gate_v6']
          checks={f'symbol_{n}':('fn '+n+'(' in s) for n in names}
          offenders=[]
          for m in re.finditer(r'fn\s+([A-Za-z0-9_]+)\(([^)]*)\)',s):
            args=[x for x in m.group(2).split(',') if x.strip()]
            if len(args)>4: offenders.append([m.group(1),len(args)])
          checks['max_four_parameters']=not offenders
          checks['v112_gate_preserved']='fn service_integration_gate_v5(' in s
          checks['v111_gate_preserved']='fn async_runtime_gate_v4(' in s
          checks['v110_gate_preserved']='fn driver_runtime_gate_v3(' in s
          checks['v109_gate_preserved']='fn architecture_platform_v2_gate(' in s
          checks['v113_process_slots_present']=all(f'process_state+{x}' in s for x in range(1936,2032,8))
          checks['controller_register_programming_added']=False
          checks['physical_transport_behavior_changed']=False
          status='PASS' if all(v for k,v in checks.items() if k not in ['controller_register_programming_added','physical_transport_behavior_changed']) else 'FAIL'
          out={'status':status,'profile':'frames-v113-driver-execution-hal-structural','runtime_layers':12,'checks':checks,'parameter_offenders':offenders,'physical_transport_behavior_changed':False,'controller_register_programming_added':False}
          pathlib.Path(sys.argv[2]).write_text(json.dumps(out,indent=2)+'\n')
          if status!='PASS': raise SystemExit(1)
          PY

      - name: Build both candidates and prove reproducibility
        run: |
          set -euo pipefail
          cd "$A"
          ./tools/build.sh
          python3 tools/sdk_selftest.py --require-pass | tee "$GITHUB_WORKSPACE/v113-evidence/SDK-SELFTEST.json"
          A_FKRN="$(sha256sum build/FramesKernel.fkrn|awk '{print $1}')"
          python3 tools/make_esp.py
          python3 tools/make_desktop_preview_image.py
          python3 tools/verify_release.py > "$GITHUB_WORKSPACE/v113-evidence/RELEASE-VERIFY.log"
          cd "$B"
          ./tools/build.sh
          B_FKRN="$(sha256sum build/FramesKernel.fkrn|awk '{print $1}')"
          test "$A_FKRN" = "$B_FKRN"
          printf 'kernel_main=%s\nfkrn=%s\n' "$V113_MAIN_SHA" "$A_FKRN" > "$GITHUB_WORKSPACE/v113-evidence/REPRODUCIBLE-IDENTITY.txt"
          echo "V113_FKRN_SHA=$A_FKRN" >> "$GITHUB_ENV"

      - name: Locate OVMF firmware
        run: |
          set -euo pipefail
          code=""; vars=""
          for p in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd /usr/share/edk2/ovmf/OVMF_CODE.fd; do [ -f "$p" ] && code="$p" && break; done
          for p in /usr/share/OVMF/OVMF_VARS_4M.fd /usr/share/OVMF/OVMF_VARS.fd /usr/share/edk2/ovmf/OVMF_VARS.fd; do [ -f "$p" ] && vars="$p" && break; done
          test -n "$code"
          echo "OVMF_CODE=$code" >> "$GITHUB_ENV"
          if [ -n "$vars" ]; then echo "OVMF_VARS=$vars" >> "$GITHUB_ENV"; fi
          printf 'OVMF_CODE=%s\nOVMF_VARS=%s\n' "$code" "$vars" > "$GITHUB_WORKSPACE/v113-evidence/OVMF-IDENTITY.txt"

      - name: QEMU OVMF v113 runtime capture
        run: |
          set -euo pipefail
          cd "$A"; export FRAMES_PREBUILT=1
          set +e
          timeout --signal=TERM --kill-after=10s 75s ./tools/qemu_secure_online_services_certify.sh > "$GITHUB_WORKSPACE/v113-evidence/QEMU-CAPTURE.log" 2>&1
          RC=$?
          set -e
          test -s build/secure-online-serial.log
          cp build/secure-online-serial.log "$GITHUB_WORKSPACE/v113-evidence/secure-online-serial.log"
          python3 "$GITHUB_WORKSPACE/architecture/v113/verify_driver_execution_hal_v113.py" --serial build/secure-online-serial.log --require-pass | tee "$GITHUB_WORKSPACE/v113-evidence/V113-RUNTIME.json"
          printf 'capture_rc=%s\n' "$RC" > "$GITHUB_WORKSPACE/v113-evidence/QEMU-HARNESS.txt"

      - name: Final fail-closed v113 certification
        run: |
          set -euo pipefail
          python3 - "$GITHUB_WORKSPACE/v113-evidence" <<'PY'
          import json,pathlib,sys
          e=pathlib.Path(sys.argv[1]); req=['V113-KERNEL-MAIN-SHA256.txt','V113-STRUCTURAL.json','REPRODUCIBLE-IDENTITY.txt','RELEASE-VERIFY.log','OVMF-IDENTITY.txt','secure-online-serial.log','V113-RUNTIME.json']
          missing=[x for x in req if not (e/x).is_file()]
          checks={'required_evidence':not missing}
          for f in ['V113-STRUCTURAL.json','V113-RUNTIME.json']:
            checks[f]=(e/f).is_file() and json.loads((e/f).read_text()).get('status')=='PASS'
          checks['release_structure']=(e/'RELEASE-VERIFY.log').is_file() and 'ALL RELEASE STRUCTURE CHECKS PASSED' in (e/'RELEASE-VERIFY.log').read_text(errors='replace')
          status='PASS' if all(checks.values()) else 'FAIL'
          out={'status':status,'profile':'frames-0.9.103-v113-driver-execution-hardware-abstraction-phase5','base_certified':'0.9.102-v112','candidate_version':'0.9.103','runtime_layers':12,'checks':checks,'missing':missing,'promotion_allowed':status=='PASS','physical_transport_behavior_changed':False,'controller_register_programming_added':False}
          (e/'FINAL-V113-CERTIFICATION.json').write_text(json.dumps(out,indent=2)+'\n')
          if status!='PASS': raise SystemExit(1)
          PY
          cd "$GITHUB_WORKSPACE/v113-evidence"; find . -maxdepth 1 -type f ! -name EVIDENCE-FILES-SHA256.txt -print0 | sort -z | xargs -0 sha256sum > EVIDENCE-FILES-SHA256.txt

      - name: Upload v113 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frames-0.9.103-v113-driver-execution-hardware-abstraction-phase5-evidence
          path: ${{ github.workspace }}/v113-evidence/**
          if-no-files-found: error
          retention-days: 30
