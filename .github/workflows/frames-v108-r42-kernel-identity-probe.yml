name: Frames v108 r42 Kernel Identity Probe

on:
  workflow_dispatch:
  push:
    branches: [ v108-usb-hub-topology-r1 ]
    paths:
      - '.github/workflows/frames-v108-r42-kernel-identity-probe.yml'
      - 'tools/ci/patch_v108_r42_hid_persistent_interrupt_in.py'

permissions:
  contents: read
  actions: read
  statuses: write

jobs:
  derive:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v108-usb-hub-topology-r1
      - name: Fetch exact r21 protected source
        uses: actions/download-artifact@v4
        with:
          name: Frames-v108-r21-Candidate
          path: r21-candidate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: afterburn25/frames
          run-id: '31979817129'
      - name: Derive exact r42 kernel identity
        run: |
          set -euo pipefail
          K='r21-candidate/evidence/kernel-r21.nx'
          test -f "$K"
          cp "$K" /tmp/kernel-r42.nx
          python3 tools/ci/patch_v108_r42_hid_persistent_interrupt_in.py /tmp/kernel-r42.nx | tee /tmp/r42-patch-sha.txt
          echo "R42_KERNEL_SHA256=$(sha256sum /tmp/kernel-r42.nx | awk '{print $1}')"
          grep -F 'if r42_target && state==1' /tmp/kernel-r42.nx >/dev/null
          grep -F 'v136_xhci_command_endpoint(xhci_state,15,0)' /tmp/kernel-r42.nx >/dev/null
      - name: Publish r42 identity-probe status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          STATE=success
          DESC='r42 identity probe PASS'
          if [ "$JOB_STATUS" != "success" ]; then STATE=failure; DESC='r42 identity probe FAIL'; fi
          TARGET="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          python3 - "$STATE" "$DESC" "$TARGET" <<'PY'
          import json,sys
          open('/tmp/status.json','w').write(json.dumps({'state':sys.argv[1],'context':'frames/r42-identity-probe','description':sys.argv[2],'target_url':sys.argv[3]}))
          PY
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary @/tmp/status.json
