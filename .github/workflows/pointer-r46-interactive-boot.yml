name: Frames 0.9.98 r46 Interactive Pointer ISO

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/pointer-r46-interactive-boot.yml'

permissions:
  contents: read

env:
  EXPECTED_PARENT_SHA256: 1c7f1b514d9aa2f847f724e8b633286d069d745bf7c281a3967c46bbfea1a18c
  CERTIFIED_R46_ARCHIVE_SHA256: 0be1fefaeb5a3fa6438ded01321ef197e2873a49b6bb98defdecad3384cb7eff
  EXPECTED_R46_KERNEL_MAIN_SHA256: e5ccd3d4a453184f620e2ed5f928599bc8a7fa6959098f3aeff4916f6dcff165

jobs:
  build-interactive-iso:
    name: Build certified r46 hands-on UEFI ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Initialize fail-safe evidence directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf boot-out
          mkdir -p boot-out
          printf 'status=started\n' > boot-out/BUILD-STATUS.txt

      - name: Verify protected parent source kit
        shell: bash
        run: |
          set -euo pipefail
          test -f Frames-0.9.98-Pointer-Diagnostics-CI-v1.zip
          actual="$(sha256sum Frames-0.9.98-Pointer-Diagnostics-CI-v1.zip | awk '{print $1}')"
          echo "protected_parent_sha256=$actual" | tee boot-out/PARENT-IDENTITY.txt
          test "$actual" = "$EXPECTED_PARENT_SHA256"

      - name: Reconstruct certified r46 source identity
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/r46-interactive"
          mkdir -p "$RUNNER_TEMP/r46-interactive"
          unzip -q Frames-0.9.98-Pointer-Diagnostics-CI-v1.zip -d "$RUNNER_TEMP/r46-interactive"
          SRC="$RUNNER_TEMP/r46-interactive/Frames-0.9.98-Pointer-CI-Source"
          cp "$SRC/kernel/main.nx" boot-out/kernel-main-before.nx
          python3 - "$SRC/kernel/main.nx" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          old1='if usb_hid_found != 0 { usb_hid_configured = xhci_configure_boot_hid(xhci_state,phys_state); if usb_hid_configured != 0 { usb_hid_report_ready = xhci_read_first_hid_report(xhci_state,phys_state); } }'
          new1='if usb_hid_found != 0 { usb_hid_configured = xhci_configure_boot_hid(xhci_state,phys_state); if usb_hid_configured != 0 { usb_hid_report_ready = 1; } }'
          old2='if input_queue_ready != 0 { if usb_hid_report_ready != 0 { input_decode_ready = input_decode_boot_hid(xhci_state,input_state); } else { ps2_poll_fallback(input_state); } }'
          new2='if input_queue_ready != 0 { if usb_hid_report_ready != 0 { input_decode_ready = 1; } else { ps2_poll_fallback(input_state); } }'
          assert s.count(old1)==1
          assert s.count(old2)==1
          p.write_text(s.replace(old1,new1).replace(old2,new2))
          PY
          cp "$SRC/kernel/main.nx" boot-out/kernel-main-after.nx
          diff -u boot-out/kernel-main-before.nx boot-out/kernel-main-after.nx > boot-out/usb-startup-handoff.patch || true
          kernel_sha="$(sha256sum "$SRC/kernel/main.nx" | awk '{print $1}')"
          echo "patched_kernel_main_sha256=$kernel_sha" | tee boot-out/R46-SOURCE-IDENTITY.txt
          echo "certified_r46_archive_sha256=$CERTIFIED_R46_ARCHIVE_SHA256" >> boot-out/R46-SOURCE-IDENTITY.txt
          test "$kernel_sha" = "$EXPECTED_R46_KERNEL_MAIN_SHA256"
          echo "FRAMES_DIR=$SRC" >> "$GITHUB_ENV"

      - name: Install build and ISO dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld python3 unzip zip xorriso mtools dosfstools
          find "$FRAMES_DIR" -type f -name '*.sh' -exec chmod +x {} +
          find "$FRAMES_DIR/toolchain" -type f -name nexus -exec chmod +x {} +

      - name: Build and verify certified r46 image
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRAMES_DIR"
          ./tools/build.sh
          python3 tools/make_esp.py
          python3 tools/sdk_selftest.py
          python3 tools/make_desktop_preview_image.py
          python3 tools/verify_desktop_preview_image.py --image build/Frames-0.9.98-Desktop-Preview.img --require-pass
          python3 tools/verify_release.py
          cp build/Frames-0.9.98-Desktop-Preview.img "$GITHUB_WORKSPACE/boot-out/Frames-0.9.98-r46-Certified-Pointer-Interactive-Boot.img"

      - name: Create UEFI bootable ISO from certified ESP
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRAMES_DIR"
          ESP="build/esp.img"
          if [ ! -f "$ESP" ]; then
            ESP="$(find build -maxdepth 2 -type f \( -iname '*esp*.img' -o -iname '*efi*.img' \) | head -n1)"
          fi
          test -n "$ESP" -a -f "$ESP"
          cp "$ESP" "$GITHUB_WORKSPACE/boot-out/Frames-0.9.98-r46-UEFI-ESP.img"
          mkdir -p "$RUNNER_TEMP/r46-iso-root"
          cat > "$RUNNER_TEMP/r46-iso-root/README.TXT" <<'EOF'
          Frames 0.9.98 r46 Certified Pointer Interactive Boot
          UEFI hands-on pointer verification image.
          EOF
          cp "$ESP" "$RUNNER_TEMP/r46-iso-root/efiboot.img"
          xorriso -as mkisofs \
            -R -J -V 'FRAMES_R46' \
            -eltorito-alt-boot \
            -e efiboot.img \
            -no-emul-boot \
            -o "$GITHUB_WORKSPACE/boot-out/Frames-0.9.98-r46-Certified-Pointer-Interactive-Boot.iso" \
            "$RUNNER_TEMP/r46-iso-root"
          test -s "$GITHUB_WORKSPACE/boot-out/Frames-0.9.98-r46-Certified-Pointer-Interactive-Boot.iso"
          xorriso -indev "$GITHUB_WORKSPACE/boot-out/Frames-0.9.98-r46-Certified-Pointer-Interactive-Boot.iso" -report_el_torito plain > "$GITHUB_WORKSPACE/boot-out/ISO-ELTORITO-REPORT.txt" 2>&1
          grep -qi 'UEFI\|EFI' "$GITHUB_WORKSPACE/boot-out/ISO-ELTORITO-REPORT.txt"

      - name: Record ISO identity and test instructions
        shell: bash
        run: |
          set -euo pipefail
          iso_sha="$(sha256sum boot-out/Frames-0.9.98-r46-Certified-Pointer-Interactive-Boot.iso | awk '{print $1}')"
          img_sha="$(sha256sum boot-out/Frames-0.9.98-r46-Certified-Pointer-Interactive-Boot.img | awk '{print $1}')"
          cat > boot-out/BOOT-IDENTITY.txt <<EOF
          Frames 0.9.98 r46 Certified Pointer Interactive Boot ISO
          certified_candidate_archive_sha256=$CERTIFIED_R46_ARCHIVE_SHA256
          protected_parent_sha256=$EXPECTED_PARENT_SHA256
          patched_kernel_main_sha256=$EXPECTED_R46_KERNEL_MAIN_SHA256
          iso=Frames-0.9.98-r46-Certified-Pointer-Interactive-Boot.iso
          iso_sha256=$iso_sha
          raw_image_sha256=$img_sha
          certification=Frames 0.9.98 Pointer Regression CI v5 PASS
          ps2_regression=PASS
          usb_regression=PASS
          EOF
          cat > boot-out/HANDS-ON-TEST.txt <<'EOF'
          Boot the ISO in UEFI mode using the same setup as prior Frames hands-on tests.
          When Pointer Diagnostic Mode appears, immediately move right, left, down, and up.
          Confirm first motion, continuous motion, 5-10 second idle/resume, then buttons/dragging if available.
          Report whether the cursor moves and whether the mouse path is USB or PS/2.
          EOF
          printf 'status=PASS\niso_sha256=%s\n' "$iso_sha" > boot-out/BUILD-STATUS.txt
          sha256sum boot-out/* > boot-out/SHA256SUMS.txt
          cat boot-out/BOOT-IDENTITY.txt

      - name: Upload certified r46 UEFI ISO
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frames-0.9.98-r46-certified-pointer-uefi-iso
          path: boot-out/**
          if-no-files-found: error
          retention-days: 14
