name: Frames 0.9.98 r46 Interactive Pointer Boot

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/pointer-r46-interactive-boot.yml'

permissions:
  contents: read

env:
  EXPECTED_PARENT_SHA256: 1c7f1b514d9aa2f847f724e8b633286d069d745bf7c281a3967c46bbfea1a18c
  EXPECTED_R46_CANDIDATE_SHA256: 0be1fefaeb5a3fa6438ded01321ef197e2873a49b6bb98defdecad3384cb7eff
  CANDIDATE_NAME: Frames-0.9.98-Pointer-USB-Startup-Fix-r46-Candidate

jobs:
  build-interactive-boot:
    name: Build certified r46 hands-on boot image
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Verify protected parent source kit
        shell: bash
        run: |
          set -euo pipefail
          test -f Frames-0.9.98-Pointer-Diagnostics-CI-v1.zip
          actual="$(sha256sum Frames-0.9.98-Pointer-Diagnostics-CI-v1.zip | awk '{print $1}')"
          echo "protected_parent_sha256=$actual"
          test "$actual" = "$EXPECTED_PARENT_SHA256"

      - name: Reconstruct exact certified r46 candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/r46-interactive" "$RUNNER_TEMP/$CANDIDATE_NAME" boot-out
          mkdir -p "$RUNNER_TEMP/r46-interactive" boot-out
          unzip -q Frames-0.9.98-Pointer-Diagnostics-CI-v1.zip -d "$RUNNER_TEMP/r46-interactive"
          SRC="$RUNNER_TEMP/r46-interactive/Frames-0.9.98-Pointer-CI-Source"
          python3 - "$SRC/kernel/main.nx" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text()
          old1='if usb_hid_found != 0 { usb_hid_configured = xhci_configure_boot_hid(xhci_state,phys_state); if usb_hid_configured != 0 { usb_hid_report_ready = xhci_read_first_hid_report(xhci_state,phys_state); } }'
          new1='if usb_hid_found != 0 { usb_hid_configured = xhci_configure_boot_hid(xhci_state,phys_state); if usb_hid_configured != 0 { usb_hid_report_ready = 1; } }'
          old2='if input_queue_ready != 0 { if usb_hid_report_ready != 0 { input_decode_ready = input_decode_boot_hid(xhci_state,input_state); } else { ps2_poll_fallback(input_state); } }'
          new2='if input_queue_ready != 0 { if usb_hid_report_ready != 0 { input_decode_ready = 1; } else { ps2_poll_fallback(input_state); } }'
          assert s.count(old1)==1, f'boot first-report site count={s.count(old1)}'
          assert s.count(old2)==1, f'boot HID decode site count={s.count(old2)}'
          p.write_text(s.replace(old1,new1).replace(old2,new2))
          PY
          cp -a "$SRC" "$RUNNER_TEMP/$CANDIDATE_NAME"
          (cd "$RUNNER_TEMP" && zip -qr -X "$GITHUB_WORKSPACE/boot-out/$CANDIDATE_NAME.zip" "$CANDIDATE_NAME")
          candidate_sha="$(sha256sum "boot-out/$CANDIDATE_NAME.zip" | awk '{print $1}')"
          echo "reconstructed_candidate_sha256=$candidate_sha"
          test "$candidate_sha" = "$EXPECTED_R46_CANDIDATE_SHA256"
          echo "FRAMES_DIR=$SRC" >> "$GITHUB_ENV"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld python3 unzip zip
          find "$FRAMES_DIR" -type f -name '*.sh' -exec chmod +x {} +
          find "$FRAMES_DIR/toolchain" -type f -name nexus -exec chmod +x {} +

      - name: Build and verify interactive image
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRAMES_DIR"
          ./tools/build.sh
          python3 tools/make_esp.py
          python3 tools/sdk_selftest.py
          python3 tools/make_desktop_preview_image.py
          python3 tools/verify_desktop_preview_image.py --image build/Frames-0.9.98-Desktop-Preview.img --require-pass
          python3 tools/verify_release.py
          cp build/Frames-0.9.98-Desktop-Preview.img "$GITHUB_WORKSPACE/boot-out/Frames-0.9.98-r46-Certified-Pointer-Interactive-Boot.img"

      - name: Record hands-on boot identity
        shell: bash
        run: |
          set -euo pipefail
          image_sha="$(sha256sum boot-out/Frames-0.9.98-r46-Certified-Pointer-Interactive-Boot.img | awk '{print $1}')"
          cat > boot-out/BOOT-IDENTITY.txt <<EOF
          Frames 0.9.98 r46 Certified Pointer Interactive Boot
          certified_candidate=Frames-0.9.98-Pointer-USB-Startup-Fix-r46-Candidate.zip
          certified_candidate_sha256=$EXPECTED_R46_CANDIDATE_SHA256
          protected_parent_sha256=$EXPECTED_PARENT_SHA256
          image=Frames-0.9.98-r46-Certified-Pointer-Interactive-Boot.img
          image_sha256=$image_sha
          certification=Frames 0.9.98 Pointer Regression CI v5 PASS
          ps2_regression=PASS
          usb_regression=PASS
          purpose=hands-on interactive pointer verification; no promotion beyond certified r46 implied by hands-on result
          EOF
          cat > boot-out/HANDS-ON-TEST.txt <<'EOF'
          1. Boot this image using the same UEFI/VM setup used for prior Frames pointer hands-on tests.
          2. As soon as Pointer Diagnostic Mode is visible, move the mouse immediately to the right, then left, down, and up.
          3. Verify the very first movement is visible; there should be no initial dead/short USB motion.
          4. Move continuously for several seconds and confirm the cursor follows smoothly.
          5. Stop moving for 5-10 seconds, then resume and confirm movement resumes immediately.
          6. If available, test primary/secondary buttons and dragging.
          7. Report: boot success/failure, cursor first-motion result, continuous-motion result, idle/resume result, button result, and whether the mouse was USB or PS/2.
          EOF
          sha256sum boot-out/* > boot-out/SHA256SUMS.txt
          cat boot-out/BOOT-IDENTITY.txt
          cat boot-out/HANDS-ON-TEST.txt

      - name: Upload certified r46 hands-on boot
        uses: actions/upload-artifact@v4
        with:
          name: frames-0.9.98-r46-certified-pointer-interactive-boot
          path: boot-out/**
          if-no-files-found: error
          retention-days: 14
