name: Frames v108 r25 Focused Flight Recorder Persistence Probe

on:
  workflow_dispatch:
  push:
    branches: [ v108-usb-hub-topology-r1 ]
    paths:
      - '.github/workflows/frames-v108-r25-persistence-probe.yml'
      - 'tools/ci/patch_v108_r25e_msc_armdiag.py'
      - 'tools/ci/r25_persistence_probe.py'
      - 'tools/ci/qemu_r25_flight_log_gate.py'
      - 'tools/ci/make_r25_logging_usb.py'

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { ref: v108-usb-hub-topology-r1 }
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang lld python3 python3-pil unzip mtools dosfstools gdisk xorriso qemu-system-x86 ovmf
      - uses: actions/download-artifact@v4
        with:
          name: Frames-v108-r21-Candidate
          path: r21-candidate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: afterburn25/frames
          run-id: '31979817129'
      - name: Run focused persistence probe
        run: python3 tools/ci/r25_persistence_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Frames-v108-r25-Persistence-Probe
          path: |
            probe-evidence/**
            probe-out/*.iso
            probe-out/*.img
          if-no-files-found: warn
          retention-days: 30
