name: Frames 0.9.98 r59 Windows-Readable FRAMESLOG Partition USB Image

on:
  workflow_dispatch:
  push:
    branches: [ r56-linux-input-architecture ]
    paths:
      - '.github/workflows/pointer-r59-windows-log-partition.yml'
      - 'tools/ci/make_r59_windows_log_partition.py'
      - 'tools/ci/make_r58_input_flight_recorder_fixed.py'
      - 'tools/ci/make_r58_input_flight_recorder.py'
      - 'tools/ci/make_r57_persistent_xhci_trace.py'

permissions:
  contents: read

env:
  EXPECTED_PARENT_SHA256: 1c7f1b514d9aa2f847f724e8b633286d069d745bf7c281a3967c46bbfea1a18c
  EXPECTED_R46_KERNEL_MAIN_SHA256: e5ccd3d4a453184f620e2ed5f928599bc8a7fa6959098f3aeff4916f6dcff165

jobs:
  build-r59:
    name: Build r59 Windows-readable FRAMESLOG Rufus image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r56-linux-input-architecture

      - name: Reconstruct protected r46 base and apply r59
        shell: bash
        run: |
          set -euo pipefail
          rm -rf r59-out "$RUNNER_TEMP/r59"
          mkdir -p r59-out "$RUNNER_TEMP/r59"
          parent_sha="$(sha256sum Frames-0.9.98-Pointer-Diagnostics-CI-v1.zip | awk '{print $1}')"
          test "$parent_sha" = "$EXPECTED_PARENT_SHA256"
          unzip -q Frames-0.9.98-Pointer-Diagnostics-CI-v1.zip -d "$RUNNER_TEMP/r59"
          SRC="$RUNNER_TEMP/r59/Frames-0.9.98-Pointer-CI-Source"
          python3 - "$SRC/kernel/main.nx" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          a='if usb_hid_found != 0 { usb_hid_configured = xhci_configure_boot_hid(xhci_state,phys_state); if usb_hid_configured != 0 { usb_hid_report_ready = xhci_read_first_hid_report(xhci_state,phys_state); } }'
          b='if usb_hid_found != 0 { usb_hid_configured = xhci_configure_boot_hid(xhci_state,phys_state); if usb_hid_configured != 0 { usb_hid_report_ready = 1; } }'
          c='if input_queue_ready != 0 { if usb_hid_report_ready != 0 { input_decode_ready = input_decode_boot_hid(xhci_state,input_state); } else { ps2_poll_fallback(input_state); } }'
          d='if input_queue_ready != 0 { if usb_hid_report_ready != 0 { input_decode_ready = 1; } else { ps2_poll_fallback(input_state); } }'
          assert s.count(a)==1 and s.count(c)==1
          p.write_text(s.replace(a,b).replace(c,d))
          PY
          test "$(sha256sum "$SRC/kernel/main.nx" | awk '{print $1}')" = "$EXPECTED_R46_KERNEL_MAIN_SHA256"
          python3 tools/ci/make_r59_windows_log_partition.py "$SRC/kernel/main.nx"
          grep -q 'R59 FRAMESLOG GPT partition 2' "$SRC/kernel/main.nx"
          grep -q 'ptrtrace_save_usb' "$SRC/kernel/main.nx"
          echo "FRAMES_DIR=$SRC" >> "$GITHUB_ENV"
          sha256sum "$SRC/kernel/main.nx" > r59-out/R59-KERNEL-SHA256.txt

      - name: Install build and image dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld python3 unzip zip mtools dosfstools gdisk
          find "$FRAMES_DIR" -type f -name '*.sh' -exec chmod +x {} +
          find "$FRAMES_DIR/toolchain" -type f -name nexus -exec chmod +x {} +

      - name: Build base Frames image
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRAMES_DIR"
          ./tools/build.sh
          python3 tools/make_esp.py
          python3 tools/sdk_selftest.py
          python3 tools/make_desktop_preview_image.py
          python3 tools/verify_desktop_preview_image.py --image build/Frames-0.9.98-Desktop-Preview.img --require-pass
          python3 tools/verify_release.py

      - name: Add Windows-readable FRAMESLOG partition
        shell: bash
        run: |
          set -euo pipefail
          BASE="$FRAMES_DIR/build/Frames-0.9.98-Desktop-Preview.img"
          OUT="r59-out/Frames-0.9.98-r59-Windows-Readable-FRAMESLOG-Rufus.img"
          cp "$BASE" "$OUT"

          # Add 64 MiB of space, relocate the backup GPT, then create a normal
          # Microsoft Basic Data partition that Windows will mount as a drive.
          old_bytes="$(stat -c %s "$OUT")"
          truncate -s $((old_bytes + 64*1024*1024)) "$OUT"
          sgdisk -e "$OUT"
          sgdisk -n 2:0:0 -t 2:0700 -c 2:FRAMESLOG "$OUT"
          sgdisk -v "$OUT" | tee r59-out/GPT-VERIFY.txt

          read START SECTORS <<<"$(python3 - "$OUT" <<'PY'
          import struct,sys
          p=sys.argv[1]
          with open(p,'rb') as f:
              f.seek(2*512+128)
              e=f.read(128)
          first,last=struct.unpack_from('<QQ',e,32)
          if first<34 or last<first: raise SystemExit('invalid GPT partition #2')
          print(first,last-first+1)
          PY
          )"
          echo "frameslog_start_lba=$START" | tee r59-out/FRAMESLOG-LAYOUT.txt
          echo "frameslog_sectors=$SECTORS" | tee -a r59-out/FRAMESLOG-LAYOUT.txt

          PART="r59-out/FRAMESLOG.part.img"
          truncate -s $((SECTORS*512)) "$PART"
          mkfs.fat -F 32 -n FRAMESLOG "$PART"
          truncate -s 1048576 r59-out/PTRLOG.BIN
          mcopy -o -i "$PART" r59-out/PTRLOG.BIN ::PTRLOG.BIN
          mdir -i "$PART" :: | tee r59-out/FRAMESLOG-DIRECTORY.txt
          grep -q 'PTRLOG' r59-out/FRAMESLOG-DIRECTORY.txt
          dd if="$PART" of="$OUT" bs=512 seek="$START" conv=notrunc status=none
          rm -f "$PART"

      - name: Verify FRAMESLOG filesystem and contiguous PTRLOG
        shell: bash
        run: |
          set -euo pipefail
          IMG="r59-out/Frames-0.9.98-r59-Windows-Readable-FRAMESLOG-Rufus.img"
          python3 - "$IMG" <<'PY' | tee r59-out/PTRLOG-LAYOUT.txt
          import struct,sys
          p=sys.argv[1]
          f=open(p,'rb')
          def sec(lba):
              f.seek(lba*512); return f.read(512)
          f.seek(2*512+128); e=f.read(128)
          part,last=struct.unpack_from('<QQ',e,32)
          assert part>=34 and last>=part
          b=sec(part)
          bps=struct.unpack_from('<H',b,11)[0]; spc=b[13]
          reserved=struct.unpack_from('<H',b,14)[0]; fats=b[16]
          fatsecs=struct.unpack_from('<I',b,36)[0]
          root=struct.unpack_from('<I',b,44)[0]&0x0fffffff
          label=b[71:82].decode('ascii','ignore').rstrip()
          assert bps==512 and spc>=1 and reserved>0 and fats>0 and fatsecs>0
          assert label=='FRAMESLOG', label
          fat_start=part+reserved
          data_start=fat_start+fats*fatsecs
          def cluster_lba(c): return data_start+(c-2)*spc
          def next_cluster(c):
              bo=c*4; d=sec(fat_start+bo//512)
              return struct.unpack_from('<I',d,bo%512)[0]&0x0fffffff
          c=root; found=None
          for _ in range(256):
              for sidx in range(spc):
                  d=sec(cluster_lba(c)+sidx)
                  for off in range(0,512,32):
                      if d[off]==0: break
                      if d[off:off+11]==b'PTRLOG  BIN':
                          hi=struct.unpack_from('<H',d,off+20)[0]
                          lo=struct.unpack_from('<H',d,off+26)[0]
                          fc=(hi<<16)|lo
                          size=struct.unpack_from('<I',d,off+28)[0]
                          found=(fc,size); break
                  if found: break
              if found: break
              c=next_cluster(c)
              if c>=0x0ffffff8: break
          assert found, 'PTRLOG.BIN missing'
          fc,size=found
          assert size==1048576
          clusters=(size + (spc*512)-1)//(spc*512)
          c=fc
          for _ in range(clusters-1):
              n=next_cluster(c)
              assert n==c+1, f'PTRLOG fragmented at {c}->{n}'
              c=n
          print(f'partition2_start_lba={part}')
          print(f'partition2_label={label}')
          print(f'ptrlog_first_cluster={fc}')
          print(f'ptrlog_bytes={size}')
          print(f'ptrlog_cluster_count={clusters}')
          print('ptrlog_contiguous=PASS')
          print('windows_readable_partition=PASS')
          PY

      - name: Package r59 evidence
        shell: bash
        run: |
          set -euo pipefail
          IMG="r59-out/Frames-0.9.98-r59-Windows-Readable-FRAMESLOG-Rufus.img"
          cat > r59-out/HANDS-ON-TEST.txt <<'EOF'
          1. Flash the r59 IMG directly with Rufus/raw image mode.
          2. Plug the USB mouse in before booting Frames.
          3. Boot PTR DIAG R59 and exercise USB mouse + touchpad for at least 15 seconds.
          4. Wait for SAVE=2.
          5. Power off, return the USB to Windows.
          6. Open the FRAMESLOG drive and upload PTRLOG.BIN.

          Partition 1 remains the Frames EFI System Partition.
          Partition 2 is a normal FAT32 Microsoft Basic Data partition labeled FRAMESLOG so Windows can mount it normally.
          PTRLOG.BIN is preallocated and verified contiguous. Runtime logging overwrites only that reserved file area.
          Diagnostic-only. Do not promote r59.
          EOF
          sha256sum "$IMG" | tee r59-out/IMAGE-SHA256.txt
          printf 'status=PASS\nrevision=r59\nlayout=esp-plus-windows-readable-frameslog\n' > r59-out/BUILD-STATUS.txt
          sha256sum r59-out/* > r59-out/SHA256SUMS.txt

      - name: Upload r59 image and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frames-0.9.98-r59-windows-readable-frameslog-rufus-image
          path: r59-out/**
          if-no-files-found: error
          retention-days: 14
