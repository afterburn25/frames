name: Frames v108 Physical Input r14d Text Editing Certification

on:
  workflow_dispatch:
  push:
    branches: [ v108-usb-hub-topology-r1 ]
    paths:
      - '.github/workflows/frames-v108-physical-input-r14d-textedit-cert.yml'
      - 'tools/ci/patch_v108_physical_input_r14c_abi.py'
      - 'tools/ci/qemu_text_edit_ibeam_gate_r14b.py'

permissions:
  contents: read

env:
  KIT_SHA: 61b0fc25513719fce554729724c7848647de9cffe54434d4ab5f7ba8af42a36a
  SRC_SHA: 5f8c13adac6d34e64bd47d9463a3e261cd0b51bb5ddb500aa9f7b87c2914a52d
  BASE_SHA: ffc5721eca68844357dbdca63b0edf266e7e210f9d162eecde8cae0067f210a8
  R14D_SHA: fc1dec191b3ccf90e096d2b21d15f9fd1fae2c2e69fc0ae6be2da27f9ee347e4
  ISO_NAME: Frames-0.9.98-v108-Physical-Input-Repair-r14d-Text-Edit-Rufus-UEFI.iso

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { ref: v108-usb-hub-topology-r1 }
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld python3 unzip mtools dosfstools gdisk xorriso
      - name: Reconstruct exact r14d source
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/r14d" evidence out payload
          mkdir -p "$RUNNER_TEMP/r14d/kit" "$RUNNER_TEMP/r14d/src" evidence out payload
          K=Frames-0.9.98-Runtime-Certification-Kit-v108-r9.zip
          test "$(sha256sum "$K"|awk '{print $1}')" = "$KIT_SHA"
          unzip -q "$K" -d "$RUNNER_TEMP/r14d/kit"
          Z="$RUNNER_TEMP/r14d/kit/Frames-0.9.98-Source-v108.zip"
          test "$(sha256sum "$Z"|awk '{print $1}')" = "$SRC_SHA"
          unzip -q "$Z" -d "$RUNNER_TEMP/r14d/src"
          F="$RUNNER_TEMP/r14d/src/Frames-0.9.98"
          test "$(sha256sum "$F/kernel/main.nx"|awk '{print $1}')" = "$BASE_SHA"
          python3 tools/ci/patch_v108_live_input_common.py "$F/kernel/main.nx" >/dev/null
          python3 tools/ci/patch_v108_usb_mouse_live.py "$F/kernel/main.nx" >/dev/null
          python3 tools/ci/patch_v108_ps2_touchpad_live.py "$F/kernel/main.nx" >/dev/null
          python3 tools/ci/patch_v108_input_telemetry_overlay.py "$F/kernel/main.nx" >/dev/null
          python3 tools/ci/patch_v108_input_usbboot_gate_decouple.py "$F/kernel/main.nx" >/dev/null
          python3 tools/ci/patch_v108_physical_deep_telemetry.py "$F/kernel/main.nx" >/dev/null
          python3 tools/ci/patch_v108_stable_input_diag_runtime.py "$F/kernel/main.nx" >/dev/null
          python3 tools/ci/patch_v108_physical_input_r7.py "$F/kernel/main.nx" >/dev/null
          python3 tools/ci/patch_v108_physical_input_r7_compilefix.py "$F/kernel/main.nx" >/dev/null
          python3 tools/ci/patch_v108_physical_input_r8_cursor_offsets.py "$F/kernel/main.nx" >/dev/null
          python3 tools/ci/patch_v108_physical_input_r9_protocol.py "$F/kernel/main.nx" >/dev/null
          python3 tools/ci/patch_v108_physical_input_r10_hwdecode.py "$F/kernel/main.nx" >/dev/null
          python3 tools/ci/patch_v108_physical_input_r11_touch_usb.py "$F/kernel/main.nx" >/dev/null
          set +e
          python3 tools/ci/patch_v108_physical_input_r12_latency_keyboard.py "$F/kernel/main.nx" >/dev/null
          set -e
          python3 tools/ci/patch_v108_physical_input_r12b_pollfix.py "$F/kernel/main.nx" >/dev/null
          python3 tools/ci/patch_v108_usb_hub_topology_r2.py "$F/kernel/main.nx" >/dev/null
          python3 tools/ci/patch_v108_usb_hub_topology_r3_abi.py "$F/kernel/main.nx" >/dev/null
          python3 tools/ci/patch_v108_physical_input_r14_realhw.py "$F/kernel/main.nx" >/dev/null
          python3 tools/ci/patch_v108_physical_input_r14b_textedit.py "$F/kernel/main.nx" >/dev/null
          python3 tools/ci/patch_v108_physical_input_r14c_abi.py "$F/kernel/main.nx" | tee evidence/R14D-SHA.txt
          test "$(sha256sum "$F/kernel/main.nx"|awk '{print $1}')" = "$R14D_SHA"
          cp "$F/kernel/main.nx" evidence/kernel-r14d.nx
          echo "F=$F" >> "$GITHUB_ENV"
      - name: Fail-closed safety/model audit
        run: |
          set -euo pipefail
          grep -Fq 'fn v108_input_pointer_draw(surface:u64,state:u64,input_state:u64,pos:u64)' evidence/kernel-r14d.nx
          grep -Fq 'FRAMES_V108_IBEAM_OK' evidence/kernel-r14d.nx
          grep -Fq 'FRAMES_V108_CARET_BLINK_OK' evidence/kernel-r14d.nx
          grep -Fq 'FRAMES_V108_TEXT_EDIT_SEQUENCE_OK' evidence/kernel-r14d.nx
          grep -Fq 'serial_marker_usb_hub_keyboard_skipped_v114' evidence/kernel-r14d.nx
          ! grep -Fq 'v108_input_pointer_draw(surface,state,input_state,cx,cy)' evidence/kernel-r14d.nx
          python3 - <<'PY'
          from pathlib import Path
          s=Path('evidence/kernel-r14d.nx').read_text(errors='replace').lower()
          bad=['physical_write_enable','destructive_write']
          hits=[x for x in bad if x in s]
          Path('evidence/WRITE-SURFACE.txt').write_text('status='+('PASS' if not hits else 'FAIL')+'\nhits='+','.join(hits)+'\n')
          if hits: raise SystemExit(hits)
          PY
      - name: Build and package exact r14d Rufus ISO
        run: |
          set -euo pipefail
          find "$F" -type f -name '*.sh' -exec chmod +x {} +
          find "$F/toolchain" -type f -name nexus -exec chmod +x {} +
          cd "$F"
          ./tools/build.sh
          python3 tools/make_esp.py
          python3 tools/sdk_selftest.py
          python3 tools/make_desktop_preview_image.py
          python3 tools/verify_desktop_preview_image.py --image build/Frames-0.9.98-Desktop-Preview.img --require-pass
          python3 tools/verify_release.py
          cp build/Frames-0.9.98-Desktop-Preview.img "$GITHUB_WORKSPACE/out/raw.img"
          cd "$GITHUB_WORKSPACE"
          FIRST="$(sgdisk -i 1 out/raw.img|awk -F: '/First sector/{gsub(/ /,"",$2);split($2,a,"(");print a[1]}')"
          LAST="$(sgdisk -i 1 out/raw.img|awk -F: '/Last sector/{gsub(/ /,"",$2);split($2,a,"(");print a[1]}')"
          dd if=out/raw.img of=out/esp.img bs=512 skip="$FIRST" count=$((LAST-FIRST+1)) status=none
          mcopy -s -i out/esp.img '::/EFI' payload/
          mcopy -s -i out/esp.img '::/FRAMES' payload/
          dd if=/dev/zero of=out/efiboot.img bs=1M count=16 status=none
          mkfs.fat -F 16 -n FRAMESBOOT out/efiboot.img >/dev/null
          mmd -i out/efiboot.img ::/EFI ::/EFI/BOOT ::/FRAMES
          mcopy -i out/efiboot.img payload/EFI/BOOT/BOOTX64.EFI ::/EFI/BOOT/BOOTX64.EFI
          for f in payload/FRAMES/*; do mcopy -i out/efiboot.img "$f" ::/FRAMES/; done
          ROOT="$RUNNER_TEMP/r14d-root"; mkdir -p "$ROOT"
          cp out/efiboot.img "$ROOT/"; cp -a payload/EFI payload/FRAMES "$ROOT/"
          printf 'Frames v108 r14d physical input repair\nI-beam hover + blinking caret + left/right/delete/backspace + USB multi-child mouse repair\nRufus ISO Image mode\nRead-only diagnostic only\n' > "$ROOT/README.TXT"
          xorriso -as mkisofs -iso-level 3 -R -J -V FRAMES_V108_R14D -eltorito-alt-boot -e efiboot.img -no-emul-boot -o "out/$ISO_NAME" "$ROOT" >/dev/null 2>&1
          sha256sum "out/$ISO_NAME" | tee evidence/ISO-SHA256.txt
          stat -c '%s' "out/$ISO_NAME" | tee evidence/ISO-SIZE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Frames-v108-r14d-Candidate
          path: |
            out/*.iso
            evidence/**
          if-no-files-found: error
          retention-days: 30

  gates:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        lane: [usb-direct, usb-hub, usb-hub-multi, ps2, smoothness, interactive, right-click, text-edit, model, safety]
    steps:
      - uses: actions/checkout@v4
        with: { ref: v108-usb-hub-topology-r1 }
      - uses: actions/download-artifact@v4
        with: { name: Frames-v108-r14d-Candidate, path: candidate }
      - name: Install runtime tools
        if: matrix.lane != 'model'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf python3 python3-pil
          O="$(find /usr/share/OVMF -type f \( -name OVMF_CODE_4M.fd -o -name OVMF_CODE.fd \)|head -n1)"
          test -s "$O"; echo "OVMF=$O" >> "$GITHUB_ENV"
      - name: Run ${{ matrix.lane }} gate
        run: |
          set -euo pipefail
          mkdir -p gate
          ISO="$(find candidate -name "$ISO_NAME" -type f -print -quit)"
          EXPECT="$(awk '{print $1}' candidate/evidence/ISO-SHA256.txt)"
          test -s "$ISO"; test "$(sha256sum "$ISO"|awk '{print $1}')" = "$EXPECT"
          case '${{ matrix.lane }}' in
            usb-direct) python3 tools/ci/qemu_usb_hub_topology_gate_r3.py --ovmf "$OVMF" --iso "$ISO" --out gate --expected-iso-sha "$EXPECT" --topology direct; grep -q '"status": "PASS"' gate/TOPOLOGY.json ;;
            usb-hub) python3 tools/ci/qemu_usb_hub_topology_gate_r3.py --ovmf "$OVMF" --iso "$ISO" --out gate --expected-iso-sha "$EXPECT" --topology hub; grep -q '"status": "PASS"' gate/TOPOLOGY.json ;;
            usb-hub-multi) python3 tools/ci/qemu_usb_hub_multichild_gate_r14.py --ovmf "$OVMF" --iso "$ISO" --out gate --expected-iso-sha "$EXPECT"; grep -q '"status": "PASS"' gate/MULTICHILD.json ;;
            ps2) python3 tools/ci/qemu_input_visual_gate_r10.py --ovmf "$OVMF" --iso "$ISO" --lane ps2 --out gate --expected-iso-sha "$EXPECT"; grep -q '"status": "PASS"' gate/RUNTIME.json ;;
            smoothness) python3 tools/ci/qemu_ps2_cursor_smoothness_r10.py --ovmf "$OVMF" --iso "$ISO" --out gate --expected-iso-sha "$EXPECT"; grep -q '"status": "PASS"' gate/SMOOTHNESS.json ;;
            interactive) python3 tools/ci/qemu_input_test_ui_r12.py --ovmf "$OVMF" --iso "$ISO" --out gate --expected-iso-sha "$EXPECT"; grep -q '"status": "PASS"' gate/INTERACTIVE-INPUT.json ;;
            right-click) python3 tools/ci/qemu_right_click_gate_r14.py --ovmf "$OVMF" --iso "$ISO" --out gate --expected-iso-sha "$EXPECT"; grep -q '"status": "PASS"' gate/RIGHT-CLICK.json ;;
            text-edit) python3 tools/ci/qemu_text_edit_ibeam_gate_r14b.py --ovmf "$OVMF" --iso "$ISO" --out gate --expected-iso-sha "$EXPECT"; grep -q '"status": "PASS"' gate/TEXT-EDIT.json ;;
            model) test "$(sha256sum candidate/evidence/kernel-r14d.nx|awk '{print $1}')" = "$R14D_SHA"; grep -Fq 'FRAMES_V108_IBEAM_OK' candidate/evidence/kernel-r14d.nx; grep -Fq 'FRAMES_V108_TEXT_EDIT_SEQUENCE_OK' candidate/evidence/kernel-r14d.nx ;;
            safety)
              truncate -s 32M gate/sentinel.img
              before="$(sha256sum gate/sentinel.img|awk '{print $1}')"
              set +e
              timeout 90 qemu-system-x86_64 -machine q35 -m 768M -smp 2 -cpu max -accel tcg,thread=single -display none -no-reboot -no-shutdown -nic none -serial file:gate/serial.log -drive if=pflash,format=raw,readonly=on,file="$OVMF" -cdrom "$ISO" -boot d -drive file=gate/sentinel.img,if=none,format=raw,readonly=on,id=s -device nvme,drive=s,serial=R14D_SENTINEL >/dev/null 2>gate/stderr
              rc=$?; set -e
              after="$(sha256sum gate/sentinel.img|awk '{print $1}')"
              test "$before" = "$after"
              grep -q 'FRAMES_V108_INPUT_TEST_RUNTIME_READY' gate/serial.log
              printf 'qemu_rc=%s\nbefore=%s\nafter=%s\n' "$rc" "$before" "$after" > gate/SAFETY.txt ;;
          esac
          echo PASS > gate/RESULT.status
          sha256sum gate/* 2>/dev/null > gate/SHA256SUMS.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Frames-v108-r14d-${{ matrix.lane }}-Evidence
          path: gate/**
          if-no-files-found: warn
          retention-days: 30

  final:
    needs: [build, gates]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { name: Frames-v108-r14d-Candidate, path: candidate }
      - uses: actions/download-artifact@v4
        with: { pattern: 'Frames-v108-r14d-*-Evidence', path: gates, merge-multiple: false }
      - name: Seal exact r14d candidate
        run: |
          set -euo pipefail
          for lane in usb-direct usb-hub usb-hub-multi ps2 smoothness interactive right-click text-edit model safety; do test "$(cat gates/Frames-v108-r14d-$lane-Evidence/RESULT.status)" = PASS; done
          test "$(sha256sum candidate/evidence/kernel-r14d.nx|awk '{print $1}')" = "$R14D_SHA"
          ISO="$(find candidate -name "$ISO_NAME" -type f -print -quit)"
          mkdir final; cp "$ISO" final/
          sha256sum "$ISO" | tee final/ISO-SHA256.txt
          stat -c '%s' "$ISO" | tee final/ISO-SIZE.txt
          cat > final/CERTIFICATION.txt <<'EOF'
          Frames v108 Physical Input Repair r14d — Real-Hardware + Text Editing Candidate
          status=PASS_VM_PENDING_PHYSICAL
          vm_usb_direct=PASS
          vm_usb_hub_child_hid=PASS
          vm_usb_hub_keyboard_then_mouse=PASS
          vm_ps2=PASS
          vm_ps2_smoothness=PASS
          vm_click_keyboard_text=PASS
          vm_right_click_context=PASS
          vm_textbox_ibeam=PASS
          vm_blinking_insertion_caret=PASS
          vm_left_right_delete_backspace=PASS
          readonly_internal_media=PASS
          r13_physical_usb_mouse=FAIL_NO_CURSOR
          r13_physical_touchpad=FAIL_JUMPBACK_REGRESSION
          r13_physical_keyboard=PARTIAL_INPUT_DELIVERY
          physical_r14d=PENDING
          destructive_writes=BLOCKED
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: Frames-v108-r14d-Rufus-Final
          path: final/**
          if-no-files-found: error
          retention-days: 30
