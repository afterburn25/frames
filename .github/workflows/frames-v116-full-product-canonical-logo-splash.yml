name: Frames v116 Full Product Canonical Logo Splash

on:
  workflow_dispatch:
  push:
    branches: [ v116-full-product-v101-integration ]
    paths:
      - '.github/workflows/frames-v116-full-product-canonical-logo-splash.yml'
      - 'architecture/integration/apply_product_boot_splash.py'
      - 'architecture/integration/port_architecture_to_product.py'

permissions:
  contents: read

jobs:
  build-logo-splash-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v116-full-product-v101-integration

      - name: Install build and ISO tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld python3 unzip patch gdisk mtools dosfstools xorriso qemu-system-x86 ovmf netcat-openbsd binutils

      - name: Extract full Frames 0.9.91 v101 product source
        shell: bash
        run: |
          set -euo pipefail
          KIT="$GITHUB_WORKSPACE/Frames-0.9.91-Integrated-Connected-Services-Certification-Kit-v101.zip"
          test -s "$KIT"
          mkdir -p "$RUNNER_TEMP/v101-kit" "$RUNNER_TEMP/v101-source" "$GITHUB_WORKSPACE/integration-evidence"
          sha256sum "$KIT" | tee "$GITHUB_WORKSPACE/integration-evidence/V101-KIT-SHA256.txt"
          unzip -q "$KIT" -d "$RUNNER_TEMP/v101-kit"
          SRCZIP="$(find "$RUNNER_TEMP/v101-kit" -type f \( -iname 'Frames-0.9.91-Source*.zip' -o -iname '*0.9.91*Source*.zip' \) -print | sort | head -n1 || true)"
          if [ -z "$SRCZIP" ]; then SRCZIP="$(find "$RUNNER_TEMP/v101-kit" -type f -iname '*Source*.zip' -print | sort | head -n1 || true)"; fi
          test -n "$SRCZIP"
          unzip -q "$SRCZIP" -d "$RUNNER_TEMP/v101-source"
          PRODUCT=""
          while IFS= read -r vf; do
            d="${vf%/VERSION}"; v="$(tr -d '\r\n' < "$vf")"
            if [ "$v" = "0.9.91" ] && [ -f "$d/kernel/main.nx" ] && [ -f "$d/boot/uefi/frames_boot.c" ]; then PRODUCT="$d"; break; fi
          done < <(find "$RUNNER_TEMP/v101-source" -type f -name VERSION -print | sort)
          test -n "$PRODUCT"
          test -s "$PRODUCT/assets/branding/FramesLogo-48.rgba"
          echo "PRODUCT=$PRODUCT" >> "$GITHUB_ENV"
          sha256sum "$PRODUCT/assets/branding/FramesLogo-48.rgba" | tee "$GITHUB_WORKSPACE/integration-evidence/CANONICAL-LOGO-SHA256.txt"
          cp "$PRODUCT/assets/branding/FramesLogo-48.png" "$GITHUB_WORKSPACE/integration-evidence/FramesLogo-48.png"

      - name: Port certified v109-v116 architecture onto product kernel
        shell: bash
        run: |
          set -euo pipefail
          PORT="$GITHUB_WORKSPACE/architecture/integration/port_architecture_to_product.py"
          chmod +x "$PORT"
          : > "$GITHUB_WORKSPACE/integration-evidence/PORT-SUCCESS.txt"
          while read -r label rel; do
            python3 "$PORT" "$label" "$GITHUB_WORKSPACE/$rel" "$PRODUCT" "$GITHUB_WORKSPACE/integration-evidence" | tee -a "$GITHUB_WORKSPACE/integration-evidence/PORT-SUCCESS.txt"
          done <<'EOF'
          v109 architecture/v109/make_unified_device_architecture_v109.py
          v110 architecture/v110/make_driver_runtime_v110.py
          v111 architecture/v111/make_async_io_service_runtime_v111.py
          v112 architecture/v112/make_device_service_integration_v112.py
          v113 architecture/v113/make_driver_execution_hal_v113.py
          v114 architecture/v114/make_kernel_concurrency_driver_scheduling_v114.py
          v115 architecture/v115/make_driver_migration_unified_input_v115.py
          v116 architecture/v116/make_usb_core_xhci_migration_v116.py
          EOF

      - name: Apply canonical Frames logo boot splash and handoff breadcrumbs
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/architecture/integration/apply_product_boot_splash.py" "$PRODUCT" | tee "$GITHUB_WORKSPACE/integration-evidence/APPLY-BOOT-SPLASH.txt"
          LOGO_SHA="$(sha256sum "$PRODUCT/assets/branding/FramesLogo-48.rgba" | awk '{print $1}')"
          grep -F "FRAMES_CANONICAL_LOGO_48_RGBA_SHA256=$LOGO_SHA" "$PRODUCT/boot/uefi/frames_boot.c"
          grep -F 'FRAMES_HANDOFF_KERNEL_CALL' "$PRODUCT/boot/uefi/frames_boot.c"
          grep -F 'frames_logo(w/2' "$PRODUCT/boot/uefi/frames_boot.c"
          if grep -F 'logo_h=h/5' "$PRODUCT/boot/uefi/frames_boot.c"; then echo 'legacy F renderer still present' >&2; exit 1; fi
          sha256sum "$PRODUCT/boot/uefi/frames_boot.c" | tee "$GITHUB_WORKSPACE/integration-evidence/PATCHED-LOADER-SOURCE-SHA256.txt"

      - name: Build complete integrated product
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRODUCT"
          chmod +x tools/*.sh tools/*.py sdk/*.sh 2>/dev/null || true
          find toolchain -type f -name nexus -exec chmod +x {} + 2>/dev/null || true
          ./tools/build.sh 2>&1 | tee "$GITHUB_WORKSPACE/integration-evidence/BUILD.log"
          if [ -f tools/make_esp.py ]; then python3 tools/make_esp.py 2>&1 | tee "$GITHUB_WORKSPACE/integration-evidence/MAKE-ESP.log"; fi
          if [ -f tools/sdk_selftest.py ]; then python3 tools/sdk_selftest.py 2>&1 | tee "$GITHUB_WORKSPACE/integration-evidence/SDK-SELFTEST.log"; fi
          if [ -f tools/make_desktop_preview_image.py ]; then python3 tools/make_desktop_preview_image.py 2>&1 | tee "$GITHUB_WORKSPACE/integration-evidence/DESKTOP-PREVIEW.log"; fi
          test -s build/BOOTX64.EFI
          test -s build/FramesKernel.fkrn
          test -s build/System.fex
          LOGO_SHA="$(sha256sum assets/branding/FramesLogo-48.rgba | awk '{print $1}')"
          strings -a build/BOOTX64.EFI | grep -F "FRAMES_CANONICAL_LOGO_48_RGBA_SHA256=$LOGO_SHA" | tee "$GITHUB_WORKSPACE/integration-evidence/BOOTX64-CANONICAL-LOGO-PROOF.txt"
          strings -a build/BOOTX64.EFI | grep -F 'FRAMES_HANDOFF_KERNEL_CALL' | tee "$GITHUB_WORKSPACE/integration-evidence/BOOTX64-HANDOFF-PROOF.txt"
          sha256sum build/BOOTX64.EFI build/FramesKernel.fkrn build/System.fex | tee "$GITHUB_WORKSPACE/integration-evidence/BUILD-PAYLOAD-SHA256.txt"

      - name: Verify product ESP contains the newly built splash loader
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRODUCT"
          ESP="$(find build -maxdepth 1 -type f -iname '*ESP*.img' -print | sort | head -n1 || true)"
          test -n "$ESP"; test -s "$ESP"
          FIRST="$(sgdisk -i 1 "$ESP" | awk -F: '/First sector/ {gsub(/^[ \t]+|[ \t]+$/, "", $2); split($2,a," "); print a[1]; exit}')"
          LAST="$(sgdisk -i 1 "$ESP" | awk -F: '/Last sector/ {gsub(/^[ \t]+|[ \t]+$/, "", $2); split($2,a," "); print a[1]; exit}')"
          COUNT=$((LAST-FIRST+1))
          EFI_IMG="$RUNNER_TEMP/canonical-logo-efiboot.img"
          dd if="$ESP" of="$EFI_IMG" bs=512 skip="$FIRST" count="$COUNT" status=none
          mcopy -i "$EFI_IMG" ::/EFI/BOOT/BOOTX64.EFI "$RUNNER_TEMP/esp-BOOTX64.EFI"
          cmp build/BOOTX64.EFI "$RUNNER_TEMP/esp-BOOTX64.EFI"
          LOGO_SHA="$(sha256sum assets/branding/FramesLogo-48.rgba | awk '{print $1}')"
          strings -a "$RUNNER_TEMP/esp-BOOTX64.EFI" | grep -F "FRAMES_CANONICAL_LOGO_48_RGBA_SHA256=$LOGO_SHA" | tee "$GITHUB_WORKSPACE/integration-evidence/ESP-CANONICAL-LOGO-PROOF.txt"
          sha256sum "$RUNNER_TEMP/esp-BOOTX64.EFI" | tee "$GITHUB_WORKSPACE/integration-evidence/ESP-BOOTX64-SHA256.txt"
          echo "EFI_IMG=$EFI_IMG" >> "$GITHUB_ENV"
          echo "ESP=$ESP" >> "$GITHUB_ENV"

      - name: Create uniquely named USB-friendly UEFI ISO
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRODUCT"
          ROOT="$RUNNER_TEMP/iso-root-logo"
          rm -rf "$ROOT"; mkdir -p "$ROOT/FRAMES" "$ROOT/EFI"
          cp "$EFI_IMG" "$ROOT/EFI/canonical-logo-efiboot.img"
          cp build/BOOTX64.EFI "$ROOT/FRAMES/BOOTX64.EFI"
          cp build/FramesKernel.fkrn "$ROOT/FRAMES/FramesKernel.fkrn"
          cp build/System.fex "$ROOT/FRAMES/System.fex"
          cp assets/branding/FramesLogo-48.png "$ROOT/FRAMES/FramesLogo-48.png"
          cp "$ESP" "$ROOT/FRAMES/Product-ESP.img"
          find build -maxdepth 1 -type f \( -iname '*Desktop*.img' -o -iname '*.fthm' -o -iname '*.cfg' -o -iname '*.fapp' \) -exec cp -t "$ROOT/FRAMES" {} + 2>/dev/null || true
          printf '%s\n' 'Frames v116 Full Product Canonical Logo Splash Test Boot' 'Uses the approved FramesLogo-48.rgba embedded in BOOTX64.EFI.' 'Full v101 product shell + certified v109-v116 architecture port.' > "$ROOT/README.TXT"
          OUT="$GITHUB_WORKSPACE/Frames-v116-Full-Product-CANONICAL-LOGO-SPLASH-UEFI.iso"
          xorriso -as mkisofs -iso-level 3 -R -J -V FRAMES_LOGO -append_partition 2 0xef "$EFI_IMG" -appended_part_as_gpt -e --interval:appended_partition_2:all:: -no-emul-boot -o "$OUT" "$ROOT" 2>&1 | tee "$GITHUB_WORKSPACE/integration-evidence/XORRISO.log"
          test -s "$OUT"
          sha256sum "$OUT" | tee "$GITHUB_WORKSPACE/Frames-v116-Full-Product-CANONICAL-LOGO-SPLASH-UEFI.iso.sha256"
          echo "ISO=$OUT" >> "$GITHUB_ENV"

      - name: QEMU OVMF splash smoke and framebuffer capture
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          code=""; vars=""
          for p in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd; do [ -f "$p" ] && code="$p" && break; done
          for p in /usr/share/OVMF/OVMF_VARS_4M.fd /usr/share/OVMF/OVMF_VARS.fd; do [ -f "$p" ] && vars="$p" && break; done
          test -n "$code"; test -n "$vars"
          cp "$vars" "$RUNNER_TEMP/OVMF_VARS-logo.fd"
          MON="$RUNNER_TEMP/qemu-logo-monitor.sock"
          SERIAL="$GITHUB_WORKSPACE/integration-evidence/CANONICAL-LOGO-SERIAL.log"
          SHOT="$GITHUB_WORKSPACE/integration-evidence/CANONICAL-LOGO-FRAMEBUFFER.ppm"
          qemu-system-x86_64 -machine q35 -m 1024 -smp 2 -drive if=pflash,format=raw,readonly=on,file="$code" -drive if=pflash,format=raw,file="$RUNNER_TEMP/OVMF_VARS-logo.fd" -cdrom "$ISO" -boot d -serial file:"$SERIAL" -monitor unix:"$MON",server=on,wait=off -display none -vga std -no-reboot &
          QPID=$!
          for i in $(seq 1 60); do [ -S "$MON" ] && break; sleep 1; done
          sleep 15
          printf 'screendump %s\ninfo status\nquit\n' "$SHOT" | nc -U "$MON" || true
          wait "$QPID" || true
          grep -E 'FRAMES_HANDOFF_|FRAMES_SPLASH_|FRAMES_BOOT_FATAL' "$SERIAL" | tee "$GITHUB_WORKSPACE/integration-evidence/SPLASH-RUNTIME-MARKERS.txt" || true

      - name: Upload canonical-logo full-product ISO and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Frames-v116-Full-Product-CANONICAL-LOGO-SPLASH-UEFI
          path: |
            ${{ github.workspace }}/Frames-v116-Full-Product-CANONICAL-LOGO-SPLASH-UEFI.iso
            ${{ github.workspace }}/Frames-v116-Full-Product-CANONICAL-LOGO-SPLASH-UEFI.iso.sha256
            ${{ github.workspace }}/integration-evidence/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
