name: Frames v108 r25l ISO-Native Flight Recorder Certification

on:
  workflow_dispatch:
  push:
    branches: [ v108-usb-hub-topology-r1 ]
    paths:
      - '.github/workflows/frames-v108-r25l-iso-native-flight-recorder-cert.yml'
      - 'tools/ci/patch_v108_r25l_iso_native_log.py'
      - 'tools/ci/make_r25l_rufus_log_volume.py'
      - 'tools/ci/r25l_cert_driver.py'
      - 'tools/ci/r25l_cert_driver_v2.py'
      - 'tools/ci/qemu_r25_flight_log_gate.py'
      - 'tools/ci/validate_physical_handoff.py'

permissions:
  contents: read
  actions: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v108-usb-hub-topology-r1
      - name: Install build, image and runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld python3 python3-pil unzip mtools dosfstools gdisk xorriso qemu-system-x86 ovmf
      - name: Fetch exact r21 protected source
        uses: actions/download-artifact@v4
        with:
          name: Frames-v108-r21-Candidate
          path: r21-candidate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: afterburn25/frames
          run-id: '31979817129'
      - name: Build and certify r25l ISO-native logging train
        run: python3 tools/ci/r25l_cert_driver_v2.py
      - name: Validate sealed Rufus physical handoff
        run: python3 tools/ci/validate_physical_handoff.py --final final
      - name: Upload r25l evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Frames-v108-r25l-Evidence
          path: |
            evidence/**
            out/*.iso
          if-no-files-found: warn
          retention-days: 30
      - name: Upload sealed Rufus ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Frames-v108-r25l-Rufus-Final
          path: final/**
          if-no-files-found: error
          retention-days: 30
