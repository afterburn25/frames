name: Frames 0.9.98 r63 Port2 USB Mouse Enumeration Trace UEFI Image

on:
  workflow_dispatch:
  push:
    branches: [ r56-linux-input-architecture ]
    paths:
      - '.github/workflows/pointer-r63-port2-mouse-enumeration-trace.yml'
      - 'tools/ci/make_r63_port2_mouse_enumeration_trace.py'
      - 'tools/ci/make_r59_windows_log_partition.py'
      - 'tools/ci/make_r58_input_flight_recorder_fixed.py'
      - 'tools/ci/make_r58_input_flight_recorder.py'
      - 'tools/ci/make_r57_persistent_xhci_trace.py'

permissions:
  contents: read

env:
  EXPECTED_PARENT_SHA256: 1c7f1b514d9aa2f847f724e8b633286d069d745bf7c281a3967c46bbfea1a18c
  EXPECTED_R46_KERNEL_MAIN_SHA256: e5ccd3d4a453184f620e2ed5f928599bc8a7fa6959098f3aeff4916f6dcff165

jobs:
  build-r63:
    name: Build r63 deterministic port2 USB mouse UEFI Rufus image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r56-linux-input-architecture

      - name: Reconstruct protected r46 base and apply r63
        shell: bash
        run: |
          set -euo pipefail
          rm -rf r63-out "$RUNNER_TEMP/r63"
          mkdir -p r63-out "$RUNNER_TEMP/r63"
          parent_sha="$(sha256sum Frames-0.9.98-Pointer-Diagnostics-CI-v1.zip | awk '{print $1}')"
          test "$parent_sha" = "$EXPECTED_PARENT_SHA256"
          unzip -q Frames-0.9.98-Pointer-Diagnostics-CI-v1.zip -d "$RUNNER_TEMP/r63"
          SRC="$RUNNER_TEMP/r63/Frames-0.9.98-Pointer-CI-Source"
          python3 - "$SRC/kernel/main.nx" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          a='if usb_hid_found != 0 { usb_hid_configured = xhci_configure_boot_hid(xhci_state,phys_state); if usb_hid_configured != 0 { usb_hid_report_ready = xhci_read_first_hid_report(xhci_state,phys_state); } }'
          b='if usb_hid_found != 0 { usb_hid_configured = xhci_configure_boot_hid(xhci_state,phys_state); if usb_hid_configured != 0 { usb_hid_report_ready = 1; } }'
          c='if input_queue_ready != 0 { if usb_hid_report_ready != 0 { input_decode_ready = input_decode_boot_hid(xhci_state,input_state); } else { ps2_poll_fallback(input_state); } }'
          d='if input_queue_ready != 0 { if usb_hid_report_ready != 0 { input_decode_ready = 1; } else { ps2_poll_fallback(input_state); } }'
          assert s.count(a)==1 and s.count(c)==1
          p.write_text(s.replace(a,b).replace(c,d))
          PY
          test "$(sha256sum "$SRC/kernel/main.nx" | awk '{print $1}')" = "$EXPECTED_R46_KERNEL_MAIN_SHA256"
          python3 tools/ci/make_r63_port2_mouse_enumeration_trace.py "$SRC/kernel/main.nx"
          grep -q 'R63' "$SRC/kernel/main.nx"
          grep -q 'r63_port2_mouse_trace' "$SRC/kernel/main.nx"
          echo "FRAMES_DIR=$SRC" >> "$GITHUB_ENV"
          sha256sum "$SRC/kernel/main.nx" > r63-out/R63-KERNEL-SHA256.txt

      - name: Install build and image dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld python3 unzip zip mtools dosfstools gdisk
          find "$FRAMES_DIR" -type f -name '*.sh' -exec chmod +x {} +
          find "$FRAMES_DIR/toolchain" -type f -name nexus -exec chmod +x {} +

      - name: Build base Frames image
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRAMES_DIR"
          ./tools/build.sh
          python3 tools/make_esp.py
          python3 tools/sdk_selftest.py
          python3 tools/make_desktop_preview_image.py
          python3 tools/verify_desktop_preview_image.py --image build/Frames-0.9.98-Desktop-Preview.img --require-pass
          python3 tools/verify_release.py

      - name: Add Windows-readable FRAMESLOG partition
        shell: bash
        run: |
          set -euo pipefail
          BASE="$FRAMES_DIR/build/Frames-0.9.98-Desktop-Preview.img"
          OUT="r63-out/Frames-0.9.98-r63-Port2-USB-Mouse-Trace-UEFI-FRAMESLOG-Rufus.img"
          cp "$BASE" "$OUT"
          old_bytes="$(stat -c %s "$OUT")"
          truncate -s $((old_bytes + 64*1024*1024)) "$OUT"
          sgdisk -e "$OUT"
          sgdisk -n 2:0:0 -t 2:0700 -c 2:FRAMESLOG "$OUT"
          sgdisk -v "$OUT" | tee r63-out/GPT-VERIFY.txt
          read START SECTORS <<<"$(python3 - "$OUT" <<'PY'
          import struct,sys
          with open(sys.argv[1],'rb') as f:
              f.seek(2*512+128); e=f.read(128)
          first,last=struct.unpack_from('<QQ',e,32)
          if first<34 or last<first: raise SystemExit('invalid GPT partition #2')
          print(first,last-first+1)
          PY
          )"
          PART="r63-out/FRAMESLOG.part.img"
          truncate -s $((SECTORS*512)) "$PART"
          mkfs.fat -F 32 -n FRAMESLOG "$PART"
          truncate -s 1048576 r63-out/PTRLOG.BIN
          mcopy -o -i "$PART" r63-out/PTRLOG.BIN ::PTRLOG.BIN
          dd if="$PART" of="$OUT" bs=512 seek="$START" conv=notrunc status=none
          rm -f "$PART"

      - name: Verify explicit UEFI bootability
        shell: bash
        run: |
          set -euo pipefail
          IMG="r63-out/Frames-0.9.98-r63-Port2-USB-Mouse-Trace-UEFI-FRAMESLOG-Rufus.img"
          sgdisk -i 1 "$IMG" | tee r63-out/UEFI-GPT-PARTITION1.txt
          grep -qi 'C12A7328-F81F-11D2-BA4B-00A0C93EC93B.*EFI system partition' r63-out/UEFI-GPT-PARTITION1.txt
          read ESP_START ESP_SECTORS <<<"$(python3 - "$IMG" <<'PY'
          import struct,sys
          with open(sys.argv[1],'rb') as f:
              f.seek(2*512); e=f.read(128)
          first,last=struct.unpack_from('<QQ',e,32)
          if first<34 or last<first: raise SystemExit('invalid EFI GPT partition #1')
          print(first,last-first+1)
          PY
          )"
          ESP="r63-out/UEFI-ESP.part.img"
          dd if="$IMG" of="$ESP" bs=512 skip="$ESP_START" count="$ESP_SECTORS" status=none
          fsck.fat -n "$ESP" | tee r63-out/UEFI-FAT32-VERIFY.txt
          mdir -i "$ESP" ::/EFI/BOOT/BOOTX64.EFI | tee r63-out/UEFI-BOOTX64-VERIFY.txt
          mcopy -i "$ESP" ::/EFI/BOOT/BOOTX64.EFI r63-out/BOOTX64.EFI
          test -s r63-out/BOOTX64.EFI
          printf 'uefi_bootability=PASS\nesp_gpt_type_guid=C12A7328-F81F-11D2-BA4B-00A0C93EC93B\nfilesystem=FAT\nremovable_media_path=EFI/BOOT/BOOTX64.EFI\n' > r63-out/UEFI-BOOT-STATUS.txt
          rm -f "$ESP"

      - name: Package r63 evidence
        shell: bash
        run: |
          set -euo pipefail
          IMG="r63-out/Frames-0.9.98-r63-Port2-USB-Mouse-Trace-UEFI-FRAMESLOG-Rufus.img"
          cat > r63-out/HANDS-ON-TEST.txt <<'EOF'
          Flash with Rufus in raw/DD image mode and boot the machine in UEFI mode.
          Plug the physical USB mouse in before power-on. r63 targets xHCI root port 2 only.

          New rows:
          PBEF = port 2 PORTSC before reset; PAFT = after reset; RST = reset success;
          SLOT = Enable Slot result; ADDR = Address Device result; D8 = first 8-byte
          descriptor result; FIN = finalize/full 18-byte descriptor result; CC = command
          completion snapshot; TRA/TRB/TRC = transfer snapshots; VID = device VID once full
          descriptor succeeds; DEPT = deepest completed stage.

          Photograph those rows after boot. Diagnostic-only. Do not promote r63.
          EOF
          sha256sum "$IMG" | tee r63-out/IMAGE-SHA256.txt
          printf 'status=PASS\nrevision=r63\nstrategy=deterministic-port2-usb-mouse-enumeration\nuefi=verified\n' > r63-out/BUILD-STATUS.txt
          sha256sum r63-out/* > r63-out/SHA256SUMS.txt

      - name: Upload r63 image and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frames-0.9.98-r63-port2-usb-mouse-trace-uefi-rufus-image
          path: r63-out/**
          if-no-files-found: error
          retention-days: 14
