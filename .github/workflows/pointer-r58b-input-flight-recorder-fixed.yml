name: Frames 0.9.98 r58B Persistent Physical Input Flight Recorder USB Image

on:
  workflow_dispatch:
  push:
    branches: [ r56-linux-input-architecture ]
    paths:
      - '.github/workflows/pointer-r58b-input-flight-recorder-fixed.yml'
      - 'tools/ci/make_r58_input_flight_recorder_fixed.py'
      - 'tools/ci/make_r58_input_flight_recorder.py'
      - 'tools/ci/decode_r58_ptrlog.py'
      - 'tools/ci/make_r57_persistent_xhci_trace.py'

permissions:
  contents: read

env:
  EXPECTED_PARENT_SHA256: 1c7f1b514d9aa2f847f724e8b633286d069d745bf7c281a3967c46bbfea1a18c
  EXPECTED_R46_KERNEL_MAIN_SHA256: e5ccd3d4a453184f620e2ed5f928599bc8a7fa6959098f3aeff4916f6dcff165

jobs:
  build-r58b:
    name: Build r58B fixed persistent input flight recorder Rufus image
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r56-linux-input-architecture

      - name: Initialize and reconstruct protected r46 base
        shell: bash
        run: |
          set -euo pipefail
          rm -rf r58b-out "$RUNNER_TEMP/r58b"; mkdir -p r58b-out "$RUNNER_TEMP/r58b"
          parent_sha="$(sha256sum Frames-0.9.98-Pointer-Diagnostics-CI-v1.zip | awk '{print $1}')"
          test "$parent_sha" = "$EXPECTED_PARENT_SHA256"
          unzip -q Frames-0.9.98-Pointer-Diagnostics-CI-v1.zip -d "$RUNNER_TEMP/r58b"
          SRC="$RUNNER_TEMP/r58b/Frames-0.9.98-Pointer-CI-Source"
          python3 - "$SRC/kernel/main.nx" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          a='if usb_hid_found != 0 { usb_hid_configured = xhci_configure_boot_hid(xhci_state,phys_state); if usb_hid_configured != 0 { usb_hid_report_ready = xhci_read_first_hid_report(xhci_state,phys_state); } }'
          b='if usb_hid_found != 0 { usb_hid_configured = xhci_configure_boot_hid(xhci_state,phys_state); if usb_hid_configured != 0 { usb_hid_report_ready = 1; } }'
          c='if input_queue_ready != 0 { if usb_hid_report_ready != 0 { input_decode_ready = input_decode_boot_hid(xhci_state,input_state); } else { ps2_poll_fallback(input_state); } }'
          d='if input_queue_ready != 0 { if usb_hid_report_ready != 0 { input_decode_ready = 1; } else { ps2_poll_fallback(input_state); } }'
          assert s.count(a)==1 and s.count(c)==1
          p.write_text(s.replace(a,b).replace(c,d))
          PY
          test "$(sha256sum "$SRC/kernel/main.nx" | awk '{print $1}')" = "$EXPECTED_R46_KERNEL_MAIN_SHA256"
          echo "FRAMES_DIR=$SRC" >> "$GITHUB_ENV"

      - name: Apply corrected r58 flight recorder
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/make_r58_input_flight_recorder_fixed.py "$FRAMES_DIR/kernel/main.nx"
          grep -q 'R58' "$FRAMES_DIR/kernel/main.nx"
          grep -q 'ptrtrace_save_usb' "$FRAMES_DIR/kernel/main.nx"
          grep -q 'usb_msc_bot_write10' "$FRAMES_DIR/kernel/main.nx"
          sha256sum "$FRAMES_DIR/kernel/main.nx" > r58b-out/R58B-KERNEL-SHA256.txt

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld python3 unzip zip mtools dosfstools
          find "$FRAMES_DIR" -type f -name '*.sh' -exec chmod +x {} +
          find "$FRAMES_DIR/toolchain" -type f -name nexus -exec chmod +x {} +

      - name: Build raw image
        run: |
          set -euo pipefail
          cd "$FRAMES_DIR"
          ./tools/build.sh
          python3 tools/make_esp.py
          python3 tools/sdk_selftest.py
          python3 tools/make_desktop_preview_image.py
          python3 tools/verify_desktop_preview_image.py --image build/Frames-0.9.98-Desktop-Preview.img --require-pass
          python3 tools/verify_release.py

      - name: Preallocate and verify PTRLOG.BIN
        shell: bash
        run: |
          set -euo pipefail
          IMG="$FRAMES_DIR/build/Frames-0.9.98-Desktop-Preview.img"
          truncate -s 1048576 r58b-out/PTRLOG.BIN
          OFFSET="$(python3 - "$IMG" <<'PY'
          from pathlib import Path
          import struct,sys
          with Path(sys.argv[1]).open('rb') as f:
              f.seek(2*512); e=f.read(128)
          start=struct.unpack_from('<Q',e,32)[0]
          assert start>=34
          print(start*512)
          PY
          )"
          mcopy -o -i "$IMG@@$OFFSET" r58b-out/PTRLOG.BIN ::PTRLOG.BIN
          mdir -i "$IMG@@$OFFSET" :: | tee r58b-out/ESP-DIRECTORY.txt
          grep -q PTRLOG r58b-out/ESP-DIRECTORY.txt
          cp "$IMG" r58b-out/Frames-0.9.98-r58B-Persistent-Input-Flight-Recorder-Rufus.img
          cp tools/ci/decode_r58_ptrlog.py r58b-out/decode-r58-ptrlog.py
          sha256sum r58b-out/Frames-0.9.98-r58B-Persistent-Input-Flight-Recorder-Rufus.img > r58b-out/IMAGE-SHA256.txt
          printf 'status=PASS\nrevision=r58B\n' > r58b-out/BUILD-STATUS.txt

      - name: Upload r58B image and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frames-0.9.98-r58b-persistent-input-flight-recorder-rufus-image
          path: r58b-out/**
          if-no-files-found: error
          retention-days: 14
