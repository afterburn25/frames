name: Frames 0.9.98 r61 Storage Write Bring-Up USB Image

on:
  workflow_dispatch:
  push:
    branches: [ r56-linux-input-architecture ]
    paths:
      - '.github/workflows/pointer-r61-storage-write-bringup.yml'
      - 'tools/ci/make_r61_storage_write_bringup.py'
      - 'tools/ci/make_r59_windows_log_partition.py'
      - 'tools/ci/make_r58_input_flight_recorder_fixed.py'
      - 'tools/ci/make_r58_input_flight_recorder.py'
      - 'tools/ci/make_r57_persistent_xhci_trace.py'

permissions:
  contents: read

env:
  EXPECTED_PARENT_SHA256: 1c7f1b514d9aa2f847f724e8b633286d069d745bf7c281a3967c46bbfea1a18c
  EXPECTED_R46_KERNEL_MAIN_SHA256: e5ccd3d4a453184f620e2ed5f928599bc8a7fa6959098f3aeff4916f6dcff165

jobs:
  build-r61:
    name: Build r61 isolated storage write bring-up Rufus image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r56-linux-input-architecture

      - name: Reconstruct protected r46 base and apply r61
        shell: bash
        run: |
          set -euo pipefail
          rm -rf r61-out "$RUNNER_TEMP/r61"
          mkdir -p r61-out "$RUNNER_TEMP/r61"
          parent_sha="$(sha256sum Frames-0.9.98-Pointer-Diagnostics-CI-v1.zip | awk '{print $1}')"
          test "$parent_sha" = "$EXPECTED_PARENT_SHA256"
          unzip -q Frames-0.9.98-Pointer-Diagnostics-CI-v1.zip -d "$RUNNER_TEMP/r61"
          SRC="$RUNNER_TEMP/r61/Frames-0.9.98-Pointer-CI-Source"
          python3 - "$SRC/kernel/main.nx" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          a='if usb_hid_found != 0 { usb_hid_configured = xhci_configure_boot_hid(xhci_state,phys_state); if usb_hid_configured != 0 { usb_hid_report_ready = xhci_read_first_hid_report(xhci_state,phys_state); } }'
          b='if usb_hid_found != 0 { usb_hid_configured = xhci_configure_boot_hid(xhci_state,phys_state); if usb_hid_configured != 0 { usb_hid_report_ready = 1; } }'
          c='if input_queue_ready != 0 { if usb_hid_report_ready != 0 { input_decode_ready = input_decode_boot_hid(xhci_state,input_state); } else { ps2_poll_fallback(input_state); } }'
          d='if input_queue_ready != 0 { if usb_hid_report_ready != 0 { input_decode_ready = 1; } else { ps2_poll_fallback(input_state); } }'
          assert s.count(a)==1 and s.count(c)==1
          p.write_text(s.replace(a,b).replace(c,d))
          PY
          test "$(sha256sum "$SRC/kernel/main.nx" | awk '{print $1}')" = "$EXPECTED_R46_KERNEL_MAIN_SHA256"
          python3 tools/ci/make_r61_storage_write_bringup.py "$SRC/kernel/main.nx"
          grep -q 'R61' "$SRC/kernel/main.nx"
          grep -q 'r61_storage_write_bringup' "$SRC/kernel/main.nx"
          echo "FRAMES_DIR=$SRC" >> "$GITHUB_ENV"
          sha256sum "$SRC/kernel/main.nx" > r61-out/R61-KERNEL-SHA256.txt

      - name: Install build and image dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld python3 unzip zip mtools dosfstools gdisk
          find "$FRAMES_DIR" -type f -name '*.sh' -exec chmod +x {} +
          find "$FRAMES_DIR/toolchain" -type f -name nexus -exec chmod +x {} +

      - name: Build base Frames image
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRAMES_DIR"
          ./tools/build.sh
          python3 tools/make_esp.py
          python3 tools/sdk_selftest.py
          python3 tools/make_desktop_preview_image.py
          python3 tools/verify_desktop_preview_image.py --image build/Frames-0.9.98-Desktop-Preview.img --require-pass
          python3 tools/verify_release.py

      - name: Add Windows-readable FRAMESLOG partition
        shell: bash
        run: |
          set -euo pipefail
          BASE="$FRAMES_DIR/build/Frames-0.9.98-Desktop-Preview.img"
          OUT="r61-out/Frames-0.9.98-r61-Storage-Write-BringUp-FRAMESLOG-Rufus.img"
          cp "$BASE" "$OUT"
          old_bytes="$(stat -c %s "$OUT")"
          truncate -s $((old_bytes + 64*1024*1024)) "$OUT"
          sgdisk -e "$OUT"
          sgdisk -n 2:0:0 -t 2:0700 -c 2:FRAMESLOG "$OUT"
          sgdisk -v "$OUT" | tee r61-out/GPT-VERIFY.txt
          read START SECTORS <<<"$(python3 - "$OUT" <<'PY'
          import struct,sys
          with open(sys.argv[1],'rb') as f:
              f.seek(2*512+128); e=f.read(128)
          first,last=struct.unpack_from('<QQ',e,32)
          if first<34 or last<first: raise SystemExit('invalid GPT partition #2')
          print(first,last-first+1)
          PY
          )"
          PART="r61-out/FRAMESLOG.part.img"
          truncate -s $((SECTORS*512)) "$PART"
          mkfs.fat -F 32 -n FRAMESLOG "$PART"
          truncate -s 1048576 r61-out/PTRLOG.BIN
          mcopy -o -i "$PART" r61-out/PTRLOG.BIN ::PTRLOG.BIN
          dd if="$PART" of="$OUT" bs=512 seek="$START" conv=notrunc status=none
          rm -f "$PART"

      - name: Package r61 evidence
        shell: bash
        run: |
          set -euo pipefail
          IMG="r61-out/Frames-0.9.98-r61-Storage-Write-BringUp-FRAMESLOG-Rufus.img"
          cat > r61-out/HANDS-ON-TEST.txt <<'EOF'
          Flash with Rufus/raw image mode. Boot with the same USB device.
          r61 performs one isolated 512-byte transaction against the first sector
          reserved for PTRLOG.BIN: read original -> write proof -> flush -> readback
          verify -> restore original -> flush -> verify restoration.

          Important on-screen fields:
          STGE 1..8 = deepest completed stage; ERR 0 = success.
          LBA = target sector; WR = WRITE(10) BOT/CSW success; FLSH = flush success;
          RDBK = proof readback success; RSTR = restore WRITE(10) success;
          VERI = final restoration byte-for-byte success.

          Success target: STGE=8 ERR=0 WR=1 FLSH=1 RDBK=1 RSTR=1 VERI=1.
          Diagnostic-only. Do not promote r61.
          EOF
          sha256sum "$IMG" | tee r61-out/IMAGE-SHA256.txt
          printf 'status=PASS\nrevision=r61\nstrategy=isolated-one-sector-storage-write-bringup\n' > r61-out/BUILD-STATUS.txt
          sha256sum r61-out/* > r61-out/SHA256SUMS.txt

      - name: Upload r61 image and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frames-0.9.98-r61-storage-write-bringup-rufus-image
          path: r61-out/**
          if-no-files-found: error
          retention-days: 14
