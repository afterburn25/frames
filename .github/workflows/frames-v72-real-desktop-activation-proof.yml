name: Frames v72 Real Desktop Activation Proof

on:
  workflow_dispatch:
  push:
    branches: [ v116-full-product-v101-integration ]
    paths:
      - '.github/workflows/frames-v72-real-desktop-activation-proof.yml'
      - 'architecture/integration/enable_v72_desktop_policy.py'
      - 'architecture/integration/decouple_v72_network_from_filesystem.py'
      - 'architecture/integration/instrument_v72_gui_app_host.py'
      - 'architecture/integration/wire_v72_gui_fapp_into_esp.py'

permissions:
  contents: read

jobs:
  prove-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v116-full-product-v101-integration
      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld python3 unzip qemu-system-x86 ovmf netcat-openbsd mtools dosfstools
      - name: Extract v72, enable desktop mode, repair gate dependency, and instrument GUI app host
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/v72-desktop"
          mkdir -p "$RUNNER_TEMP/v72-desktop" "$GITHUB_WORKSPACE/v72-desktop-proof"
          unzip -q "$GITHUB_WORKSPACE/Frames-0.9.62-Source-v72-r1.zip" -d "$RUNNER_TEMP/v72-desktop"
          SRC="$(find "$RUNNER_TEMP/v72-desktop" -type f -name VERSION -print | while read -r f; do [ "$(tr -d '\r\n' < "$f")" = '0.9.62' ] && dirname "$f" && break; done)"
          test -n "$SRC"
          echo "SRC=$SRC" >> "$GITHUB_ENV"
          grep -Rni -C 4 'boot_policy_flags' "$SRC/boot" > "$GITHUB_WORKSPACE/v72-desktop-proof/BOOT-POLICY-BEFORE.txt" || true
          python3 "$GITHUB_WORKSPACE/architecture/integration/enable_v72_desktop_policy.py" "$SRC/boot/uefi/frames_boot.c" | tee "$GITHUB_WORKSPACE/v72-desktop-proof/PATCH-DESKTOP-POLICY.log"
          python3 "$GITHUB_WORKSPACE/architecture/integration/decouple_v72_network_from_filesystem.py" "$SRC/kernel/main.nx" | tee "$GITHUB_WORKSPACE/v72-desktop-proof/PATCH-NETWORK-GATE.log"
          python3 "$GITHUB_WORKSPACE/architecture/integration/instrument_v72_gui_app_host.py" "$SRC/kernel/main.nx" | tee "$GITHUB_WORKSPACE/v72-desktop-proof/PATCH-GUI-APP-HOST.log"
          grep -Rni -C 4 'boot_policy_flags' "$SRC/boot" > "$GITHUB_WORKSPACE/v72-desktop-proof/BOOT-POLICY-AFTER.txt" || true
          grep -n -C 2 'fn network_core_gate' "$SRC/kernel/main.nx" > "$GITHUB_WORKSPACE/v72-desktop-proof/NETWORK-GATE-AFTER.txt" || true
          grep -n -A 24 'fn gui_app_host_init' "$SRC/kernel/main.nx" > "$GITHUB_WORKSPACE/v72-desktop-proof/GUI-APP-HOST-AFTER.txt" || true
          grep -q 'score==9' "$SRC/kernel/main.nx"
      - name: Build supplied v72 with desktop path enabled and wire verified GUI FAPP
        shell: bash
        run: |
          set -euo pipefail
          cd "$SRC"
          chmod +x tools/*.sh tools/*.py sdk/*.sh 2>/dev/null || true
          find toolchain -type f -name nexus -exec chmod +x {} + 2>/dev/null || true
          ./tools/build.sh 2>&1 | tee "$GITHUB_WORKSPACE/v72-desktop-proof/BUILD.log"
          find "$SRC" -type f \( -iname '*.fapp' -o -iname '*hello*' \) -print | sort | tee "$GITHUB_WORKSPACE/v72-desktop-proof/FAPP-CANDIDATES.txt" || true
          python3 tools/make_esp.py 2>&1 | tee "$GITHUB_WORKSPACE/v72-desktop-proof/MAKE-ESP.log"
          ESP="$(find "$SRC/build" -maxdepth 1 -type f -iname '*ESP*.img' -print | sort | head -n1)"
          test -s "$ESP"
          python3 "$GITHUB_WORKSPACE/architecture/integration/wire_v72_gui_fapp_into_esp.py" "$SRC" "$ESP" 2>&1 | tee "$GITHUB_WORKSPACE/v72-desktop-proof/WIRE-GUI-FAPP.log"
          echo "ESP=$ESP" >> "$GITHUB_ENV"
      - name: Boot desktop mode in QEMU and prove real GUI markers
        shell: bash
        run: |
          set -euo pipefail
          CODE=""; VARS=""
          for p in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd; do [ -f "$p" ] && CODE="$p" && break; done
          for p in /usr/share/OVMF/OVMF_VARS_4M.fd /usr/share/OVMF/OVMF_VARS.fd; do [ -f "$p" ] && VARS="$p" && break; done
          cp "$VARS" "$RUNNER_TEMP/v72-vars.fd"
          MON="$RUNNER_TEMP/v72-desktop-mon.sock"
          SERIAL="$GITHUB_WORKSPACE/v72-desktop-proof/SERIAL.log"
          SHOT="$GITHUB_WORKSPACE/v72-desktop-proof/FRAMEBUFFER.ppm"
          rm -f "$MON"
          qemu-system-x86_64 -machine q35 -m 1024 -smp 2 -drive if=pflash,format=raw,readonly=on,file="$CODE" -drive if=pflash,format=raw,file="$RUNNER_TEMP/v72-vars.fd" -drive if=virtio,format=raw,file="$ESP" -boot menu=off -serial file:"$SERIAL" -monitor unix:"$MON",server=on,wait=off -display none -vga std -no-reboot &
          PID=$!
          for i in $(seq 1 30); do [ -S "$MON" ] && break; sleep 1; done
          sleep 30
          printf 'screendump %s\ninfo status\nquit\n' "$SHOT" | nc -U "$MON" > "$GITHUB_WORKSPACE/v72-desktop-proof/QEMU-MONITOR.txt" 2>&1 || true
          wait "$PID" || true
          grep -E 'FRAMES_(FILESYSTEM|NETWORK_CORE|DISPLAY|DESKTOP|INTEGRATED_GUI|GUI_|READY)' "$SERIAL" | tee "$GITHUB_WORKSPACE/v72-desktop-proof/DESKTOP-MARKERS.txt" || true
          grep -q 'FRAMES_DESKTOP_POLICY_OK' "$SERIAL"
          grep -q 'FRAMES_NETWORK_CORE_OK' "$SERIAL"
          grep -q 'FRAMES_DESKTOP_PHASE1_OK' "$SERIAL"
          grep -q 'FRAMES_GUI_APP_CONTRACT_OK' "$SERIAL"
          grep -q 'FRAMES_DESKTOP_PHASE5_OK' "$SERIAL"
          grep -q 'FRAMES_INTEGRATED_GUI_OK' "$SERIAL"
          test -s "$SHOT"
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Frames-v72-Real-Desktop-Activation-Proof
          path: v72-desktop-proof/
          if-no-files-found: error
          retention-days: 30
