name: Frames 0.9.98 v108 r9 Certified Baseline UEFI ISO

on:
  workflow_dispatch:
  push:
    branches: [ v108-r9-certified-baseline-uefi-iso ]
    paths:
      - '.github/workflows/frames-v108-r9-certified-baseline-uefi-iso.yml'

permissions:
  contents: read

env:
  EXPECTED_RUNTIME_KIT_SHA256: 61b0fc25513719fce554729724c7848647de9cffe54434d4ab5f7ba8af42a36a
  EXPECTED_SOURCE_SHA256: 5f8c13adac6d34e64bd47d9463a3e261cd0b51bb5ddb500aa9f7b87c2914a52d
  EXPECTED_FRAMES_VERSION: 0.9.98
  EXPECTED_SOURCE_REVISION: v108-train
  CERTIFICATION_WORKFLOW_REVISION: v108-integrated-secure-online-services-r9
  CERTIFICATION_RUN_ID: '31831716862'
  CERTIFICATION_COMMIT: 7333a6670a38c9180e7d72c2a3df444409c36164

jobs:
  build-uefi-iso:
    name: Build exact v108 r9 baseline UEFI test ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Initialize output
        shell: bash
        run: |
          set -euo pipefail
          rm -rf boot-out
          mkdir -p boot-out
          printf 'status=started\n' > boot-out/BUILD-STATUS.txt

      - name: Verify and extract certified v108 r9 source
        shell: bash
        run: |
          set -euo pipefail
          KIT="$GITHUB_WORKSPACE/Frames-0.9.98-Runtime-Certification-Kit-v108-r9.zip"
          test -f "$KIT"
          kit_sha="$(sha256sum "$KIT" | awk '{print $1}')"
          test "$kit_sha" = "$EXPECTED_RUNTIME_KIT_SHA256"

          rm -rf "$RUNNER_TEMP/v108-r9-kit" "$RUNNER_TEMP/v108-r9-source"
          mkdir -p "$RUNNER_TEMP/v108-r9-kit" "$RUNNER_TEMP/v108-r9-source"
          python3 - "$KIT" "$RUNNER_TEMP/v108-r9-kit" <<'PY'
          import pathlib, sys, zipfile
          kit=pathlib.Path(sys.argv[1]); dst=pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(kit) as z:
              bad=z.testzip()
              if bad:
                  raise SystemExit(f'runtime kit ZIP integrity failure: {bad}')
              need={'CERTIFICATION-KIT.json','Frames-0.9.98-Source-v108.zip'}
              missing=need-set(z.namelist())
              if missing:
                  raise SystemExit(f'missing runtime kit members: {sorted(missing)}')
              for name in sorted(need): z.extract(name,dst)
          PY

          SOURCE_ZIP="$RUNNER_TEMP/v108-r9-kit/Frames-0.9.98-Source-v108.zip"
          source_sha="$(sha256sum "$SOURCE_ZIP" | awk '{print $1}')"
          test "$source_sha" = "$EXPECTED_SOURCE_SHA256"
          python3 - "$SOURCE_ZIP" "$RUNNER_TEMP/v108-r9-source" <<'PY'
          import pathlib, sys, zipfile
          src=pathlib.Path(sys.argv[1]); dst=pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(src) as z:
              bad=z.testzip()
              if bad: raise SystemExit(f'source ZIP integrity failure: {bad}')
              z.extractall(dst)
          PY

          FRAMES_DIR="$RUNNER_TEMP/v108-r9-source/Frames-0.9.98"
          test -f "$FRAMES_DIR/VERSION"
          test -f "$FRAMES_DIR/GUI-REPAIR-REVISION"
          test "$(tr -d '\r\n' < "$FRAMES_DIR/VERSION")" = "$EXPECTED_FRAMES_VERSION"
          test "$(tr -d '\r\n' < "$FRAMES_DIR/GUI-REPAIR-REVISION")" = "$EXPECTED_SOURCE_REVISION"
          echo "FRAMES_DIR=$FRAMES_DIR" >> "$GITHUB_ENV"

          cat > boot-out/SOURCE-IDENTITY.txt <<EOF
          status=PASS
          frames_version=$EXPECTED_FRAMES_VERSION
          source_revision=$EXPECTED_SOURCE_REVISION
          certification_workflow_revision=$CERTIFICATION_WORKFLOW_REVISION
          certification_run_id=$CERTIFICATION_RUN_ID
          certification_commit=$CERTIFICATION_COMMIT
          runtime_kit=Frames-0.9.98-Runtime-Certification-Kit-v108-r9.zip
          runtime_kit_sha256=$kit_sha
          source_archive=Frames-0.9.98-Source-v108.zip
          source_sha256=$source_sha
          EOF

      - name: Install build and ISO dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld python3 unzip zip xorriso mtools dosfstools qemu-system-x86 ovmf
          find "$FRAMES_DIR" -type f -name '*.sh' -exec chmod +x {} +
          find "$FRAMES_DIR/toolchain" -type f -name nexus -exec chmod +x {} +

      - name: Build exact certified source
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRAMES_DIR"
          ./tools/build.sh
          python3 tools/make_esp.py
          python3 tools/sdk_selftest.py
          python3 tools/make_desktop_preview_image.py
          python3 tools/verify_desktop_preview_image.py --image build/Frames-0.9.98-Desktop-Preview.img --require-pass
          python3 tools/verify_release.py
          cp build/Frames-0.9.98-Desktop-Preview.img "$GITHUB_WORKSPACE/boot-out/Frames-0.9.98-v108-r9-Baseline-UEFI.img"

      - name: Create UEFI El Torito ISO
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRAMES_DIR"
          ESP="build/esp.img"
          if [ ! -f "$ESP" ]; then
            ESP="$(find build -maxdepth 2 -type f \( -iname '*esp*.img' -o -iname '*efi*.img' \) | head -n1)"
          fi
          test -n "$ESP" -a -f "$ESP"
          cp "$ESP" "$GITHUB_WORKSPACE/boot-out/Frames-0.9.98-v108-r9-UEFI-ESP.img"

          ISO_ROOT="$RUNNER_TEMP/v108-r9-iso-root"
          rm -rf "$ISO_ROOT"
          mkdir -p "$ISO_ROOT"
          cp "$ESP" "$ISO_ROOT/efiboot.img"
          cat > "$ISO_ROOT/README.TXT" <<'EOF'
          Frames 0.9.98 v108 r9 Baseline UEFI Boot Media

          Built from the exact source sealed by the successful v108 r9 certification.
          This ISO packaging is test media derived from the certified source baseline.
          It does not change the certification status or unlock physical-media writes.
          UEFI boot only.
          EOF

          ISO="$GITHUB_WORKSPACE/boot-out/Frames-0.9.98-v108-r9-Baseline-UEFI-Boot.iso"
          xorriso -as mkisofs \
            -R -J -V 'FRAMES_V108_R9' \
            -eltorito-alt-boot \
            -e efiboot.img \
            -no-emul-boot \
            -o "$ISO" \
            "$ISO_ROOT"
          test -s "$ISO"
          xorriso -indev "$ISO" -report_el_torito plain > "$GITHUB_WORKSPACE/boot-out/ISO-ELTORITO-REPORT.txt" 2>&1
          grep -Eqi 'UEFI|EFI' "$GITHUB_WORKSPACE/boot-out/ISO-ELTORITO-REPORT.txt"

      - name: QEMU OVMF optical boot smoke test
        shell: bash
        run: |
          set -euo pipefail
          ISO="$GITHUB_WORKSPACE/boot-out/Frames-0.9.98-v108-r9-Baseline-UEFI-Boot.iso"
          CODE="$(find /usr/share/OVMF -type f \( -name 'OVMF_CODE_4M.fd' -o -name 'OVMF_CODE.fd' \) | head -n1)"
          VARS_SRC="$(find /usr/share/OVMF -type f \( -name 'OVMF_VARS_4M.fd' -o -name 'OVMF_VARS.fd' \) | head -n1)"
          test -n "$CODE" -a -f "$CODE"
          test -n "$VARS_SRC" -a -f "$VARS_SRC"
          cp "$VARS_SRC" "$RUNNER_TEMP/OVMF_VARS.fd"
          set +e
          timeout 18s qemu-system-x86_64 \
            -machine q35,accel=tcg \
            -m 768 \
            -no-reboot \
            -display none \
            -serial file:"$GITHUB_WORKSPACE/boot-out/QEMU-ISO-SERIAL.log" \
            -monitor none \
            -nic none \
            -drive if=pflash,format=raw,readonly=on,file="$CODE" \
            -drive if=pflash,format=raw,file="$RUNNER_TEMP/OVMF_VARS.fd" \
            -cdrom "$ISO" \
            > "$GITHUB_WORKSPACE/boot-out/QEMU-ISO-DEBUG.log" 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            echo "Unexpected QEMU exit code: $rc"
            cat "$GITHUB_WORKSPACE/boot-out/QEMU-ISO-DEBUG.log"
            exit "$rc"
          fi
          test -s "$GITHUB_WORKSPACE/boot-out/QEMU-ISO-SERIAL.log"
          if grep -Eqi 'Frames|FRAMES_' "$GITHUB_WORKSPACE/boot-out/QEMU-ISO-SERIAL.log"; then
            printf 'status=PASS\nqemu_exit_code=%s\nframes_serial_marker=true\n' "$rc" > "$GITHUB_WORKSPACE/boot-out/QEMU-ISO-SMOKE-TEST.txt"
          else
            printf 'status=PASS_WITHOUT_SERIAL_MARKER\nqemu_exit_code=%s\nframes_serial_marker=false\n' "$rc" > "$GITHUB_WORKSPACE/boot-out/QEMU-ISO-SMOKE-TEST.txt"
          fi

      - name: Seal boot-media identity and checksums
        shell: bash
        run: |
          set -euo pipefail
          cd boot-out
          iso_sha="$(sha256sum Frames-0.9.98-v108-r9-Baseline-UEFI-Boot.iso | awk '{print $1}')"
          img_sha="$(sha256sum Frames-0.9.98-v108-r9-Baseline-UEFI.img | awk '{print $1}')"
          esp_sha="$(sha256sum Frames-0.9.98-v108-r9-UEFI-ESP.img | awk '{print $1}')"
          cat > BOOT-IDENTITY.txt <<EOF
          Frames 0.9.98 v108 r9 Baseline UEFI Boot Media
          status=PASS
          source_baseline_certified=true
          iso_packaging_certification=derived-test-media
          frames_version=$EXPECTED_FRAMES_VERSION
          source_revision=$EXPECTED_SOURCE_REVISION
          certification_workflow_revision=$CERTIFICATION_WORKFLOW_REVISION
          certification_run_id=$CERTIFICATION_RUN_ID
          certification_commit=$CERTIFICATION_COMMIT
          runtime_kit_sha256=$EXPECTED_RUNTIME_KIT_SHA256
          source_sha256=$EXPECTED_SOURCE_SHA256
          iso=Frames-0.9.98-v108-r9-Baseline-UEFI-Boot.iso
          iso_sha256=$iso_sha
          raw_image=Frames-0.9.98-v108-r9-Baseline-UEFI.img
          raw_image_sha256=$img_sha
          esp_sha256=$esp_sha
          physical_media_writes_unlocked=false
          physical_boot_approved=false
          EOF
          printf 'status=PASS\niso_sha256=%s\nsource_sha256=%s\n' "$iso_sha" "$EXPECTED_SOURCE_SHA256" > BUILD-STATUS.txt
          sha256sum * > SHA256SUMS.txt
          cat BOOT-IDENTITY.txt

      - name: Upload v108 r9 baseline UEFI boot media
        uses: actions/upload-artifact@v4
        with:
          name: frames-0.9.98-v108-r9-baseline-uefi-boot-media
          path: boot-out/**
          if-no-files-found: error
          retention-days: 30