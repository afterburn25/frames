name: Frames v116 Full Product v101 Integration

on:
  workflow_dispatch:
  push:
    branches: [ v116-full-product-v101-integration ]
    paths:
      - '.github/workflows/frames-v116-full-product-v101-integration.yml'
      - 'architecture/integration/**'
      - 'architecture/v109/**'
      - 'architecture/v110/**'
      - 'architecture/v111/**'
      - 'architecture/v112/**'
      - 'architecture/v113/**'
      - 'architecture/v114/**'
      - 'architecture/v115/**'
      - 'architecture/v116/**'

permissions:
  contents: read

jobs:
  integrate-build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v116-full-product-v101-integration

      - name: Install build and ISO tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld python3 unzip patch gdisk mtools dosfstools xorriso qemu-system-x86 ovmf netcat-openbsd

      - name: Extract full Frames 0.9.91 v101 product source
        shell: bash
        run: |
          set -euo pipefail
          KIT="$GITHUB_WORKSPACE/Frames-0.9.91-Integrated-Connected-Services-Certification-Kit-v101.zip"
          test -s "$KIT"
          mkdir -p "$RUNNER_TEMP/v101-kit" "$RUNNER_TEMP/v101-source" "$GITHUB_WORKSPACE/integration-evidence"
          sha256sum "$KIT" | tee "$GITHUB_WORKSPACE/integration-evidence/V101-KIT-SHA256.txt"
          unzip -q "$KIT" -d "$RUNNER_TEMP/v101-kit"
          find "$RUNNER_TEMP/v101-kit" -maxdepth 5 -type f -printf '%P\n' | sort > "$GITHUB_WORKSPACE/integration-evidence/V101-KIT-INVENTORY.txt"
          SRCZIP="$(find "$RUNNER_TEMP/v101-kit" -type f \( -iname 'Frames-0.9.91-Source*.zip' -o -iname '*0.9.91*Source*.zip' \) -print | sort | head -n1 || true)"
          if [ -z "$SRCZIP" ]; then SRCZIP="$(find "$RUNNER_TEMP/v101-kit" -type f -iname '*Source*.zip' -print | sort | head -n1 || true)"; fi
          test -n "$SRCZIP"
          sha256sum "$SRCZIP" | tee "$GITHUB_WORKSPACE/integration-evidence/V101-SOURCE-SHA256.txt"
          unzip -q "$SRCZIP" -d "$RUNNER_TEMP/v101-source"
          PRODUCT=""
          while IFS= read -r vf; do
            d="${vf%/VERSION}"
            v="$(tr -d '\r\n' < "$vf")"
            if [ "$v" = "0.9.91" ] && [ -f "$d/kernel/main.nx" ]; then PRODUCT="$d"; break; fi
          done < <(find "$RUNNER_TEMP/v101-source" -type f -name VERSION -print | sort)
          test -n "$PRODUCT"
          echo "PRODUCT=$PRODUCT" >> "$GITHUB_ENV"
          printf 'product=%s\nversion=%s\n' "$PRODUCT" "$(cat "$PRODUCT/VERSION")" | tee "$GITHUB_WORKSPACE/integration-evidence/PRODUCT-IDENTITY.txt"
          sha256sum "$PRODUCT/kernel/main.nx" | tee "$GITHUB_WORKSPACE/integration-evidence/V101-KERNEL-MAIN-SHA256-BEFORE.txt"
          find "$PRODUCT" -maxdepth 2 -type f -printf '%P %s bytes\n' | sort > "$GITHUB_WORKSPACE/integration-evidence/V101-SOURCE-TOPLEVEL-INVENTORY.txt"
          find "$PRODUCT/tools" -maxdepth 1 -type f -printf '%f\n' 2>/dev/null | sort > "$GITHUB_WORKSPACE/integration-evidence/V101-TOOLS-INVENTORY.txt" || true

      - name: Semantically port v109 through v116 onto product kernel
        shell: bash
        run: |
          set -euo pipefail
          PORT="$GITHUB_WORKSPACE/architecture/integration/port_architecture_to_product.py"
          chmod +x "$PORT"
          : > "$GITHUB_WORKSPACE/integration-evidence/PORT-SUCCESS.txt"
          while read -r label rel; do
            python3 "$PORT" "$label" "$GITHUB_WORKSPACE/$rel" "$PRODUCT" "$GITHUB_WORKSPACE/integration-evidence" | tee -a "$GITHUB_WORKSPACE/integration-evidence/PORT-SUCCESS.txt"
          done <<'EOF'
          v109 architecture/v109/make_unified_device_architecture_v109.py
          v110 architecture/v110/make_driver_runtime_v110.py
          v111 architecture/v111/make_async_io_service_runtime_v111.py
          v112 architecture/v112/make_device_service_integration_v112.py
          v113 architecture/v113/make_driver_execution_hal_v113.py
          v114 architecture/v114/make_kernel_concurrency_driver_scheduling_v114.py
          v115 architecture/v115/make_driver_migration_unified_input_v115.py
          v116 architecture/v116/make_usb_core_xhci_migration_v116.py
          EOF
          sha256sum "$PRODUCT/kernel/main.nx" | tee "$GITHUB_WORKSPACE/integration-evidence/V116-PRODUCT-KERNEL-MAIN-SHA256-AFTER.txt"

      - name: Build complete product using v101 build system
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRODUCT"
          chmod +x tools/*.sh tools/*.py sdk/*.sh 2>/dev/null || true
          find toolchain -type f -name nexus -exec chmod +x {} + 2>/dev/null || true
          ./tools/build.sh 2>&1 | tee "$GITHUB_WORKSPACE/integration-evidence/BUILD.log"
          if [ -f tools/make_esp.py ]; then python3 tools/make_esp.py 2>&1 | tee "$GITHUB_WORKSPACE/integration-evidence/MAKE-ESP.log"; fi
          if [ -f tools/sdk_selftest.py ]; then python3 tools/sdk_selftest.py 2>&1 | tee "$GITHUB_WORKSPACE/integration-evidence/SDK-SELFTEST.log"; fi
          if [ -f tools/make_desktop_preview_image.py ]; then python3 tools/make_desktop_preview_image.py 2>&1 | tee "$GITHUB_WORKSPACE/integration-evidence/DESKTOP-PREVIEW.log"; fi
          if [ -f tools/verify_release.py ]; then python3 tools/verify_release.py 2>&1 | tee "$GITHUB_WORKSPACE/integration-evidence/VERIFY-RELEASE.log"; fi
          find build -maxdepth 2 -type f -printf '%P %s bytes\n' | sort | tee "$GITHUB_WORKSPACE/integration-evidence/BUILD-INVENTORY.txt"
          sha256sum build/FramesKernel.fkrn | tee "$GITHUB_WORKSPACE/integration-evidence/PRODUCT-V116-FKRN-SHA256.txt"
          test -s build/BOOTX64.EFI
          test -s build/FramesKernel.fkrn
          test -s build/System.fex

      - name: Preserve product ESP and create USB-friendly UEFI ISO
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRODUCT"
          ESP="$(find build -maxdepth 1 -type f -iname '*ESP*.img' -print | sort | head -n1 || true)"
          test -n "$ESP"; test -s "$ESP"
          FIRST="$(sgdisk -i 1 "$ESP" | awk -F: '/First sector/ {gsub(/^[ \t]+|[ \t]+$/, "", $2); split($2,a," "); print a[1]; exit}')"
          LAST="$(sgdisk -i 1 "$ESP" | awk -F: '/Last sector/ {gsub(/^[ \t]+|[ \t]+$/, "", $2); split($2,a," "); print a[1]; exit}')"
          test -n "$FIRST"; test -n "$LAST"
          COUNT=$((LAST - FIRST + 1))
          EFI_IMG="$RUNNER_TEMP/v101-product-efiboot.img"
          dd if="$ESP" of="$EFI_IMG" bs=512 skip="$FIRST" count="$COUNT" status=none
          fsck.vfat -n "$EFI_IMG" | tee "$GITHUB_WORKSPACE/integration-evidence/EFI-FAT-CHECK.txt" || true
          mdir -i "$EFI_IMG" ::/ | tee "$GITHUB_WORKSPACE/integration-evidence/EFI-ROOT-DIR.txt"
          mdir -i "$EFI_IMG" ::/EFI/BOOT/ | tee "$GITHUB_WORKSPACE/integration-evidence/EFI-BOOT-DIR.txt"
          mdir -i "$EFI_IMG" ::/FRAMES/ 2>&1 | tee "$GITHUB_WORKSPACE/integration-evidence/EFI-FRAMES-DIR.txt" || true
          mdir -i "$EFI_IMG" ::/EFI/BOOT/BOOTX64.EFI
          ROOT="$RUNNER_TEMP/iso-root"
          rm -rf "$ROOT"; mkdir -p "$ROOT/FRAMES" "$ROOT/EFI"
          cp "$EFI_IMG" "$ROOT/EFI/product-efiboot.img"
          cp build/BOOTX64.EFI "$ROOT/FRAMES/BOOTX64.EFI"
          cp build/FramesKernel.fkrn "$ROOT/FRAMES/FramesKernel.fkrn"
          cp build/System.fex "$ROOT/FRAMES/System.fex"
          cp "$ESP" "$ROOT/FRAMES/Product-ESP.img"
          find build -maxdepth 1 -type f \( -iname '*Desktop*.img' -o -iname '*.fthm' -o -iname '*.cfg' -o -iname '*.fapp' \) -exec cp -t "$ROOT/FRAMES" {} + 2>/dev/null || true
          printf '%s\n' 'Frames v116 Full Product Integration Test Boot' 'Product shell: Frames 0.9.91 Integrated Connected Services v101' 'Kernel additions: certified v109-v116 architecture port' 'Integration test image; not a new release promotion.' > "$ROOT/README.TXT"
          OUT="$GITHUB_WORKSPACE/Frames-v116-Full-Product-v101-Integrated-UEFI.iso"
          xorriso -as mkisofs -iso-level 3 -R -J -V FRAMES_FULL -append_partition 2 0xef "$EFI_IMG" -appended_part_as_gpt -e --interval:appended_partition_2:all:: -no-emul-boot -o "$OUT" "$ROOT" 2>&1 | tee "$GITHUB_WORKSPACE/integration-evidence/XORRISO.log"
          test -s "$OUT"
          sha256sum "$OUT" | tee "$GITHUB_WORKSPACE/Frames-v116-Full-Product-v101-Integrated-UEFI.iso.sha256"
          echo "ISO=$OUT" >> "$GITHUB_ENV"

      - name: QEMU OVMF full-product smoke and framebuffer capture
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          code=""; vars=""
          for p in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd; do [ -f "$p" ] && code="$p" && break; done
          for p in /usr/share/OVMF/OVMF_VARS_4M.fd /usr/share/OVMF/OVMF_VARS.fd; do [ -f "$p" ] && vars="$p" && break; done
          test -n "$code"; test -n "$vars"
          cp "$vars" "$RUNNER_TEMP/OVMF_VARS.fd"
          MON="$RUNNER_TEMP/qemu-monitor.sock"
          SERIAL="$GITHUB_WORKSPACE/integration-evidence/FULL-PRODUCT-SERIAL.log"
          SHOT="$GITHUB_WORKSPACE/integration-evidence/FULL-PRODUCT-FRAMEBUFFER.ppm"
          qemu-system-x86_64 -machine q35 -m 1024 -smp 2 -drive if=pflash,format=raw,readonly=on,file="$code" -drive if=pflash,format=raw,file="$RUNNER_TEMP/OVMF_VARS.fd" -cdrom "$ISO" -boot d -serial file:"$SERIAL" -monitor unix:"$MON",server=on,wait=off -display none -vga std -no-reboot &
          QPID=$!
          for i in $(seq 1 60); do [ -S "$MON" ] && break; sleep 1; done
          sleep 35
          printf 'screendump %s\ninfo status\nquit\n' "$SHOT" | nc -U "$MON" || true
          wait "$QPID" || true
          grep -E 'FRAMES_|GUI|DESKTOP|SHELL|COMPOS|CONNECTED|SYSTEM_SERVICE' "$SERIAL" | tail -300 > "$GITHUB_WORKSPACE/integration-evidence/PRODUCT-RUNTIME-MARKERS.txt" || true

      - name: Upload full integrated ISO and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Frames-v116-Full-Product-v101-Integrated-UEFI
          path: |
            ${{ github.workspace }}/Frames-v116-Full-Product-v101-Integrated-UEFI.iso
            ${{ github.workspace }}/Frames-v116-Full-Product-v101-Integrated-UEFI.iso.sha256
            ${{ github.workspace }}/integration-evidence/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
