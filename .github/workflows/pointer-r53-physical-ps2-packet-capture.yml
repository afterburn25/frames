name: Frames 0.9.98 r53 Physical PS2 Packet Capture USB Image

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/pointer-r53-physical-ps2-packet-capture.yml'
      - 'tools/ci/make_r53_ps2_packet_capture.py'
      - 'tools/ci/make_r52_ps2_bounded_delta.py'
      - 'tools/ci/make_r50_ps2_phase_fix.py'
      - 'tools/ci/make_r49_ps2_phase.py'

permissions:
  contents: read

env:
  EXPECTED_PARENT_SHA256: 1c7f1b514d9aa2f847f724e8b633286d069d745bf7c281a3967c46bbfea1a18c
  EXPECTED_R46_KERNEL_MAIN_SHA256: e5ccd3d4a453184f620e2ed5f928599bc8a7fa6959098f3aeff4916f6dcff165

jobs:
  build-r53:
    name: Build r53 Rufus-compatible physical PS2 packet capture image
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Initialize evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf r53-out
          mkdir -p r53-out
          printf 'status=started\nrevision=r53\n' > r53-out/BUILD-STATUS.txt
      - name: Reconstruct exact certified r46 base
        shell: bash
        run: |
          set -euo pipefail
          parent_sha="$(sha256sum Frames-0.9.98-Pointer-Diagnostics-CI-v1.zip | awk '{print $1}')"
          echo "protected_parent_sha256=$parent_sha" > r53-out/PARENT-IDENTITY.txt
          test "$parent_sha" = "$EXPECTED_PARENT_SHA256"
          rm -rf "$RUNNER_TEMP/r53"; mkdir -p "$RUNNER_TEMP/r53"
          unzip -q Frames-0.9.98-Pointer-Diagnostics-CI-v1.zip -d "$RUNNER_TEMP/r53"
          SRC="$RUNNER_TEMP/r53/Frames-0.9.98-Pointer-CI-Source"
          python3 - "$SRC/kernel/main.nx" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          a='if usb_hid_found != 0 { usb_hid_configured = xhci_configure_boot_hid(xhci_state,phys_state); if usb_hid_configured != 0 { usb_hid_report_ready = xhci_read_first_hid_report(xhci_state,phys_state); } }'
          b='if usb_hid_found != 0 { usb_hid_configured = xhci_configure_boot_hid(xhci_state,phys_state); if usb_hid_configured != 0 { usb_hid_report_ready = 1; } }'
          c='if input_queue_ready != 0 { if usb_hid_report_ready != 0 { input_decode_ready = input_decode_boot_hid(xhci_state,input_state); } else { ps2_poll_fallback(input_state); } }'
          d='if input_queue_ready != 0 { if usb_hid_report_ready != 0 { input_decode_ready = 1; } else { ps2_poll_fallback(input_state); } }'
          assert s.count(a)==1 and s.count(c)==1
          p.write_text(s.replace(a,b).replace(c,d))
          PY
          r46_sha="$(sha256sum "$SRC/kernel/main.nx" | awk '{print $1}')"
          echo "r46_kernel_main_sha256=$r46_sha" > r53-out/R46-BASE-IDENTITY.txt
          test "$r46_sha" = "$EXPECTED_R46_KERNEL_MAIN_SHA256"
          echo "FRAMES_DIR=$SRC" >> "$GITHUB_ENV"
      - name: Apply r53 packet capture on r52 working path
        shell: bash
        run: |
          set -euo pipefail
          cp "$FRAMES_DIR/kernel/main.nx" r53-out/kernel-main-before-r53.nx
          python3 tools/ci/make_r53_ps2_packet_capture.py "$FRAMES_DIR/kernel/main.nx"
          cp "$FRAMES_DIR/kernel/main.nx" r53-out/kernel-main-r53.nx
          diff -u r53-out/kernel-main-before-r53.nx r53-out/kernel-main-r53.nx > r53-out/R53-PACKET-CAPTURE.patch || true
          grep -q 'R53' "$FRAMES_DIR/kernel/main.nx"
          grep -q 'RAW0' "$FRAMES_DIR/kernel/main.nx"
          grep -q 'PKT3' "$FRAMES_DIR/kernel/main.nx"
          sha256sum "$FRAMES_DIR/kernel/main.nx" | tee r53-out/R53-KERNEL-SHA256.txt
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld python3 unzip zip mtools dosfstools
          find "$FRAMES_DIR" -type f -name '*.sh' -exec chmod +x {} +
          find "$FRAMES_DIR/toolchain" -type f -name nexus -exec chmod +x {} +
      - name: Build and verify raw USB image
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRAMES_DIR"
          ./tools/build.sh
          python3 tools/make_esp.py
          python3 tools/sdk_selftest.py
          python3 tools/make_desktop_preview_image.py
          python3 tools/verify_desktop_preview_image.py --image build/Frames-0.9.98-Desktop-Preview.img --require-pass
          python3 tools/verify_release.py
          cp build/Frames-0.9.98-Desktop-Preview.img "$GITHUB_WORKSPACE/r53-out/Frames-0.9.98-r53-Physical-PS2-Packet-Capture-Rufus.img"
      - name: Record hands-on instructions and hashes
        shell: bash
        run: |
          set -euo pipefail
          img="r53-out/Frames-0.9.98-r53-Physical-PS2-Packet-Capture-Rufus.img"
          img_sha="$(sha256sum "$img" | awk '{print $1}')"
          cat > r53-out/HANDS-ON-TEST.txt <<'EOF'
          Write the r53 IMG directly to USB with Rufus/raw image mode and boot UEFI.
          Confirm PTR DIAG R53. Move the touchpad slowly in one direction for 5 seconds, stop, then move in another direction for 5 seconds. Take clear photos while motion has just occurred.
          RAW0/RAW1/RAW2 are the last 12 AUX bytes, oldest to newest, packed four bytes per row. PKT3 is the exact three-byte packet Frames most recently interpreted as header/X/Y. RCNT is raw byte count. PSIZ is Frames' active packet size.
          Preserve SRC/CORE/TRNS/JNUM/JHDR/JPDX/JPDY and GUI coordinates in the photos if possible.
          Diagnostic capture only; do not promote.
          EOF
          printf 'status=PASS\nrevision=r53\nimage_sha256=%s\n' "$img_sha" > r53-out/BUILD-STATUS.txt
          sha256sum r53-out/* > r53-out/SHA256SUMS.txt
      - name: Upload r53 USB image and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frames-0.9.98-r53-physical-ps2-packet-capture-rufus-image
          path: r53-out/**
          if-no-files-found: error
          retention-days: 14
