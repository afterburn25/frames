name: Frames 0.9.98 r56 Linux-Reference Input Architecture Rufus ISO

on:
  workflow_dispatch:
  push:
    branches: [ r56-linux-input-architecture ]
    paths:
      - '.github/workflows/pointer-r56-linux-input-architecture.yml'
      - 'tools/ci/make_r56_linux_input_architecture.py'
      - 'tools/ci/make_r55_physical_protocol_probe.py'
      - 'tools/ci/make_r54_usb_multiport_hid.py'
      - 'tools/ci/make_r53b_input_protocol_id.py'
      - 'tools/ci/make_r50_ps2_phase_fix.py'
      - 'tools/ci/make_r49_ps2_phase.py'

permissions:
  contents: read

env:
  EXPECTED_PARENT_SHA256: 1c7f1b514d9aa2f847f724e8b633286d069d745bf7c281a3967c46bbfea1a18c
  EXPECTED_R46_KERNEL_MAIN_SHA256: e5ccd3d4a453184f620e2ed5f928599bc8a7fa6959098f3aeff4916f6dcff165

jobs:
  build-r56:
    name: Build r56 controller/core boundary Rufus ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r56-linux-input-architecture

      - name: Initialize evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf r56-out
          mkdir -p r56-out
          printf 'status=started\nrevision=r56\nstrategy=linux-reference-input-architecture\nformat=rufus-uefi-iso\n' > r56-out/BUILD-STATUS.txt

      - name: Reconstruct exact protected r46 base
        shell: bash
        run: |
          set -euo pipefail
          parent_sha="$(sha256sum Frames-0.9.98-Pointer-Diagnostics-CI-v1.zip | awk '{print $1}')"
          echo "protected_parent_sha256=$parent_sha" > r56-out/PARENT-IDENTITY.txt
          test "$parent_sha" = "$EXPECTED_PARENT_SHA256"
          rm -rf "$RUNNER_TEMP/r56"; mkdir -p "$RUNNER_TEMP/r56"
          unzip -q Frames-0.9.98-Pointer-Diagnostics-CI-v1.zip -d "$RUNNER_TEMP/r56"
          SRC="$RUNNER_TEMP/r56/Frames-0.9.98-Pointer-CI-Source"
          python3 - "$SRC/kernel/main.nx" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          a='if usb_hid_found != 0 { usb_hid_configured = xhci_configure_boot_hid(xhci_state,phys_state); if usb_hid_configured != 0 { usb_hid_report_ready = xhci_read_first_hid_report(xhci_state,phys_state); } }'
          b='if usb_hid_found != 0 { usb_hid_configured = xhci_configure_boot_hid(xhci_state,phys_state); if usb_hid_configured != 0 { usb_hid_report_ready = 1; } }'
          c='if input_queue_ready != 0 { if usb_hid_report_ready != 0 { input_decode_ready = input_decode_boot_hid(xhci_state,input_state); } else { ps2_poll_fallback(input_state); } }'
          d='if input_queue_ready != 0 { if usb_hid_report_ready != 0 { input_decode_ready = 1; } else { ps2_poll_fallback(input_state); } }'
          assert s.count(a)==1 and s.count(c)==1
          p.write_text(s.replace(a,b).replace(c,d))
          PY
          r46_sha="$(sha256sum "$SRC/kernel/main.nx" | awk '{print $1}')"
          echo "r46_kernel_main_sha256=$r46_sha" > r56-out/R46-BASE-IDENTITY.txt
          test "$r46_sha" = "$EXPECTED_R46_KERNEL_MAIN_SHA256"
          echo "FRAMES_DIR=$SRC" >> "$GITHUB_ENV"

      - name: Apply r56 Linux-reference architecture probe
        shell: bash
        run: |
          set -euo pipefail
          cp "$FRAMES_DIR/kernel/main.nx" r56-out/kernel-main-before-r56.nx
          python3 tools/ci/make_r56_linux_input_architecture.py "$FRAMES_DIR/kernel/main.nx"
          cp "$FRAMES_DIR/kernel/main.nx" r56-out/kernel-main-r56.nx
          diff -u r56-out/kernel-main-before-r56.nx r56-out/kernel-main-r56.nx > r56-out/R56-LINUX-REFERENCE-ARCH.patch || true
          grep -q 'R56' "$FRAMES_DIR/kernel/main.nx"
          grep -q 'XINI' "$FRAMES_DIR/kernel/main.nx"
          grep -q 'XBAS' "$FRAMES_DIR/kernel/main.nx"
          grep -q 'USTG' "$FRAMES_DIR/kernel/main.nx"
          sha256sum "$FRAMES_DIR/kernel/main.nx" | tee r56-out/R56-KERNEL-SHA256.txt

      - name: Install build and ISO dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld python3 unzip zip xorriso mtools dosfstools
          find "$FRAMES_DIR" -type f -name '*.sh' -exec chmod +x {} +
          find "$FRAMES_DIR/toolchain" -type f -name nexus -exec chmod +x {} +

      - name: Build and verify r56 image
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRAMES_DIR"
          ./tools/build.sh
          python3 tools/make_esp.py
          python3 tools/sdk_selftest.py
          python3 tools/make_desktop_preview_image.py
          python3 tools/verify_desktop_preview_image.py --image build/Frames-0.9.98-Desktop-Preview.img --require-pass
          python3 tools/verify_release.py
          cp build/Frames-0.9.98-Desktop-Preview.img "$GITHUB_WORKSPACE/r56-out/Frames-0.9.98-r56-Linux-Reference-Input-Architecture-Rufus.img"

      - name: Create Rufus-compatible UEFI ISO from verified ESP
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRAMES_DIR"
          ESP="build/esp.img"
          if [ ! -f "$ESP" ]; then
            ESP="$(find build -maxdepth 2 -type f \( -iname '*esp*.img' -o -iname '*efi*.img' \) | head -n1)"
          fi
          test -n "$ESP" -a -f "$ESP"
          cp "$ESP" "$GITHUB_WORKSPACE/r56-out/Frames-0.9.98-r56-UEFI-ESP.img"
          rm -rf "$RUNNER_TEMP/r56-iso-root"
          mkdir -p "$RUNNER_TEMP/r56-iso-root"
          cat > "$RUNNER_TEMP/r56-iso-root/README.TXT" <<'EOF'
          Frames 0.9.98 r56 Linux-Reference Input Architecture
          Rufus-compatible UEFI physical USB/input diagnostic image.
          Diagnostic-only candidate; do not promote.
          EOF
          cp "$ESP" "$RUNNER_TEMP/r56-iso-root/efiboot.img"
          xorriso -as mkisofs \
            -R -J -V 'FRAMES_R56' \
            -eltorito-alt-boot \
            -e efiboot.img \
            -no-emul-boot \
            -o "$GITHUB_WORKSPACE/r56-out/Frames-0.9.98-r56-Linux-Reference-Input-Architecture-Rufus-UEFI.iso" \
            "$RUNNER_TEMP/r56-iso-root"
          test -s "$GITHUB_WORKSPACE/r56-out/Frames-0.9.98-r56-Linux-Reference-Input-Architecture-Rufus-UEFI.iso"
          xorriso -indev "$GITHUB_WORKSPACE/r56-out/Frames-0.9.98-r56-Linux-Reference-Input-Architecture-Rufus-UEFI.iso" -report_el_torito plain > "$GITHUB_WORKSPACE/r56-out/ISO-ELTORITO-REPORT.txt" 2>&1
          grep -qi 'UEFI\|EFI' "$GITHUB_WORKSPACE/r56-out/ISO-ELTORITO-REPORT.txt"

      - name: Record hands-on instructions and hashes
        shell: bash
        run: |
          set -euo pipefail
          iso="r56-out/Frames-0.9.98-r56-Linux-Reference-Input-Architecture-Rufus-UEFI.iso"
          img="r56-out/Frames-0.9.98-r56-Linux-Reference-Input-Architecture-Rufus.img"
          iso_sha="$(sha256sum "$iso" | awk '{print $1}')"
          img_sha="$(sha256sum "$img" | awk '{print $1}')"
          cat > r56-out/HANDS-ON-TEST.txt <<'EOF'
          Select the r56 ISO in Rufus and write it to the test USB, then boot the laptop in UEFI mode.
          Plug the physical USB mouse in BEFORE boot and leave the Frames boot USB inserted.
          Confirm PTR DIAG R56.

          USB controller/core boundary fields:
            XINI = xHCI controller state initialized flag (+56)
            XBAS = xHCI MMIO capability base recorded by Frames
            XOP  = xHCI operational-register base recorded by Frames
            USTG = deepest USB device-enumeration stage from r55
            UTRY = connected-port scan attempts
            UPOR = selected root port
            UVID = USB device VID when descriptor acquisition succeeds

          Interpretation:
            XINI=0 => failure is controller discovery/initialization, before USB enumeration.
            XINI=1 with USTG=0 => xHCI exists but Frames never enters the device-enumeration gate; investigate PCI/controller sequencing and ownership handoff.
            USTG 1-6 => controller path works; fix the first failing enumeration stage.
            USTG 7-8 => HID discovery/configuration reached; next target is persistent interrupt-IN streaming.

          Touchpad telemetry is retained from r55 for later native protocol identification. Do not promote r56; diagnostic architecture probe only.
          EOF
          cat > r56-out/BOOT-IDENTITY.txt <<EOF
          revision=r56
          format=Rufus-compatible UEFI ISO
          iso=Frames-0.9.98-r56-Linux-Reference-Input-Architecture-Rufus-UEFI.iso
          iso_sha256=$iso_sha
          raw_image_sha256=$img_sha
          protected_parent_sha256=$EXPECTED_PARENT_SHA256
          r46_kernel_main_sha256=$EXPECTED_R46_KERNEL_MAIN_SHA256
          EOF
          printf 'status=PASS\nrevision=r56\nformat=rufus-uefi-iso\niso_sha256=%s\nimage_sha256=%s\n' "$iso_sha" "$img_sha" > r56-out/BUILD-STATUS.txt
          sha256sum r56-out/* > r56-out/SHA256SUMS.txt

      - name: Upload r56 Rufus ISO and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frames-0.9.98-r56-linux-reference-input-architecture-rufus-iso
          path: r56-out/**
          if-no-files-found: error
          retention-days: 14
