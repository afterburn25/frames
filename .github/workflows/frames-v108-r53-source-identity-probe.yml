name: Frames v108 r53 Source Identity Probe

on:
  workflow_dispatch:
  push:
    branches: [ v108-usb-hub-topology-r1 ]
    paths:
      - '.github/workflows/frames-v108-r53-source-identity-probe.yml'
      - 'tools/ci/patch_v108_r53_ehci_port_reset_companion_classifier.py'

permissions:
  contents: read
  actions: read
  statuses: write

jobs:
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v108-usb-hub-topology-r1
      - name: Publish identity pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          python3 - "$TARGET" <<'PY'
          import json,sys
          open('/tmp/r53-id-status.json','w').write(json.dumps({'state':'pending','context':'frames/r53-source-identity','description':'r53 source identity running','target_url':sys.argv[1]}))
          PY
          curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --data-binary @/tmp/r53-id-status.json
      - name: Fetch exact r21 protected source
        uses: actions/download-artifact@v4
        with:
          name: Frames-v108-r21-Candidate
          path: r21-candidate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: afterburn25/frames
          run-id: '31979817129'
      - name: Reconstruct r53 and print deterministic identity
        shell: bash
        run: |
          set -euo pipefail
          cp r21-candidate/evidence/kernel-r21.nx /tmp/kernel-r53.nx
          set +e
          OUT="$(python3 tools/ci/patch_v108_r53_ehci_port_reset_companion_classifier.py /tmp/kernel-r53.nx 2>&1)"
          RC=$?
          set -e
          printf '%s\n' "$OUT"
          if printf '%s\n' "$OUT" | grep -Eq 'r53 output sha mismatch [0-9a-f]{64}'; then
            printf '%s\n' "$OUT" | grep -Eo 'r53 output sha mismatch [0-9a-f]{64}'
            exit 0
          fi
          exit "$RC"
      - name: Publish identity success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          python3 - "$TARGET" <<'PY'
          import json,sys
          open('/tmp/r53-id-status.json','w').write(json.dumps({'state':'success','context':'frames/r53-source-identity','description':'r53 source identity discovered','target_url':sys.argv[1]}))
          PY
          curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --data-binary @/tmp/r53-id-status.json
