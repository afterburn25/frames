name: Frames v108 r61 r59s Reference EHCI Discovery

on:
  workflow_dispatch:
  push:
    branches: [ v108-usb-r61-r59s-reference-ehci ]
    paths:
      - '.github/workflows/frames-v108-r61-r59s-reference-ehci-discovery.yml'
      - 'tools/ci/r61_transform.py'
      - 'tools/ci/r61_discovery_driver.py'

permissions:
  contents: read
  actions: read
  statuses: write

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v108-usb-r61-r59s-reference-ehci
      - name: Publish r61 discovery pending status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          python3 - "$TARGET" <<'PY'
          import json,sys
          open('/tmp/r61-status-pending.json','w').write(json.dumps({'state':'pending','context':'frames/r61-discovery','description':'r61 exact-source discovery running','target_url':sys.argv[1]}))
          PY
          curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --data-binary @/tmp/r61-status-pending.json
      - name: Install build/image/runtime tools
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /etc/apt/apt-mirrors.txt ]; then sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt || true; fi
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends lld mtools dosfstools gdisk xorriso qemu-system-x86 ovmf python3-pil
          for t in clang ld.lld python3 unzip mformat mkfs.fat sgdisk xorriso qemu-system-x86_64; do command -v "$t"; done
      - name: Fetch exact r21 protected source
        uses: actions/download-artifact@v4
        with:
          name: Frames-v108-r21-Candidate
          path: r21-candidate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: afterburn25/frames
          run-id: '31979817129'
      - name: Harden inherited text readiness harness
        run: python3 tools/ci/harden_qemu_text_edit_gate_r28.py
      - name: Reconstruct exact r59s and discover r61 identity
        run: python3 tools/ci/r61_discovery_driver.py
      - name: Upload r61 discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Frames-v108-r61-Discovery-Evidence
          path: |
            evidence/R61-*.txt
            evidence/kernel-r61-discovery.nx
          if-no-files-found: warn
          retention-days: 30
      - name: Publish r61 discovery status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          STATE=success
          DESC='r61 exact-source discovery PASS'
          if [ "$JOB_STATUS" != "success" ]; then STATE=failure; DESC='r61 exact-source discovery FAIL'; fi
          TARGET="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          python3 - "$STATE" "$DESC" "$TARGET" <<'PY'
          import json,sys
          open('/tmp/r61-status.json','w').write(json.dumps({'state':sys.argv[1],'context':'frames/r61-discovery','description':sys.argv[2],'target_url':sys.argv[3]}))
          PY
          curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --data-binary @/tmp/r61-status.json
