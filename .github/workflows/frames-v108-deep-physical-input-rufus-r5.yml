name: Frames v108 Deep Physical Input Rufus Diagnostic r5

on:
  workflow_dispatch:
  push:
    branches: [ v108-physical-input-bringup ]
    paths:
      - '.github/workflows/frames-v108-deep-physical-input-rufus-r5.yml'
      - 'tools/ci/patch_v108_physical_deep_telemetry.py'

permissions:
  contents: read

env:
  KIT_SHA: 61b0fc25513719fce554729724c7848647de9cffe54434d4ab5f7ba8af42a36a
  SRC_SHA: 5f8c13adac6d34e64bd47d9463a3e261cd0b51bb5ddb500aa9f7b87c2914a52d
  BASE_MAIN_SHA: ffc5721eca68844357dbdca63b0edf266e7e210f9d162eecde8cae0067f210a8
  R2_MAIN_SHA: 8cf33253489331e200643fa004992fece4eaf86b6feccaa3e00c06883927f675
  R5_MAIN_SHA: d0421388cd288a7073ca750915b1b51ceeee62acfe524a6785f855e42f9b1e7f
  ISO_NAME: Frames-0.9.98-v108-Physical-Input-Deep-Diagnostic-r5-Rufus-UEFI.iso

jobs:
  build-rufus-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v108-physical-input-bringup
      - name: Install build and ISO tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld python3 unzip zip mtools dosfstools gdisk xorriso
      - name: Reconstruct exact certified v108 and apply r5 telemetry
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/v108r5" evidence out payload
          mkdir -p "$RUNNER_TEMP/v108r5/kit" "$RUNNER_TEMP/v108r5/src" evidence out payload
          K=Frames-0.9.98-Runtime-Certification-Kit-v108-r9.zip
          test "$(sha256sum "$K" | awk '{print $1}')" = "$KIT_SHA"
          unzip -q "$K" -d "$RUNNER_TEMP/v108r5/kit"
          Z="$RUNNER_TEMP/v108r5/kit/Frames-0.9.98-Source-v108.zip"
          test "$(sha256sum "$Z" | awk '{print $1}')" = "$SRC_SHA"
          unzip -q "$Z" -d "$RUNNER_TEMP/v108r5/src"
          F="$RUNNER_TEMP/v108r5/src/Frames-0.9.98"
          test "$(sha256sum "$F/kernel/main.nx" | awk '{print $1}')" = "$BASE_MAIN_SHA"
          cp "$F/kernel/main.nx" evidence/kernel-certified-v108.nx
          python3 tools/ci/patch_v108_live_input_common.py "$F/kernel/main.nx" > evidence/common-sha.txt
          python3 tools/ci/patch_v108_usb_mouse_live.py "$F/kernel/main.nx" > evidence/usb-sha.txt
          python3 tools/ci/patch_v108_ps2_touchpad_live.py "$F/kernel/main.nx" > evidence/ps2-sha.txt
          python3 tools/ci/patch_v108_input_telemetry_overlay.py "$F/kernel/main.nx" > evidence/telemetry-sha.txt
          python3 tools/ci/patch_v108_input_usbboot_gate_decouple.py "$F/kernel/main.nx" > evidence/usbboot-gate-sha.txt
          test "$(sha256sum "$F/kernel/main.nx" | awk '{print $1}')" = "$R2_MAIN_SHA"
          cp "$F/kernel/main.nx" evidence/kernel-r2-before-deep-telemetry.nx
          python3 tools/ci/patch_v108_physical_deep_telemetry.py "$F/kernel/main.nx" | tee evidence/deep-telemetry-sha.txt
          test "$(sha256sum "$F/kernel/main.nx" | awk '{print $1}')" = "$R5_MAIN_SHA"
          cp "$F/kernel/main.nx" evidence/kernel-r5-deep-telemetry.nx
          diff -u evidence/kernel-r2-before-deep-telemetry.nx evidence/kernel-r5-deep-telemetry.nx > evidence/DEEP-INPUT-R5.patch || true
          grep -q 'input_state+3224' "$F/kernel/main.nx"
          grep -q 'input_state+3192' "$F/kernel/main.nx"
          echo "FRAMES_DIR=$F" >> "$GITHUB_ENV"
      - name: Fail closed on write-path surface
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          d=Path('evidence/DEEP-INPUT-R5.patch').read_text(errors='replace').splitlines()
          changed='\n'.join(x for x in d if (x.startswith('+') or x.startswith('-')) and not x.startswith('+++') and not x.startswith('---')).lower()
          forbidden=['nvme_write','storage_write','write10','write(10)','scsi_write','fat_write','block_write','destructive_write','physical_write_enable']
          hits=[x for x in forbidden if x in changed]
          Path('evidence/WRITE-SURFACE-AUDIT.txt').write_text('status=' + ('PASS' if not hits else 'FAIL') + '\nforbidden_hits=' + ','.join(hits) + '\n')
          if hits: raise SystemExit('input telemetry patch touched write surface: '+','.join(hits))
          PY
      - name: Build raw candidate and Rufus UEFI ISO
        run: |
          set -euo pipefail
          find "$FRAMES_DIR" -type f -name '*.sh' -exec chmod +x {} +
          find "$FRAMES_DIR/toolchain" -type f -name nexus -exec chmod +x {} +
          cd "$FRAMES_DIR"
          ./tools/build.sh
          python3 tools/make_esp.py
          python3 tools/sdk_selftest.py
          python3 tools/make_desktop_preview_image.py
          python3 tools/verify_desktop_preview_image.py --image build/Frames-0.9.98-Desktop-Preview.img --require-pass
          python3 tools/verify_release.py
          cp build/Frames-0.9.98-Desktop-Preview.img "$GITHUB_WORKSPACE/out/r5-raw.img"
          cd "$GITHUB_WORKSPACE"
          sha256sum out/r5-raw.img | tee evidence/RAW-IMAGE-SHA256.txt
          stat -c '%s' out/r5-raw.img | tee evidence/RAW-IMAGE-SIZE.txt
          FIRST="$(sgdisk -i 1 out/r5-raw.img | awk -F: '/First sector/ {gsub(/ /,"",$2); split($2,a,"("); print a[1]}')"
          LAST="$(sgdisk -i 1 out/r5-raw.img | awk -F: '/Last sector/ {gsub(/ /,"",$2); split($2,a,"("); print a[1]}')"
          dd if=out/r5-raw.img of=out/original-esp.img bs=512 skip="$FIRST" count=$((LAST-FIRST+1)) status=none
          mcopy -s -i out/original-esp.img '::/EFI' payload/
          mcopy -s -i out/original-esp.img '::/FRAMES' payload/
          test -s payload/EFI/BOOT/BOOTX64.EFI
          test -s payload/FRAMES/FramesKernel.fkrn
          sha256sum payload/EFI/BOOT/BOOTX64.EFI payload/FRAMES/* > evidence/PAYLOAD-SHA256.txt
          dd if=/dev/zero of=out/efiboot.img bs=1M count=16 status=none
          mkfs.fat -F 16 -n FRAMESBOOT out/efiboot.img
          mmd -i out/efiboot.img ::/EFI ::/EFI/BOOT ::/FRAMES
          mcopy -i out/efiboot.img payload/EFI/BOOT/BOOTX64.EFI ::/EFI/BOOT/BOOTX64.EFI
          for f in payload/FRAMES/*; do mcopy -i out/efiboot.img "$f" ::/FRAMES/; done
          mcopy -i out/efiboot.img ::/EFI/BOOT/BOOTX64.EFI out/roundtrip-BOOTX64.EFI
          mcopy -i out/efiboot.img ::/FRAMES/FramesKernel.fkrn out/roundtrip-FramesKernel.fkrn
          test "$(sha256sum out/roundtrip-BOOTX64.EFI | awk '{print $1}')" = "$(sha256sum payload/EFI/BOOT/BOOTX64.EFI | awk '{print $1}')"
          test "$(sha256sum out/roundtrip-FramesKernel.fkrn | awk '{print $1}')" = "$(sha256sum payload/FRAMES/FramesKernel.fkrn | awk '{print $1}')"
          fsck.fat -vn out/efiboot.img > evidence/COMPACT-FSCK.txt 2>&1
          ROOT="$RUNNER_TEMP/r5-iso-root"; rm -rf "$ROOT"; mkdir -p "$ROOT"
          cp out/efiboot.img "$ROOT/efiboot.img"
          cp -a payload/EFI payload/FRAMES "$ROOT/"
          cat > "$ROOT/README.TXT" <<'EOF'
          Frames 0.9.98 v108 r5 Deep Physical Input Diagnostic
          Rufus-compatible UEFI ISO. Use Rufus ISO Image mode.
          Diagnostic/read-only physical boot only. Destructive writes are not certified.
          EOF
          xorriso -as mkisofs -iso-level 3 -R -J -V FRAMES_V108_R5 -eltorito-alt-boot -e efiboot.img -no-emul-boot -o "out/$ISO_NAME" "$ROOT"
          test -s "out/$ISO_NAME"
          sha256sum "out/$ISO_NAME" | tee evidence/ISO-SHA256.txt
          stat -c '%s' "out/$ISO_NAME" | tee evidence/ISO-SIZE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Frames-v108-Deep-Physical-Input-r5-Candidate
          path: |
            out/${{ env.ISO_NAME }}
            evidence/**
          if-no-files-found: error
          retention-days: 30

  vm-live-input:
    needs: build-rufus-iso
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane: [usb, ps2]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Frames-v108-Deep-Physical-Input-r5-Candidate
          path: candidate
      - name: Install QEMU/OVMF
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf python3
          code="$(find /usr/share/OVMF -type f \( -name 'OVMF_CODE_4M.fd' -o -name 'OVMF_CODE.fd' \) | head -n1)"
          test -n "$code"
          echo "OVMF_CODE=$code" >> "$GITHUB_ENV"
      - name: Boot exact ISO and prove ${{ matrix.lane }} path still works
        run: |
          set -euo pipefail
          OUT="lane-${{ matrix.lane }}"; mkdir -p "$OUT"
          ISO="candidate/$ISO_NAME"; test -s "$ISO"
          python3 - "$OVMF_CODE" "$ISO" "$OUT" '${{ matrix.lane }}' <<'PY'
          import json,pathlib,socket,subprocess,sys,time
          ovmf,iso,out,lane=sys.argv[1:]
          out=pathlib.Path(out); qmp=out/'qmp.sock'; serial=out/'serial.log'; stderr=out/'qemu.stderr'
          cmd=['qemu-system-x86_64','-machine','q35','-m','768M','-smp','2','-cpu','max','-accel','tcg,thread=single','-display','none','-no-reboot','-no-shutdown','-nic','none','-serial',f'file:{serial}','-qmp',f'unix:{qmp},server=on,wait=off','-drive',f'if=pflash,format=raw,readonly=on,file={ovmf}','-cdrom',iso,'-boot','d']
          if lane=='usb': cmd += ['-device','qemu-xhci,id=xhci','-device','usb-mouse,bus=xhci.0,id=usbmouse']
          (out/'qemu-command.json').write_text(json.dumps(cmd,indent=2)+'\n')
          ef=stderr.open('wb'); p=subprocess.Popen(cmd,stdout=subprocess.DEVNULL,stderr=ef)
          try:
              deadline=time.time()+25
              while time.time()<deadline and not qmp.exists():
                  if p.poll() is not None: raise RuntimeError(f'qemu exited {p.returncode}')
                  time.sleep(.05)
              if not qmp.exists(): raise RuntimeError('qmp timeout')
              s=socket.socket(socket.AF_UNIX,socket.SOCK_STREAM); s.connect(str(qmp)); f=s.makefile('rwb',buffering=0); json.loads(f.readline())
              def call(name,args=None):
                  o={'execute':name}
                  if args is not None:o['arguments']=args
                  f.write((json.dumps(o)+'\n').encode())
                  while True:
                      r=json.loads(f.readline())
                      if 'return' in r:return r['return']
                      if 'error' in r:raise RuntimeError(r['error'])
              call('qmp_capabilities'); mice=call('query-mice'); (out/'query-mice.json').write_text(json.dumps(mice,indent=2)+'\n')
              if lane=='usb': idx=next((m['index'] for m in mice if ('hid' in m['name'].lower() or 'usb' in m['name'].lower()) and 'ps/2' not in m['name'].lower()),None)
              else: idx=next((m['index'] for m in mice if 'ps/2' in m['name'].lower() or 'ps2' in m['name'].lower()),None)
              if idx is None: raise RuntimeError(f'{lane} frontend missing: {mice}')
              call('human-monitor-command',{'command-line':f'mouse_set {idx}'})
              deadline=time.time()+90
              while time.time()<deadline:
                  txt=serial.read_text(errors='ignore') if serial.exists() else ''
                  if 'FRAMES_V108_INPUT_TEST_RUNTIME_READY' in txt and 'FRAMES_V108_INPUT_TELEMETRY_OK' in txt: break
                  if p.poll() is not None: raise RuntimeError('qemu stopped before runtime ready')
                  time.sleep(.2)
              else: raise RuntimeError('runtime readiness timeout')
              before=out/'BEFORE.ppm'; call('screendump',{'filename':str(before)})
              required=['FRAMES_V108_USB_LIVE_REPORT_OK','FRAMES_V108_USB_GUI_CURSOR_OK'] if lane=='usb' else ['FRAMES_V108_PS2_ENABLE_OK','FRAMES_V108_PS2_PACKET_OK','FRAMES_V108_PS2_GUI_CURSOR_OK']
              ok=False
              for _ in range(100):
                  call('input-send-event',{'events':[{'type':'rel','data':{'axis':'x','value':8}},{'type':'rel','data':{'axis':'y','value':4}}]})
                  time.sleep(.08)
                  txt=serial.read_text(errors='ignore') if serial.exists() else ''
                  if all(x in txt for x in required): ok=True; break
              after=out/'AFTER.ppm'; call('screendump',{'filename':str(after)})
              a=before.read_bytes(); b=after.read_bytes(); changed=sum(x!=y for x,y in zip(a,b))
              result={'status':'PASS' if ok and changed>20 else 'FAIL','lane':lane,'exact_iso_boot':True,'markers_ok':ok,'changed_bytes':changed,'frontend_index':idx}
              (out/'RESULT.json').write_text(json.dumps(result,indent=2)+'\n'); print(json.dumps(result,indent=2))
              if result['status']!='PASS': raise SystemExit(1)
              call('quit')
          finally:
              try:p.wait(timeout=5)
              except: p.kill(); p.wait()
          PY
          find "$OUT" -type s -delete || true
          sha256sum "$OUT"/* > "$OUT/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Frames-v108-Deep-r5-${{ matrix.lane }}-Evidence
          path: lane-${{ matrix.lane }}/**
          if-no-files-found: error
          retention-days: 30

  readonly-safety:
    needs: build-rufus-iso
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Frames-v108-Deep-Physical-Input-r5-Candidate
          path: candidate
      - name: Install QEMU/OVMF
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf
          code="$(find /usr/share/OVMF -type f \( -name 'OVMF_CODE_4M.fd' -o -name 'OVMF_CODE.fd' \) | head -n1)"
          test -n "$code"
          echo "OVMF_CODE=$code" >> "$GITHUB_ENV"
      - name: Boot exact ISO with internal sentinel read-only
        run: |
          set -euo pipefail
          mkdir -p safety
          ISO="candidate/$ISO_NAME"; test -s "$ISO"
          truncate -s 32M safety/internal-sentinel.img
          timeout 90 qemu-system-x86_64 -machine q35 -m 768M -smp 2 -cpu max -accel tcg,thread=single -display none -no-reboot -no-shutdown -nic none -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" -cdrom "$ISO" -drive if=none,id=sentinel,format=raw,readonly=on,file=safety/internal-sentinel.img -device nvme,serial=READONLYSENTINEL,drive=sentinel -serial file:safety/serial.log -boot d || test $? = 124
          grep -q 'FRAMES_V108_INPUT_TEST_RUNTIME_READY' safety/serial.log
          ! grep -Eqi 'write.*error|readonly.*write|destructive.*armed' safety/serial.log
          printf 'status=PASS\niso_read_only=true\ninternal_sentinel_read_only=true\nphysical_destructive_writes_certified=false\n' > safety/READONLY-SAFETY.txt
          sha256sum safety/serial.log safety/READONLY-SAFETY.txt > safety/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Frames-v108-Deep-r5-ReadOnly-Safety
          path: safety/**
          if-no-files-found: error
          retention-days: 30

  final:
    needs: [build-rufus-iso, vm-live-input, readonly-safety]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Frames-v108-Deep-Physical-Input-r5-Candidate
          path: candidate
      - name: Seal diagnostic physical-boot ISO
        run: |
          set -euo pipefail
          mkdir -p final
          ISO="candidate/$ISO_NAME"; test -s "$ISO"
          cp "$ISO" final/
          cp candidate/ISO-SHA256.txt candidate/ISO-SIZE.txt final/
          cat > final/FINAL-DEEP-INPUT-DIAGNOSTIC.json <<'EOF'
          {
            "status": "PASS",
            "profile": "frames-0.9.98-v108-deep-physical-input-r5",
            "base": "exact freshly certified Frames 0.9.98 v108 r9",
            "rufus_compatible_uefi_iso": true,
            "recommended_rufus_mode": "ISO Image mode",
            "deep_usb_enumeration_telemetry": true,
            "deep_ps2_raw_classification_telemetry": true,
            "qemu_direct_usb_mouse_regression": true,
            "qemu_ps2_mouse_regression": true,
            "readonly_safety_gate": true,
            "physical_boot_test_allowed": true,
            "physical_hardware_input_verified": false,
            "physical_destructive_writes_certified": false,
            "promotion_allowed": false
          }
          EOF
          sha256sum final/* > final/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Frames-v108-Deep-Physical-Input-r5-Rufus-Final
          path: final/**
          if-no-files-found: error
          retention-days: 30
