name: Frames v108 Physical Input Repair r8 Rufus

on:
  workflow_dispatch:
  push:
    branches: [ v108-physical-input-bringup ]
    paths:
      - '.github/workflows/frames-v108-physical-input-r8-rufus.yml'
      - 'tools/ci/patch_v108_physical_input_r8_cursor_offsets.py'

permissions:
  contents: read

env:
  KIT_SHA: 61b0fc25513719fce554729724c7848647de9cffe54434d4ab5f7ba8af42a36a
  SRC_SHA: 5f8c13adac6d34e64bd47d9463a3e261cd0b51bb5ddb500aa9f7b87c2914a52d
  BASE_MAIN_SHA: ffc5721eca68844357dbdca63b0edf266e7e210f9d162eecde8cae0067f210a8
  R2_MAIN_SHA: 8cf33253489331e200643fa004992fece4eaf86b6feccaa3e00c06883927f675
  R5_MAIN_SHA: d0421388cd288a7073ca750915b1b51ceeee62acfe524a6785f855e42f9b1e7f
  R6_MAIN_SHA: de8cd41f707268bc0d7bb2ff5ef925ba0e8981650703afdb065b1a62a1d6cca1
  R7_PRE_SHA: b94070bfe399162a8bb5bef1694c92100716d500d9e85737896901ef3f5aa8e7
  R7_MAIN_SHA: d458aa61d92ff33bcf7e529354deec7cd345d5d96188c95b08842853fa3e3e2b
  R8_MAIN_SHA: b0e7893dea8306b44ea044b5e712fb4568223b5bdd599b9d369f19e523bad037
  ISO_NAME: Frames-0.9.98-v108-Physical-Input-Repair-r8-Rufus-UEFI.iso

jobs:
  build-rufus-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v108-physical-input-bringup
      - name: Install build and ISO tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld python3 unzip zip mtools dosfstools gdisk xorriso
      - name: Reconstruct certified v108 and apply exact r2-r8 input train
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/v108r8" evidence out payload
          mkdir -p "$RUNNER_TEMP/v108r8/kit" "$RUNNER_TEMP/v108r8/src" evidence out payload
          K=Frames-0.9.98-Runtime-Certification-Kit-v108-r9.zip
          test "$(sha256sum "$K" | awk '{print $1}')" = "$KIT_SHA"
          unzip -q "$K" -d "$RUNNER_TEMP/v108r8/kit"
          Z="$RUNNER_TEMP/v108r8/kit/Frames-0.9.98-Source-v108.zip"
          test "$(sha256sum "$Z" | awk '{print $1}')" = "$SRC_SHA"
          unzip -q "$Z" -d "$RUNNER_TEMP/v108r8/src"
          F="$RUNNER_TEMP/v108r8/src/Frames-0.9.98"
          test "$(sha256sum "$F/kernel/main.nx" | awk '{print $1}')" = "$BASE_MAIN_SHA"
          python3 tools/ci/patch_v108_live_input_common.py "$F/kernel/main.nx" >/dev/null
          python3 tools/ci/patch_v108_usb_mouse_live.py "$F/kernel/main.nx" >/dev/null
          python3 tools/ci/patch_v108_ps2_touchpad_live.py "$F/kernel/main.nx" >/dev/null
          python3 tools/ci/patch_v108_input_telemetry_overlay.py "$F/kernel/main.nx" >/dev/null
          python3 tools/ci/patch_v108_input_usbboot_gate_decouple.py "$F/kernel/main.nx" >/dev/null
          test "$(sha256sum "$F/kernel/main.nx" | awk '{print $1}')" = "$R2_MAIN_SHA"
          python3 tools/ci/patch_v108_physical_deep_telemetry.py "$F/kernel/main.nx" >/dev/null
          test "$(sha256sum "$F/kernel/main.nx" | awk '{print $1}')" = "$R5_MAIN_SHA"
          python3 tools/ci/patch_v108_stable_input_diag_runtime.py "$F/kernel/main.nx" >/dev/null
          test "$(sha256sum "$F/kernel/main.nx" | awk '{print $1}')" = "$R6_MAIN_SHA"
          python3 tools/ci/patch_v108_physical_input_r7.py "$F/kernel/main.nx" >/dev/null
          test "$(sha256sum "$F/kernel/main.nx" | awk '{print $1}')" = "$R7_PRE_SHA"
          python3 tools/ci/patch_v108_physical_input_r7_compilefix.py "$F/kernel/main.nx" >/dev/null
          test "$(sha256sum "$F/kernel/main.nx" | awk '{print $1}')" = "$R7_MAIN_SHA"
          cp "$F/kernel/main.nx" evidence/kernel-r7.nx
          python3 tools/ci/patch_v108_physical_input_r8_cursor_offsets.py "$F/kernel/main.nx" | tee evidence/r8-sha.txt
          test "$(sha256sum "$F/kernel/main.nx" | awk '{print $1}')" = "$R8_MAIN_SHA"
          cp "$F/kernel/main.nx" evidence/kernel-r8.nx
          diff -u evidence/kernel-r7.nx evidence/kernel-r8.nx > evidence/R7-TO-R8.patch || true
          ! grep -Fq 'cursor+24' "$F/kernel/main.nx"
          python3 - "$F/kernel/main.nx" <<'PY'
          from pathlib import Path
          import sys
          s=Path(sys.argv[1]).read_text()
          start=s.index('fn desktop_input_runtime(process:u64,input_state:u64,phys_state:u64,hardware_state:u64) -> u64 {')
          end=s.index('\nfn serial_marker_shell_init_ok',start)
          fn=s[start:end]
          assert fn.count('appearance_render(process)')==1
          assert fn.index('appearance_render(process)') < fn.index('while true {')
          assert 'wm_render_all' not in fn
          assert fn.count('desktop_draw_cursor')==2
          PY
          echo "FRAMES_DIR=$F" >> "$GITHUB_ENV"
      - name: Fail closed on destructive-write surface
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          d=Path('evidence/R7-TO-R8.patch').read_text(errors='replace').splitlines()
          changed='\n'.join(x for x in d if (x.startswith('+') or x.startswith('-')) and not x.startswith('+++') and not x.startswith('---')).lower()
          forbidden=['nvme_write','storage_write','write10','write(10)','scsi_write','fat_write','block_write','destructive_write','physical_write_enable']
          hits=[x for x in forbidden if x in changed]
          Path('evidence/WRITE-SURFACE-AUDIT.txt').write_text('status=' + ('PASS' if not hits else 'FAIL') + '\nforbidden_hits=' + ','.join(hits) + '\n')
          if hits: raise SystemExit('r8 touched destructive-write surface: '+','.join(hits))
          PY
      - name: Build Rufus UEFI ISO
        run: |
          set -euo pipefail
          find "$FRAMES_DIR" -type f -name '*.sh' -exec chmod +x {} +
          find "$FRAMES_DIR/toolchain" -type f -name nexus -exec chmod +x {} +
          cd "$FRAMES_DIR"
          ./tools/build.sh
          python3 tools/make_esp.py
          python3 tools/make_desktop_preview_image.py
          python3 tools/verify_desktop_preview_image.py --image build/Frames-0.9.98-Desktop-Preview.img --require-pass
          python3 tools/verify_release.py
          cp build/Frames-0.9.98-Desktop-Preview.img "$GITHUB_WORKSPACE/out/r8-raw.img"
          cd "$GITHUB_WORKSPACE"
          sha256sum out/r8-raw.img | tee evidence/RAW-IMAGE-SHA256.txt
          FIRST="$(sgdisk -i 1 out/r8-raw.img | awk -F: '/First sector/ {gsub(/ /,"",$2); split($2,a,"("); print a[1]}')"
          LAST="$(sgdisk -i 1 out/r8-raw.img | awk -F: '/Last sector/ {gsub(/ /,"",$2); split($2,a,"("); print a[1]}')"
          dd if=out/r8-raw.img of=out/original-esp.img bs=512 skip="$FIRST" count=$((LAST-FIRST+1)) status=none
          mcopy -s -i out/original-esp.img '::/EFI' payload/
          mcopy -s -i out/original-esp.img '::/FRAMES' payload/
          test -s payload/EFI/BOOT/BOOTX64.EFI
          test -s payload/FRAMES/FramesKernel.fkrn
          sha256sum payload/EFI/BOOT/BOOTX64.EFI payload/FRAMES/* > evidence/PAYLOAD-SHA256.txt
          dd if=/dev/zero of=out/efiboot.img bs=1M count=16 status=none
          mkfs.fat -F 16 -n FRAMESBOOT out/efiboot.img
          mmd -i out/efiboot.img ::/EFI ::/EFI/BOOT ::/FRAMES
          mcopy -i out/efiboot.img payload/EFI/BOOT/BOOTX64.EFI ::/EFI/BOOT/BOOTX64.EFI
          for f in payload/FRAMES/*; do mcopy -i out/efiboot.img "$f" ::/FRAMES/; done
          ROOT="$RUNNER_TEMP/r8-iso-root"; rm -rf "$ROOT"; mkdir -p "$ROOT"
          cp out/efiboot.img "$ROOT/efiboot.img"
          cp -a payload/EFI payload/FRAMES "$ROOT/"
          cat > "$ROOT/README.TXT" <<'EOF'
          Frames 0.9.98 v108 Physical Input Repair r8
          Rufus-compatible UEFI ISO. Use Rufus ISO Image mode.
          Cursor field offsets corrected; one-time clean cursor handoff; cursor-only motion redraw.
          USB EP0 address transition repair retained with completion-code telemetry.
          Diagnostic/read-only physical boot only. Destructive writes are not certified.
          EOF
          xorriso -as mkisofs -iso-level 3 -R -J -V FRAMES_V108_R8 -eltorito-alt-boot -e efiboot.img -no-emul-boot -o "out/$ISO_NAME" "$ROOT"
          test -s "out/$ISO_NAME"
          sha256sum "out/$ISO_NAME" | tee evidence/ISO-SHA256.txt
          stat -c '%s' "out/$ISO_NAME" | tee evidence/ISO-SIZE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Frames-v108-Physical-Input-r8-Candidate
          path: |
            out/${{ env.ISO_NAME }}
            evidence/**
          if-no-files-found: error
          retention-days: 30

  input-proof:
    needs: build-rufus-iso
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane: [usb, ps2]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Frames-v108-Physical-Input-r8-Candidate
          path: candidate
      - name: Install QEMU/OVMF/Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf python3 python3-pil
          code="$(find /usr/share/OVMF -type f \( -name 'OVMF_CODE_4M.fd' -o -name 'OVMF_CODE.fd' \) | head -n1)"
          test -n "$code"
          echo "OVMF_CODE=$code" >> "$GITHUB_ENV"
      - name: Prove ${{ matrix.lane }} input and single-cursor framebuffer
        run: |
          set -euo pipefail
          OUT="lane-${{ matrix.lane }}"; mkdir -p "$OUT"
          ISO="$(find candidate -name "$ISO_NAME" -type f -print -quit)"; test -s "$ISO"
          python3 - "$OVMF_CODE" "$ISO" "$OUT" '${{ matrix.lane }}' <<'PY'
          import json,pathlib,socket,subprocess,sys,time
          from PIL import Image
          ovmf,iso,out,lane=sys.argv[1:]; out=pathlib.Path(out)
          qmp=out/'qmp.sock'; serial=out/'serial.log'; stderr=out/'qemu.stderr'
          cmd=['qemu-system-x86_64','-machine','q35','-m','768M','-smp','2','-cpu','max','-accel','tcg,thread=single','-display','none','-no-reboot','-no-shutdown','-nic','none','-serial',f'file:{serial}','-qmp',f'unix:{qmp},server=on,wait=off','-drive',f'if=pflash,format=raw,readonly=on,file={ovmf}','-cdrom',iso,'-boot','d']
          if lane=='usb': cmd += ['-device','qemu-xhci,id=xhci','-device','usb-mouse,bus=xhci.0,id=usbmouse']
          (out/'qemu-command.json').write_text(json.dumps(cmd,indent=2)+'\n')
          ef=stderr.open('wb'); p=subprocess.Popen(cmd,stdout=subprocess.DEVNULL,stderr=ef)
          result={'lane':lane,'status':'FAIL'}
          try:
              deadline=time.time()+25
              while time.time()<deadline and not qmp.exists(): time.sleep(.05)
              if not qmp.exists(): raise RuntimeError('qmp timeout')
              s=socket.socket(socket.AF_UNIX,socket.SOCK_STREAM); s.connect(str(qmp)); f=s.makefile('rwb',buffering=0); json.loads(f.readline())
              def call(name,args=None):
                  o={'execute':name};
                  if args is not None:o['arguments']=args
                  f.write((json.dumps(o)+'\n').encode())
                  while True:
                      r=json.loads(f.readline())
                      if 'return' in r:return r['return']
                      if 'error' in r:raise RuntimeError(r['error'])
              call('qmp_capabilities'); mice=call('query-mice'); (out/'query-mice.json').write_text(json.dumps(mice,indent=2)+'\n')
              if lane=='usb': idx=next((m['index'] for m in mice if ('hid' in m['name'].lower() or 'usb' in m['name'].lower()) and 'ps/2' not in m['name'].lower()),None)
              else: idx=next((m['index'] for m in mice if 'ps/2' in m['name'].lower() or 'ps2' in m['name'].lower()),None)
              if idx is None: raise RuntimeError('frontend missing')
              call('human-monitor-command',{'command-line':f'mouse_set {idx}'})
              deadline=time.time()+100
              while time.time()<deadline:
                  txt=serial.read_text(errors='ignore') if serial.exists() else ''
                  if 'FRAMES_V108_INPUT_TEST_RUNTIME_READY' in txt and (lane=='usb' or 'FRAMES_V108_PS2_ENABLE_OK' in txt): break
                  time.sleep(.2)
              else: raise RuntimeError('runtime ready timeout')
              before=out/'BEFORE.ppm'; call('screendump',{'filename':str(before)})
              ib=Image.open(before).convert('RGB')
              white=(244,247,251)
              # r7 regression fingerprint: wrong cursor offsets left a white cursor at (290,16).
              legacy_ghost_absent=ib.getpixel((291,17)) != white
              initial_cursor_present=ib.getpixel((397,291)) == white
              required=['FRAMES_V108_PHYSICAL_CURSOR_VISIBLE_OK']
              required += ['FRAMES_V108_USB_LIVE_REPORT_OK','FRAMES_V108_USB_GUI_CURSOR_OK'] if lane=='usb' else ['FRAMES_V108_PS2_PACKET_OK','FRAMES_V108_PS2_GUI_CURSOR_OK']
              markers=False
              for _ in range(120):
                  call('input-send-event',{'events':[{'type':'rel','data':{'axis':'x','value':8}},{'type':'rel','data':{'axis':'y','value':4}}]})
                  time.sleep(.08)
                  txt=serial.read_text(errors='ignore') if serial.exists() else ''
                  if all(x in txt for x in required): markers=True; break
              time.sleep(.35)
              after=out/'AFTER.ppm'; call('screendump',{'filename':str(after)})
              ia=Image.open(after).convert('RGB')
              changed=sum(1 for x,y in zip(ib.getdata(),ia.getdata()) if x!=y)
              legacy_ghost_after_absent=ia.getpixel((291,17)) != white
              visual=20 <= changed <= 20000
              result.update({'markers':markers,'changed_pixels':changed,'legacy_ghost_absent':legacy_ghost_absent,'legacy_ghost_after_absent':legacy_ghost_after_absent,'initial_cursor_present':initial_cursor_present,'visual':visual,'frame_size':list(ib.size)})
              if not (markers and visual and legacy_ghost_absent and legacy_ghost_after_absent and initial_cursor_present): raise RuntimeError(f'r8 cursor gate failed: {result}')
              result['status']='PASS'
              try: call('quit')
              except Exception: pass
          finally:
              try:p.wait(timeout=5)
              except: p.kill(); p.wait()
              ef.close(); (out/'RUNTIME.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
          grep -q '"status": "PASS"' "$OUT/RUNTIME.json"
          sha256sum "$OUT"/* > "$OUT/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: Frames-v108-Physical-Input-r8-${{ matrix.lane }}-Evidence
          path: lane-${{ matrix.lane }}/**
          if-no-files-found: error
          retention-days: 30

  readonly-safety:
    needs: build-rufus-iso
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Frames-v108-Physical-Input-r8-Candidate
          path: candidate
      - name: Install QEMU/OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf
          code="$(find /usr/share/OVMF -type f \( -name 'OVMF_CODE_4M.fd' -o -name 'OVMF_CODE.fd' \) | head -n1)"
          test -n "$code"; echo "OVMF_CODE=$code" >> "$GITHUB_ENV"
      - name: Prove exact ISO remains read-only safe
        run: |
          set -euo pipefail
          mkdir -p safety
          ISO="$(find candidate -name "$ISO_NAME" -type f -print -quit)"; test -s "$ISO"
          truncate -s 32M safety/internal-sentinel.img
          set +e
          timeout 90 qemu-system-x86_64 -machine q35 -m 768M -smp 2 -cpu max -accel tcg,thread=single -display none -no-reboot -no-shutdown -nic none -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" -cdrom "$ISO" -drive if=none,id=sentinel,format=raw,readonly=on,file=safety/internal-sentinel.img -device nvme,serial=READONLYSENTINEL,drive=sentinel -serial file:safety/serial.log -boot d
          rc=$?; set -e
          test "$rc" = 124 || test "$rc" = 0
          grep -q 'FRAMES_V108_INPUT_TEST_RUNTIME_READY' safety/serial.log
          ! grep -Eqi 'write.*error|readonly.*write|destructive.*armed' safety/serial.log
          printf 'status=PASS\ninternal_sentinel_read_only=true\nphysical_destructive_writes_certified=false\n' > safety/READONLY-SAFETY.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Frames-v108-Physical-Input-r8-ReadOnly-Safety
          path: safety/**
          if-no-files-found: error
          retention-days: 30

  final:
    needs: [build-rufus-iso, input-proof, readonly-safety]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Frames-v108-Physical-Input-r8-Candidate
          path: candidate
      - name: Seal exact r8 Rufus ISO
        run: |
          set -euo pipefail
          mkdir -p final
          ISO="$(find candidate -name "$ISO_NAME" -type f -print -quit)"; test -s "$ISO"
          HASHFILE="$(find candidate -name 'ISO-SHA256.txt' -type f -print -quit)"
          H="$(awk '{print $1}' "$HASHFILE")"; test "$(sha256sum "$ISO" | awk '{print $1}')" = "$H"
          cp "$ISO" final/
          printf '%s  %s\n' "$H" "$ISO_NAME" > final/ISO-SHA256.txt
          stat -c '%s' "$ISO" > final/ISO-SIZE.txt
          cat > final/FINAL-R8.json <<EOF
          {"status":"PASS","profile":"frames-0.9.98-v108-physical-input-r8","kernel_sha256":"$R8_MAIN_SHA","iso_sha256":"$H","rufus_mode":"ISO Image mode","cursor_offset_repair":true,"single_cursor_vm_gate":true,"usb_ep0_repair":true,"qemu_usb_input":true,"qemu_ps2_input":true,"readonly_safety":true,"physical_hardware_verified":false,"physical_destructive_writes_certified":false,"promotion_allowed":false}
          EOF
          sha256sum final/* > final/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Frames-v108-Physical-Input-r8-Rufus-Final
          path: final/**
          if-no-files-found: error
          retention-days: 30
