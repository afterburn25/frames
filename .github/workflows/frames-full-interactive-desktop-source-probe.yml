name: Frames Full Interactive Desktop Source Probe

on:
  workflow_dispatch:
  push:
    branches: [ full-interactive-desktop-gui ]
    paths:
      - '.github/workflows/frames-full-interactive-desktop-source-probe.yml'
      - 'bootux/**'
      - 'architecture/integration/**'

permissions:
  contents: read

jobs:
  inspect-full-gui-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: full-interactive-desktop-gui

      - name: Reconstruct exact v116 product integration source
        shell: bash
        run: |
          set -euo pipefail
          E="$GITHUB_WORKSPACE/full-gui-source-probe"
          mkdir -p "$E" "$RUNNER_TEMP/v108-kit" "$RUNNER_TEMP/v108-src"
          KIT="$GITHUB_WORKSPACE/Frames-0.9.98-Runtime-Certification-Kit-v108-r9.zip"
          test "$(sha256sum "$KIT" | awk '{print $1}')" = '61b0fc25513719fce554729724c7848647de9cffe54434d4ab5f7ba8af42a36a'
          unzip -q "$KIT" -d "$RUNNER_TEMP/v108-kit"
          Z="$RUNNER_TEMP/v108-kit/Frames-0.9.98-Source-v108.zip"
          test "$(sha256sum "$Z" | awk '{print $1}')" = '5f8c13adac6d34e64bd47d9463a3e261cd0b51bb5ddb500aa9f7b87c2914a52d'
          unzip -q "$Z" -d "$RUNNER_TEMP/v108-src"
          S="$RUNNER_TEMP/v108-src/Frames-0.9.98"
          for p in \
            architecture/v109/make_unified_device_architecture_v109.py \
            architecture/v110/make_driver_runtime_v110.py \
            architecture/v111/make_async_io_service_runtime_v111.py \
            architecture/v112/make_device_service_integration_v112.py \
            architecture/v113/make_driver_execution_hal_v113.py \
            architecture/v114/make_kernel_concurrency_driver_scheduling_v114.py \
            architecture/v115/make_driver_migration_unified_input_v115.py \
            architecture/v116/make_usb_core_xhci_migration_v116.py; do
              python3 "$p" "$S/kernel/main.nx"
          done
          test "$(sha256sum "$S/kernel/main.nx" | awk '{print $1}')" = 'a8c569ca5c6b9facd85176a0fe97c8b369f9e4bbf50153f41a1b7777636a3ed5'
          python3 bootux/patch_v108_uefi_approved_splash.py "$S/boot/uefi/frames_boot.c" > "$E/PRODUCT-GUI-REPAIRS.log"
          python3 bootux/patch_integrated_gui_physical_test_policy.py "$S/boot/uefi/frames_boot.c" "$S/kernel/main.nx" > "$E/GUI-TEST-PROFILE.log"
          echo "S=$S" >> "$GITHUB_ENV"
          sha256sum "$S/kernel/main.nx" "$S/boot/uefi/frames_boot.c" > "$E/PATCHED-SOURCE-SHA256.txt"

      - name: Enumerate GUI and window-system functions
        shell: bash
        run: |
          set -euo pipefail
          E="$GITHUB_WORKSPACE/full-gui-source-probe"
          grep -nE '^fn (wm_|desktop_|shell_|gui_|file_manager_|settings_|notification_|session_|appearance_|display_)' "$S/kernel/main.nx" > "$E/GUI-FUNCTION-INDEX.txt" || true
          grep -nE 'wm_create|wm_render_window|wm_focus|launcher|menu|dialog|title|drag|resize|file_manager|settings_phase|notification|session_shell|appearance_system|gui_app_(launch|present)|desktop_phase' "$S/kernel/main.nx" > "$E/GUI-SYMBOL-HITS.txt" || true

      - name: Extract full GUI function bodies
        shell: bash
        run: |
          set -euo pipefail
          E="$GITHUB_WORKSPACE/full-gui-source-probe"
          python3 - "$S/kernel/main.nx" "$E/FULL-GUI-FUNCTIONS.txt" <<'PY'
          import re,sys
          from pathlib import Path
          p=Path(sys.argv[1]); text=p.read_text(errors='replace')
          names=[
            'wm_create','wm_focus','wm_render_window','wm_hit_test','wm_move','wm_resize',
            'gui_app_host_init','gui_app_launch','gui_app_present',
            'file_manager_phase1_compose','settings_phase1_compose','notification_phase1_compose',
            'session_shell_phase1_compose','gui_polish_integrated_compose','appearance_system_phase1_compose'
          ]
          def body(name):
              m=re.search(r'^fn\s+'+re.escape(name)+r'\s*\(',text,re.M)
              if not m:return None
              start=m.start(); brace=text.find('{',m.end())
              if brace<0:return None
              depth=0; i=brace
              while i<len(text):
                  if text[i]=='{':depth+=1
                  elif text[i]=='}':
                      depth-=1
                      if depth==0:return text[start:i+1]
                  i+=1
              return text[start:]
          out=[]
          for n in names:
              b=body(n)
              out.append(f'===== {n} =====')
              out.append(b if b else 'NOT FOUND')
          # Capture candidate desktop orchestrators by marker proximity.
          for token in ['serial_marker_desktop_phase1_ok','serial_marker_desktop_phase12_ok','serial_marker_integrated_gui_ok']:
              pos=text.find(token)
              out.append(f'===== CONTEXT {token} =====')
              out.append(text[max(0,pos-9000):min(len(text),pos+12000)] if pos>=0 else 'NOT FOUND')
          Path(sys.argv[2]).write_text('\n\n'.join(out))
          PY

      - name: Upload full GUI source probe
        uses: actions/upload-artifact@v4
        with:
          name: Frames-Full-Interactive-Desktop-Source-Probe
          path: full-gui-source-probe/
          if-no-files-found: error
          retention-days: 30
