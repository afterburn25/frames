name: Frames v108 Physical Input Visual Certification r3

on:
  workflow_dispatch:
  push:
    branches: [ v108-physical-input-bringup ]
    paths:
      - '.github/workflows/frames-v108-physical-input-visual-cert-r3.yml'

permissions:
  contents: read

env:
  KIT_SHA: 61b0fc25513719fce554729724c7848647de9cffe54434d4ab5f7ba8af42a36a
  SRC_SHA: 5f8c13adac6d34e64bd47d9463a3e261cd0b51bb5ddb500aa9f7b87c2914a52d
  BASE_MAIN_SHA: ffc5721eca68844357dbdca63b0edf266e7e210f9d162eecde8cae0067f210a8
  COMBINED_MAIN_SHA: 270c76a79ab56fe275acf87ec0e5cabdf4b1bca5bff15bb0e6ef89a7bafad7e8
  EXPECTED_IMAGE_SHA: 6918d228725f0cb3185e17f974119b4abf8c8413af1173369fc8d0594f30bab7

jobs:
  build-once:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v108-physical-input-bringup
      - name: Install build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld python3 unzip zip mtools dosfstools
      - name: Reconstruct identical r2 candidate source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/k" "$RUNNER_TEMP/s" build-evidence
          K=Frames-0.9.98-Runtime-Certification-Kit-v108-r9.zip
          test "$(sha256sum "$K"|awk '{print $1}')" = "$KIT_SHA"
          unzip -q "$K" -d "$RUNNER_TEMP/k"
          Z="$RUNNER_TEMP/k/Frames-0.9.98-Source-v108.zip"
          test "$(sha256sum "$Z"|awk '{print $1}')" = "$SRC_SHA"
          unzip -q "$Z" -d "$RUNNER_TEMP/s"
          F="$RUNNER_TEMP/s/Frames-0.9.98"
          test "$(sha256sum "$F/kernel/main.nx"|awk '{print $1}')" = "$BASE_MAIN_SHA"
          python3 tools/ci/patch_v108_live_input_common.py "$F/kernel/main.nx"
          python3 tools/ci/patch_v108_usb_mouse_live.py "$F/kernel/main.nx"
          python3 tools/ci/patch_v108_ps2_touchpad_live.py "$F/kernel/main.nx"
          test "$(sha256sum "$F/kernel/main.nx"|awk '{print $1}')" = "$COMBINED_MAIN_SHA"
          python3 tools/ci/patch_v108_input_telemetry_overlay.py "$F/kernel/main.nx"
          python3 tools/ci/patch_v108_input_usbboot_gate_decouple.py "$F/kernel/main.nx"
          sha256sum "$F/kernel/main.nx" | tee build-evidence/KERNEL-SHA256.txt
          echo "FRAMES_DIR=$F" >> "$GITHUB_ENV"
      - name: Build deterministic raw image
        run: |
          set -euo pipefail
          find "$FRAMES_DIR" -type f -name '*.sh' -exec chmod +x {} +
          find "$FRAMES_DIR/toolchain" -type f -name nexus -exec chmod +x {} +
          cd "$FRAMES_DIR"
          ./tools/build.sh
          python3 tools/make_esp.py
          python3 tools/sdk_selftest.py
          python3 tools/make_desktop_preview_image.py
          python3 tools/verify_desktop_preview_image.py --image build/Frames-0.9.98-Desktop-Preview.img --require-pass
          python3 tools/verify_release.py
          cp build/Frames-0.9.98-Desktop-Preview.img "$GITHUB_WORKSPACE/Frames-0.9.98-v108-Physical-Input-Test-r3.img"
          actual="$(sha256sum "$GITHUB_WORKSPACE/Frames-0.9.98-v108-Physical-Input-Test-r3.img"|awk '{print $1}')"
          echo "$actual  Frames-0.9.98-v108-Physical-Input-Test-r3.img" | tee "$GITHUB_WORKSPACE/build-evidence/IMAGE-SHA256.txt"
          test "$actual" = "$EXPECTED_IMAGE_SHA"
          test "$(stat -c '%s' "$GITHUB_WORKSPACE/Frames-0.9.98-v108-Physical-Input-Test-r3.img")" = 67108864
      - uses: actions/upload-artifact@v4
        with:
          name: Frames-v108-Physical-Input-Visual-r3-Candidate
          path: |
            Frames-0.9.98-v108-Physical-Input-Test-r3.img
            build-evidence/**
          if-no-files-found: error
          retention-days: 30

  visual-live-input:
    needs: build-once
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane: [usb, ps2]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Frames-v108-Physical-Input-Visual-r3-Candidate
          path: candidate
      - name: Install QEMU/OVMF
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf python3
          code="$(find /usr/share/OVMF -type f \( -name 'OVMF_CODE_4M.fd' -o -name 'OVMF_CODE.fd' \) | head -n1)"
          test -n "$code"
          echo "OVMF_CODE=$code" >> "$GITHUB_ENV"
      - name: Prove ${{ matrix.lane }} movement and preserve full desktop visually
        run: |
          set -euo pipefail
          OUT="visual-${{ matrix.lane }}"; mkdir -p "$OUT"
          IMG="$(find candidate -name 'Frames-0.9.98-v108-Physical-Input-Test-r3.img' -print -quit)"; test -s "$IMG"
          python3 - "$OVMF_CODE" "$IMG" "$OUT" '${{ matrix.lane }}' <<'PY'
          import json,pathlib,socket,subprocess,sys,time
          ovmf,image,out,lane=sys.argv[1:]
          out=pathlib.Path(out); qmp=out/'qmp.sock'; serial=out/'serial.log'; stderr=out/'qemu.stderr'
          cmd=['qemu-system-x86_64','-machine','q35','-m','768M','-smp','2','-cpu','max','-accel','tcg,thread=single','-display','none','-no-reboot','-no-shutdown','-nic','none','-serial',f'file:{serial}','-qmp',f'unix:{qmp},server=on,wait=off','-drive',f'if=pflash,format=raw,readonly=on,file={ovmf}','-device','qemu-xhci,id=xhci','-drive',f'if=none,id=bootusb,format=raw,file={image}','-device','usb-storage,drive=bootusb,bus=xhci.0,bootindex=1']
          if lane=='usb': cmd += ['-device','usb-mouse,bus=xhci.0,id=usbmouse']
          (out/'qemu-command.json').write_text(json.dumps(cmd,indent=2)+'\n')
          ef=stderr.open('wb'); p=subprocess.Popen(cmd,stdout=subprocess.DEVNULL,stderr=ef)
          try:
              deadline=time.time()+25
              while time.time()<deadline and not qmp.exists():
                  if p.poll() is not None: raise RuntimeError(f'qemu exited {p.returncode}')
                  time.sleep(.05)
              if not qmp.exists(): raise RuntimeError('qmp timeout')
              s=socket.socket(socket.AF_UNIX,socket.SOCK_STREAM); s.connect(str(qmp)); f=s.makefile('rwb',buffering=0); json.loads(f.readline())
              def call(name,args=None):
                  o={'execute':name}
                  if args is not None:o['arguments']=args
                  f.write((json.dumps(o)+'\n').encode())
                  while True:
                      r=json.loads(f.readline())
                      if 'return' in r:return r['return']
                      if 'error' in r:raise RuntimeError(r['error'])
              call('qmp_capabilities'); mice=call('query-mice'); (out/'query-mice.json').write_text(json.dumps(mice,indent=2)+'\n')
              if lane=='usb': idx=next((m['index'] for m in mice if ('hid' in m['name'].lower() or 'usb' in m['name'].lower()) and 'ps/2' not in m['name'].lower()),None)
              else: idx=next((m['index'] for m in mice if 'ps/2' in m['name'].lower() or 'ps2' in m['name'].lower()),None)
              if idx is None: raise RuntimeError(f'{lane} frontend missing: {mice}')
              call('human-monitor-command',{'command-line':f'mouse_set {idx}'})
              deadline=time.time()+90
              while time.time()<deadline:
                  txt=serial.read_text(errors='ignore') if serial.exists() else ''
                  if 'FRAMES_V108_INPUT_TEST_RUNTIME_READY' in txt and 'FRAMES_V108_INPUT_TELEMETRY_OK' in txt: break
                  if p.poll() is not None: raise RuntimeError('qemu stopped before desktop ready')
                  time.sleep(.2)
              else: raise RuntimeError('desktop/input runtime timeout')
              before=out/'BEFORE.ppm'; call('screendump',{'filename':str(before)})
              required=['FRAMES_V108_USB_LIVE_REPORT_OK','FRAMES_V108_USB_GUI_CURSOR_OK'] if lane=='usb' else ['FRAMES_V108_PS2_ENABLE_OK','FRAMES_V108_PS2_PACKET_OK','FRAMES_V108_PS2_GUI_CURSOR_OK']
              ok=False
              for _ in range(40):
                  call('input-send-event',{'events':[{'type':'rel','data':{'axis':'x','value':12}}]})
                  time.sleep(.15)
                  txt=serial.read_text(errors='ignore') if serial.exists() else ''
                  if all(m in txt for m in required): ok=True; break
              if not ok: raise RuntimeError(f'{lane} runtime markers missing')
              time.sleep(2.0)
              after=out/'AFTER.ppm'; call('screendump',{'filename':str(after)})
              def read_ppm(path):
                  b=path.read_bytes(); parts=b.split(b'\n',3)
                  if parts[0].strip()!=b'P6': raise RuntimeError('bad PPM magic')
                  dims=parts[1].split(); w=int(dims[0]); h=int(dims[1]); maxv=int(parts[2]); data=parts[3]
                  if maxv!=255 or len(data)!=w*h*3: raise RuntimeError('bad PPM payload')
                  return w,h,data
              w,h,a=read_ppm(before); w2,h2,b=read_ppm(after)
              if (w,h)!=(w2,h2): raise RuntimeError('frame dimensions changed')
              pa=[a[i:i+3] for i in range(0,len(a),3)]; pb=[b[i:i+3] for i in range(0,len(b),3)]
              unique_before=len(set(pa)); unique_after=len(set(pb)); same=sum(x==y for x,y in zip(pa,pb)); total=len(pa); same_ratio=same/total; changed=total-same
              def region_unique(pixels,x0,y0,x1,y1):
                  vals=[]
                  for y in range(y0,y1):
                      row=y*w
                      vals.extend(pixels[row+x0:row+x1])
                  return len(set(vals))
              sidebar=region_unique(pb,0,0,130,min(h,730))
              center=region_unique(pb,450,180,min(w,830),min(h,500))
              telemetry=region_unique(pb,max(0,w-430),0,w,min(h,110))
              visual_ok=(unique_before>=250 and unique_after>=250 and same_ratio>=0.90 and 20<=changed<=100000 and sidebar>=20 and center>=20 and telemetry>=20)
              result={'status':'PASS' if visual_ok else 'FAIL','lane':lane,'runtime_markers_ok':ok,'width':w,'height':h,'unique_before':unique_before,'unique_after':unique_after,'same_pixel_ratio':same_ratio,'changed_pixels':changed,'sidebar_unique':sidebar,'center_unique':center,'telemetry_unique':telemetry,'frontend_index':idx}
              (out/'VISUAL-RESULT.json').write_text(json.dumps(result,indent=2)+'\n'); print(json.dumps(result,indent=2))
              if not visual_ok: raise SystemExit(1)
              call('quit')
          finally:
              try:p.wait(timeout=5)
              except:p.kill(); p.wait()
          PY
          find "$OUT" -type s -delete || true
          sha256sum "$OUT"/* > "$OUT/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Frames-v108-Physical-Visual-r3-${{ matrix.lane }}-Evidence
          path: visual-${{ matrix.lane }}/**
          if-no-files-found: error
          retention-days: 30

  final:
    needs: [build-once, visual-live-input]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Frames-v108-Physical-Input-Visual-r3-Candidate
          path: candidate
      - name: Seal visually stable physical candidate
        run: |
          set -euo pipefail
          mkdir -p final
          IMG="$(find candidate -name 'Frames-0.9.98-v108-Physical-Input-Test-r3.img' -print -quit)"
          test "$(sha256sum "$IMG"|awk '{print $1}')" = "$EXPECTED_IMAGE_SHA"
          cat > final/FINAL-VISUAL-PHYSICAL-INPUT.json <<'EOF'
          {
            "status": "PASS",
            "profile": "frames-0.9.98-v108-physical-input-visual-r3",
            "same_candidate_as_r2": true,
            "usb_live_input": true,
            "ps2_live_input": true,
            "full_desktop_preserved_after_motion": true,
            "visible_input_telemetry": true,
            "physical_hardware_verified": false,
            "i2c_hid_touchpad_implemented": false,
            "physical_destructive_writes_certified": false,
            "promotion_allowed": false
          }
          EOF
          sha256sum "$IMG" > final/IMAGE-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Frames-v108-Physical-Input-Visual-r3-Final
          path: final/**
          if-no-files-found: error
          retention-days: 30
