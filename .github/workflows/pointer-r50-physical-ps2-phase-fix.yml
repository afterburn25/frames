name: Frames 0.9.98 r50 Physical PS2 Phase Repair USB Image

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/pointer-r50-physical-ps2-phase-fix.yml'
      - 'tools/ci/make_r50_ps2_phase_fix.py'
      - 'tools/ci/make_r49_ps2_phase.py'

permissions:
  contents: read

env:
  EXPECTED_PARENT_SHA256: 1c7f1b514d9aa2f847f724e8b633286d069d745bf7c281a3967c46bbfea1a18c
  EXPECTED_R46_KERNEL_MAIN_SHA256: e5ccd3d4a453184f620e2ed5f928599bc8a7fa6959098f3aeff4916f6dcff165

jobs:
  build-r50:
    name: Build r50 Rufus-compatible physical PS2 phase repair image
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Initialize evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf r50-out
          mkdir -p r50-out
          printf 'status=started\nrevision=r50\n' > r50-out/BUILD-STATUS.txt

      - name: Reconstruct exact certified r46 base
        shell: bash
        run: |
          set -euo pipefail
          parent_sha="$(sha256sum Frames-0.9.98-Pointer-Diagnostics-CI-v1.zip | awk '{print $1}')"
          echo "protected_parent_sha256=$parent_sha" > r50-out/PARENT-IDENTITY.txt
          test "$parent_sha" = "$EXPECTED_PARENT_SHA256"
          rm -rf "$RUNNER_TEMP/r50"; mkdir -p "$RUNNER_TEMP/r50"
          unzip -q Frames-0.9.98-Pointer-Diagnostics-CI-v1.zip -d "$RUNNER_TEMP/r50"
          SRC="$RUNNER_TEMP/r50/Frames-0.9.98-Pointer-CI-Source"
          python3 - "$SRC/kernel/main.nx" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          a='if usb_hid_found != 0 { usb_hid_configured = xhci_configure_boot_hid(xhci_state,phys_state); if usb_hid_configured != 0 { usb_hid_report_ready = xhci_read_first_hid_report(xhci_state,phys_state); } }'
          b='if usb_hid_found != 0 { usb_hid_configured = xhci_configure_boot_hid(xhci_state,phys_state); if usb_hid_configured != 0 { usb_hid_report_ready = 1; } }'
          c='if input_queue_ready != 0 { if usb_hid_report_ready != 0 { input_decode_ready = input_decode_boot_hid(xhci_state,input_state); } else { ps2_poll_fallback(input_state); } }'
          d='if input_queue_ready != 0 { if usb_hid_report_ready != 0 { input_decode_ready = 1; } else { ps2_poll_fallback(input_state); } }'
          assert s.count(a)==1 and s.count(c)==1
          p.write_text(s.replace(a,b).replace(c,d))
          PY
          r46_sha="$(sha256sum "$SRC/kernel/main.nx" | awk '{print $1}')"
          echo "r46_kernel_main_sha256=$r46_sha" > r50-out/R46-BASE-IDENTITY.txt
          test "$r46_sha" = "$EXPECTED_R46_KERNEL_MAIN_SHA256"
          cp "$SRC/kernel/main.nx" r50-out/kernel-main-r46.nx
          echo "FRAMES_DIR=$SRC" >> "$GITHUB_ENV"

      - name: Apply r50 phase-acquisition repair and retain r49 telemetry
        shell: bash
        run: |
          set -euo pipefail
          cp "$FRAMES_DIR/kernel/main.nx" r50-out/kernel-main-before-r50.nx
          python3 tools/ci/make_r50_ps2_phase_fix.py "$FRAMES_DIR/kernel/main.nx"
          cp "$FRAMES_DIR/kernel/main.nx" r50-out/kernel-main-r50.nx
          diff -u r50-out/kernel-main-before-r50.nx r50-out/kernel-main-r50.nx > r50-out/R50-PHASE-REPAIR.patch || true
          grep -q 'r50 physical touchpad repair' "$FRAMES_DIR/kernel/main.nx"
          grep -q 'volatile_write64(input_state+3032,0);' "$FRAMES_DIR/kernel/main.nx"
          sha256sum "$FRAMES_DIR/kernel/main.nx" | tee r50-out/R50-KERNEL-SHA256.txt

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld python3 unzip zip mtools dosfstools
          find "$FRAMES_DIR" -type f -name '*.sh' -exec chmod +x {} +
          find "$FRAMES_DIR/toolchain" -type f -name nexus -exec chmod +x {} +

      - name: Build and verify raw USB image
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRAMES_DIR"
          ./tools/build.sh
          python3 tools/make_esp.py
          python3 tools/sdk_selftest.py
          python3 tools/make_desktop_preview_image.py
          python3 tools/verify_desktop_preview_image.py --image build/Frames-0.9.98-Desktop-Preview.img --require-pass
          python3 tools/verify_release.py
          cp build/Frames-0.9.98-Desktop-Preview.img "$GITHUB_WORKSPACE/r50-out/Frames-0.9.98-r50-Physical-PS2-Phase-Repair-Rufus.img"

      - name: Record hands-on instructions and hashes
        shell: bash
        run: |
          set -euo pipefail
          img="r50-out/Frames-0.9.98-r50-Physical-PS2-Phase-Repair-Rufus.img"
          img_sha="$(sha256sum "$img" | awk '{print $1}')"
          cat > r50-out/HANDS-ON-TEST.txt <<'EOF'
          Write Frames-0.9.98-r50-Physical-PS2-Phase-Repair-Rufus.img directly to USB with Rufus/raw image mode.
          Boot in UEFI mode and confirm PTR DIAG R50.
          Move the touchpad continuously in circles and all four directions for 10-15 seconds.
          Expected repair signature: PSTA should begin at 0, PCNT/scores should advance, LOCK should become nonzero, then GOOD and SRC/CORE/TRNS should become nonzero and the cursor should move.
          If LOCK stays 0, photograph PSTA, PCNT, S0SC, S1SC, S2SC, WINS, SHFT, LOCK, P2IR, P2PK, PRAW, AUXN, SYNC, GOOD, BHDR, SRC, CORE and TRNS.
          Experimental physical repair build; do not promote until hands-on success plus regression certification.
          EOF
          printf 'status=PASS\nrevision=r50\nimage_sha256=%s\n' "$img_sha" > r50-out/BUILD-STATUS.txt
          sha256sum r50-out/* > r50-out/SHA256SUMS.txt

      - name: Upload r50 USB image and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frames-0.9.98-r50-physical-ps2-phase-repair-rufus-image
          path: r50-out/**
          if-no-files-found: error
          retention-days: 14
