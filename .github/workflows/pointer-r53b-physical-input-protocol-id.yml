name: Frames 0.9.98 r53B Physical Input Protocol ID USB Image

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/pointer-r53b-physical-input-protocol-id.yml'
      - 'tools/ci/make_r53b_input_protocol_id.py'
      - 'tools/ci/make_r50_ps2_phase_fix.py'
      - 'tools/ci/make_r49_ps2_phase.py'

permissions:
  contents: read

env:
  EXPECTED_PARENT_SHA256: 1c7f1b514d9aa2f847f724e8b633286d069d745bf7c281a3967c46bbfea1a18c
  EXPECTED_R46_KERNEL_MAIN_SHA256: e5ccd3d4a453184f620e2ed5f928599bc8a7fa6959098f3aeff4916f6dcff165

jobs:
  build-r53b:
    name: Build r53B dual physical input protocol-ID image
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Initialize evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf r53b-out
          mkdir -p r53b-out
          printf 'status=started\nrevision=r53B\n' > r53b-out/BUILD-STATUS.txt
      - name: Reconstruct exact certified r46 base
        shell: bash
        run: |
          set -euo pipefail
          parent_sha="$(sha256sum Frames-0.9.98-Pointer-Diagnostics-CI-v1.zip | awk '{print $1}')"
          echo "protected_parent_sha256=$parent_sha" > r53b-out/PARENT-IDENTITY.txt
          test "$parent_sha" = "$EXPECTED_PARENT_SHA256"
          rm -rf "$RUNNER_TEMP/r53b"; mkdir -p "$RUNNER_TEMP/r53b"
          unzip -q Frames-0.9.98-Pointer-Diagnostics-CI-v1.zip -d "$RUNNER_TEMP/r53b"
          SRC="$RUNNER_TEMP/r53b/Frames-0.9.98-Pointer-CI-Source"
          python3 - "$SRC/kernel/main.nx" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          a='if usb_hid_found != 0 { usb_hid_configured = xhci_configure_boot_hid(xhci_state,phys_state); if usb_hid_configured != 0 { usb_hid_report_ready = xhci_read_first_hid_report(xhci_state,phys_state); } }'
          b='if usb_hid_found != 0 { usb_hid_configured = xhci_configure_boot_hid(xhci_state,phys_state); if usb_hid_configured != 0 { usb_hid_report_ready = 1; } }'
          c='if input_queue_ready != 0 { if usb_hid_report_ready != 0 { input_decode_ready = input_decode_boot_hid(xhci_state,input_state); } else { ps2_poll_fallback(input_state); } }'
          d='if input_queue_ready != 0 { if usb_hid_report_ready != 0 { input_decode_ready = 1; } else { ps2_poll_fallback(input_state); } }'
          assert s.count(a)==1 and s.count(c)==1
          p.write_text(s.replace(a,b).replace(c,d))
          PY
          r46_sha="$(sha256sum "$SRC/kernel/main.nx" | awk '{print $1}')"
          echo "r46_kernel_main_sha256=$r46_sha" > r53b-out/R46-BASE-IDENTITY.txt
          test "$r46_sha" = "$EXPECTED_R46_KERNEL_MAIN_SHA256"
          echo "FRAMES_DIR=$SRC" >> "$GITHUB_ENV"
      - name: Apply r53B dual-path physical protocol telemetry on r50 path
        shell: bash
        run: |
          set -euo pipefail
          cp "$FRAMES_DIR/kernel/main.nx" r53b-out/kernel-main-before-r53b.nx
          python3 tools/ci/make_r53b_input_protocol_id.py "$FRAMES_DIR/kernel/main.nx"
          cp "$FRAMES_DIR/kernel/main.nx" r53b-out/kernel-main-r53b.nx
          diff -u r53b-out/kernel-main-before-r53b.nx r53b-out/kernel-main-r53b.nx > r53b-out/R53B-PROTOCOL-ID.patch || true
          grep -q 'R53B' "$FRAMES_DIR/kernel/main.nx"
          grep -q 'RAW0' "$FRAMES_DIR/kernel/main.nx"
          grep -q 'UCFG' "$FRAMES_DIR/kernel/main.nx"
          grep -q 'URPT' "$FRAMES_DIR/kernel/main.nx"
          sha256sum "$FRAMES_DIR/kernel/main.nx" | tee r53b-out/R53B-KERNEL-SHA256.txt
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld python3 unzip zip mtools dosfstools
          find "$FRAMES_DIR" -type f -name '*.sh' -exec chmod +x {} +
          find "$FRAMES_DIR/toolchain" -type f -name nexus -exec chmod +x {} +
      - name: Build and verify raw USB image
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRAMES_DIR"
          ./tools/build.sh
          python3 tools/make_esp.py
          python3 tools/sdk_selftest.py
          python3 tools/make_desktop_preview_image.py
          python3 tools/verify_desktop_preview_image.py --image build/Frames-0.9.98-Desktop-Preview.img --require-pass
          python3 tools/verify_release.py
          cp build/Frames-0.9.98-Desktop-Preview.img "$GITHUB_WORKSPACE/r53b-out/Frames-0.9.98-r53B-Physical-Input-Protocol-ID-Rufus.img"
      - name: Record hands-on instructions and hashes
        shell: bash
        run: |
          set -euo pipefail
          img="r53b-out/Frames-0.9.98-r53B-Physical-Input-Protocol-ID-Rufus.img"
          img_sha="$(sha256sum "$img" | awk '{print $1}')"
          cat > r53b-out/HANDS-ON-TEST.txt <<'EOF'
          Write the r53B IMG directly to USB with Rufus/raw image mode and boot UEFI.
          Confirm PTR DIAG R53B.

          TEST A - built-in touchpad:
          Move slowly right for 5 seconds, stop, then down for 5 seconds. Photograph the full panel.
          RAW0/RAW1/RAW2 are the last 12 AUX bytes; PKT3 is the 3-byte packet Frames interpreted; RCNT is raw byte count; PSIZ is active packet size.

          TEST B - physical USB mouse:
          Plug the USB mouse in before boot. Move it continuously for 10 seconds and photograph the panel.
          UCFG=xHCI HID configured state; UPRT=boot protocol (2 means mouse); UARM=interrupt-IN armed; URPT=completed HID reports; ULEN=last report length; U0B/U1B=first two last-report bytes; USBR=reports accepted by Generic Pointer.

          Diagnostic-only image; do not promote.
          EOF
          printf 'status=PASS\nrevision=r53B\nimage_sha256=%s\n' "$img_sha" > r53b-out/BUILD-STATUS.txt
          sha256sum r53b-out/* > r53b-out/SHA256SUMS.txt
      - name: Upload r53B USB image and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frames-0.9.98-r53b-physical-input-protocol-id-rufus-image
          path: r53b-out/**
          if-no-files-found: error
          retention-days: 14
