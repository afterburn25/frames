name: Frames v108 r38 G750JM HID Event Identity Alt Setting Certification

on:
  workflow_dispatch:
  push:
    branches: [ v108-usb-hub-topology-r1 ]
    paths:
      - '.github/workflows/frames-v108-r38-hid-event-identity-altsetting-cert.yml'
      - 'tools/ci/patch_v108_r38_hid_event_identity_altsetting.py'
      - 'tools/ci/r38_cert_driver.py'
      - 'tools/ci/patch_v108_r37b_stable_diag.py'
      - 'tools/ci/r37b_cert_driver.py'
      - 'tools/ci/patch_v108_r37_g750jm_xhci_ring_ps2.py'
      - 'tools/ci/r37_cert_driver.py'
      - 'tools/ci/patch_v108_r36_nonblocking_interrupt_recovery.py'
      - 'tools/ci/r36_cert_driver.py'
      - 'tools/ci/patch_v108_r35b_g750jm_hm87_hid_interval.py'
      - 'tools/ci/r35b_cert_driver.py'
      - 'tools/ci/patch_v108_r35_hid_control_poll_fallback.py'
      - 'tools/ci/r35_cert_driver.py'
      - 'tools/ci/patch_v108_r34_late_reroute_reinit.py'
      - 'tools/ci/r34_cert_driver.py'
      - 'tools/ci/patch_v108_r33c_motion_telemetry_isolation.py'
      - 'tools/ci/r33c_cert_driver.py'
      - 'tools/ci/patch_v108_r33b_overlay_render_recovery.py'
      - 'tools/ci/r33b_cert_driver.py'
      - 'tools/ci/patch_v108_r33_ehci_ownership_recovery.py'
      - 'tools/ci/r33_cert_driver.py'
      - 'tools/ci/patch_v108_r32_usb_settle_input_recovery.py'
      - 'tools/ci/r32_cert_driver.py'
      - 'tools/ci/patch_v108_r31b_overlay_state.py'
      - 'tools/ci/patch_v108_r31_usb_state_isolation.py'
      - 'tools/ci/r31_cert_driver.py'
      - 'tools/ci/patch_v108_r30b_hid_first_device_state.py'
      - 'tools/ci/r30b_cert_driver.py'
      - 'tools/ci/patch_v108_r30_hid_first_right_click.py'
      - 'tools/ci/patch_v108_r29_root_port_recovery.py'
      - 'tools/ci/r29_cert_driver.py'
      - 'tools/ci/harden_qemu_text_edit_gate_r28.py'
      - 'tools/ci/patch_v108_r28c_hub_ep0_state_isolation.py'
      - 'tools/ci/patch_v108_r28b_ep0_identity.py'
      - 'tools/ci/patch_v108_r28_ep0_address_evaluate.py'
      - 'tools/ci/patch_v108_r27_usb_event_mailbox.py'
      - 'tools/ci/r28c_cert_driver.py'
      - 'tools/ci/r28_cert_driver.py'
      - 'tools/ci/r27_cert_driver.py'
      - 'tools/ci/r26_cert_driver.py'
      - 'tools/ci/r26_log_format.py'
      - 'tools/ci/make_r26_rufus_target.py'
      - 'tools/ci/qemu_r25_flight_log_gate.py'
      - 'tools/ci/qemu_r26_log_failopen_gate.py'
      - 'tools/ci/validate_physical_handoff.py'

permissions:
  contents: write
  actions: read
  statuses: write

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v108-usb-hub-topology-r1
      - name: Install build, image and runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld python3 python3-pil unzip mtools dosfstools gdisk xorriso qemu-system-x86 ovmf
      - name: Fetch exact r21 protected source
        uses: actions/download-artifact@v4
        with:
          name: Frames-v108-r21-Candidate
          path: r21-candidate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: afterburn25/frames
          run-id: '31979817129'
      - name: Harden TCG text readiness harness
        run: python3 tools/ci/harden_qemu_text_edit_gate_r28.py
      - name: Build and certify r38 HID event identity and alternate-setting recovery
        run: python3 tools/ci/r38_cert_driver.py
      - name: Validate sealed Rufus physical handoff
        run: python3 tools/ci/validate_physical_handoff.py --final final
      - name: Upload r38 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Frames-v108-r38-Evidence
          path: |
            evidence/**
            out/*.iso
          if-no-files-found: warn
          retention-days: 30
      - name: Upload sealed r38 Rufus ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Frames-v108-r38-Rufus-Final
          path: final/**
          if-no-files-found: error
          retention-days: 30
      - name: Publish r38 commit status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R38_JOB_STATUS: ${{ job.status }}
        run: |
          STATE=success
          DESC='r38 certification PASS'
          if [ "$R38_JOB_STATUS" != "success" ]; then STATE=failure; DESC='r38 certification FAIL'; fi
          python3 - <<'PY'
          import json,os
          payload={'state':os.environ['STATE'],'context':'frames/r38-certification','description':os.environ['DESC'][:140]}
          open('/tmp/r38-status.json','w').write(json.dumps(payload))
          PY
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary @/tmp/r38-status.json
        env:
          STATE: success
          DESC: r38 certification PASS
      - name: Publish r38 CI status handoff
        if: always()
        continue-on-error: true
        env:
          R38_JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          out={
            'profile':'frames-v108-r38-ci-handoff',
            'job_status':os.environ.get('R38_JOB_STATUS','unknown'),
            'run_id':os.environ.get('GITHUB_RUN_ID',''),
            'run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT',''),
            'head_sha':os.environ.get('GITHUB_SHA',''),
            'ref':os.environ.get('GITHUB_REF',''),
          }
          isos=list(Path('final').glob('*.iso'))
          if isos:
            p=isos[0]; b=p.read_bytes()
            out.update({'iso_name':p.name,'iso_size':len(b),'iso_sha256':hashlib.sha256(b).hexdigest()})
          fail=Path('evidence/R38-FAILURE.txt')
          if fail.exists(): out['failure']=fail.read_text(errors='replace')[-16000:]
          agg=Path('evidence/R38-AGGREGATE.json')
          if agg.exists():
            try: out['aggregate']=json.loads(agg.read_text())
            except Exception: out['aggregate_raw']=agg.read_text(errors='replace')[-8000:]
          d=Path('ci-status'); d.mkdir(exist_ok=True)
          (d/'r38-latest.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'Frames CI'
          git config user.email 'frames-ci@users.noreply.github.com'
          git add ci-status/r38-latest.json
          git commit -m "ci: publish r38 run ${GITHUB_RUN_ID} status" || exit 0
          git pull --rebase origin v108-usb-hub-topology-r1
          git push origin HEAD:v108-usb-hub-topology-r1
